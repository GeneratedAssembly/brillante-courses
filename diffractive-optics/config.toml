    { symbol = "\\Lambda", meaning = "grating period; self-images of the input field recur at every integer multiple of Z_T" },
    { symbol = "\\text{fractional } Z_T", meaning = "at fractions like Z_T/3, certain phase gratings (duty 1/3, step 2π/3) form ~100%-contrast spot arrays at ~100% efficiency — near-field illuminators where more spots = more illuminated periods, no redesign" },
]


[widgets."com.github.richbai90.diffractive.fanout.int-duty0"]
expression = "(1 - 2 * x) ^ 2"
domain = [0, 1]
ydomain = [0, 1]
title = "Zero-order efficiency vs duty cycle (binary π grating)"
xlabel = "duty cycle b/Λ"
ylabel = "η₀"
readout = "b/Λ = {x:0.01f} → η₀ = {y:0.3f}"

[widgets."com.github.richbai90.diffractive.fanout.int-duty1"]
expression = "(2 / pi * sin(pi * x)) ^ 2"
domain = [0, 1]
ydomain = [0, 0.45]
title = "First-order efficiency vs duty cycle (binary π grating)"
xlabel = "duty cycle b/Λ"
ylabel = "η₁"
readout = "b/Λ = {x:0.01f} → η₁ = {y:0.3f}"

[widgets."com.github.richbai90.diffractive.fanout.math-sbwp"]
tex = "\\mathrm{SBWP} \\;=\\; \\frac{L \\times L}{\\ell \\times \\ell}"
label = "Space–bandwidth product of the design space (Eq. 5.8)"
definitions = [
    { symbol = "L", meaning = "beam dimension the element must fill" },
    { symbol = "\\ell", meaning = "minimum resolvable feature (fab floor) — the pixel pitch" },
    { symbol = "10\\,\\text{mm},\\ 1\\,\\mu\\text{m}", meaning = "the book's example: SBWP = 10⁸ variables — information capacity, at computational threat" },
]

[widgets."com.github.richbai90.diffractive.fanout.step-inversion"]
label = "Direct inversion: target → element in four moves"
steps = [
    { title = "Grid the target", text = "Map desired spots onto the FFT grid of orders (indices −31…+32 on a 64×64 array); period from the grating equation: 0.5° at 633 nm ⇒ Λ = 72.5 µm; pixels 1.133 µm > the 1-µm fab floor." },
    { title = "Amplitudes known, phases not", tex = "F_{m,n} = A_{m,n}\\, e^{i\\phi_{m,n}}, \\qquad A_{m,n} = \\sqrt{I_{m,n}}", text = "Assign each spot a random phase — uniform phases would pile all the amplitude into the cell's center (Eqs. 5.9–5.10)." },
    { title = "Inverse FFT", text = "Gives the cell field f = a·e^{iϕ} — unfortunately varying in BOTH amplitude and phase." },
    { title = "Truncate", tex = "f_{m,n} = (1.0)\\, e^{i\\varphi_{m,n}}, \\qquad \\varphi_{m,n} \\in \\{0, \\pi/2, \\pi, 3\\pi/2\\}", text = "Force amplitude to unity, quantize phase to N levels (Eqs. 5.12–5.13) — the information loss is the whole problem." },
    { title = "Playback", text = "FFT the encoded cell: MSE = 8.2, efficiency 46%. Diagnosis: amplitude truncation dominates the noise; phase quantization costs ~1/N levels. The lesson: WHICH phases minimize the amplitude modulation? → iteration.", note = "With added metal amplitude patterning (matched spatial filters), direct inversion is still useful when reconstruction fidelity matters more than efficiency." },
]

[widgets."com.github.richbai90.diffractive.fanout.quiz-knobs"]
question = "The 1 × 3 grating at 0.64π depth (28.8% per order, 86% total) beats the 26.5%-duty design (66%) because…"
options = [
    "Smaller periods are more efficient",
    "Keeping 50% duty preserves the even-order null while a shallower phase feeds the zero order — better power balance than breaking the duty symmetry",
    "The random phases help",
    "Depth never matters for fanouts",
]
answer = 1
explanation = "50% duty kills all even orders by symmetry; tuning depth to 2 arctan(π/2) = 0.64π equalizes 0/±1 at 28.7% each. Off 50% duty, ±2 and the rest start stealing power. Note the book's caution: depth is a design variable only in simple binary cases — it is tied to λ and n for everything else."

[widgets."com.github.richbai90.diffractive.fanout.quiz-invert"]
question = "Direct inversion's playback noise comes mostly from…"
options = [
    "The random phases",
    "Forcing the inverse-transformed amplitude to unity — a dramatic truncation of information; phase quantization is the secondary term",
    "The FFT grid being too fine",
    "Shadowing at the cell edges",
]
answer = 1
explanation = "Simulations with/without amplitude truncation isolate it: amplitude-to-unity is the big loss. Random phases were the mitigation, not the cause. 8+ phase levels make quantization minor — motivating the search for the phase set that makes truncation harmless."

[widgets."com.github.richbai90.diffractive.fanout.quiz-period"]
question = "Target: spots 0.5° apart at λ = 633 nm. You need…"
options = [
    "Λ = 72.5 µm, set by the grating equation — then the cell handles the powers",
    "Λ = 0.633 µm, one wavelength per period",
    "Λ chosen to maximize the zero order",
    "No period at all — fanouts are aperiodic",
]
answer = 0
explanation = "Λ = λ/sin θ₁ = 0.633/0.00873 = 72.5 µm. Fact 1 (period → angles) is analytic and exact; all the difficulty lives in fact 2 (cell → powers), which is why the unit cell gets 40 pages of algorithms."

[widgets."com.github.richbai90.diffractive.fanout.card-encoding"]
front = "Three unit-cell encodings"
back = "Transition points (Dammann: move edges; 25 features = 8 variables) · trapezoids (+16 variables; mask software accepts them) · pixel array (each pixel one of N phase levels; maps straight to masks + FFTs — most common). Balance freedom against variable count."

[widgets."com.github.richbai90.diffractive.fanout.card-facts"]
front = "The two facts that simplify grating design"
back = "1) The period alone controls angular separation/orientation of orders. 2) The unit-cell structure alone controls relative amplitude/phase of orders. Design splits into: period from spot geometry; cell from power budget."

# ---------------------------------------------------------------------------
# Lesson 11 — Iterative Grating Design (11-iterative-design.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.diffractive.iter.step-gs"]
label = "The bidirectional (Gerchberg–Saxton) loop"
steps = [
    { title = "Random start", tex = "f^{1}_{m,n} = (1.0)\\, e^{i\\varphi^{1}_{m,n}}", text = "First estimate: random phases, unit amplitude, already satisfying the cell's encoding constraints (Eq. 5.14)." },
    { title = "Go forward", tex = "F^{1}_{m,n} = A^{1}_{m,n}\\,e^{i\\phi^{1}_{m,n}} = \\mathrm{FFT}[f^{1}]", text = "The system transform — a Fourier transform for far-field gratings (Fresnel for beam shapers). Eq. 5.15." },
    { title = "Impose the target", tex = "F^{1} \\rightarrow A_{m,n}\\, e^{i\\phi^{1}_{m,n}}", text = "Replace computed amplitudes with the TARGET amplitudes; keep the computed phases. This is the step that 'asks' the cell to try new phases. Eq. 5.16." },
    { title = "Come back", tex = "f^{2}_{m,n} = \\mathrm{FFT}^{-1}[F^{1}]", text = "Inverse transform → updated cell estimate; re-quantize phases and normalize amplitudes; repeat. Eq. 5.17.", note = "Converges in ~12 iterations on the 64×64 example: MSE 8.2 → 0.87, efficiency 85%. Seconds on trivial hardware." },
]

[widgets."com.github.richbai90.diffractive.iter.math-mse"]
tex = "\\mathrm{MSE} \\;=\\; \\frac{1}{MN} \\sum_{m,n} \\left( \\left| F_{m,n} \\right| - A_{m,n} \\right)^2"
label = "Mean-square-error figure of merit (Eq. 5.18)"
definitions = [
    { symbol = "A_{m,n}", meaning = "target amplitude at each grid point; deviations of the playback from target accumulate here" },
    { symbol = "\\text{alternatives}", meaning = "merit functions can weight absolute efficiency or in-order uniformity more heavily — the choice IS a design decision" },
]

[widgets."com.github.richbai90.diffractive.iter.quiz-gs"]
question = "In the bidirectional loop, which quantity is deliberately destroyed each half-cycle?"
options = [
    "The target amplitudes",
    "One domain's phase information: forward pass keeps computed phases and overwrites amplitudes; the inverse pass re-encodes the cell (amplitude → 1, phases quantized)",
    "The FFT",
    "The grating period",
]
answer = 1
explanation = "The loop alternates which domain's constraint is imposed: target amplitude in the Fourier plane, encoding constraints (unit amplitude, quantized phase) in the cell plane. The unconstrained phases are what get 'driven' toward a good solution."

[widgets."com.github.richbai90.diffractive.iter.quiz-anneal"]
question = "In simulated annealing, the temperature variable t controls…"
options = [
    "The substrate temperature during etch",
    "The probability of accepting a change that INCREASES the merit function; t decays with iteration",
    "The number of phase levels",
    "The FFT grid size",
]
answer = 1
explanation = "Uphill moves let the search escape starting valleys; their acceptance probability p < t shrinks as the schedule cools — slow cooling = exploration then descent (with a mathematical global-minimum proof in the infinitely-slow limit; t₀ = 0 degenerates it into a deterministic hill-climber)."

[widgets."com.github.richbai90.diffractive.iter.quiz-score"]
question = "On the shared 64 × 64 fanout benchmark, which scoreboard is right?"
options = [
    "Bidirectional: MSE 0.87, η 85%; annealing: MSE 0.12, η 76%; GA: MSE 0.11, η 76%",
    "Direct inversion wins on MSE",
    "GA reaches MSE 0.01 with 99% efficiency",
    "All three converge to identical designs",
]
answer = 0
explanation = "The stochastic pair trades ~10× computation for a 7× better target fit at slightly lower efficiency — the book argues fit-to-target (uniformity) is the true figure of merit here. And no algorithm guarantees the global optimum; you never know you found the best."

[widgets."com.github.richbai90.diffractive.iter.quiz-rule"]
question = "The book's final design rule for choosing an algorithm is…"
options = [
    "Always use the most sophisticated method available",
    "Provide an acceptable design using the simplest technique",
    "Match the algorithm to the mask count",
    "Use genetic algorithms for lenses, annealing for gratings",
]
answer = 1
explanation = "Dammann/direct inversion for simple outputs; deterministic bidirectional for complex invertible systems (fast, huge variable counts); SA/GA for the hardest patterns — at real compute cost. Escalate only when the simpler tool fails."

[widgets."com.github.richbai90.diffractive.iter.card-prospector"]
front = "The blind prospector (local minima)"
back = "N variables = an N-dimensional mountain range; a downhill-only algorithm lands in whatever valley it starts in — 'the quality of the solution is (sometimes unwittingly) set by the first estimate.' Annealing = strong legs, big early leaps. GA = a cooperating team of prospectors."

[widgets."com.github.richbai90.diffractive.iter.card-ga"]
front = "Genetic algorithm mechanics"
back = "Cell → chromosome (concatenated phase genes). Per generation: forward-transform each member, rank by MSE, pick parents randomly but weighted by rank (worst < 1%, best 33%), cross over at random breakpoints (a few is best; > 5–10% of variables stops helping), mutate a few random genes to stop inbreeding. Identical population = a minimum found (premature = local)."

[widgets."com.github.richbai90.diffractive.iter.card-taxonomy"]
front = "Optimization taxonomy (Mait)"
back = "Bidirectional — for invertible systems with many variables. Unidirectional deterministic — when inversion is hard; fast to *an* optimum. Unidirectional stochastic (SA, GA) — evaluate many candidates before settling; best solutions, highest compute."


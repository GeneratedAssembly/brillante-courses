# ---------------------------------------------------------------------------
# Lesson 1 — What Is a Diffractive Optical Element? (01-what-is-a-doe.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.diffractive.doe.card-taxonomy"]
front = "DOE taxonomy: kinoform vs binary optic vs CGH vs HOE"
back = "Kinoform: DOE with a smoothly varying phase profile. Binary optic: discrete phase levels (N masks → 2^N levels; 1 mask → 0/π). CGH: DOE made from a calculated interference pattern reduced to masks, useful output often one of several orders. HOE: DOE written by the interference of two real wavefronts."

[widgets."com.github.richbai90.diffractive.doe.card-binary"]
front = "Binary optic, precisely"
back = "A DOE with a discrete number of phase-controlling surfaces. Simplest form: one lithographic mask producing two levels with 0 or π phase difference. With N masks: usually 2^N phase levels."

[widgets."com.github.richbai90.diffractive.doe.card-blaze"]
front = "Blazed grating"
back = "Sawtooth (triangular) groove profile, derived from slicing a prism one wavelength high. At its design wavelength it directs essentially all diffracted light into one order. Deflects by diffraction — dispersion set by the period, not the glass."

[widgets."com.github.richbai90.diffractive.doe.math-grating"]
tex = "m\\lambda \\;=\\; \\Lambda \\sin\\theta_m"
label = "Grating equation, normal incidence (Eq. 1.1)"
definitions = [
    { symbol = "m", meaning = "diffraction order number (integer; m = 0 is the undiffracted beam)" },
    { symbol = "\\lambda", meaning = "wavelength of the light" },
    { symbol = "\\Lambda", meaning = "grating period — the repeat distance of the structure" },
    { symbol = "\\theta_m", meaning = "angle of order m, measured from the surface normal" },
]

[widgets."com.github.richbai90.diffractive.doe.int-angle"]
expression = "m * lam / x"
domain = [1, 10]
ydomain = [0, 1.6]
title = "Order angle vs grating period: sin θ_m = mλ/Λ"
xlabel = "period Λ (µm)"
ylabel = "sin θ_m"
readout = "Λ = {x:0.1f} µm → sinθ_m = {y:0.2f}"
parameters = [
    { name = "m", label = "order m", min = 1, max = 3, step = 1, initial = 1 },
    { name = "lam", label = "wavelength λ (µm)", min = 0.4, max = 1.6, step = 0.01, initial = 0.6328 },
]

[widgets."com.github.richbai90.diffractive.doe.quiz-kinoform"]
question = "A colleague describes a DOE whose phase profile varies continuously — no discrete steps at all. Which term is exact?"
options = [
    "Binary optic",
    "Kinoform",
    "Holographic optical element",
    "Fresnel zone plate",
]
answer = 1
explanation = "Kinoform = smoothly varying phase-controlling surface. Binary optics have a discrete number of levels; an HOE is defined by how it is made (interference of two wavefronts); a zone plate is the two-level amplitude ancestor of diffractive lenses."

[widgets."com.github.richbai90.diffractive.doe.quiz-blaze"]
question = "A prism and a blazed grating both steer a beam. What is the fundamental difference?"
options = [
    "The grating steers more light than any prism can",
    "The prism's deflection comes from refraction and index dispersion; the grating's comes from diffraction and its periodicity",
    "The prism works only in white light; the grating only in monochromatic light",
    "There is no difference — a blazed grating is just a staircase prism",
]
answer = 1
explanation = "Geometrically the blazed grating IS a sliced prism — optically it is a periodic structure: order angles obey Λ sinθ = mλ, and the wavelength dependence comes from the period, not from any material dispersion. That sign-flipped dispersion is exactly what hybrid lenses exploit later."

[widgets."com.github.richbai90.diffractive.doe.quiz-theme"]
question = "Two facts organize all DOE design. Which pair?"
options = [
    "Depth sets the angles; period sets the efficiencies",
    "The period sets where light goes; the structure inside one period sets how much goes to each place",
    "Index sets the angles; wavelength sets the depths",
    "The substrate sets the function; the coating sets the efficiency",
]
answer = 1
explanation = "Grating equation → angles (period only). Fourier transform of the unit cell → amplitudes and phases of the orders (cell structure only). Every design lesson from here on is an application of this division of labor — and the 'all diffractive optics is in the geometry' theme."

# ---------------------------------------------------------------------------
# Lesson 2 — Huygens, Zones, and the First Diffractive Lenses (02-huygens-fresnel-zones.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.diffractive.zones.step-phasors"]
label = "Why alternate Fresnel zones cancel"
steps = [
    { title = "Equal-area zones", text = "Cut the aperture into annuli whose paths to the on-axis point P exceed r₀ by λ/2 each. Every zone has exactly the same area, so every zone delivers the same amplitude at P." },
    { title = "Subdivide each zone", tex = "\\Delta\\phi_{\\text{subzone}} = \\frac{\\pi}{6}", text = "Divide each zone into six equal subzones. A whole zone spans phase π, so successive subzone phasors step by π/6 in direction.", note = "The book's Fig. 1.13 illustration uses six subzones per zone." },
    { title = "Sum one zone", text = "The six subzone vectors of zone 1 form half a polygonal arc: their resultant is the zone's contribution, call it A." },
    { title = "Zone 2 opposes", tex = "\\vec{A}_2 = -\\vec{A}_1", text = "Zone 2's path is λ/2 longer — every subzone is phase-rotated by an extra π — so its resultant is equal and opposite. An aperture of exactly two zones gives zero on-axis field." },
    { title = "The spiral to E₀", text = "Opening more zones makes the resultant oscillate between ~0 (even count) and ~2E₀ (odd counts just past a maximum), with successive zone amplitudes shrinking slowly — the phasor sum spirals into E₀, the unobstructed field.", note = "This is why 'blocking the even zones' is worth 6× the amplitude: you flip the canceling pairs instead of losing them." },
]

[widgets."com.github.richbai90.diffractive.zones.math-pidepth"]
tex = "d \\;=\\; \\frac{\\lambda}{2\\,(n - 1)}"
label = "Depth of a π-phase zone (Fresnel phase plate)"
definitions = [
    { symbol = "d", meaning = "height of the phase-shifting zones; OPD = (n−1)d = λ/2 produces the π shift" },
    { symbol = "\\lambda", meaning = "design wavelength" },
    { symbol = "n", meaning = "refractive index of the plate material" },
]

[widgets."com.github.richbai90.diffractive.zones.quiz-depth"]
question = "A Fresnel phase plate works at λ = 633 nm in fused silica (n ≈ 1.457). The zone depth is closest to…"
options = [
    "0.35 µm",
    "0.69 µm",
    "1.38 µm",
    "2.76 µm",
]
answer = 1
explanation = "d = λ/[2(n−1)] = 0.633/(2 × 0.457) ≈ 0.69 µm — a half-wave OPD. (1.38 µm is the full 2π depth, the kinoform's per-period relief; that number returns in the fabrication lessons.)"

[widgets."com.github.richbai90.diffractive.zones.int-levels"]
expression = "(sin(pi / x) / (pi / x)) ^ 2"
domain = [1.2, 32]
ydomain = [0, 1.02]
title = "First-order efficiency of an N-level staircase blaze: η₁ = [sin(π/N)/(π/N)]²"
xlabel = "number of phase levels N"
ylabel = "efficiency η₁"
readout = "N = {x:0.0f} levels → η₁ = {y:0.3f}"

[widgets."com.github.richbai90.diffractive.zones.quiz-levels"]
question = "Going from 2 phase levels to 4 buys +40 points of efficiency; going from 8 to 16 buys only…"
options = [
    "+4 points (95% → 99%)",
    "+19 points",
    "+9 points",
    "Nothing — 8 levels is already ideal",
]
answer = 0
explanation = "40.5% → 81% → 95% → 99%: the ladder is steep at the bottom and flat at the top. Combined with the mask count (each doubling costs one more litho-and-etch cycle with its own alignment error), this is why 8 and 16 levels dominate real production."

[widgets."com.github.richbai90.diffractive.zones.card-dammann"]
front = "Dammann grating"
back = "A binary (0/π) phase grating with several transition points per period, placed so the zero order and the first N orders have equal intensity. Binary symmetry forces ±m equality, so designs yield 2N+1 equal beams. The fanout workhorse."

[widgets."com.github.richbai90.diffractive.zones.card-theme"]
front = "Amplitude zones vs phase zones"
back = "Blocking alternate Fresnel zones (zone plate): 3 open zones → 6E₀ → 36× on-axis irradiance. Shifting their phase by π instead (phase plate): 6 contributing zones → 12E₀ → 144×. Same geometry; phase beats amplitude 4-to-1 in irradiance."

[widgets."com.github.richbai90.diffractive.zones.quiz-plate"]
question = "Why does a two-level Fresnel phase plate put only ~41% of light on the focus?"
options = [
    "Absorption in the glass",
    "The structure is symmetric: the other ~41% goes into a diverging (negative focal length) order, and the rest into higher orders",
    "The zones are too wide to focus visible light",
    "Half the light reflects off the surface",
]
answer = 1
explanation = "A binary π grating sends 40.5% to +1 and 40.5% to −1 — for a lens, the −1 order is the same element acting as a negative lens. Only adding phase levels (4, 8, 16…) reclaims the split — the sinc² ladder in the interactive."

# ---------------------------------------------------------------------------
# Lesson 3 — Scalar Diffraction Theory (03-scalar-diffraction.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.diffractive.scalar.math-maxwell"]
tex = "\\nabla \\times \\mathbf{E} = -\\frac{\\partial \\mathbf{B}}{\\partial t}, \\qquad \\nabla \\times \\mathbf{B} = \\mu\\sigma\\mathbf{E} + \\mu\\varepsilon\\frac{\\partial \\mathbf{E}}{\\partial t}"
label = "Maxwell's equations (Eq. 2.1), source-free forms used here"
definitions = [
    { symbol = "\\mathbf{E},\\; \\mathbf{B}", meaning = "electric and magnetic fields" },
    { symbol = "\\varepsilon,\\; \\mu", meaning = "permittivity and permeability of the medium — constants under assumptions 1–4" },
    { symbol = "\\sigma", meaning = "conductivity; set to zero (a conducting medium absorbs light)" },
]

[widgets."com.github.richbai90.diffractive.scalar.math-wave"]
tex = "\\nabla^2 \\mathbf{E} \\;=\\; \\mu\\varepsilon\\, \\frac{\\partial^2 \\mathbf{E}}{\\partial t^2}, \\qquad v \\;=\\; \\frac{1}{\\sqrt{\\mu\\varepsilon}}, \\qquad n = \\frac{c}{v} = c\\sqrt{\\mu\\varepsilon}"
label = "The wave equation and what propagates (Eqs. 2.2–2.4)"
definitions = [
    { symbol = "v", meaning = "wave speed in the medium — the constant multiplying ∂²/∂t² is v²" },
    { symbol = "n", meaning = "index of refraction, defined as the speed ratio c/v" },
]

[widgets."com.github.richbai90.diffractive.scalar.math-helmholtz"]
tex = "\\nabla^2 P + k^2 P \\;=\\; 0, \\qquad k = \\frac{2\\pi}{\\lambda}"
label = "Helmholtz equation for the spatial field (Eq. 2.7)"
definitions = [
    { symbol = "P", meaning = "spatial part of a scalar field component (time factor exp(−ikct/n) separated off)" },
    { symbol = "k", meaning = "propagation constant (wavenumber), rad/m" },
]

[widgets."com.github.richbai90.diffractive.scalar.math-rs"]
tex = "P(X, Y, Z) \\;=\\; \\frac{1}{2\\pi} \\iint_{x,y} P(x, y, 0)\\, \\frac{e^{-ikr}}{r} \\left( ik + \\frac{1}{r} \\right) dxdy, \\qquad r = \\left[(x-X)^2 + (y-Y)^2 + Z^2\\right]^{1/2}"
label = "Rayleigh–Sommerfeld propagation integral (Eq. 2.8)"
definitions = [
    { symbol = "P(x, y, 0)", meaning = "field in the aperture plane — written P₀(x, y) when the DOE sits there" },
    { symbol = "r", meaning = "distance from an aperture point to the evaluation point (X, Y, Z)" },
    { symbol = "e^{-ikr}/r \\,(ik + 1/r)", meaning = "the spherical-wavelet Green's function with its obliquity factor — Huygens made exact under assumptions 5–8" },
]

[widgets."com.github.richbai90.diffractive.scalar.math-farfield"]
label = "From Rayleigh–Sommerfeld to a Fourier transform (Eqs. 2.10–2.12)"
steps = [
    { title = "Write the exact path", tex = "r = \\left[ R^2\\left(1 + \\frac{x^2 + y^2}{R^2} - \\frac{2(xX + yY)}{R^2} \\right) \\right]^{1/2}", text = "Distance from aperture point (x, y, 0) to evaluation point at radius R, with R² = X² + Y² + Z²." },
    { title = "Invoke the far field", text = "Assumption 9: the aperture is small compared with R, so (x² + y²)/R² ≪ 1 and can be dropped against the other terms." },
    { title = "Taylor-expand", tex = "r \\approx R\\left(1 - \\frac{xX + yY}{R^2}\\right)^{1/2} \\approx R - \\frac{xX}{R} - \\frac{yY}{R}", text = "Keep the first two terms of √(1−ε) ≈ 1 − ε/2." },
    { title = "Direction cosines", tex = "r = R - \\alpha x - \\beta y, \\qquad \\alpha = X/R,\\; \\beta = Y/R", text = "The path is linear in the aperture coordinates — which is precisely the Fourier kernel.", note = "The far-field pattern is angle-defined: it merely grows linearly as the evaluation plane recedes." },
]

[widgets."com.github.richbai90.diffractive.scalar.math-ft"]
tex = "P(X, Y, Z) \\;=\\; \\iint\\limits_{\\text{aperture}} u_0(x, y)\\, e^{i\\phi_0(x, y)}\\; e^{-ik(xX/R)}\\, e^{-ik(yY/R)}\\; dxdy \\;=\\; \\mathcal{F}\\{u_0\\, e^{i\\phi_0}\\}"
label = "Far field = Fourier transform of the aperture function (Eq. 2.18)"
definitions = [
    { symbol = "u_0(x, y)", meaning = "incident amplitude in the aperture plane" },
    { symbol = "\\phi_0(x, y)", meaning = "phase imprinted by the DOE — the thin-phase approximation: the element is a position-dependent phase screen" },
    { symbol = "\\mathcal{F}", meaning = "two-dimensional Fourier transform; measured irradiance is ∝ |P|²" },
]

[widgets."com.github.richbai90.diffractive.scalar.math-pws"]
tex = "P(\\alpha, \\beta) \\;=\\; \\iint\\limits_{\\text{aperture}} u_0(x, y)\\, e^{i\\phi_0(x,y)}\\, e^{-ik\\alpha x}\\, e^{-ik\\beta y}\\; dxdy"
label = "Same transform in direction cosines (Eq. 2.19)"
definitions = [
    { symbol = "\\alpha,\\; \\beta", meaning = "direction cosines of the observation ray (X/R, Y/R) — the natural angular coordinates of the far field" },
    { symbol = "P(\\alpha, \\beta)", meaning = "field as a function of direction; this form survives when the far-field assumption breaks and reappears as the plane-wave spectrum in the next lesson" },
]

[widgets."com.github.richbai90.diffractive.scalar.quiz-farfield"]
question = "In the far field, moving the evaluation plane twice as far from the aperture…"
options = [
    "Changes the diffraction pattern's shape",
    "Keeps the pattern identical in angle and scales its size linearly with distance",
    "Halves the number of visible fringes",
    "Converts it to the near-field Fresnel pattern",
]
answer = 1
explanation = "The far-field result depends only on the direction cosines α = X/R, β = Y/R. The pattern lives on the angular sphere; the physical plane just intercepts a bigger version of it. That is why Eq. 2.18 is a transform of angles, not of positions."

[widgets."com.github.richbai90.diffractive.scalar.quiz-assumptions"]
question = "Which assumptions are typically NOT valid inside a diffractive microstructure itself?"
options = [
    "Assumptions 1–2 (uncharged, linear medium)",
    "Assumptions 2 and 7 (homogeneous medium; aperture large vs λ) — the structure is inhomogeneous and its features are not large vs λ",
    "Assumption 5 (time factor separable)",
    "None — scalar theory is exact everywhere",
]
answer = 1
explanation = "Within the relief, the material is not homogeneous and features can be λ-scale. The book's circumvention: compute the DOE's complex transmission function analytically, then apply scalar theory only to plane-to-plane propagation beyond the element. Where that shortcut fails, Chapter 3's vector methods take over."

[widgets."com.github.richbai90.diffractive.scalar.quiz-what"]
question = "What does a detector in the evaluation plane actually record?"
options = [
    "The field P(X, Y, Z)",
    "The irradiance, proportional to |P|²",
    "The phase φ₀ of the element",
    "The direction cosines directly",
]
answer = 1
explanation = "All measurements are of irradiance ∝ |field|² — phase information is lost in routine detection, which is exactly why the 'phase retrieval' structure of iterative design algorithms works the way it does."

[widgets."com.github.richbai90.diffractive.scalar.card-rs"]
front = "Rayleigh–Sommerfeld integral"
back = "Scalar plane-to-plane propagation: every aperture point radiates a spherical wavelet with obliquity factor (ik + 1/r); sum over the aperture. Nine assumptions; valid for most DOE propagation problems; becomes a Fourier transform in the far field."

[widgets."com.github.richbai90.diffractive.scalar.card-farfield"]
front = "Far-field (Fraunhofer) condition"
back = "Assumption 9: evaluation distance very large compared with aperture size. Path r ≈ R − αx − βy; the pattern is the Fourier transform of the aperture function and is purely angular."

# ---------------------------------------------------------------------------
# Lesson 4 — Fourier Analysis of Diffractive Structures (04-fourier-analysis-of-does.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.diffractive.fourier.math-conv"]
tex = "h(X) \\;=\\; \\int_{-\\infty}^{\\infty} f(x)\\, g(X - x)\\, dx \\;\\equiv\\; f(x) \\otimes g(x)"
label = "Convolution (Eq. 2.20)"
definitions = [
    { symbol = "\\otimes", meaning = "the book's convolution operator (modern texts use ∗)" },
    { symbol = "f \\otimes f", meaning = "rect ⊗ rect = triangle: the overlap of two sliding boxes, a mental model for every convolution here" },
]

[widgets."com.github.richbai90.diffractive.fourier.math-delta"]
tex = "\\int_{-\\infty}^{\\infty} \\delta(x)\\, dx = 1, \\qquad \\delta(x) = 0 \\;\\; \\text{for} \\;\\; x \\neq 0"
label = "The Dirac delta (Eq. 2.21)"
definitions = [
    { symbol = "\\delta(x)", meaning = "infinitely narrow, infinitely high, unit area — under an integral it samples: ∫f(x)δ(x−a)dx = f(a)" },
]

[widgets."com.github.richbai90.diffractive.fourier.math-comb"]
tex = "\\mathrm{comb}(x/\\Lambda) \\;=\\; \\sum_{n = -\\infty}^{\\infty} \\delta(x - n\\Lambda)"
label = "The comb function (Eq. 2.22)"
definitions = [
    { symbol = "\\Lambda", meaning = "spacing of the delta spikes — later, the grating period" },
    { symbol = "\\mathrm{rect} \\otimes \\mathrm{comb}", meaning = "copies one unit cell to every lattice point: a grating from two words" },
]

[widgets."com.github.richbai90.diffractive.fourier.math-theorem"]
tex = "\\mathcal{F}[f \\otimes g] \\;=\\; \\mathcal{F}[f] \\times \\mathcal{F}[g]"
label = "The convolution theorem (Eq. 2.23)"
definitions = [
    { symbol = "\\mathcal{F}", meaning = "Fourier transform; convolution in one domain ⇔ multiplication in the other" },
    { symbol = "\\mathcal{F}[\\mathrm{comb}(x/\\Lambda)]", meaning = "another comb, at spatial frequencies q = m/Λ — the discrete diffraction orders" },
]

[widgets."com.github.richbai90.diffractive.fourier.math-blaze"]
tex = "U(x) \\;=\\; \\mathrm{comb}\\!\\left(\\frac{x}{\\Lambda}\\right) \\otimes \\mathrm{rect}\\!\\left(\\frac{x}{\\Lambda}\\right) \\exp\\!\\left(\\frac{i\\varphi x}{\\Lambda}\\right), \\qquad \\varphi = \\frac{2\\pi (n - 1) d}{\\lambda}"
label = "Blazed grating aperture function (Eq. 2.25)"
definitions = [
    { symbol = "\\varphi", meaning = "total phase ramp across one period, set by groove depth d and index n" },
    { symbol = "\\Lambda", meaning = "period; rect(x/Λ) × the linear phase is one sawtooth" },
]

[widgets."com.github.richbai90.diffractive.fourier.math-eta"]
tex = "\\eta_m \\;=\\; p_m^2 \\;=\\; \\left[ \\frac{\\sin[\\pi(k - m)]}{\\pi(k - m)} \\right]^2, \\qquad k \\equiv \\frac{(n-1)d}{\\lambda}"
label = "Order efficiency of the linear blaze (Eq. 2.27)"
definitions = [
    { symbol = "m", meaning = "diffraction order under test" },
    { symbol = "k", meaning = "blaze parameter: the OPD across one period in wavelengths; k = 1 means (n−1)d = λ" },
    { symbol = "\\eta_m", meaning = "fraction of incident light in order m — the squared sinc of the mismatch (k − m)" },
]

[widgets."com.github.richbai90.diffractive.fourier.int-sinc"]
expression = "(sin(pi * (m - x)) / (pi * (m - x))) ^ 2"
domain = [0, 2]
ydomain = [0, 1.02]
title = "Blaze efficiency η_m vs phase-per-period k (value is 1 exactly at x = m)"
xlabel = "blaze parameter k = (n−1)d/λ"
ylabel = "η_m"
readout = "k = {x:0.01f} → η_m = {y:0.3f}"
parameters = [
    { name = "m", label = "order m", min = 0, max = 2, step = 1, initial = 1 },
]

[widgets."com.github.richbai90.diffractive.fourier.quiz-comb"]
question = "rect(x/b) ⊗ comb(x/2b) describes…"
options = [
    "A single slit of width 2b",
    "A square-wave amplitude grating: bars of width b repeating every 2b",
    "A blazed phase grating",
    "The far-field pattern of a double slit",
]
answer = 1
explanation = "The comb copies the rect to every multiple of 2b: alternating open bars of width b with equal gaps — period Λ = 2b, a square-wave grating. Its transform is a comb (orders) weighted by the rect transform (sinc envelope)."

[widgets."com.github.richbai90.diffractive.fourier.quiz-blaze"]
question = "Equation 2.27 predicts 100% efficiency in order m = 1 when…"
options = [
    "The period equals the wavelength",
    "The depth satisfies (n − 1)d = λ, making the phase ramp exactly 2π per period",
    "The duty cycle is 50%",
    "The index equals 2",
]
answer = 1
explanation = "At k = 1 the denominator sin π(k−m) vanishes for m = 1 and the ratio → 1. One wavelength of OPD per period: every point of the ramp is the 'correct' prism facet — the ideal blaze. (Caveat: depth must stay small vs period, or shadowing bites — next lesson.)"

[widgets."com.github.richbai90.diffractive.fourier.quiz-theorem"]
question = "Why does the convolution theorem make grating analysis trivial?"
options = [
    "It converts the far-field integral into a near-field one",
    "A grating is cell ⊗ comb, so its transform is (cell transform) × (comb transform): orders = discrete comb, weighted by the unit-cell envelope",
    "It proves the grating equation",
    "It removes the need for the far-field assumption",
]
answer = 1
explanation = "Every periodic DOE = one unit cell convolved with a comb. Transform → product: the comb gives the order positions (where), the cell's transform gives amplitude/phase of each order (how much). This factorization is the structural core of the whole design chapter."

[widgets."com.github.richbai90.diffractive.fourier.card-sampling"]
front = "FFT propagation sampling rules"
back = "For a collimated beam of diameter D propagated distance Z with interval Δ and N points: Δ ≪ D (many points across the aperture); N > D²/(Zλ) (output plane sampled); Δ < Zλ/D (output spatial frequencies resolved)."

[widgets."com.github.richbai90.diffractive.fourier.card-envelope"]
front = "Where vs how much"
back = "Comb transform → WHERE the light goes (order angles). Unit-cell transform → HOW MUCH (the sinc-like envelope sampled at each order). Design the period for the geometry, the cell for the powers."

# ---------------------------------------------------------------------------
# Lesson 5 — Efficiency of Binary and Multilevel Gratings (05-binary-grating-efficiency.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.diffractive.binary.math-cell"]
tex = "f(x) \\;=\\; \\mathrm{rect}\\!\\left(\\frac{x}{b}\\right) \\otimes \\delta(x) \\;+\\; \\mathrm{rect}\\!\\left(\\frac{x}{b}\\right) \\otimes \\delta(x - b)\\; e^{i\\phi}"
label = "Binary grating unit cell (Eq. 2.28); grating = f ⊗ comb(x/Λ) (Eq. 2.29)"
definitions = [
    { symbol = "b", meaning = "width of each level; square wave means b = Λ/2" },
    { symbol = "\\phi = 2\\pi(n-1)d/\\lambda", meaning = "phase of the raised section; d = λ/[2(n−1)] gives φ = π" },
]

[widgets."com.github.richbai90.diffractive.binary.math-eta"]
tex = "F(q)\\big|_{q = m/\\Lambda} \\;=\\; \\frac{\\sin(m\\pi/2)}{m\\pi/2} \\cdot i\\sin(m\\pi/2)"
label = "π-phase square wave evaluated at the orders (Eq. 2.32)"
definitions = [
    { symbol = "m", meaning = "order index; the expression vanishes for every even m — even orders are symmetry-suppressed" },
]

[widgets."com.github.richbai90.diffractive.binary.math-odd"]
tex = "\\eta_m \\;=\\; \\left( \\frac{2}{m\\pi} \\right)^2 \\qquad (m\\ \\text{odd})"
label = "Odd-order efficiencies of the binary π grating (Eq. 2.33)"
definitions = [
    { symbol = "\\eta_{\\pm 1}", meaning = "(2/π)² = 0.405 — the famous 40.5%" },
    { symbol = "\\eta_{\\pm 3},\\ \\eta_{\\pm 5}", meaning = "4.5%, 1.6% — the residue; total sums to 1 over all odd orders" },
]

[widgets."com.github.richbai90.diffractive.binary.math-nlevel"]
tex = "\\eta_1 \\;=\\; \\left[ \\frac{\\sin(\\pi/N)}{\\pi/N} \\right]^2"
label = "First-order efficiency of an N-level staircase blaze (Eq. 2.34)"
definitions = [
    { symbol = "N", meaning = "number of uniform phase levels spanning 2π (N = 2^M for M binary masks)" },
    { symbol = "\\eta_1", meaning = "fraction of light in the design order — assumes depth ≪ period; shadowing multiplies it down otherwise" },
]

[widgets."com.github.richbai90.diffractive.binary.plot-orders"]
title = "Binary π square-wave grating: efficiency per order"
xlabel = "order m"
ylabel = "efficiency"
points = [[0, 0.0], [1, 0.405], [2, 0.0], [3, 0.045], [4, 0.0], [5, 0.016], [6, 0.0], [7, 0.008]]

[widgets."com.github.richbai90.diffractive.binary.int-duty"]
expression = "(2 / pi * sin(pi * x)) ^ 2"
domain = [0, 1]
ydomain = [0, 0.45]
title = "Each of ±1 orders vs duty cycle b/Λ (π phase depth)"
xlabel = "duty cycle b/Λ"
ylabel = "η±1"
readout = "b/Λ = {x:0.01f} → η±1 = {y:0.3f}"

[widgets."com.github.richbai90.diffractive.binary.int-levels"]

[widgets."com.github.richbai90.diffractive.apps2.quiz-shack"]
question = "A Shack–Hartmann sensor turns a lens array into a wavefront meter by…"
options = [
    "Imaging the source onto each subarray",
    "Putting a subarray of detectors one focal length under each lens: a tilted local wavefront shifts its spot off-axis, and per-subaperture spot displacement = local slope, interpolated into a full wavefront",
    "Measuring diffraction efficiency per lens",
    "Interfering neighboring lens focal spots",
]
answer = 1
explanation = "Same microlens-array-on-detector geometry as the fill-factor trick, different processing: plane wave ⇒ all spots centered; aberrated wavefront ⇒ pattern of displacements. Bench-top system testing and atmospheric correction for astronomy."

[widgets."com.github.richbai90.diffractive.apps2.quiz-swg"]
question = "A subwavelength AR surface works by…"
options = [
    "Destructive interference in a deposited quarter-wave film",
    "Etching the host material into a λ/4-deep grating whose EMT effective index is n₁ = √(n_i n_s) — an artificial film as tough as the substrate, no deposition needed",
    "Redirecting reflections into high diffraction orders",
    "Absorbing the reflected light",
]
answer = 1
explanation = "Λ < λ/2n: no orders exist, the film sees one effective index; choose the duty cycle for n_eff = √(n_i n_s) and depth λ/4n_eff. Moth's-eye cones do the same with a graded taper; multilayer SWG stacks widen angle and band. Deposition-free AR that survives the environment."

[widgets."com.github.richbai90.diffractive.apps2.quiz-vcsel"]
question = "In the 1 × 12 VCSEL datacom module, the diffractive beam shaper's three jobs are…"
options = [
    "Collimate, focus, and AR-coat",
    "Share focusing power, reshape amplitude+phase to load the GRIN fiber's skew modes (avoiding the centerline defect that causes differential mode delay), and steer back-reflections away from the lasers",
    "Split, fan out, and detect",
    "Modulate, amplify, and demodulate",
]
answer = 1
explanation = "One thin lithographic surface doing three simultaneous optical functions — plus passive-alignment features molded into the same wafer. A refractive microlens cannot do any of the mode-shaping or reflection-steering; this is the 'why DOE' argument compressed into one part."

[widgets."com.github.richbai90.diffractive.apps2.card-recap"]
front = "The whole book in one card"
back = "Geometry = function: period sets angles, cell sets powers, depth sets efficiency. Scalar theory designs it, vector theory checks the λ-scale corners, lithography etches it (2^N levels, N masks), metrology measures edges and depths, and applications cash in where planar, patternable, arbitrary-phase optics beat ground glass."


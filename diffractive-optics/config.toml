[widgets."com.github.richbai90.diffractive.lensbasics.math-thick"]
tex = "\\frac{1}{f} \\;=\\; (n - 1)\\left( \\frac{1}{R_1} - \\frac{1}{R_2} + \\frac{t\\,(n - 1)}{n R_1 R_2} \\right)"
label = "Thick-lens power (Eq. 4.1)"
definitions = [
    { symbol = "R_1,\\ R_2", meaning = "surface radii (sign by the usual convention; flat = ∞, entered as 0 in prescriptions)" },
    { symbol = "t", meaning = "center thickness; dropping the t-term gives the thin-lens formula" },
]

[widgets."com.github.richbai90.diffractive.lensbasics.math-thin"]
tex = "\\varphi \\;=\\; \\frac{1}{f} \\;=\\; (n - 1)(c_1 - c_2), \\qquad c_i \\equiv \\frac{1}{R_i}"
label = "Lensmaker's equation in power/curvature form (Eqs. 4.2–4.3)"
definitions = [
    { symbol = "\\varphi", meaning = "power in mm⁻¹ (1 mm⁻¹ = 1000 D); linear in the index contrast n − 1" },
    { symbol = "c_1 - c_2", meaning = "curvature difference; 'bending' explores all (c₁, c₂) at fixed power" },
]

[widgets."com.github.richbai90.diffractive.lensbasics.int-planoconvex"]
expression = "x / (n - 1)"
domain = [20, 200]
ydomain = [50, 2000]
title = "Plano-convex lens: f = R₁/(n − 1)"
xlabel = "front radius R₁ (mm)"
ylabel = "focal length f (mm)"
readout = "R₁ = {x:0.1f} mm → f = {y:0.1f} mm"
parameters = [
    { name = "n", label = "index n", min = 1.4, max = 1.9, step = 0.01, initial = 1.5 },
]

[widgets."com.github.richbai90.diffractive.lensbasics.math-abbe"]
tex = "V \\;=\\; \\frac{n_d - 1}{n_C - n_F}, \\qquad \\frac{\\Delta\\varphi}{\\varphi} \\;=\\; \\frac{1}{V}"
label = "Abbe number and fractional power spread (Eqs. 4.5, 4.7)"
definitions = [
    { symbol = "n_d", meaning = "index at the reference yellow line (≈587.6 nm)" },
    { symbol = "n_C,\\ n_F", meaning = "indices at red (656.3 nm) and blue (485.1 nm) hydrogen lines" },
    { symbol = "V", meaning = "large V = weak dispersion (crowns ≈ 70); small V = strong (flints ≈ 25)" },
]

[widgets."com.github.richbai90.diffractive.lensbasics.math-achromat"]
tex = "\\varphi = \\varphi_a + \\varphi_b, \\qquad \\frac{\\varphi_a}{V_a} = -\\frac{\\varphi_b}{V_b}"
label = "Thin-contact achromatic doublet (Eqs. 4.8–4.11)"
definitions = [
    { symbol = "\\varphi_a / \\varphi_b", meaning = "element powers: since every glass has V > 0, one must be positive and the other negative" },
    { symbol = "\\text{secondary color}", meaning = "residual focus error at the d-line left after correcting at F and C — two conditions, two variables" },
]

[widgets."com.github.richbai90.diffractive.lensbasics.quiz-abbe"]
question = "Two glasses: crown V = 64, flint V = 36. To make an achromat from them, the powers must be…"
options = [
    "Equal and same-sign",
    "Opposite sign, with magnitudes in ratio 64:36 — the crown takes more power",
    "Opposite sign, with magnitudes in ratio 36:64 — the flint takes more power",
    "Both positive, split 50/50",
]
answer = 1
explanation = "φ_a/V_a = −φ_b/V_b ⇒ |φ_a|/|φ_b| = V_a/V_b = 64/36. The weakly dispersive element (crown) can carry more power per unit color; the flint, being more dispersive per diopter, is used with less (negative) power."

[widgets."com.github.richbai90.diffractive.lensbasics.quiz-signature"]
question = "A ray-intercept plot shows a family of identical S-shaped curves, one per wavelength, evenly offset. Reading?"
options = [
    "Coma only",
    "Spherical aberration plus chromatic aberration",
    "Distortion",
    "Field curvature",
]
answer = 1
explanation = "S-shape = spherical; the per-wavelength separation of otherwise-identical curves = chromatic. The book's diagnostic language: bend magnitude = SA size, curve spacing = color, U-shape = coma."

[widgets."com.github.richbai90.diffractive.lensbasics.quiz-achromat"]
question = "Why does an all-glass achromatic doublet need one negative element?"
options = [
    "To shorten the total length",
    "Because dispersions must cancel (φ_a/V_a = −φ_b/V_b) while powers add — and every glass has V > 0, so opposing dispersions require opposing powers",
    "Negative elements cost less",
    "To correct spherical aberration automatically",
]
answer = 1
explanation = "Every real glass focuses blue short and red long (V > 0). The only way to cancel color with glasses is to run one element's dispersion backwards by making its power negative. Remember how freeing this looks when a diffractive surface arrives with V ≈ −3.45…"

[widgets."com.github.richbai90.diffractive.lensbasics.card-seidels"]
front = "The five third-order (Seidel) aberrations"
back = "S_I spherical (marginal rays focus short; LSA/TSA); S_II coma (off-axis comet); S_III astigmatism + S_IV field curvature (Petzval surface — curved image of a flat object); S_V distortion (field-dependent magnification, no blur)."

[widgets."com.github.richbai90.diffractive.lensbasics.card-intercept"]
front = "Reading ray intercept curves"
back = "Error Δy vs ray height y: S-shaped = spherical (rotates about origin as the evaluation plane moves); U-shaped = coma (chief-ray zone errors); families separated per wavelength = chromatic. The book's figures in Ch. 4/10 all use this language."

[widgets."com.github.richbai90.diffractive.lensbasics.card-power"]
front = "Prescription vs specifications"
back = "Prescription: per-surface radius, thickness, index, clear aperture. Specifications: object, fields, stop/pupil locations, wavelengths, resolution measure (spot or MTF), size. Design = minimizing a merit function over the prescription."


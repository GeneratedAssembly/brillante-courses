[widgets."com.github.richbai90.diffractive.fab.math-grating"]
tex = "m\\lambda \\;=\\; \\Lambda \\left( \\sin\\theta_m - \\sin\\theta_i \\right)"
label = "Grating equation, general incidence (Eq. 6.1)"
definitions = [
    { symbol = "\\theta_i,\\ \\theta_m", meaning = "incident and diffracted angles — both measured from the NORMAL to the grating plane, not to the facets" },
]

[widgets."com.github.richbai90.diffractive.fab.math-depth"]
tex = "d(x, y) \\;=\\; \\frac{\\varphi(x, y)}{2\\pi} \\cdot \\frac{\\lambda}{n_1 - n_0} \\quad \\text{(transmissive)}, \\qquad d \\;=\\; \\frac{\\varphi}{2\\pi} \\cdot \\frac{\\lambda}{2 n_0} \\quad \\text{(reflective)}"
label = "Phase-to-relief-depth (Eqs. 6.2a/6.2b)"
definitions = [
    { symbol = "\\varphi(x,y)", meaning = "desired phase in radians at that point" },
    { symbol = "n_1,\\ n_0", meaning = "substrate and surrounding indices, at the operating wavelength; the reflective factor 2n₀ = double pass" },
]

[widgets."com.github.richbai90.diffractive.fab.int-depth"]
expression = "lam / (2 * (x - 1))"
domain = [1.05, 4]
ydomain = [0, 4]
title = "π-step (half-wave) relief depth vs substrate index, transmissive"
xlabel = "substrate index n₁"
ylabel = "depth (µm)"
readout = "n₁ = {x:0.01f} → d_π = {y:0.02f} µm"
parameters = [
    { name = "lam", label = "wavelength λ (µm)", min = 0.4, max = 11, step = 0.01, initial = 0.6328 },
]

[widgets."com.github.richbai90.diffractive.fab.step-1x2"]
label = "Worked example: the book's 1 × 2 beamsplitter, end to end"
steps = [
    { title = "Requirements", text = "HeNe λ = 0.6328 µm; 18.2° between the two output orders ⇒ θ±1 = ±9.1° at normal incidence." },
    { title = "Period", tex = "\\Lambda = \\frac{\\lambda}{\\sin 9.1^\\circ} = 4.0\\ \\mu\\text{m}", text = "Eq. 6.1 — geometry alone." },
    { title = "Cell", text = "Square wave: 50% duty ⇒ b = 2.0 µm." },
    { title = "Depth", tex = "d = \\frac{0.6328}{2\\,(1.4572 - 1)} = 0.6920\\ \\mu\\text{m}", text = "Eq. 6.2a with φ = π, fused silica n₁ = 1.4572 — depth depends ONLY on λ and indices, even when the cell is far more complex." },
    { title = "Reality check", text = "The book's SEM (Fig. 6.3, Digital Optics Corp.) shows exactly these grooves: 0.69 µm deep, 2 µm wide. Design → masks → wafer → measured part.", note = "Efficiency: 40.5% per order — 81% total into ±1." },
]

[widgets."com.github.richbai90.diffractive.fab.quiz-depth"]
question = "The same 1 × 2 splitter is to work in oil (n₀ = 1.45) instead of air. Its π depth…"
options = [
    "Is unchanged",
    "Grows: λ/(n₁ − n₀) with a smaller index contrast means a taller step",
    "Shrinks by 1.45×",
    "Depends on the resist",
]
answer = 1
explanation = "d = λ/[2(n₁ − n₀)]: fused silica in oil gives contrast 0.007 instead of 0.457 — a ~65× deeper structure (or a broken design). Depth is set by the OPD between levels, and immersion removes the very contrast the relief exploits."

[widgets."com.github.richbai90.diffractive.fab.quiz-masks"]
question = "Why do DOE makers buy masks from foundries rather than owning writers?"
options = [
    "Foundry chrome is purer",
    "An e-beam mask writer costs > $5M; foundries write MEBES-format data in stripes of 32768×1024 address units, with nm-scale butting errors and $1k–$20k+ mask prices",
    "Masks cannot be made on site at any price",
    "E-beam writers cannot write curves",
]
answer = 1
explanation = "The economics and the format: patterns fractured into rectilinear primitives, curve-fit error ε contributing wavefront error εsinθ/λ, and the PostScript escape hatch ($25 transparencies, ~7 µm photoreduced floor) for education — not for the 0.7-µm Dammann feature."

[widgets."com.github.richbai90.diffractive.fab.quiz-ar"]
question = "A fused-silica DOE needs 1.5 µm relief in features 0.7 µm wide. Aspect ratio ≈ 2:1 means…"
options = [
    "Standard single-layer resist lithography will be effortless",
    "Challenging but achievable — thick resist diffracts the exposing light, so hard masks/etch stops or AR < 1 designs are the rule",
    "The etch will be isotropic",
    "The design is impossible, full stop",
]
answer = 1
explanation = "AR = d/b. The book's rule of thumb: keep AR < 1; 5–10+ is possible with special chemistries and metal/dielectric etch stops. The 1 × 5 Dammann example (0.7 µm features, 1.48 µm depth) is its own verdict: 'challenging but achievable'."

[widgets."com.github.richbai90.diffractive.fab.quiz-material"]
question = "Silicon instead of fused silica for a 1.55 µm DOE…"
options = [
    "Relaxes depth tolerance (3 nm vs 17.5 nm per 1% phase error)",
    "Tightens depth tolerance ~6× (high index = shallow structures = small absolute error budget) and raises Fresnel loss to ~30%/surface",
    "Is transparent and index-free",
    "Only matters for reflective optics",
]
answer = 1
explanation = "High n cuts relief height (good: low AR, less shadowing) but every nanometer of etch is a larger fraction of the phase — and AR coatings become mandatory (92% slab transmission for silica vs 49% for Si). Material choice is a tolerance choice."

[widgets."com.github.richbai90.diffractive.fab.card-split"]
front = "The geometry split (function vs efficiency)"
back = "Lateral transition points = the optical function; depth = efficiency only, set by λ and the indices (Eqs. 6.1–6.2). Design the pattern for the wavefront, set the depth for the phase — then let masks and etch chemistry chase both."

# ---------------------------------------------------------------------------
# Lesson 13 — Photolithography and the Binary Optics Process (13-photolithography-binary-optics.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.diffractive.photo.card-tone"]
front = "Positive vs negative resist"
back = "Positive: EXPOSED resist dissolves in developer (DNQ/novolak chemistry: UV makes carboxylic acid, releases N₂; developers NaOH/KOH/TMAH). Negative: exposed resist polymerizes and stays. Positive is the workhorse."

[widgets."com.github.richbai90.diffractive.photo.card-modes"]
front = "Printing modes and floors"
back = "Contact: mask on resist, best fidelity ~0.5 µm, mask wears. Proximity: small gap, longer mask life, worse fidelity. Projection: lens-imaged, <0.3 µm, 5:1/10:1 reduction; steppers = step-and-repeat, >100 wafers/hour."

[widgets."com.github.richbai90.diffractive.photo.math-select"]
tex = "S \\;=\\; \\frac{\\text{etch rate of substrate}}{\\text{etch rate of mask (resist)}}"
label = "Etch selectivity"
definitions = [
    { symbol = "S \\geq 2\\text{–}3", meaning = "wanted for small, high-aspect-ratio binary features (CF₄/CHF₃ + O₂ chemistries on fused silica)" },
    { symbol = "S \\approx 1", meaning = "wanted for continuous-relief transfer (gray-scale, direct write): the resist depth maps directly into the substrate" },
]

[widgets."com.github.richbai90.diffractive.photo.math-levels"]
tex = "N\\ \\text{binary masks} \\;\\Longrightarrow\\; 2^N\\ \\text{phase levels} \\qquad (M\\ \\text{levels} \\Rightarrow N = \\log_2 M)"
label = "The binary-optics relation (vs N + 1 levels in older schemes)"
definitions = [
    { symbol = "3\\ \\text{masks}", meaning = "8 levels → 95% scalar efficiency for a lens blaze" },
    { symbol = "4\\ \\text{masks}", meaning = "16 levels → 99%" },
]

[widgets."com.github.richbai90.diffractive.photo.int-levels"]
expression = "pow(2, x)"
domain = [1, 5]
ydomain = [0, 40]
title = "Binary optics: phase levels per mask count"
xlabel = "masks N"
ylabel = "levels 2^N"
readout = "N = {x:0.0f} masks → {y:0.0f} levels"

[widgets."com.github.richbai90.diffractive.photo.step-eight"]
label = "Making 8 levels with 3 masks"
steps = [
    { title = "Decompose", text = "The final staircase's level code (000…111 in three bits) tells each mask which regions to open: mask k protects the regions whose k-th bit is 0." },
    { title = "Etch 1", tex = "\\Delta d = \\frac{\\lambda}{2^3 (n - 1)}", text = "First mask + etch: the deepest unit step, λ/8 of OPD — two levels exist." },
    { title = "Etch 2", text = "Strip, recoat, align mask 2, etch another λ/8 step in its opened regions: four levels." },
    { title = "Etch 3", text = "Mask 3, same depth step again: eight levels, total relief 7λ/8(n−1) — one step short of the full 2π depth." },
    { title = "Ordering rule", text = "In practice pattern the SMALLEST features FIRST (largest masks last): resist coats unevenly on steps, and small features at different heights can't be printed with equal fidelity. Alignment between levels: ≤ 0.1 µm with good methods.", note = "Each extra level doubles masks/etches/alignments — the tax that the sinc² flattening (Lesson 5) usually tells you to stop paying around 8–16 levels." },
]

[widgets."com.github.richbai90.diffractive.photo.quiz-er0"]
question = "Binary (mask) lithography uses which part of the resist response curve?"
options = [
    "The linear region between knee and E₀",
    "Two points only: below the knee (opaque mask areas) and above the dose-to-clear E₀ (clear areas)",
    "Only the knee itself",
    "The saturation plateau",
]
answer = 1
explanation = "A binary mask delivers two exposures; a high-contrast resist (steep slope past the knee) makes the developed profile sharp. The knee-to-E₀ region is the gray-scale/direct-write toolkit's home — deliberately low-contrast resists there."

[widgets."com.github.richbai90.diffractive.photo.quiz-etch"]
question = "A 40-µm-tall refractive microlens in fused silica at a typical 20 nm/min RIE rate takes…"
options = [
    "~33 minutes",
    "~33 hours",
    "~33 days",
    "It cannot be etched",
]
answer = 1
explanation = "40 µm ÷ 20 nm/min = 2000 min ≈ 33 h — the book's number (Sec. 8.1.5). Faster ICP tools help, but this is why DOE relief (3–4 µm) and refractive micro-relief (tens of µm) are different economic universes."

[widgets."com.github.richbai90.diffractive.photo.quiz-binary"]
question = "The binary-optics process (MIT Lincoln Lab, mid-1980s) changed the arithmetic from N masks → N+1 levels to…"
options = [
    "N masks → 2N levels",
    "N masks → 2^N levels",
    "N masks → N² levels",
    "One mask → unlimited levels",
]
answer = 1
explanation = "Binary encoding: each mask/etch cycle doubles the level count. 3 masks = 8 levels = 95%; 4 = 16 = 99%. The exponential is the whole reason multilevel DOEs became manufacturable at wafer scale."

[widgets."com.github.richbai90.diffractive.photo.quiz-order"]
question = "Why pattern the smallest features first in a multilevel process?"
options = [
    "Smallest etches are cheapest",
    "Resist coats unevenly over steps and depth-of-focus/diffraction effects degrade small features printed at the bottom of trenches — critical lithography wants a planar surface",
    "Large features would cover small ones",
    "Alignment marks only work on level surfaces",
]
answer = 1
explanation = "The book's process rule (Fig. 7.12 shows large-first only 'for illustration'): every etched step makes the next coating and exposure less planar; finish with the coarse mask where fidelity is easiest to spare."

[widgets."com.github.richbai90.diffractive.photo.card-summary"]
front = "Resist → relief, in one line"
back = "Clean + HMDS prime → spin coat → softbake → align & expose (contact ~0.5 µm / projection <0.3 µm) → develop → PEB/descum as needed → harden or RIE-transfer (S ≥ 2–3) → strip → inspect. Repeat per mask; 2^N levels from N masks."

# ---------------------------------------------------------------------------
# Lesson 14 — The Wider Fabrication Landscape (14-fabrication-survey.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.diffractive.fabsurvey.quiz-serial"]
question = "Which pair of methods shares the same fundamental throughput limitation?"
options = [
    "Contact printing and projection printing",
    "E-beam/laser direct writing and FIB/excimer machining — both serial, one element at a time",
    "Injection molding and thermal embossing",
    "Binary optics and gray-scale lithography",
]
answer = 1
explanation = "Serial = the beam must visit every point. Direct write wins prototypes (no masks, 256+ levels) and FIB/ablation machine arbitrary surfaces in final materials, but volume production pairs them with replication instead."

[widgets."com.github.richbai90.diffractive.fabsurvey.card-reflow"]
front = "Reflowed microlenses"
back = "Pattern resist cylinders with a binary mask, then melt them: surface tension pulls each cylinder into a refractive lens (good when diameter/height is in range). Refractive micro-relief is tens of µm tall — etch-transfer of a 40-µm lens takes >33 h at 20 nm/min."

[widgets."com.github.richbai90.diffractive.fabsurvey.card-choose"]
front = "Choosing a fabrication method"
back = "Volume vs quantity · material constraints (Si vs silica vs polymer chemistries) · function constraints (ruling = lines only; turning = radial only; lithography = arbitrary) · profile fidelity vs process sensitivity (binary = robust, gray-scale = sensitive, direct write = serial)."

[widgets."com.github.richbai90.diffractive.fabsurvey.quiz-rep"]
question = "Which replication route gives the highest-fidelity polymer replicas?"
options = [
    "Injection molding",
    "Thermal embossing above Tg",
    "Casting / UV embossing from a liquid photopolymer",
    "Microcontact printing",
]
answer = 2
explanation = "Liquid → solid cure avoids the flow/softening defects of melt pressing. Injection molding and embossing win on throughput (millions/month; credit-card holograms) but not fidelity. Sol-gel casting reaches glass, watching shrinkage."

[widgets."com.github.richbai90.diffractive.fabsurvey.quiz-match"]
question = "Match the capability: 'periods below 0.3 µm, parallel exposure, only straight periodic fringes.'"
options = [
    "Gray-scale lithography",
    "Interferometric exposure",
    "Diamond turning",
    "Near-field holography",
]
answer = 1
explanation = "Two-beam interference writes the fringe directly into resist — the smallest periods of any listed method, at the cost of only-sinusoidal-to-binary straight structures. NFH gets small periods via a mask's near field (period-halving); gray-scale and turning do not compete down there."

# ---------------------------------------------------------------------------
# Lesson 15 — Testing Diffractive Optical Elements (15-testing-doos.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.diffractive.test.card-metrology"]
front = "DOE metrology: who measures what"
back = "Optical microscope: gross defects, quick widths (reticle/video caliper). Stylus profilometer: depths ~10 Å on LARGE features; tip convolution (2–12.5 µm radius) reads narrow trenches shallow; can damage resist. AFM: <10 nm tip, force-sensing, µm-scale scan areas, sidewalls with flared tips. SEM: 0.4 Å electrons, 60,000×, may need conductive overcoat; FIB cross-section for sidewalls. PSI: angstrom vertical, ~1 µm lateral, blurs small features."

[widgets."com.github.richbai90.diffractive.test.quiz-stylus"]
question = "A mechanical profilometer reports a 16-level lens as shallower and rounder than designed. Cause?"
options = [
    "The lens really is — always trust the stylus",
    "The measured trace is the profile CONVOLVED with the stylus tip: a 2–12.5 µm radius cannot reach trench bottoms or ride sharp corners",
    "Phase-shifting error",
    "Charging of the surface",
]
answer = 1
explanation = "The trace follows the tip's center of curvature, not the surface. Same limitation in different clothing appears for PSI (focused spot size) and AFM (edge riding). Cross-check small features with AFM/SEM; trust stylus depth on large features."

[widgets."com.github.richbai90.diffractive.test.quiz-rss"]
question = "A rotating slit scanner characterizes a 3 × 3 spot array. Expect…"
options = [
    "The best possible 2-D map — that is what RSS is for",
    "Misleading results: the detector integrates along the whole slit length, so 2-D resolution ≈ slit length; RSS suits 1-D or circularly symmetric patterns",
    "Higher resolution than a CCD in 2-D",
    "Nothing — RSS only works in the far field",
]
answer = 1
explanation = "RSS gives superb 1-D profiles (0.5–1 µm slit, µm sampling) — the book's near-field 1 × 7 Dammann trace — but any point on its profile sums all light along the slit. 2-D discrete patterns: use a CCD or a pinhole scan."

[widgets."com.github.richbai90.diffractive.test.quiz-error"]
question = "On a fabricated 1 × 5 Dammann grating, which error does the MOST damage?"
options = [
    "+10% etch depth error (zero order swells to 17.6%)",
    "Shifting one transition point by 3% of the period — 'an even more profound effect' than the depth error",
    "A 10 nm surface roughness",
    "Testing at 670 nm instead of 650 nm",
]
answer = 1
explanation = "Depth errors are sinc²-soft (Lesson 8's table); transition-location errors re-write the Fourier coefficients themselves — the design's carefully balanced interference falls apart. The book's x₄ = 0.73532 → 0.70532 example makes the point, and it drives the metrology priority: check where the edges ARE, not only how deep."

[widgets."com.github.richbai90.diffractive.test.quiz-rough"]
question = "Random surface roughness on a completed DOE shows up as…"
options = [
    "Extra light in the zero order",
    "A uniform robbery: all orders lose intensity to a raised background between them",
    "A shift of the diffraction angles",
    "Chromatic focal shift",
]
answer = 1
explanation = "Systematic errors (depth, transitions, misalignment) redistribute power among orders deterministically; random scatter dephase light into the background everywhere equally. That's why a scatterometer measures 'light that goes where it isn't supposed to go.'"

[widgets."com.github.richbai90.diffractive.test.int-depth"]
expression = "(2 / pi * sin(pi * x / 2)) ^ 2"
domain = [0.6, 1.4]
ydomain = [0, 0.45]
title = "Binary π grating: each of ±1 orders vs depth ratio d/d_ideal"
xlabel = "depth ratio x"
ylabel = "η±1"
readout = "d/d₀ = {x:0.01f} → η±1 = {y:0.3f}"

[widgets."com.github.richbai90.diffractive.test.int-zero"]
expression = "(cos(pi * x / 2)) ^ 2"
domain = [0.6, 1.4]
ydomain = [0, 0.25]
title = "Same grating: zero-order leakage vs depth ratio"
xlabel = "depth ratio x"
ylabel = "η₀"
readout = "d/d₀ = {x:0.01f} → η₀ = {y:0.3f}"

[widgets."com.github.richbai90.diffractive.test.card-errorrule"]
front = "Process choice = error budget choice"
back = "Gray-scale/direct-write: nonvertical sidewalls + dose-shape errors, NO alignment errors. Binary masks: sharp walls, dose-robust, but mask-to-mask misalignment enters. Weave error type × likelihood × effect against cost and performance when picking the process."

# ---------------------------------------------------------------------------
# Lesson 16 — Diffractive Lenses in Instruments (16-lens-applications.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.diffractive.apps.math-dseidel"]
tex = "S_{\\mathrm{I}} = \\frac{y^4 \\varphi^3}{4}\\left[1 + B^2 + 4BT + 3T^2 - \\frac{8\\lambda G}{p\\,y^4}\\right], \\qquad S_{\\mathrm{II}} = \\frac{-y^2 \\varphi^2 H}{2}(B + 2T), \\qquad S_{\\mathrm{IV}} = S_{\\mathrm V} = 0"
label = "Seidel coefficients of a diffractive lens — the n → ∞ limit (Eqs. 10.8)"
definitions = [
    { symbol = "B = 2c_s/\\varphi", meaning = "bending via the SUBSTRATE curvature c_s; B = 2 with T = −1 (object at ∞) kills spherical AND coma on axis — the substrate must be concentric with the focus" },
    { symbol = "G", meaning = "a fourth-order phase term available to cancel spherical on a flat substrate" },
    { symbol = "S_{\\mathrm{IV}} = S_{\\mathrm V} = 0", meaning = "zero field curvature and zero distortion, inherently — the diffractive singlet's head start" },
]

[widgets."com.github.richbai90.diffractive.apps.step-sweatt"]
label = "The Sweatt model: a DOE as an absurdly thick-index wedge"
steps = [
    { title = "Wedge deflection", tex = "(n - 1)\\, \\frac{dt}{dr} = \\sin\\theta_d - \\sin\\theta_i", text = "A thin prism element of index n and thickness gradient dt/dr (Eq. 10.4)." },
    { title = "Grating deflection", tex = "\\frac{m\\lambda}{\\Lambda(r)} = \\sin\\theta_d - \\sin\\theta_i", text = "The same ray steered by a local grating period (Eq. 10.5)." },
    { title = "Equate", tex = "\\frac{m\\lambda}{\\Lambda(r)} = n\\, \\frac{dt}{dr} \\quad (n \\gg 1)", text = "Neither side depends on incidence angle — only on r — so a static thickness profile mimics the DOE at every field (Eq. 10.7)." },
    { title = "Numbers", tex = "f = 100\\ \\text{mm},\\ n = 10^4 \\Rightarrow R = 10^6\\ \\text{mm},\\ \\text{sag} = 50\\ \\text{nm}", text = "A 20-mm-diam 'lens' 50 nm thick with the right focal length and phase. Override its (unphysical) dispersion for color work; perfect for monochromatic aberration studies." },
    { title = "Consistency", tex = "\\Lambda(r) = \\frac{\\lambda R}{(n-1) r} \\approx \\frac{f\\lambda}{r}", text = "The model reproduces the diffractive lens's local period — Eq. 4.15 — as it must.", note = "Modern design programs have native DOE surface types; Sweatt's 1979 trick was how it was done before them." },
]

[widgets."com.github.richbai90.diffractive.apps.int-ftheta"]
expression = "f * (sin(x) / cos(x) - x)"
domain = [-0.5, 0.5]
ydomain = [-25, 25]
title = "Distortion to build into a scan lens: y − fθ = f(tan θ − θ)"
xlabel = "scan angle θ (rad)"
ylabel = "deviation (mm)"
readout = "θ = {x:0.02f} rad → y − fθ = {y:0.2f} mm"
parameters = [
    { name = "f", label = "focal length f (mm)", min = 50, max = 300, step = 1, initial = 150 },
]

[widgets."com.github.richbai90.diffractive.apps.math-thermal"]
tex = "x_f \\;=\\; \\frac{1}{f}\\frac{df}{dT}, \\qquad x_f^{\\,r} = \\alpha - \\frac{\\frac{dn_L}{dT} - \\frac{dn_{\\text{air}}}{dT}}{n_L - n_{\\text{air}}}, \\qquad x_f^{\\,d} = 2\\alpha - \\frac{1}{n_{\\text{air}}}\\frac{dn_{\\text{air}}}{dT}"
label = "Coefficient of thermal defocus (Eqs. 10.21–10.23), ppm/°C"
definitions = [
    { symbol = "\\alpha", meaning = "substrate's coefficient of thermal expansion; the diffractive form counts it TWICE (r² = 2f pλ: both f and the zone radii scale with length)" },
    { symbol = "x_f^{\\,d}", meaning = "positive, ~1–14 ppm/°C on common substrates, and nearly independent of dn/dT — a free thermal knob" },
    { symbol = "\\text{athermal rule}", meaning = "match the lens CTD to the mount CTE — focal length is irrelevant (Al mount = +23; fused silica refractive = −21.1, diffractive = +1.1)" },
]

[widgets."com.github.richbai90.diffractive.apps.quiz-ftheta"]
question = "A polygon scanner rotates at constant dθ/dt with an ordinary f·tanθ lens. The spot velocity…"
options = [
    "Is constant — geometry is geometry",
    "Grows with θ (d/dt of tanθ = θ/cos²θ), so pixels bunch at line start and stretch at center; the f–θ lens builds in exactly the opposite distortion",
    "Depends on the laser wavelength",
    "Is set by the facet count"
]
answer = 1
explanation = "Constant scan rate needs y = fθ. The diffractive singlet with B = −1 (substrate R = −2f, facet stop at 2f/3) delivers it as designed negative distortion: 16-µm spot, ~1600 dots/inch over 8.5 inches at f = 150 mm, ±20°."

[widgets."com.github.richbai90.diffractive.apps.quiz-thermal"]
question = "Why does a diffractive lens's CTD depend only on 2α (plus air's dn/dT)?"
options = [
    "Because etch depth cancels",
    "Zone radii scale as r² = 2f pλ: heating expands the substrate's lengths twice over (f ∝ length² in the r–f geometry), while the phase steps' OPD ratio barely moves with the glass's dn/dT",
    "Because DOEs are flat",
    "Because the mount dominates",
]
answer = 1
explanation = "The book's Table 10.1 checks it: fused silica x_d = 1.10 = 2 × 0.55; acrylic 129 ≈ 2 × 64.5; polycarbonate 131 ≈ 2 × 65.5. The glass's own dn/dT — which rules refractive thermal behavior — drops out almost entirely."

[widgets."com.github.richbai90.diffractive.apps.quiz-sweatt"]
question = "The Sweatt model's one unforgivable sin for chromatic design is…"
options = [
    "It cannot handle aspheres",
    "The surrogate material's dispersion is unphysical — you must force it to reproduce the DOE's λ-dependence, or color results are fiction",
    "It requires thick elements",
    "It only works for reflection",
]
answer = 1
explanation = "n = 10⁴ glass has the right monochromatic kick but arbitrary color; the model must be given the diffractive power's λ ∝ scaling (Eq. 4.36) by hand. For monochromatic aberration work it is exact — which is why it survived decades."

[widgets."com.github.richbai90.diffractive.apps.card-zero"]
front = "Diffractive singlet superpowers"
back = "S_IV = S_V = 0 inherently (no field curvature, no distortion). Telecentric stop (t = f) kills coma + astigmatism → landscape lens rivaling a Cooke triplet. For on-axis SA: curved (concentric) substrate or a 4th-order phase term."

[widgets."com.github.richbai90.diffractive.apps.card-staircase"]
front = "Staircase lens"
back = "The kinoform's leftover: refractive lens minus diffractive lens. Locally parallel surfaces ⇒ zero power, but off-axis it supplies negative field curvature — a thin Petzval corrector as small as the stop. Highly chromatic (lateral color): monochromatic systems only."


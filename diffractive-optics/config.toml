[widgets."com.github.richbai90.diffractive.binary.quiz-ladder"]
question = "A process can add one more mask/etch cycle. Buying the most efficiency means going from…"
options = [
    "4 to 8 levels",
    "2 to 4 levels",
    "8 to 16 levels",
    "16 to 32 levels",
]
answer = 1
explanation = "2→4 levels: 40.5% → 81%, +40 points. 4→8: +14. 8→16: +4. The sinc² curve is brutally front-loaded — which is why real processes climb the bottom rungs with masks and stop around 8–16 levels."

[widgets."com.github.richbai90.diffractive.binary.quiz-shadow"]
question = "Four-level grating, Λ = 4.0 µm, n = 1.5, λ = 1.0 µm at 14.48°: scalar theory says 81%, extended scalar theory says…"
options = [
    "Still 81% — shadowing only matters for lenses",
    "62.5% — the fill factor 0.878 enters squared: 0.81 × 0.772",
    "40.5% — half the light is shadowed",
    "95% — steps improve the blaze",
]
answer = 1
explanation = "The book's worked example (Sec. 2.5): η_net = η_scalar × (Λ′/Λ)². The facets shave the emerging beamlet to 87.8% of the period; squared, 0.772. 0.81 → 0.625. At large diffraction angles plain scalar numbers are optimistic by construction."

[widgets."com.github.richbai90.diffractive.binary.card-405"]
front = "40.5%"
back = "η±1 = (2/π)² for a 50%-duty π-phase binary grating — the two-level blaze in either direction, hence the 81% 1×2 beamsplitter. Also the ~41% focus fraction of the Fresnel phase plate in Lesson 2."

[widgets."com.github.richbai90.diffractive.binary.card-fill"]
front = "Fill factor and extended scalar theory"
back = "Deep structures clip each period's beamlet to Λ′ < Λ. Corrections: blaze shallower, d′ = λ/(n − cos θ_d); efficiency × (Λ′/Λ)². Predicts the collapse of 100% scalar efficiency as Λ/λ → 1 (Fig. 2.12)."

[widgets."com.github.richbai90.diffractive.binary.quiz-masks"]
question = "Why don't production DOEs use 256-level profiles?"
options = [
    "Sinc² theory caps efficiency at 99%",
    "Each level doubling costs a mask + etch + alignment, features shrink toward the fab floor, and the efficiency gain flattens — 8–16 levels is the practical knee",
    "Multilevel profiles cannot be designed mathematically",
    "High level counts destroy the substrate",
]
answer = 1
explanation = "The efficiency ladder is nearly flat above 8 levels while the fabrication ladder (masks, alignment to ~0.1 µm, ever-smaller features) climbs steeply. Gray-scale and direct-write methods (fabrication survey) buy smooth profiles in one step instead — at process-control cost."

# ---------------------------------------------------------------------------
# Lesson 6 — Rigorous Electromagnetic Methods (06-electromagnetic-methods.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.diffractive.emath.math-pws"]
tex = "A\\!\\left(\\tfrac{\\alpha}{\\lambda}, \\tfrac{\\beta}{\\lambda}, z\\right) \\;=\\; A\\!\\left(\\tfrac{\\alpha}{\\lambda}, \\tfrac{\\beta}{\\lambda}, 0\\right) \\exp\\!\\left[ \\frac{i 2\\pi z}{\\lambda} \\sqrt{1 - \\alpha^2 - \\beta^2} \\right]"
label = "Plane-wave spectrum propagation factor (Eq. 3.12)"
definitions = [
    { symbol = "A(\\alpha/\\lambda, \\beta/\\lambda, z)", meaning = "angular spectrum — the 2-D Fourier transform of the field, indexed by direction cosines α = λf_x, β = λf_y" },
    { symbol = "\\sqrt{1 - \\alpha^2 - \\beta^2}", meaning = "γ, the z direction cosine: real → propagating wave (pure phase); imaginary (α² + β² > 1) → evanescent wave, decaying within ~λ" },
    { symbol = "z", meaning = "propagation distance; each spectral component advances independently — FFT-based, O(N log N) versus O(N²) for direct Huygens summation" },
]

[widgets."com.github.richbai90.diffractive.emath.step-rcwa"]
label = "The modal method / RCWA in five moves (periodic structures only)"
steps = [
    { title = "Three regions", text = "Superstrate (index n₁, z < 0), grating slab (thickness h, periodic permittivity ε(x)), substrate (n₂). Incident TE plane wave at angle θ_i." },
    { title = "Expand in Rayleigh orders", tex = "\\alpha_m = \\alpha_0 + \\frac{2\\pi m}{\\Lambda}", text = "Reflected and transmitted fields are sums over orders m; tangential momentum is conserved modulo the reciprocal lattice. Order m propagates iff |α_m| ≤ n k₀ — otherwise it is evanescent (Eqs. 3.18–3.21)." },
    { title = "Fourier-expand the material", tex = "\\varepsilon(x) = \\varepsilon_0 \\sum_p \\varepsilon_p\\, e^{i 2\\pi p x / \\Lambda}", text = "Inside the slab, expand both the field in modes and ε(x) in harmonics; substituting Maxwell's equations (Eqs. 3.23–3.24) couples the harmonics." },
    { title = "Solve an eigenproblem", tex = "[Z]\\,\\tilde{E}_y = \\gamma^2\\, \\tilde{E}_y, \\qquad Z_{mn} = k_0^2 \\varepsilon_{m-n} - \\delta_{mn}\\alpha_m^2", text = "Truncating to N harmonics gives an N×N matrix eigenproblem: eigenvalues γ² are the modes the grating region can sustain (Eq. 3.30)." },
    { title = "Match and normalize", text = "Continuity of tangential E_y and H_x at z = 0 and z = h yields a linear system for reflected/transmitted amplitudes R_m, T_m; efficiencies follow with Poynting factors, η_Tm = Re(t_m/r₀)|T_m|² (Eq. 3.36).", note = "On the fused-silica square wave (n = 1.457, λ = 0.633 µm), periods 1–10 µm: the scalar constants 40.5%/4.5%/… are recovered only as Λ ≫ λ." },
]

[widgets."com.github.richbai90.diffractive.emath.math-emt"]
tex = "\\varepsilon_{\\text{eff}} = \\varepsilon_s f + \\varepsilon_0 (1 - f) \\;\\;\\text{(TE)}, \\qquad \\frac{1}{\\varepsilon_{\\text{eff}}} = \\frac{f}{\\varepsilon_s} + \\frac{1 - f}{\\varepsilon_0} \\;\\;\\text{(TM)}, \\qquad n_{\\text{eff}} = \\sqrt{\\varepsilon_{\\text{eff}}}"
label = "Effective medium theory for a subwavelength lamellar grating (Eq. 3.45)"
definitions = [
    { symbol = "f", meaning = "fill factor — fraction of the period occupied by ridge material" },
    { symbol = "\\varepsilon_s,\\ \\varepsilon_0", meaning = "permittivities of ridge and surrounding (vacuum) material" },
    { symbol = "\\text{validity}", meaning = "period Δ ≤ λ/(2n): constant field across a period; beyond it, use RCWA/FDTD" },
]

[widgets."com.github.richbai90.diffractive.emath.int-emt"]
expression = "sqrt(x * n_s * n_s + (1 - x))"
domain = [0, 1]
ydomain = [1, 4]
title = "TE effective index vs fill factor (fused-silica ridges in air; TM follows the harmonic average)"
xlabel = "fill factor f"
ylabel = "n_eff (TE)"
readout = "f = {x:0.01f} → n_eff = {y:0.3f}"
parameters = [
    { name = "n_s", label = "ridge index n_s", min = 1.4, max = 4, step = 0.01, initial = 1.457 },
]

[widgets."com.github.richbai90.diffractive.emath.quiz-evanescent"]
question = "A spatial-frequency component has α² + β² > 1. Under PWS propagation it…"
options = [
    "Grows with distance",
    "Decays exponentially with z — it is evanescent, carrying only near-field boundary information",
    "Propagates at a shallower angle",
    "Reflects back toward the aperture",
]
answer = 1
explanation = "The square root turns imaginary, so the transfer function becomes a real exponential decay over roughly a wavelength. This is exactly the information scalar far-field theory discards — and why fields must be sampled several wavelengths from the structure before plane-to-plane propagation is trustworthy."

[widgets."com.github.richbai90.diffractive.emath.quiz-rcwa"]
question = "Which structure would force you to abandon the modal method/RCWA for FDTD?"
options = [
    "A 1-D lamellar grating with period 2 µm",
    "A one-shot aperiodic diffractive beam shaper",
    "A crossed two-dimensional grating with constant period",
    "A subwavelength grating at normal incidence",
]
answer = 1
explanation = "RCWA's machinery is Floquet: periodicity in the expansion. An aperiodic element has no reciprocal lattice to expand in — that's FDTD's job (any geometry, λ/20 cells, time-march to steady state). Deep/high-contrast periodic structures stress RCWA's truncation but remain its domain."

[widgets."com.github.richbai90.diffractive.emath.quiz-emt"]
question = "A subwavelength grating has period exactly λ/(2n)… and you double the period. What breaks?"
options = [
    "Nothing — EMT is exact for all periods",
    "More than half a wavelength fits in a period: the constant-field assumption fails and diffracted orders appear — use RCWA/FDTD",
    "The fill factor becomes undefined",
    "TE and TM efficiencies become equal",
]
answer = 1
explanation = "Δ ≤ λ/(2n) is EMT's validity boundary. Beyond it the structure no longer looks like a homogeneous film to the wave — real diffraction orders exist and the rigorous solvers take over."

[widgets."com.github.richbai90.diffractive.emath.quiz-choose"]
question = "Pick the right tool for each job."
options = [
    "RCWA for aperiodic shapes; FDTD for periodic ones",
    "PWS to solve the boundary problem; RCWA to propagate between planes",
    "RCWA for periodic structures; FDTD for arbitrary ones; EMT when features ≪ λ; PWS to propagate a known field between planes",
    "FDTD for everything — it is the only rigorous method",
]
answer = 2
explanation = "The chapter's division of labor: PWS = fast, accurate plane-to-plane propagation (given a good source field); RCWA/modal = rigorous for infinite periodicity; FDTD = rigorous for anything, at grid cost; EMT = the analytic shortcut deep in the subwavelength regime."

[widgets."com.github.richbai90.diffractive.emath.card-fdtd"]
front = "FDTD in one line"
back = "Discretize Maxwell's time-dependent curl equations on a staggered grid (E/H offset half a cell in space, half a step in time), march iteratively to steady state. Cells ≈ λ/20 in the material; second-order accurate; handles any geometry and any ε, μ, σ per cell."

[widgets."com.github.richbai90.diffractive.emath.card-ladder"]
front = "The modeling ladder"
back = "Scalar thin-element (features ≫ λ) → extended scalar with fill factor (moderate angles) → PWS propagation + RCWA/FDTD boundary solve (features ~ λ) → EMT (features ≪ λ). Each rung's job: know which assumptions your design actually satisfies."


[widgets."com.github.richbai90.diffractive.dlens.step-zones"]
label = "Zone radii of a diffractive lens"
steps = [
    { title = "Define a zone edge", tex = "r_p^2 + f^2 \\;=\\; (f + p\\lambda)^2", text = "The p-th boundary is where the path from the aperture to the focus exceeds the axial path by exactly p wavelengths." },
    { title = "Expand", tex = "r_p^2 \\;=\\; 2 f p \\lambda + p^2 \\lambda^2", text = "Pure algebra on the relation above." },
    { title = "Paraxial limit", tex = "r_p^2 \\;=\\; 2 f p \\lambda \\quad (p\\lambda \\ll f)", text = "Eqs. 4.12–4.13: the familiar zone-plate radii. A π-step (amplitude/Fresnel) plate halves it: r_p² = pλf (Eq. 4.16)." },
    { title = "Local zone spacing", tex = "(r_{p+1} + r_p)\\,\\Delta r = 2f\\lambda \\;\\Rightarrow\\; \\Delta r \\approx \\frac{f\\lambda}{r}", text = "Eq. 4.15: the local grating period Λ(r) = fλ/r — zones crowd toward the edge as 1/r.", note = "At the edge of a fast lens the period approaches the wavelength — where scalar theory and the fab floor both start arguing (Sec. 4.3.3, Ch. 3)." },
]

[widgets."com.github.richbai90.diffractive.dlens.math-period"]
tex = "\\Lambda(r) \\;=\\; \\frac{f \\lambda}{r}"
label = "Local grating period of a diffractive lens (Eq. 4.15)"
definitions = [
    { symbol = "r", meaning = "radial position in the lens; the period shrinks linearly with 1/r — finest at the clear edge" },
    { symbol = "f\\lambda", meaning = "the invariant r·Λ(r) — the profile's 'information content'; later (Sec. 4.4.1) its constancy is what makes diffractive power ∝ λ" },
]

[widgets."com.github.richbai90.diffractive.dlens.math-depth"]
tex = "d_{2\\pi} \\;=\\; \\frac{\\lambda}{n - 1}, \\qquad d_N = \\frac{(2^N - 1)\\,\\lambda}{2^N (n - 1)} \\;\\xrightarrow{N \\to \\infty}\\; \\frac{\\lambda}{n - 1}"
label = "Kinoform depth and N-mask total etch (Eqs. 4.24–4.25)"
definitions = [
    { symbol = "d_{2\\pi}", meaning = "one full 2π of OPD: fused silica at HeNe → 0.6328/0.4572 = 1.384 µm" },
    { symbol = "N", meaning = "binary masks; each mask etches λ/[2^N(n−1)] — the last level stops one step below the full 2π depth" },
]

[widgets."com.github.richbai90.diffractive.dlens.math-alpha"]
tex = "\\alpha \\;=\\; \\frac{\\lambda_0}{\\lambda}\\cdot \\frac{n(\\lambda) - 1}{n(\\lambda_0) - 1}, \\qquad f(\\lambda) \\;=\\; \\frac{\\lambda_0}{\\lambda}\\,\\frac{f_0}{m}"
label = "Wavelength detuning parameter and focal shift (Eq. 4.26)"
definitions = [
    { symbol = "\\lambda_0", meaning = "design (construction) wavelength; α = 1 means perfect design" },
    { symbol = "m", meaning = "diffraction order used; focal length scales as 1/λ — diffractive power grows linearly with wavelength, opposite to glass" },
    { symbol = "\\eta", meaning = "kinoform first-order efficiency follows sin²[π(α−1)]/[π(α−1)]² (Eq. 4.27) — broad and forgiving near α = 1; multilevel devices degrade faster" },
]

[widgets."com.github.richbai90.diffractive.dlens.int-depth"]
expression = "(sin(pi * x) / (pi * x)) ^ 2"
domain = [0.01, 0.5]
ydomain = [0, 1.02]
title = "Kinoform efficiency vs fractional depth error ε (Eqs. 4.28–4.29)"
xlabel = "depth error ε"
ylabel = "η₁"
readout = "ε = {x:0.01f} → η₁ = {y:0.3f}"

[widgets."com.github.richbai90.diffractive.dlens.math-fnum"]
tex = "F_{\\min} \\;=\\; \\frac{2^{N-1}\\, \\Delta r_{\\min}}{\\lambda}"
label = "Fastest diffractive lens you can make (Eq. 4.34)"
definitions = [
    { symbol = "\\Delta r_{\\min}", meaning = "smallest fabricable feature — it appears at the lens edge, where Λ(r) = fλ/r is smallest" },
    { symbol = "N", meaning = "number of masks; each added level doubles the minimum f-number — fine features get finer per level" },
]

[widgets."com.github.richbai90.diffractive.dlens.int-fnum"]
expression = "pow(2, x - 1) * dr / lam"
domain = [1, 5]
ydomain = [0, 400]
title = "Minimum f-number vs mask count"
xlabel = "masks N (levels = 2^N)"
ylabel = "F_min"
readout = "N = {x:0.0f} masks → F_min = {y:0.1f}"
parameters = [
    { name = "dr", label = "min feature Δr_min (µm)", min = 0.1, max = 10, step = 0.1, initial = 1.0 },
    { name = "lam", label = "wavelength λ (µm)", min = 0.4, max = 11, step = 0.01, initial = 0.6328 },
]

[widgets."com.github.richbai90.diffractive.dlens.quiz-depth"]
question = "Etch depth is off by 10% on an otherwise perfect kinoform. Efficiency is closest to…"
options = [
    "87.5% (Table 4.2)",
    "96.8% (Table 4.2)",
    "40.5%",
    "50% — half the phase is wrong",
]
answer = 1
explanation = "η ≈ sin²(πε)/(πε)² with ε = 0.1 gives 96.8%; even 20% depth error leaves 87.5%. Depth is forgiving. The book's paired warning: the same tolerance logic does NOT protect transition locations — small placement errors can drastically cut efficiency."

[widgets."com.github.richbai90.diffractive.dlens.quiz-fnum"]
question = "λ = 0.6328 µm, minimum fabricable feature 1 µm, and you commit to 4 masks (16 levels). The fastest diffractive lens you can make is about…"
options = [
    "f/1.6",
    "f/3.2",
    "f/6.3",
    "f/12",
]
answer = 3
explanation = "F_min = 2^{N−1}·Δr_min/λ = 8 × 1/0.6328 ≈ 12.6 — and note the doubling per mask: f/1.6 → f/3.2 → f/6.3 → f/12.6. (The book's Sec. 4.3.3 prints 'f/12' for the eight-level case, which its own Eq. 4.34 puts at f/6.3; f/12 is the 16-level answer. Trust the formula.)"

[widgets."com.github.richbai90.diffractive.dlens.quiz-alpha"]
question = "A diffractive lens focuses λ₀ = 633 nm at f₀ = 100 mm in order m = 1. Its first-order focus at 1060 nm sits at…"
options = [
    "≈ 60 mm",
    "≈ 100 mm",
    "≈ 168 mm",
    "It has no first-order focus",
]
answer = 0
explanation = "f(λ) = (λ₀/λ)·f₀/m = (633/1060) × 100 ≈ 59.7 mm. Diffractive power grows linearly with wavelength (Eq. 4.36), so focal length shrinks as λ rises — the exact opposite of a glass lens, and the root of the negative Abbe number in the next lesson. (Efficiency at that detuning is a separate question — the sinc² in α.)"

[widgets."com.github.richbai90.diffractive.dlens.card-kinoform"]
front = "Kinoform design recipe"
back = "Compute the continuous phase profile φ(r) = 2π(n₀−1)z(r)/λ₀ for the target wavefront; fracture (wrap mod 2π) wherever phase changes by 2π = one wavelength of OPD; etch depths from λ/(n−1). Higher-order fractures (OPD = mλ₀) = superzones."

[widgets."com.github.richbai90.diffractive.dlens.card-edge"]
front = "Why the lens edge is the hard place"
back = "Λ(r) = fλ/r: features shrink toward the clear edge, so the edge sets the minimum f-number (Eq. 4.34), the shadowing loss, and where scalar theory first fails (low f/# → subwavelength outer zones, Swanson's MIT report)."

# ---------------------------------------------------------------------------
# Lesson 9 — Hybrid Lenses (09-hybrid-lenses.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.diffractive.hybrid.math-disp"]
tex = "\\varphi(\\lambda) \\;=\\; \\frac{\\lambda}{\\lambda_c}\\, \\varphi_c"
label = "Diffractive power is linear in wavelength (Eq. 4.36)"
definitions = [
    { symbol = "\\varphi_c", meaning = "power at the center wavelength; from φ = λ/(rΛ) with rΛ fixed by the manufactured profile" },
    { symbol = "\\text{vs. glass}", meaning = "a glass's power falls with λ (dn/dλ < 0); a DOE's power rises — opposite slopes through the visible" },
]

[widgets."com.github.richbai90.diffractive.hybrid.math-vdiff"]
tex = "V_{\\text{diff}} \\;=\\; \\frac{\\varphi}{\\Delta\\varphi} \\;=\\; \\frac{\\lambda_c}{\\lambda_s - \\lambda_l} \\;=\\; \\frac{587.6}{486.1 - 656.3} \\;=\\; -3.45"
label = "The equivalent Abbe number of every diffractive surface (Eq. 4.39)"
definitions = [
    { symbol = "-3.45", meaning = "negative (power grows with λ) and identical for every diffractive surface in the F/C/d band, regardless of shape or power" },
    { symbol = "\\text{glasses}", meaning = "V ≈ +25 (flint) to +70 (crown): the DOE is ~10–20× more dispersive than the strongest glass, with the opposite sign" },
]

[widgets."com.github.richbai90.diffractive.hybrid.step-example"]
label = "Achromatizing 100 mm of BK7 with a whisper of DOE"
steps = [
    { title = "The glass", tex = "\\varphi_a = 0.01\\ \\text{mm}^{-1}, \\quad V_a = 64.2", text = "A 100-mm-EFL BK7 singlet." },
    { title = "Achromat condition", tex = "\\varphi_b = -\\varphi_a\\, \\frac{V_b}{V_a} = -0.01 \\times \\frac{-3.45}{64.2}", text = "Eq. 4.11 with the diffractive surface's V_b = −3.45." },
    { title = "The DOE is nearly flat", tex = "\\varphi_b = +5.374 \\times 10^{-4}\\ \\text{mm}^{-1} \\;\\Rightarrow\\; f_b = 1861\\ \\text{mm}", text = "A +1.86 m 'lens' — a barely perceptible relief — cancels the color of a 100 mm singlet." },
    { title = "Net power", tex = "\\varphi = 0.01 + 0.000537 \\Rightarrow f \\approx 94.9\\ \\text{mm}", text = "Book prints 94.5 mm; recompute from its numbers gives ≈ 94.9 mm — a ~5% power addition either way. Design the glass for the residual, put the DOE on one flat surface, done." },
]

[widgets."com.github.richbai90.diffractive.hybrid.math-opd"]
tex = "\\mathrm{OPD}_{\\text{def}} \\;=\\; -\\frac{\\varphi}{2}\\, r^2 \\;=\\; A_1 r^2, \\qquad \\phi(r) \\;=\\; \\frac{2\\pi}{\\lambda}\\left( A_1 r^2 + A_2 r^4 + A_3 r^6 + A_4 r^8 \\right)"
label = "Diffractive surface as an optimizable phase polynomial (Eqs. 4.40–4.42)"
definitions = [
    { symbol = "A_1", meaning = "quadratic coefficient = −φ/2, the lens's power (fused-silica f/5 example: A₁ = −3.1365×10⁻⁴ mm⁻¹ with the higher terms)" },
    { symbol = "A_2, A_3, A_4", meaning = "even-power terms optimized like aspheric coefficients to cancel spherical and its wavelength dependence" },
    { symbol = "\\text{workflow}", meaning = "optimize coefficients in CODE V / Zemax / OSLO → fracture the phase by integral wavelengths → binary mask data (each program's unit conventions differ — Table 4.3)" },
]

[widgets."com.github.richbai90.diffractive.hybrid.math-poly"]
tex = "\\mathrm{OPD} \\;=\\; \\frac{(n_0 - 1)}{R}\\, \\frac{r^2}{2} \\quad \\longleftrightarrow \\quad \\phi(r) = \\frac{2\\pi}{\\lambda_0}(n_0 - 1)\\, z(r)"
label = "Phase profile from a surface profile (Eqs. 4.22–4.23)"
definitions = [
    { symbol = "z(r)", meaning = "the physical relief height; the program's polynomial lives in OPD/phase space, the fab's masks live in z(r) — fracture by λ of OPD to convert" },
]

[widgets."com.github.richbai90.diffractive.hybrid.quiz-weak"]
question = "Why can a diffractive surface with ~5% of the total power correct a singlet's color?"
options = [
    "DOEs have no spherical aberration",
    "Its Abbe number, −3.45, is ~10–20× more dispersive than any glass with the opposite sign — dispersion cancellation needs only a small power share",
    "The DOE absorbs the red end",
    "Because the doublet is cemented",
]
answer = 1
explanation = "φ_a/V_a = −φ_b/V_b: with |V_diff| ≈ 3.45 against a crown at 64, the diffractive power needed is only 3.45/64 ≈ 5% of the glass power. Nearly free color correction — the defining trick of hybrid optics."

[widgets."com.github.richbai90.diffractive.hybrid.quiz-vdiff"]
question = "Two diffractive surfaces: a strong f/2 lens profile and a weak flat field corrector. Their Abbe numbers are…"
options = [
    "The strong one is more dispersive",
    "Both ≈ −3.45 in the visible — identical for every diffractive surface over the same band",
    "Set by the substrate material",
    "+3.45, since diffraction adds power at red",
]
answer = 1
explanation = "V_diff = λ_c/(λ_s − λ_l) contains no geometry or material: shape-independent and always negative in the visible. (Only the sign convention could tempt you: power grows with λ, so the number is negative.)"

[widgets."com.github.richbai90.diffractive.hybrid.quiz-workflow"]
question = "The design program hands you phase coefficients A₁…A₄. What turns them into masks?"
options = [
    "Direct e-beam writing of the polynomial itself",
    "Fracturing: wrap the phase mod 2π (drop integral wavelengths of OPD) and quantize to 2^N levels, then generate the binary mask set",
    "A thermal reflow step",
    "Nothing — programs output finished optics",
]
answer = 1
explanation = "Optimize in phase space, manufacture in height space: OPD = λ₀·(phase/2π), fracture at every 2π wrap into the kinoform, quantize to the mask decomposition (Ch. 6–7's function-to-form step)."

[widgets."com.github.richbai90.diffractive.hybrid.card-fracture"]
front = "Fracturing"
back = "Cutting a continuous phase/OPD profile wherever it changes by 2π (one wavelength) and stacking the pieces into one-period relief; quantizing the sawtooth to 2^N levels yields the binary mask decomposition."

[widgets."com.github.richbai90.diffractive.hybrid.card-payoff"]
front = "What hybrids actually buy"
back = "IR Petzval: 2 ZnS menisci + DOE/asphere instead of 4 elements/3 materials — 1.1 kg vs 1.9 kg, ~⅓ cost. Erfle eyepiece: 5 → 3 lenses, 72% lighter, 1.36× eye relief, less lateral color. LWIR telescope: −2 elements, big lateral-color cut."


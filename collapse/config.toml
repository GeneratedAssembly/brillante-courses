# Widget configs for the "Why Reconstruction Collapses" course.
# Every [widgets."<id>"] table configures one <Widget /> instance used by a lesson.

# ---- Lesson 0: the collapse problem ---------------------------------------------

[widgets."com.github.richbai90.collapse.l0.quiz_diagnosis"]
question = "You train a U-Net with MSE to extract the red channel from grayscale images. The output looks like a washed-out, low-contrast copy of the input. Which explanation covers the most cases?"
options = [
    "The network is underfitting — train longer or add capacity",
    "MSE regression drives the prediction toward an average of every target consistent with the input",
    "The dataset is too small, so the network memorized it",
    "Grayscale images carry no color information at all",
]
answer = 1
explanation = "When many targets are consistent with the same input, the MSE-optimal prediction is their conditional mean — a blend, not any true channel. The input does carry color information; the loss just averages it away. That is the gray wall, and this course builds it from first principles."

[widgets."com.github.richbai90.collapse.l0.link_colorization"]
title = "Colorful Image Colorization"
url = "https://arxiv.org/abs/1603.08511"
source = "Zhang, Isola, Efros — ECCV 2016 (arXiv)"
description = "The canonical fix for conditional-mean collapse: quantize the color space into 313 bins, train cross-entropy with class re-weighting, and sample with annealed temperature at inference."
kind = "web"

[widgets."com.github.richbai90.collapse.l0.link_spectral_bias"]
title = "On the Spectral Bias of Neural Networks"
url = "https://arxiv.org/abs/1806.08734"
source = "Rahaman et al. — ICML 2019 (arXiv)"
description = "The F-principle: gradient descent fits low frequencies first, and high-frequency components can take exponentially longer. The learning-dynamics half of the collapse story."
kind = "web"

# ---- Lesson 1: the gray wall ----------------------------------------------------

[widgets."com.github.richbai90.collapse.l1.math_conditional_mean"]
label = "The MSE-optimal prediction"
tex = '\hat{C}(y) \;=\; \mathbb{E}\bigl[\,C \mid Y = y\,\bigr] \;=\; \int C\; p(C \mid Y = y)\;\mathrm{d}C'
definitions = [
    { symbol = "Ĉ(y)", meaning = "the prediction the network converges to for input y — the conditional mean", link = "#the-conditional-mean" },
    { symbol = "𝔼[C | Y = y]", meaning = "the average of the channel C over every training example whose grayscale input is y" },
    { symbol = "p(C | Y = y)", meaning = "the conditional distribution: which channel values occur, and how often, at this gray pattern" },
]

[widgets."com.github.richbai90.collapse.l1.inter_mixture"]
title = "A multimodal conditional: two shirts, one gray pattern"
xlabel = "channel value c"
ylabel = "p(c | Y)"
domain = [0.0, 1.0]
ydomain = [0.0, 6.0]
readout = "density at c = {x:0.2f} → {y:0.3f}"
expression = "(w/(s*sqrt(2*pi)))*exp(-(x-m1)^2/(2*s*s)) + ((1-w)/(s*sqrt(2*pi)))*exp(-(x-m2)^2/(2*s*s))"
parameters = [
    { name = "m1", label = "mode 1 (red shirt)", min = 0.05, max = 0.45, step = 0.01, initial = 0.25 },
    { name = "m2", label = "mode 2 (green shirt)", min = 0.55, max = 0.95, step = 0.01, initial = 0.75 },
    { name = "w", label = "weight of mode 1", min = 0.05, max = 0.95, step = 0.01, initial = 0.5 },
    { name = "s", label = "spread of each mode", min = 0.03, max = 0.15, step = 0.005, initial = 0.08 },
]

[widgets."com.github.richbai90.collapse.l1.quiz_mean_prediction"]
question = "At one gray pattern, the dataset contains two kinds of patches: 60% red (channel value 0.2) and 40% green (channel value 0.8). What does an MSE-trained network output for this patch?"
options = [
    "0.2 — the more common value",
    "0.8 — the more informative value",
    "0.44 — the probability-weighted mean",
    "It depends on the architecture",
]
answer = 2
explanation = "E[C|Y] = 0.6·0.2 + 0.4·0.8 = 0.44. The MSE optimum is the conditional mean — here a value that occurs in neither patch. Averaging is not a defect of the optimizer; it is what the loss computes."

[widgets."com.github.richbai90.collapse.l1.quiz_shortcut"]
question = "Why does the identity mapping f(Y) ≈ Y dominate early training in this task?"
options = [
    "Because convolutions are linear, so the untrained network is already the identity",
    "Because Y and C share their spatial structure, so a scaled copy of Y already achieves low loss — a stable early minimum",
    "Because stochastic gradient descent always converges to the identity",
    "Because color channels are smooth functions of grayscale",
]
answer = 1
explanation = "Input and target share edges, textures, and geometry, so predicting a scaled copy of the input captures most of the achievable loss reduction immediately. Escaping that basin needs gradients strong enough to break the input-output correlation — exactly what a DC-dominated L2 landscape fails to supply (Lesson 3)."

[widgets."com.github.richbai90.collapse.l1.quiz_mean_blame"]
question = "The gray wall appears. Which intervention does NOT attack it?"
options = [
    "Quantize the channel into bins and train cross-entropy",
    "Add an adversarial loss that punishes washed-out outputs",
    "Predict the chromaticity or the residual D = C − Y instead of the raw channel",
    "Make the network deeper and retrain with the same MSE loss",
]
answer = 3
explanation = "Depth does not change what the objective rewards. The conditional mean of a multimodal conditional is a blend no matter how it is parameterized. The working interventions all change what the loss can distinguish — bins, adversaries, feature spaces, or the target representation itself (Lesson 6)."

[widgets."com.github.richbai90.collapse.l1.card_mean"]
front = "What does an MSE-trained regressor minimize, and what is the optimal prediction?"
back = "The expected squared error E[(C − Ĉ(Y))²]; its minimizer is the conditional mean Ĉ(Y) = E[C | Y]. Regression to the mean is the objective, not a failure of training."

[widgets."com.github.richbai90.collapse.l1.card_l2_blur"]
front = "Why does the conditional mean look like a low-contrast copy of the input?"
back = "Y and C share their spatial structure, so E[C|Y] keeps the shared geometry while averaging away everything that differs — dynamic range, saturation, color. Shared structure survives; distinguishing content is averaged out."

# ---- Lesson 2: one gray, many colors --------------------------------------------

[widgets."com.github.richbai90.collapse.l2.math_luminance"]
label = "Grayscale is a projection of color (ITU-R BT.601)"
tex = 'Y \;=\; 0.299\,R \;+\; 0.587\,G \;+\; 0.114\,B'
definitions = [
    { symbol = "Y", meaning = "the grayscale value — perceived brightness, a weighted sum of the color channels", link = "#luminance-and-metamers" },
    { symbol = "R, G, B", meaning = "the color channel intensities, each in [0, 1]" },
    { symbol = "weights", meaning = "0.299/0.587/0.114 approximate the eye's sensitivity: green contributes most, blue least" },
]

[widgets."com.github.richbai90.collapse.l2.inter_isoluminant"]
title = "Every point on this line is the same gray"
xlabel = "red channel value R"
ylabel = "green channel value G that keeps Y fixed"
domain = [0.0, 1.0]
ydomain = [0.0, 1.0]
readout = "at R = {x:0.2f}: G = {y:0.3f}"
expression = "(Y - 0.299*x - 0.114*B)/0.587"
parameters = [
    { name = "Y", label = "gray value Y", min = 0.05, max = 0.95, step = 0.01, initial = 0.5 },
    { name = "B", label = "blue channel B (held fixed)", min = 0.0, max = 1.0, step = 0.01, initial = 0.5 },
]

[widgets."com.github.richbai90.collapse.l2.quiz_metamer"]
question = "Two different shirts — one red, one green — render to the identical grayscale patch. In color science this is called…"
options = [
    "aliasing",
    "metamerism",
    "quantization",
    "clipping",
]
answer = 1
explanation = "Metamerism: distinct colors producing the same measured response. Here the response is the luminance projection Y = 0.299R + 0.587G + 0.114B, which many different RGB triples share."

[widgets."com.github.richbai90.collapse.l2.quiz_projection"]
question = "Given only the gray value Y = 0.299R + 0.587G + 0.114B, how many RGB triples are consistent with it?"
options = [
    "Exactly one — that is what grayscale encodes",
    "A two-parameter family of colors",
    "Up to three — one per channel",
    "It depends on the image content",
]
answer = 1
explanation = "One linear equation in three unknowns leaves 3 − 1 = 2 free directions: an entire plane of metamers per gray value. The projection discards two of the three color degrees of freedom, for every patch, always."

[widgets."com.github.richbai90.collapse.l2.quiz_residual_idea"]
question = "Why does predicting the residual D = C − Y (or the ratio C/(Y+ε)) remove the gray wall's favorite shortcut?"
options = [
    "Residuals are smaller numbers, so the loss converges faster",
    "The shortcut C ≈ k·Y becomes C − Y ≈ (k−1)·Y, which is even easier",
    "The shared luminance structure is subtracted away, so the target no longer looks like the input",
    "It doesn't — residuals are always harder to predict",
]
answer = 2
explanation = "Y and C share nearly all their structure; the residual is what makes the channel distinct from the luminance profile. After subtracting, the trivial scaled-identity solution no longer scores well — the shortcut is removed by construction, not by optimization pressure."

[widgets."com.github.richbai90.collapse.l2.card_metamer"]
front = "Metamerism"
back = "Distinct colors that produce the same measured response — here, different RGB triples with equal luminance Y. The projection RGB → Y is many-to-one, so color is not recoverable from gray alone without extra assumptions."

[widgets."com.github.richbai90.collapse.l2.card_luminance"]
front = "What does Y = 0.299R + 0.587G + 0.114B compute, and what does it destroy?"
back = "Perceived brightness (BT.601 luminance). It maps a 3-D color space to 1-D, discarding two degrees of freedom per patch — which is why the conditional p(C|Y) is generically spread over a two-parameter family."


[widgets."com.github.richbai90.collapse.l6.card_reproject"]
front = "Re-projection (forward-consistency) loss"
back = "Pass the predicted channels back through the known forward operator and penalize ‖g − Σ T_λ[Î_λ]‖². The stripped-signature shortcut fails this check: smooth outputs cannot re-encode to the encoded measurement."

[widgets."com.github.richbai90.collapse.l6.card_decorr"]
front = "Cross-channel decorrelation penalty"
back = "Penalize |⟨Î_i, Î_j⟩| / (‖Î_i‖₂‖Î_j‖₂) over output-channel pairs. A collapsed reconstruction has pairwise correlation ≈ 1; forcing decorrelation obliges each band to carry distinct spatial structure."

[widgets."com.github.richbai90.collapse.l6.card_unrolling"]
front = "Algorithm unrolling"
back = "Turn iterative reconstruction (ISTA, ADMM, primal-dual) into network layers, so the forward/adjoint operators act on the residual inside the architecture. The signature cannot be stripped without failing the block's own data-fidelity step."
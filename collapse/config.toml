[widgets."com.github.richbai90.collapse.l3.math_parseval"]
label = "Parseval's theorem (discrete form)"
tex = '\sum_{x} \bigl(g(x) - \hat{g}(x)\bigr)^2 \;=\; \sum_{f} \bigl|\, G(f) - \hat{G}(f) \,\bigr|^2'
definitions = [
    { symbol = "Σₓ (·)²", meaning = "total squared error summed over pixels — the (unnormalized) MSE", link = "#parseval-s-accounting" },
    { symbol = "𝓕{·}", meaning = "Fourier transform: G(f) is the Fourier coefficient of g(x) at spatial frequency f" },
    { symbol = "Σ_f |·|²", meaning = "total squared error summed over frequencies — the same number, by Parseval" },
]

[widgets."com.github.richbai90.collapse.l3.inter_residual"]
title = "The residual: a DC mistake and a carrier mistake, together"
xlabel = "position x"
ylabel = "residual e(x) = g − ĝ"
domain = [0.0, 1.0]
ydomain = [-0.3, 0.3]
readout = "residual at x = {x:0.2f} → {y:0.4f}"
expression = "d + 2*a*sin(p/2)*cos(2*pi*f*x + p/2)"
parameters = [
    { name = "d", label = "DC error d", min = -0.2, max = 0.2, step = 0.01, initial = 0.08 },
    { name = "a", label = "carrier amplitude a", min = 0.0, max = 0.1, step = 0.005, initial = 0.04 },
    { name = "f", label = "carrier frequency f", min = 1.0, max = 40.0, step = 1.0, initial = 10.0 },
    { name = "p", label = "carrier phase error p", min = -3.14159, max = 3.14159, step = 0.05, initial = 1.5708 },
]

[widgets."com.github.richbai90.collapse.l3.math_mse_decomp"]
label = "MSE decomposed into DC and carrier error"
tex = '\mathrm{MSE} \;=\; d^2 \;+\; a^2\,\bigl(1 - \cos p\bigr)'
definitions = [
    { symbol = "d", meaning = "DC error: how far the predicted constant level is off", link = "#two-mistakes-two-very-different-energies" },
    { symbol = "a", meaning = "carrier amplitude — the size of the high-frequency component" },
    { symbol = "p", meaning = "phase error of the carrier; p = π/2 is the worst case" },
]

[widgets."com.github.richbai90.collapse.l3.slider_energy"]
label = "Carrier amplitude a (truth: A_DC = 0.8, so A² = 0.64)"
min = 0.005
max = 0.2
step = 0.005
initial = 0.04
readout = "x*x/(0.64 + x*x)"
display = "energy share of the carrier: {result:0.4f}"

[widgets."com.github.richbai90.collapse.l3.stepper_mse"]
label = "Why DC gradients add while carrier gradients cancel"
steps = [
    { title = "Setup", text = "Truth g(x) = A_DC + a·sin(2π f₀ x), with A_DC ≫ a. The prediction carries a DC error d and a carrier phase error p: ĝ(x) = (A_DC + d) + a·sin(2π f₀ x + p)." },
{ title = "The residual", tex = 'e(x) = g(x) - \hat{g}(x) = d \;+\; a\bigl[\sin(2\pi f_0 x + p) - \sin(2\pi f_0 x)\bigr]', note = "Two independent parts: a constant offset, and a carrier difference." },
    { title = "Collapse the carrier difference", tex = '\sin(u + p) - \sin(u) \;=\; 2\,\sin(p/2)\,\cos(u + p/2)', note = "The carrier error is a zero-mean cosine with amplitude 2a·sin(p/2) — small when a is small, regardless of how wrong the phase is." },
    { title = "Average the square over pixels", text = "The cross term d·(zero-mean cosine) cancels across the sum — the DC error and the carrier error do not interact. The cosine squared averages to 1/2. So the carrier part contributes (2a·sin(p/2))²·(1/2) = 2a²·sin²(p/2)." },
    { title = "The decomposition", tex = '\mathrm{MSE} \;=\; d^2 \;+\; 2a^2\sin^2(p/2) \;=\; d^2 \;+\; a^2\bigl(1-\cos p\bigr)', note = "Linear in the DC error, quadratic in the carrier amplitude — and capped by a²." },
    { title = "Now take the gradient", text = "∂MSE/∂d = 2d: every pixel's residual has the same sign, so gradient contributions add constructively — a large, smooth pull. The carrier's gradient is scaled by a² and its per-pixel terms oscillate in sign, so they partially cancel unless the phase is already near-perfect. With A_DC ≫ a the DC pull wins by orders of magnitude: a tiny shift of the background outweighs a catastrophic carrier error." },
]

[widgets."com.github.richbai90.collapse.l3.quiz_dc_vs_hf"]
question = "g(x) = 0.8 + 0.04·sin(2πf₀x). Two models make equally accurate relative mistakes — each is off by 10% of its own component's amplitude. Roughly how much more loss does the DC mistake cost?"
options = [
    "About the same — relative accuracy is what matters",
    "About 20× more",
    "About 400× more",
    "The carrier mistake costs more because it is high-frequency",
]
answer = 2
explanation = "Squared error is amplitude squared: the DC term is 20× the carrier, so equal relative accuracy means (0.8/0.04)² = 400× unequal energy (within a factor of two, depending on the carrier error's shape — the order of magnitude is the point). Equal effort earns hundreds of times unequal loss, which is why L2 gravitates to the DC band."

[widgets."com.github.richbai90.collapse.l3.quiz_constructive"]
question = "Why do DC-error gradients add constructively while carrier gradients mostly cancel?"
options = [
    "DC residuals are spatially correlated — every pixel pushes the same way — while carrier residuals oscillate in sign and cancel in the sum",
    "DC errors are larger, and squaring removes their sign",
    "Carrier gradients vanish exactly because sin averages to zero",
    "Because convolutions low-pass filter the gradients themselves",
]
answer = 0
explanation = "The L2 gradient sums residual × ∂ĝ/∂θ over pixels. A constant offset is coherent across the whole patch — contributions reinforce. An oscillating residual changes sign across small neighborhoods, so terms cancel unless the model's phase alignment is already near-perfect. Early in training it is not."

[widgets."com.github.richbai90.collapse.l3.quiz_parseval_meaning"]
question = "Parseval's theorem says spatial MSE equals frequency-summed squared error. So why is L2 biased toward low frequencies?"
options = [
    "It isn't — Parseval proves L2 treats all frequencies equally",
    "The theorem equalizes the accounting, but the signal's energy is not equal across frequencies: natural spectra concentrate at low f, so that is where the error budget is spendable",
    "Because Fourier transforms of images are low-pass filtered",
    "Because high frequencies cannot be represented in pixel space",
]
answer = 1
explanation = "The loss weights every frequency's error identically — but the components do not arrive with equal energy. Natural signals put ~99.75% of theirs in the DC band for our A/a = 20 example. Equal weighting of unequal energies is the asymmetry."

[widgets."com.github.richbai90.collapse.l3.card_parseval"]
front = "Parseval's theorem (discrete)"
back = "Total squared error in pixel space equals total squared error in Fourier space: Σₓ(g−ĝ)² = Σ_f |G−Ĝ|². MSE is a frequency-summed budget — and it gets spent where the signal's energy is, which for natural signals is the low end."

[widgets."com.github.richbai90.collapse.l3.card_energy_share"]
front = "Energy share of a weak carrier"
back = "For g = A_DC + a·sin(2πf₀x), the carrier holds a²/(A²_DC + a²) of the total energy. For A = 0.8, a = 0.04: about 0.25%. The signature the model must learn is a quarter-percent of the signal, as far as squared error is concerned."


[widgets."com.github.richbai90.collapse.l4.quiz_order"]
question = "Under standard gradient descent with MSE, which components of the target are fit first?"
options = [
    "Low frequencies first; high-frequency components can take exponentially longer",
    "High frequencies first, then the low-frequency envelope",
    "All frequencies at the same rate",
    "The order depends on the initialization, unpredictably",
]
answer = 0
explanation = "The F-principle (Rahaman et al., 2019): gradient descent learns low-frequency components first, and the iterations needed for frequency f grow roughly exponentially with f. The component the loss rewards least (Lesson 3) is also reached last."

[widgets."com.github.richbai90.collapse.l4.quiz_dip"]
question = "What does the deep image prior result (Ulyanov et al., 2018) establish?"
options = [
    "Any image can be compressed into a CNN's weights",
    "A randomly initialized convolutional network, with no training data at all, already favors smooth, low-frequency image solutions",
    "CNNs need large datasets because they carry no prior information",
    "Noise is removed by the loss function, not the architecture",
]
answer = 1
explanation = "The architecture alone is a smoothness prior: even untrained, a CNN mapping random noise to images produces low-frequency structure. Convolutional layers act as implicit low-pass filters — the hypothesis space leans smooth before a single gradient step."

[widgets."com.github.richbai90.collapse.l4.inter_carrier"]
title = "What the network must add on top of the DC term"
xlabel = "position x"
ylabel = "carrier alone: a·sin(2πfx)"
domain = [0.0, 1.0]
ydomain = [-0.12, 0.12]
readout = "carrier at x = {x:0.2f} → {y:0.3f}"
expression = "a*sin(2*pi*f*x)"
parameters = [
    { name = "a", label = "carrier amplitude a", min = 0.01, max = 0.1, step = 0.005, initial = 0.04 },
    { name = "f", label = "carrier frequency f", min = 1.0, max = 30.0, step = 1.0, initial = 8.0 },
]

[widgets."com.github.richbai90.collapse.l4.math_fourier_features"]
label = "Fourier feature map (Tancik et al., 2020)"
tex = '\gamma(x) = \bigl(\sin(2\pi B_1 x),\ \cos(2\pi B_1 x),\ \ldots,\ \sin(2\pi B_m x),\ \cos(2\pi B_m x)\bigr)'
definitions = [
    { symbol = "γ(x)", meaning = "the feature map replacing the raw input coordinate — the network sees γ(x), not x", link = "#fourier-features-moving-the-target-into-reach" },
    { symbol = "B_j", meaning = "frequencies drawn from a distribution with scale σ: the bands the map can represent" },
    { symbol = "m", meaning = "number of features; the target's high-frequency structure becomes linearly reachable in γ-space" },
]

[widgets."com.github.richbai90.collapse.l4.quiz_features_vs_optics"]
question = "In the spectral decoding problem, the optics encode wavelength as a high-frequency spatial signature. How does this relate to Fourier features?"
options = [
    "They are unrelated — optics cannot change what a network can represent",
    "The optics already performed a Fourier-feature-like embedding: the signature is high-frequency structure the network could represent — but an L2 loss on a DC-dominated signal never rewards it",
    "Fourier features remove the need for the forward model",
    "The encoding makes the problem harder in every respect",
]
answer = 1
explanation = "Tancik et al. lift high-frequency structure into the network's reach by embedding the input; the encoded-optics measurement arrives with that embedding already stamped on. The information is present and representable — it is the loss and the smoothness prior that abandon it."

[widgets."com.github.richbai90.collapse.l4.card_fprinciple"]
front = "F-principle (spectral bias)"
back = "Gradient descent fits low-frequency components of the target first; the training time to fit frequency f grows roughly exponentially with f (Rahaman et al., 2019). Networks are low-pass filters in time, not just in architecture."

[widgets."com.github.richbai90.collapse.l4.card_dip"]
front = "Deep image prior"
back = "The convolutional architecture is itself a prior: a randomly initialized CNN, trained to fit noise, produces smooth low-frequency images. Smoothness is in the hypothesis space before the loss gets a vote (Ulyanov et al., 2018)."

[widgets."com.github.richbai90.collapse.l4.card_fourier"]
front = "Fourier features"
back = "Remap input coordinates through sin/cos at many frequencies: γ(x) = (sin 2πB₁x, cos 2πB₁x, …). High-frequency targets become linearly reachable, countering the F-principle (Tancik et al., 2020)."

# ---- Lesson 5: encoded light ------------------------------------------------------

[widgets."com.github.richbai90.collapse.l5.math_forward"]
label = "The encoded measurement"
tex = 'g(x, y) \;=\; \sum_{i=1}^{3} \bigl( T_{\lambda_i} \ast I_{\lambda_i} \bigr)(x, y) \;+\; \eta'
definitions = [
    { symbol = "g(x, y)", meaning = "the single grayscale measurement — everything the sensor sees", link = "#the-forward-model" },
    { symbol = "T_λ", meaning = "wavelength-dependent spatial transport: the shift-and-blur operator the optics apply at wavelength λ", link = "#the-forward-model" },
    { symbol = "∗", meaning = "2-D convolution with the PSF h_λ of wavelength λ" },
    { symbol = "I_λ", meaning = "the spectral image: energy arriving in band λ (the reconstruction target)", link = "/course/collapse/one-gray-many-colors#luminance-and-metamers" },
    { symbol = "η", meaning = "sensor noise" },
]

[widgets."com.github.richbai90.collapse.l5.inter_overlap"]
title = "Two spectral bands, one combined response"
xlabel = "normalized spatial frequency"
ylabel = "combined transfer response"
domain = [-2.0, 2.0]
ydomain = [0.0, 2.0]
readout = "combined response at f = {x:0.2f} → {y:0.3f}"
expression = "exp(-(x+d/2)^2/(2*s*s)) + 0.85*exp(-(x-d/2)^2/(2*s*s))"
parameters = [
    { name = "d", label = "band separation d", min = 0.0, max = 1.6, step = 0.02, initial = 0.4 },
    { name = "s", label = "band bandwidth s", min = 0.1, max = 0.8, step = 0.01, initial = 0.45 },
]

[widgets."com.github.richbai90.collapse.l5.stepper_nullspace"]
label = "From optics to a matrix to the collapse"
steps = [
    { title = "Discretize", text = "Sample the measurement and each channel image onto N pixels; stack the three channel images into one vector i = (I_λ1, I_λ2, I_λ3) of length 3N." },
    { title = "The forward map becomes a matrix", tex = '\mathbf{g} \;=\; A\,\mathbf{i} \;+\; \boldsymbol{\eta}, \qquad A \in \mathbb{R}^{N \times 3N}', note = "Each column of A is a shifted, blurred delta pattern — a PSF. Applying A means: blur each channel by its own PSF and add." },
    { title = "Overlapping PSFs → near-collinear columns", text = "When the three PSFs share spatial support and most of their energy near DC, the columns of A are nearly collinear: applying them has almost the same effect. A is close to singular — small singular values." },
    { title = "Singular value decomposition", tex = 'A \;=\; U\,\boldsymbol{\Sigma}\,V^{\!\top}', note = "Σ's large entries: directions the measurement records strongly. Small entries: directions the measurement barely distinguishes." },
    { title = "Where the signature lives", text = "Channel differences like I_λ1 − I_λ2 act along the small singular values — they contribute almost nothing to g. The dominant direction is the spatial average across the channels, which carries nearly all the energy." },
    { title = "The collapse, stated in matrix language", text = "An L2-trained network is graded by energy. The optimum it finds: reproduce the dominant direction (the average channel), drop the rest. The signature is not noise — it is unweighted information, living in directions the loss barely grades. This is null-space averaging." },
]

[widgets."com.github.richbai90.collapse.l5.slider_noise"]
label = "Channel correlation ρ (two channels, columns [[1, ρ], [ρ, 1]])"
min = 0.0
max = 0.99
step = 0.01
initial = 0.9
readout = "1/(1-x)"
display = "amplification of the difference direction: {result:0.2f}×"

[widgets."com.github.richbai90.collapse.l5.quiz_conditioning"]
question = "Two spectral channels' PSFs overlap so heavily that their correlation is ρ = 0.9. How much does exact inversion amplify noise along the channels' difference direction?"
options = [
    "0.9× — noise is damped",
    "About 1.11× — inversion is gentle on differences",
    "About 10×",
    "About 81×",
]
answer = 2
explanation = "The matrix [[1, ρ], [ρ, 1]] has eigenvalues 1±ρ with eigenvectors (1,1) and (1,−1). The difference direction (1,−1) has eigenvalue 0.1, so inversion amplifies it by 1/0.1 = 10× — while the sum direction is damped (1/1.9 ≈ 0.53). Exact inversion amplifies exactly what an energy-graded loss ignores."

[widgets."com.github.richbai90.collapse.l5.quiz_signature"]
question = "Why does the trained model remove the transformation signature from its predictions?"
options = [
    "The signature is absent from the measurement",
    "The signature is random noise, so removing it reduces the loss",
    "The signature is present but carries little energy and its gradients cancel, while the average component dominates the loss — so it is optimized away",
    "The network's capacity is too small to represent it",
]
answer = 2
explanation = "The optics encoded the signature into g — it is there. But overlapping transfer functions push it into low-singular-value territory (weak energy), its oscillating residuals produce cancelling gradients (Lesson 3), and the architecture's smoothness prior dislikes it (Lesson 4). Every force points the same way: keep the average, drop the signature."

[widgets."com.github.richbai90.collapse.l5.quiz_throughline"]
question = "The gray wall (Lesson 1) and null-space averaging (this lesson) collapse in the same direction. What is the shared root cause?"
options = [
    "Both datasets were too small",
    "In both, the components that distinguish the true answer carry almost none of the energy that the loss grades",
    "Both need larger networks",
    "Both are caused by sensor noise",
]
answer = 1
explanation = "Metamers: the averaged color is what survives when distinguishing content is unobservable. Null-space averaging: the average channel is what survives when distinguishing content is unweighted. In both cases an energy-graded loss keeps the dominant component and discards the signature of the truth."

[widgets."com.github.richbai90.collapse.l5.card_psf"]
front = "PSF and transfer function"
back = "h_λ: the blur-and-shift pattern the optics imprint at wavelength λ. H_λ = 𝓕{h_λ}: which spatial frequencies that pattern passes. Overlapping H_λ means the bands are entangled in the measurement — separation becomes ill-conditioned."

[widgets."com.github.richbai90.collapse.l5.card_nullspace"]
front = "Null-space averaging"
back = "When the forward matrix has near-null directions (overlapping PSFs, collinear columns), the measurement barely distinguishes channel differences. An energy-graded loss reconstructs the dominant direction — the average channel — and discards the signature."

# ---- Lesson 6: forcing the signature ----------------------------------------------

[widgets."com.github.richbai90.collapse.l6.math_reproject"]
label = "Re-projection (forward-consistency) loss"
tex = '\mathcal{L}_{\text{total}} \;=\; \sum_{i=1}^{3} \bigl\lVert I_{\lambda_i} - \hat{I}_{\lambda_i} \bigr\rVert_1 \;+\; \gamma\,\Bigl\lVert g - \sum_{i=1}^{3} T_{\lambda_i}\bigl[\hat{I}_{\lambda_i}\bigr] \Bigr\rVert_2^2'
definitions = [
    { symbol = "Î_λ", meaning = "the model's reconstruction of the channel at wavelength λ", link = "#fixing-the-signature-re-projection" },
    { symbol = "Σ T_λ[Î_λ]", meaning = "re-encoding: the predicted channels passed back through the forward optics" },
    { symbol = "g − Σ T_λ[Î_λ]", meaning = "consistency residual: if the prediction stripped the signature, its re-encoding cannot match the measurement" },
    { symbol = "γ", meaning = "weight of the consistency term" },
]

[widgets."com.github.richbai90.collapse.l6.math_decorr"]
label = "Cross-channel decorrelation penalty"
tex = '\mathcal{L}_{\text{decorr}} \;=\; \sum_{i \neq j} \frac{\bigl| \langle \hat{I}_{\lambda_i},\ \hat{I}_{\lambda_j} \rangle \bigr|}{\bigl\lVert \hat{I}_{\lambda_i} \bigr\rVert_2\ \bigl\lVert \hat{I}_{\lambda_j} \bigr\rVert_2}'
definitions = [
    { symbol = "⟨Î_i, Î_j⟩", meaning = "spatial inner product of two output channel estimates — large when the channels are near-copies", link = "#decorrelate-the-outputs" },
    { symbol = "‖·‖₂", meaning = "pixel-space (L2) norm of a channel image" },
]

[widgets."com.github.richbai90.collapse.l6.stepper_diagnose"]
label = "Diagnose, then fix"
steps = [
    { title = "Symptom", text = "The output is a low-contrast copy of the input, or the output channels are near-identical and signature-free." },
    { title = "Diagnose A: multimodality", text = "Is the conditional p(target | input) multimodal — many valid targets per input (metamers)? Check predictions against targets: do in-between values appear that no training example has?" },
    { title = "Prescription A", text = "Change what the objective distinguishes between modes: classification over bins with cross-entropy (class-balanced), adversarial loss, or perceptual loss; or change representation — chromaticity, or residual D = C − Y." },
    { title = "Diagnose B: energy asymmetry", text = "Is the distinguishing content low-energy and high-frequency (a signature)? Check the error spectrum; re-encode the prediction through the forward operator and compare with the measurement." },
    { title = "Prescription B", text = "Make the signature load-bearing: re-projection (forward-consistency) loss, cross-channel decorrelation, unrolled or adjoint-wired architectures, Fourier features." },
    { title = "Do not cross the streams", text = "The families are not interchangeable: cross-entropy does not repair a null space, and re-projection does not repair multimodal averaging. Diagnose first; then pick the family that targets the failure." },
]

[widgets."com.github.richbai90.collapse.l6.quiz_fix_classification"]
question = "Your target channel given grayscale is genuinely multimodal — red or green, never in between. Which loss family directly avoids outputting the in-between average?"
options = [
    "L1 instead of L2",
    "Discretize the channel into bins and train softmax + cross-entropy, with annealed sampling at inference",
    "MSE with a deeper network",
    "L2 with a larger learning rate",
]
answer = 1
explanation = "L1 is not the fix: its optimum is the conditional median, which for a bimodal conditional is still an arbitrary point of the in-between plateau. Cross-entropy concentrates probability mass instead of averaging — two plausible modes stay two modes (Zhang et al., 2016)."

[widgets."com.github.richbai90.collapse.l6.quiz_fix_signature"]
question = "Your three output channels re-encode to a smooth measurement that misses the encoded fringes of g. Which addition most directly penalizes that?"
options = [
    "Dropout on the encoder",
    "Forward-operator consistency: add γ·‖g − Σ T_λ[Î_λ]‖² to the loss",
    "Weight decay",
    "A larger learning rate",
]
answer = 1
explanation = "Re-projection makes the stripped-signature solution invalid: smooth outputs re-encode to a smooth g′ that cannot reproduce the encoded fringes. The loss constrains consistency with the measurement, not closeness to a mean — it does not need to out-shout the DC band."

[widgets."com.github.richbai90.collapse.l6.quiz_matching"]
question = "Match fix to failure. Which pairing is WRONG?"
options = [
    "Multimodal conditional → classification over bins + cross-entropy",
    "Signature stripped → re-projection loss through the forward operator",
    "Three near-identical output channels → cross-channel decorrelation penalty",
    "Multimodal conditional → Fourier features on the input coordinates",
]
answer = 3
explanation = "Fourier features attack the learner's spectral bias — they help the network reach high-frequency structure, but they do nothing about averaging over modes. For multimodality, change what the loss distinguishes: classification, adversarial, perceptual, or a new target representation."

[widgets."com.github.richbai90.collapse.l6.link_gan"]

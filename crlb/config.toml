[widgets."com.github.richbai90.crlb2.math_conditional_scaling"]
type = "math"
label = "Conditional illumination scaling"
tex = "J(\\theta) \\;=\\; \\mathbb{E}\\!\\left[\\sum_{j,p} \\int_0^T \\frac{\\nabla_\\theta r_{jp}\\, \\nabla_\\theta r_{jp}^{\\mathsf T}}{r_{jp}}\\,\\mathrm{d}t\\right], \\qquad r_{jp} = b_{jp}(I_j) + \\frac{g(p\\,q_j)}{C_{jp}}"
definitions = [
    { symbol = "b_jp(I_j)", meaning = "circuit-domain spurious rate — a calibrated device property, not a universal law", link = "/course/crlb/sensor#what-the-sensor-actually-emits" },
    { symbol = "B_j, f_j", meaning = "optical background and encoded signal — modeled and calibrated separately", link = "/course/crlb/sum-before-log#hyperspectral-encoding" },
    { symbol = "J(θ)", meaning = "the point-process Fisher information", link = "/course/crlb/point-process#the-score-and-the-point-process-fim" },
]

[widgets."com.github.richbai90.crlb2.quiz_scaling_retraction"]
type = "quiz"
question = "Why was the CRLB ∝ N conclusion retracted?"
options = [
    "The Poisson algebra was wrong",
    "Λ₀(N) appended after an illumination-invariant contrast is a modeling choice, not a physical noise law",
    "Event cameras cannot work in daylight",
    "The CRLB was applied backwards",
]
answer = 1
explanation = "The count algebra was correct. The retraction targets the noise model: photon shot noise compresses through the log to σ ∝ 1/√N, so relative log-domain precision improves with illumination. Each factor must be modeled and calibrated separately."

[widgets."com.github.richbai90.crlb2.quiz_log_compression"]
type = "quiz"
question = "Photon shot noise on the photocurrent has σ ∝ √N. After the logarithmic front-end, the log-domain noise is…"
options = ["σ_ln I ∝ N", "σ_ln I ∝ √N", "σ_ln I ∝ 1/√N", "σ_ln I ∝ 1/N"]
answer = 2
explanation = "The log front-end converts multiplicative fluctuation to additive: relative error √N/N = 1/√N. Relative log-domain precision improves as illumination grows."

[widgets."com.github.richbai90.crlb2.card_three_domains"]
type = "flashcard"
front = "The three noise domains"
back = "Photon: shot noise ∝ √N, compressed by the log to σ_ln I ∝ 1/√N. Circuit: b_jp(I) spurious events, calibrated device property. Optical: B_j enables observability and dilutes contrast — a design parameter."

[widgets."com.github.richbai90.crlb2.card_shot_noise"]
type = "flashcard"
front = "σ_ln I ∝ 1/√N — log-domain shot noise"
back = "Photocurrent shot noise (∝ √N) passes through the log front-end as relative fluctuation: √N/N = 1/√N. More light → cleaner log-intensity signal."


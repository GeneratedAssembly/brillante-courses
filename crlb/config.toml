[widgets."com.github.richbai90.crlb2.math_lean_poisson"]
type = "math"
label = "poisson_sum_one · poisson_mean · poisson_second_moment"
tex = "\\sum_{k} \\frac{\\mu^k e^{-\\mu}}{k!} = 1, \\qquad \\mathbb{E}[K] = \\mu, \\qquad \\mathbb{E}\\bigl[K^2\\bigr] = \\mu^2 + \\mu"
definitions = [
    { symbol = "μ", meaning = "Poisson bin mean", link = "/course/crlb/poisson#the-pmf-and-its-log-likelihood" },
]

[widgets."com.github.richbai90.crlb2.math_lean_poisson_fim"]
type = "math"
label = "poisson_fisher_mu · poisson_fisher_rate"
tex = "I(\\mu) = \\frac{1}{\\mu}, \\qquad I(\\Lambda) = \\frac{\\Delta t}{\\Lambda}"
definitions = [
    { symbol = "I(μ), I(Λ)", meaning = "Fisher information in the bin-mean and rate parametrizations", link = "/course/crlb/fisher#fisher-information" },
]

[widgets."com.github.richbai90.crlb2.math_lean_zero_mean"]
type = "math"
label = "score_zero_mean · fam_fim"
tex = "\\mathbb{E}\\bigl[\\partial_i \\ell\\bigr] = 0, \\qquad -\\,\\mathbb{E}\\bigl[\\partial_i^2 \\ell\\bigr] = \\sum_b \\frac{(\\partial_i \\mu_b)^2}{\\mu_b}"
definitions = [
    { symbol = "μ_b", meaning = "bin mean of bin b", link = "/course/crlb/poisson#the-pmf-and-its-log-likelihood" },
]

[widgets."com.github.richbai90.crlb2.math_lean_continuous"]
type = "math"
label = "continuous_fim"
tex = "\\int_0^T \\frac{(\\partial_i r)^2}{r}\\,\\mathrm{d}t \\;=\\; \\sum_b \\Delta t\\, \\frac{(\\partial_i r_b)^2}{r_b}"
definitions = [
    { symbol = "r_b", meaning = "piecewise-constant rate on bin b", link = "/course/crlb/point-process#the-binned-stage-rehabilitated" },
]

[widgets."com.github.richbai90.crlb2.math_lean_forward"]
type = "math"
label = "quotient_rule_sensitivity · degenerate_zero_ref · rate_chain_ideal · fim_sign_invariant · ideal_fim_entry"
tex = "\\partial_s q_j = \\frac{\\dot a\\, B_j\\, h_j}{\\bigl(B_j + a f_j\\bigr)^2}, \\quad B_j = 0 \\Rightarrow \\partial_s q_j = 0, \\quad \\partial_s r_{j+} = \\frac{p\\, \\partial_s q_j}{C_{j+}}, \\quad \\Delta t\\, \\frac{q'^2}{C\\,(C\\Lambda_0 + q)}"
definitions = [

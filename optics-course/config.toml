[widgets."com.github.richbai90.optics.eye-camera.quiz1"]
type = "quiz"
question = "Which structure supplies most of the eye's refractive power, and which one changes during accommodation?"
options = [
    "The cornea supplies most of the power; the crystalline lens changes shape to accommodate",
    "The crystalline lens supplies most of the power; the cornea changes shape to accommodate",
    "The retina supplies most of the power; the pupil changes shape to accommodate",
    "The iris supplies most of the power; the lens changes diameter to accommodate",
]
answer = 0
explanation = "The cornea does ~2/3 of the focusing, thanks to the big index jump from air (~1.00) to cornea (~1.38). The lens sits in fluid on both sides, so its index contrast is small — but it is the only part that can change shape, so it owns the variable ~20 D of accommodation."


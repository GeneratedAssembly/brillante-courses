# Lesson 30 — Interferometers (30-interferometers.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.optics.interferometers.math-michelson"]
type = "math"
label = "Michelson phase bookkeeping"
tex = "\\Delta L \\Rightarrow \\Delta\\phi = \\frac{4\\pi}{\\lambda}\\,\\Delta L, \\qquad I = I_0\\cos^2\\!\\left(\\frac{2\\pi\\,\\Delta L}{\\lambda}\\right)"
definitions = [
    { symbol = "ΔL", meaning = "mirror displacement from balance; the arm difference is 2ΔL (round trip)" },
    { symbol = "fringe", meaning = "one full bright-dark cycle per λ/2 of travel — the round trip doubles the ruler's resolution" },
]

[widgets."com.github.richbai90.optics.interferometers.int-fringecount"]
type = "interactive"
expression = "cos(2 * pi * x / lam) * cos(2 * pi * x / lam)"
domain = [0, 3]
ydomain = [0, 1.05]
title = "Michelson output versus mirror displacement ΔL — one fringe per λ/2 (λ = 0.55 μm default)"
xlabel = "mirror displacement ΔL (μm)"
ylabel = "relative intensity"
readout = "ΔL = {x:0.3f} μm → I = {y:0.2f}"
parameters = [
    { name = "lam", label = "wavelength λ (μm)", min = 0.4, max = 0.7, step = 0.01, initial = 0.55 },
]

[widgets."com.github.richbai90.optics.interferometers.quiz1"]
type = "quiz"
question = "A Michelson mirror moves 0.55 μm at λ = 550 nm. How many fringes cross the output?"
options = [
    "0.5 — one fringe per full wavelength",
    "1 — the round trip halves the count",
    "2 — the round trip doubles it: m = 2ΔL/λ",
    "4 — two fringes per arm per wavelength",
]
answer = 2
explanation = "The light visits the mirror twice, so the path difference is 2ΔL = 1.1 μm = 2λ: the intensity cycles twice, m = 2ΔL/λ = 2. Counting fringes converts motion to wavelength units with no calibrated ruler in sight."

[widgets."com.github.richbai90.optics.interferometers.quiz2"]
type = "quiz"
question = "A glass slide (n = 1.5, t = 100 μm) is slipped into one arm of a balanced Michelson at λ = 550 nm. The fringe shift is:"
options = [
    "0 — a balanced interferometer is insensitive to glass",
    "91 — one pass of the extra optical path",
    "182 — 2(n − 1)t/λ with the round trip",
    "364 — the slide multiplies the path by four",
]
answer = 2
explanation = "The glass adds (n − 1)t = 50 μm of optical path one way; the round trip doubles it: 2 × 50 μm / 0.55 μm ≈ 182 fringes. A shard of glass thinner than a hair moves the pattern by hundreds of fringes."

[widgets."com.github.richbai90.optics.interferometers.quiz3"]
type = "quiz"
question = "Why does LIGO build interferometer arms 4 km long?"
options = [
    "Long arms are cheaper per meter of vacuum",
    "A gravitational-wave strain of ~10⁻²¹ displaces the arms by L × h; kilometers turn a 10⁻¹⁹ m signal into a detectable differential phase",
    "Gravity waves reflect better off distant mirrors",
    "Long arms suppress the laser's noise floor by diffraction",
]
answer = 1
explanation = "The measurable quantity is displacement, and displacement = strain × length. At L = 4 km, a strain of 10⁻²¹ becomes ~10⁻¹⁸ m — still absurdly small, but within reach of phase detection after repeated bounces and heavy filtering. Arm length is the lever."

[widgets."com.github.richbai90.optics.interferometers.card-counting"]
type = "flashcard"
front = "How does a Michelson measure displacement?"
back = "Count fringes: one cycle per λ/2 of mirror travel, m = 2ΔL/λ. Inserting glass of index n and thickness t shifts 2(n − 1)t/λ fringes — index and length both come out in wavelength units."

[widgets."com.github.richbai90.optics.interferometers.card-family"]
type = "flashcard"
front = "Name the interferometer family and each one's niche."
back = "Michelson: folded, displacement and index. Mach–Zehnder: open arms for imaging and photonics. Fizeau: surface against a reference flat — the optical shop's tool. Common-path shearing: beam against its shifted self, vibration-immune. Same two-amplitude bookkeeping throughout."

# ---------------------------------------------------------------------------
# Lesson 31 — Coherence (31-coherence.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.optics.coherence.math-temporal"]
type = "math"
label = "Temporal coherence and bandwidth"
tex = "L_c = c\\,\\tau_c \\approx \\frac{\\lambda^2}{\\Delta\\lambda}"
definitions = [
    { symbol = "τ_c", meaning = "coherence time: how long the field remembers its phase" },
    { symbol = "L_c", meaning = "coherence length: the path difference beyond which fringes wash out" },
    { symbol = "Δλ", meaning = "spectral width — bandwidth is forgetfulness; white light forgets in ~3 fs" },
]

[widgets."com.github.richbai90.optics.coherence.plot-visibility"]
type = "plot"
title = "Fringe visibility versus path difference (λ = 550 nm): white light ~1 µm, LED ~10 µm, laser far beyond"
xlabel = "path difference (µm)"
ylabel = "fringe visibility"
series = [
    { name = "white light (Δλ = 300 nm)", color = "#0d9488", points = [[0, 1], [0.5, 0.5], [1, 0]] },
    { name = "filtered LED (Δλ = 30 nm)", color = "#6366f1", points = [[0, 1], [2.5, 0.75], [5, 0.5], [7.5, 0.25], [10, 0]] },
    { name = "single-mode laser (Δλ ~ 0.001 nm)", color = "#f59e0b", points = [[0, 1], [7.5, 1], [15, 1]] },
]

[widgets."com.github.richbai90.optics.coherence.quiz1"]
type = "quiz"
question = "A Michelson's fringes vanish once its arm difference exceeds about 10 μm, at λ ≈ 550 nm. The source's spectral width is roughly:"
options = [
    "0.03 nm — a laser diode",
    "0.3 nm",
    "30 nm — a filtered LED",
    "300 nm — white light",
]
answer = 2
explanation = "Δλ ≈ λ²/L_c = (550 nm)²/10⁴ nm = 30 nm. White light (300 nm) would have died at 1 μm; the LED's 10 μm matches. Coherence length inverts bandwidth measurement: an interferometer is a spectrum analyzer."

[widgets."com.github.richbai90.optics.coherence.quiz2"]
type = "quiz"
question = "Two independent laser pointers overlap on a screen. Why no fringes?"
options = [
    "Their frequencies differ by more than the detector can see",
    "No mechanism enforces a fixed phase between two independent oscillators — the cross term averages to zero",
    "Laser light is too intense to superpose",
    "The beams are too parallel to overlap",
]
answer = 1
explanation = "Interference needs a fixed phase relation, and two independent lasers have none: each lases from spontaneous seeds with unrelated phases. Deriving both beams from one wavefront — a beamsplitter, a single source feeding two slits — is what restores the relation."

[widgets."com.github.richbai90.optics.coherence.quiz3"]
type = "quiz"
question = "Which experiment demands the longest coherence length?"
options = [
    "A soap-film color observation in sunlight",
    "Young's two slits 0.2 mm apart",
    "A Michelson test of a 30 cm optic",
    "A hologram of a 30 cm scene",
]
answer = 3
explanation = "Holography interferes object and reference beams from every point of the scene, so the path differences span the object's own depth: a 30 cm hologram wants laser-class coherence (meters). The Michelson needs 30 cm plus margin; the slits and the film live happily on micrometers."

[widgets."com.github.richbai90.optics.coherence.card-temporal"]
type = "flashcard"
front = "Define coherence length and connect it to bandwidth."
back = "L_c = c τ_c ≈ λ²/Δλ: the path difference a beam can tolerate before fringes wash out. White light ~1 μm, a filtered LED ~10 μm, a good single-mode laser 0.3 m or much more."

[widgets."com.github.richbai90.optics.coherence.card-spatial"]
type = "flashcard"
front = "What is spatial coherence?"
back = "The mutual phase agreement between separated points of one wavefront. Independent sources have none — no fringes. A source of angular size θ_s limits transverse coherence to about λ/θ_s, which is how Michelson's stellar interferometer measured star diameters."


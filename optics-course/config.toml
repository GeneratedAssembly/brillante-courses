    { name = "crown glass (Cauchy)", color = "#0d9488", points = [[400, 1.5281], [450, 1.5222], [500, 1.5180], [550, 1.5146], [600, 1.5125], [650, 1.5106], [700, 1.5092]] },
    { name = "water (flat-ish)", color = "#6366f1", points = [[400, 1.3428], [450, 1.3388], [500, 1.3364], [550, 1.3346], [600, 1.3332], [650, 1.3322], [700, 1.3315]] },
]

[widgets."com.github.richbai90.optics.light-in-matter.quiz1"]
question = "Blue light (450 nm) enters the same glass as red light (650 nm). Which is faster inside the glass?"
options = [
    "Blue — shorter wavelength always travels faster",
    "Red — n(650 nm) < n(450 nm), and v = c/n",
    "Both identical — glass has a single index",
    "Whichever entered first",
]
answer = 1
explanation = "In transparent media n grows toward shorter wavelengths, so red meets a smaller n and a larger speed v = c/n. This speed difference is exactly what drives chromatic aberration and prisms."

[widgets."com.github.richbai90.optics.light-in-matter.quiz2"]
question = "Why is the sky blue rather than violet, given that Rayleigh scattering goes as 1/λ⁴ and violet scatters even more strongly?"
options = [
    "The atmosphere is made of blue pigment",
    "The Sun emits less violet than blue, and our eyes are less sensitive to violet",
    "Violet light is absorbed entirely by oxygen",
    "Scattering removes violet from the sky",
]
answer = 1
explanation = "Two effects shift the perceived color from violet toward blue: the solar spectrum contains less violet, and the eye's spectral sensitivity peaks well below violet. The strong 1/λ⁴ scattering still makes short wavelengths dominate."

[widgets."com.github.richbai90.optics.light-in-matter.slider-rayleigh"]
label = "Wavelength λ (nm) — Rayleigh scattering goes as 1/λ⁴"
min = 380
max = 750
step = 5
initial = 450
display = "λ = {value} nm → {result:.1}× the scattering of 650 nm red light"
readout = "(650/x)^4"

[widgets."com.github.richbai90.optics.light-in-matter.card-n"]
front = "Index of refraction n"
back = "n = c/v — ratio of light's speed in vacuum to its speed in the medium. Air ≈ 1.0003, water ≈ 1.33, glass ≈ 1.52, diamond ≈ 2.42."

[widgets."com.github.richbai90.optics.light-in-matter.card-rayleigh"]
front = "Rayleigh scattering"
back = "Scattering by particles ≪ λ; intensity ∝ 1/λ⁴ — blue (450 nm) scatters ≈ 4.4× more than red (650 nm)."


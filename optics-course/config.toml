    { name = "flint glass (N-SF11, V≈25)", color = "#6366f1", points = [[400, 1.8067], [450, 1.7860], [500, 1.7730], [550, 1.7641], [600, 1.7577], [650, 1.7529], [700, 1.7491]] },
]

[widgets."com.github.richbai90.optics.prisms-and-dispersion.quiz1"]
question = "In the thin-prism limit, doubling a prism's apex angle α while keeping the glass the same does what to the deviation D ≈ (n−1)α?"
options = [
    "Leaves it unchanged — only n matters",
    "Doubles it",
    "Doubles it and reverses its direction",
    "Halves it",
]
answer = 1
explanation = "D ≈ (n−1)α is linear in α: doubling the apex angle doubles the deviation, and the dispersion (the spread between colors) doubles with it — which is why spectrometers use steep prisms."

[widgets."com.github.richbai90.optics.prisms-and-dispersion.quiz2"]
question = "In a primary rainbow, which color appears on the outside (top) of the arc, and why?"
options = [
    "Violet — it deviates least, so it comes from the highest drops",
    "Red — it deviates least (~42° vs ~40°), so it reaches the eye from drops higher in the sky",
    "Green — it sits between red and violet in deviation",
    "All colors come from the same drops, in equal arcs",
]
answer = 1
explanation = "Each color leaves the drop at its own angle; red, deviated least, arrives at the eye from drops that sit higher along the line of sight, so red forms the outer edge of the arc. The secondary bow reverses this order after a second internal reflection."

[widgets."com.github.richbai90.optics.prisms-and-dispersion.quiz3"]
question = "Why does an achromatic doublet pair a positive crown element with a negative flint element instead of using two positive elements?"
options = [
    "Two positive elements would double the focal power",
    "The flint's negative power cancels the crown's power while adding chromatic error",
    "Their powers add (the pair still converges) while their chromatic errors, driven in opposite directions by opposite signs, partially cancel",
    "The flint corrects spherical aberration, which is the real problem",
]
answer = 2
explanation = "Because the flint's power is negative, the chromatic dispersion it introduces opposes the crown's. Choosing glasses with well-chosen Abbe numbers makes the net power substantially achromatic while remaining converging."

[widgets."com.github.richbai90.optics.prisms-and-dispersion.card-deviation"]
front = "Thin-prism deviation"
back = "D ≈ (n−1)α — linear in apex angle α and in excess index (n−1); dispersion follows the slope of n(λ)."

[widgets."com.github.richbai90.optics.prisms-and-dispersion.card-doublet"]
front = "Achromatic doublet"
back = "Positive crown (low dispersion, high V) + negative flint (high dispersion, low V): focal powers add, chromatic errors cancel."


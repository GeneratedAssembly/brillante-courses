[widgets."com.github.richbai90.optics.radiometry.math-solidangle"]
tex = "\\Omega = \\frac{A}{R^{2}}, \\qquad \\Omega_{\\text{cone}} = 2\\pi\\left(1 - \\cos\\theta\\right) \\;\\approx\\; \\pi\\theta^{2}"
label = "Solid angle, full sphere and small cone"
definitions = [
    { symbol = "\\Omega", meaning = "solid angle in steradians (sr); a full sphere is 4π sr", link = "#solid-angle" },
    { symbol = "A,\\; R", meaning = "area of the patch on a sphere of radius R centered on the source", link = "#solid-angle" },
    { symbol = "\\theta", meaning = "cone half-angle; the paraxial form Ω ≈ πθ² drives every θ² scaling below", link = "#solid-angle" },
]

[widgets."com.github.richbai90.optics.radiometry.math-quantities"]
tex = "E = \\frac{d\\Phi}{dA}, \\qquad I = \\frac{d\\Phi}{d\\Omega}, \\qquad L = \\frac{d^{2}\\Phi}{dA\\,d\\Omega\\,\\cos\\varphi}"
label = "The radiometric family (flux Φ in watts)"
definitions = [
    { symbol = "\\Phi", meaning = "radiant flux, in watts — total optical power", link = "#the-radiometric-quantities" },
    { symbol = "E", meaning = "irradiance, W/m² — flux landing per unit area (the detector's currency)", link = "#the-radiometric-quantities" },
    { symbol = "I", meaning = "radiant intensity, W/sr — flux per unit solid angle from a point-like source", link = "#the-radiometric-quantities" },
    { symbol = "L", meaning = "radiance, W/(sr·m²) — brightness of a patch per direction; invariant along a ray in a lossless system", link = "#the-radiometric-quantities" },
    { symbol = "\\varphi", meaning = "angle between the surface normal and the viewing direction (cosine 'projected area' factor)", link = "#the-radiometric-quantities" },
]

[widgets."com.github.richbai90.optics.radiometry.quiz1"]
question = "Radiance L is invariant along a ray in a lossless optical system. What design consequence follows?"
options = [
    "A lens can brighten a scene patch arbitrarily by concentrating its light",
    "No passive instrument can exceed the source's radiance in the image; you can only gather a larger solid angle of it (bigger aperture)",
    "Radiance equals irradiance at every conjugate plane",
    "Brightness depends only on the focal length",
]
answer = 1
explanation = "Conservation of radiance (étendue) means an image pixel's radiance can never exceed the object patch's radiance. Instruments win light only by accepting a wider cone of it — larger aperture / lower f-number — or by trading image size, never by 'amplifying' brightness."

[widgets."com.github.richbai90.optics.radiometry.math-fnumber"]
tex = "E_{\\text{image}} \\;=\\; \\frac{\\pi\\,L}{4\\,N^{2}}, \\qquad N \\equiv f/\\#"
label = "Focal-plane irradiance vs f-number"
definitions = [
    { symbol = "L", meaning = "radiance of the scene patch being imaged", link = "#the-radiometric-quantities" },
    { symbol = "N", meaning = "f-number f/# of the lens; each stop multiplies N by √2 and changes E by a factor of 2", link = "/course/optics/stops-pupils#numerical-aperture-and-f-number" },
    { symbol = "E_{\\text{image}}", meaning = "irradiance on the focal plane — what the sensor integrates over the exposure", link = "#image-brightness-the-f-2-rule" },
]


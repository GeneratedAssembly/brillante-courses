[widgets."com.github.richbai90.optics.radiometry.math-solidangle"]
type = "math"
tex = "\\Omega = \\frac{A}{R^{2}}, \\qquad \\Omega_{\\text{cone}} = 2\\pi\\left(1 - \\cos\\theta\\right) \\;\\approx\\; \\pi\\theta^{2}"
label = "Solid angle, full sphere and small cone"
definitions = [
    { symbol = "\\Omega", meaning = "solid angle in steradians (sr); a full sphere is 4π sr", link = "#solid-angle" },
    { symbol = "A,\\; R", meaning = "area of the patch on a sphere of radius R centered on the source", link = "#solid-angle" },
    { symbol = "\\theta", meaning = "cone half-angle; the paraxial form Ω ≈ πθ² drives every θ² scaling below", link = "#solid-angle" },
]

[widgets."com.github.richbai90.optics.radiometry.math-quantities"]
type = "math"
tex = "E = \\frac{d\\Phi}{dA}, \\qquad I = \\frac{d\\Phi}{d\\Omega}, \\qquad L = \\frac{d^{2}\\Phi}{dA\\,d\\Omega\\,\\cos\\varphi}"
label = "The radiometric family (flux Φ in watts)"
definitions = [
    { symbol = "\\Phi", meaning = "radiant flux, in watts — total optical power", link = "#the-radiometric-quantities" },
    { symbol = "E", meaning = "irradiance, W/m² — flux landing per unit area (the detector's currency)", link = "#the-radiometric-quantities" },
    { symbol = "I", meaning = "radiant intensity, W/sr — flux per unit solid angle from a point-like source", link = "#the-radiometric-quantities" },
    { symbol = "L", meaning = "radiance, W/(sr·m²) — brightness of a patch per direction; invariant along a ray in a lossless system", link = "#the-radiometric-quantities" },
    { symbol = "\\varphi", meaning = "angle between the surface normal and the viewing direction (cosine 'projected area' factor)", link = "#the-radiometric-quantities" },
]

[widgets."com.github.richbai90.optics.radiometry.quiz1"]
type = "quiz"
question = "Radiance L is invariant along a ray in a lossless optical system. What design consequence follows?"
options = [
    "A lens can brighten a scene patch arbitrarily by concentrating its light",
    "No passive instrument can exceed the source's radiance in the image; you can only gather a larger solid angle of it (bigger aperture)",
    "Radiance equals irradiance at every conjugate plane",
    "Brightness depends only on the focal length",
]
answer = 1
explanation = "Conservation of radiance (étendue) means an image pixel's radiance can never exceed the object patch's radiance. Instruments win light only by accepting a wider cone of it — larger aperture / lower f-number — or by trading image size, never by 'amplifying' brightness."

[widgets."com.github.richbai90.optics.radiometry.math-fnumber"]
type = "math"
tex = "E_{\\text{image}} \\;=\\; \\frac{\\pi\\,L}{4\\,N^{2}}, \\qquad N \\equiv f/\\#"
label = "Focal-plane irradiance vs f-number"
definitions = [
    { symbol = "L", meaning = "radiance of the scene patch being imaged", link = "#the-radiometric-quantities" },
    { symbol = "N", meaning = "f-number f/# of the lens; each stop multiplies N by √2 and changes E by a factor of 2", link = "/course/optics/stops-pupils#numerical-aperture-and-f-number" },
    { symbol = "E_{\\text{image}}", meaning = "irradiance on the focal plane — what the sensor integrates over the exposure", link = "#image-brightness-the-f-2-rule" },
]

[widgets."com.github.richbai90.optics.radiometry.int-brightness"]
type = "interactive"
expression = "pi * L / (4 * x^2)"
domain = [1, 11]
ydomain = [0, 80]
title = "Focal-plane irradiance E = πL/4N² vs f-number"
xlabel = "f-number N"
ylabel = "relative image irradiance E (L = 100)"
readout = "N = {x:0.1f} → E = {y:0.1f} (arbitrary units)"
parameters = [
    { name = "L", label = "scene radiance L", min = 20, max = 200, step = 5, initial = 100 },
]

[widgets."com.github.richbai90.optics.radiometry.quiz2"]
type = "quiz"
question = "You stop a camera lens down from f/2 to f/8. How much longer must the exposure be for the same sensor signal?"
options = [
    "4× longer — two stops of light are lost",
    "16× longer — four stops, each halving the irradiance",
    "6× longer — proportional to the f-numbers",
    "8× longer — proportional to the number 8",
]
answer = 1
explanation = "E ∝ 1/N²: from f/2 to f/8 is N×4 = four stops (f/2.8, 4, 5.6, 8), each stop halving E, so 2⁴ = 16× the exposure time. The θ² solid-angle geometry is what makes the exponent 2."

[widgets."com.github.richbai90.optics.radiometry.math-luminous"]
type = "math"
tex = "\\Phi_v \\;=\\; 683\\,\\frac{\\mathrm{lm}}{\\mathrm{W}} \\int \\Phi(\\lambda)\\,V(\\lambda)\\,d\\lambda"
label = "Luminous flux from the radiometric spectrum"
definitions = [
    { symbol = "V(\\lambda)", meaning = "CIE photopic luminous-efficiency function of the daylight eye: peaks at 555 nm, falls off toward red and violet", link = "#photometry-weighting-by-the-eye" },
    { symbol = "683 lm/W", meaning = "peak luminous efficacy: 1 W at 555 nm produces 683 lumens", link = "#photometry-weighting-by-the-eye" },
    { symbol = "\\Phi_v", meaning = "luminous flux in lumens — the photometric counterpart of Φ; lux, candela, and nit follow the same geometry (lux ↔ W/m², cd ↔ W/sr)", link = "#photometry-weighting-by-the-eye" },
]

[widgets."com.github.richbai90.optics.radiometry.card-quantities"]
type = "flashcard"
front = "The four radiometric quantities"
back = "Φ (W) total flux → E = dΦ/dA (W/m²) irradiance → I = dΦ/dΩ (W/sr) intensity → L = d²Φ/dA dΩ cosφ (W/sr·m²) radiance. Photometric twins: lumen, lux, candela, nit."

[widgets."com.github.richbai90.optics.radiometry.card-stop"]
type = "flashcard"
front = "The f/2 rule"
back = "Image irradiance E = πL/4N² depends only on the f-number N (and scene radiance L), not focal length. One stop: N×√2, E×2. Stopping down f/2 → f/8 costs 4 stops = 16× exposure."

[widgets."com.github.richbai90.optics.radiometry.quiz3"]
type = "quiz"
question = "A '100 W' incandescent bulb and a '15 W' LED can both emit ~1600 lumens. How is that consistent?"
options = [
    "Lumens measure heat output, and the two run at different temperatures",
    "Lumens weight radiant power by the eye's photopic response V(λ); the LED emits most of its power in the green-yellow where V peaks, the bulb mostly in the infrared where V ≈ 0",
    "The bulb's watts are alternating current and the LED's are direct current",
    "They can't be — watts and lumens are the same unit",
]
answer = 1
explanation = "Photometry is radiometry weighted by V(λ) (peak 683 lm/W at 555 nm). An incandescent bulb dumps most of its 100 W as infrared — no luminous contribution — while an efficient LED concentrates its watts near the V peak. Same lumens, wildly different radiant watts."


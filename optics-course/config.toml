# Lesson 19 — Optical Design and Gradient-Index Optics (19-optical-design-grin.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.optics.optical-design-grin.math-aplanatic"]
type = "math"
label = "The aplanatic points of a sphere"
tex = "\\overline{CA} = R\\,\\frac{n'}{n}, \\qquad \\overline{CA'} = R\\,\\frac{n}{n'}, \\qquad m = \\left(\\frac{n}{n'}\\right)^2"
definitions = [
    { symbol = "C", meaning = "center of curvature of the refracting sphere of radius R" },
    { symbol = "A", meaning = "object point inside the glass at distance Rn'/n from C — every ray from A refracts with zero spherical aberration and zero coma", link = "#aplanatic-points" },
    { symbol = "A'", meaning = "virtual image point on the same side, at distance Rn/n' from C", link = "#aplanatic-points" },
    { symbol = "m", meaning = "transverse magnification of the pair: (n/n')² — 2.25 for glass to air (verified by exact ray trace)" },
    { symbol = "n, n'", meaning = "index inside the sphere (glass) and outside (e.g. oil, air)" },
]

[widgets."com.github.richbai90.optics.optical-design-grin.quiz1"]
type = "quiz"
question = "For a glass sphere (n = 1.5) in air, the aplanatic object point sits at Rn'/n = 0.667 R from the center. What transverse magnification does the pair deliver?"
options = [
    "1.5 — the index ratio n/n'",
    "2.25 — the square of the index ratio",
    "0.667 — the inverse of the object distance ratio",
    "It depends on the ray angle — that is why it is aplanatic",
]
answer = 1
explanation = "The pair satisfies the Abbe sine condition exactly, so m = n sin(u)/(n' sin(u')) is the same for every ray — and direct ray tracing gives 2.25 = (n/n')² for every zone. The virtual image stands at Rn/n' = 1.5 R on the same side."

[widgets."com.github.richbai90.optics.optical-design-grin.quiz2"]
type = "quiz"
question = "Why do many 50 mm camera lenses (double-Gauss types) hold the aperture stop between two nearly symmetric halves?"
options = [
    "Symmetry doubles the speed of the lens",
    "Coma, distortion, and lateral chromatic aberration change sign under reflection about the stop, so a symmetric layout cancels them by construction",
    "Symmetry eliminates field curvature automatically",
    "The stop needs to sit at the front focus",
]
answer = 1
explanation = "Reverse the system about the stop and the odd-in-field, odd-in-aperture errors — coma, distortion, lateral color — flip sign while the imaging geometry is unchanged; equal-and-opposite halves cancel them. The residual astigmatism and Petzval curvature are what the outer meniscus elements then correct. Field curvature is NOT auto-cancelled — it is even and needs glass choice."

[widgets."com.github.richbai90.optics.optical-design-grin.math-grin"]
type = "math"
label = "Parabolic GRIN profile"
tex = "n(r) = n_0\\left(1 - \\tfrac{1}{2} g^2 r^2\\right) \\quad\\Longrightarrow\\quad \\frac{d^2 y}{dz^2} + g^2 y = 0"
definitions = [
    { symbol = "n(r)", meaning = "index as a function of radial distance r from the axis — highest on axis, falling quadratically" },
    { symbol = "n₀", meaning = "on-axis index of the GRIN medium" },
    { symbol = "g", meaning = "gradient constant: sets the oscillation period 2π/g of ray paths" },
    { symbol = "y(z)", meaning = "ray height versus axial distance — a sinusoid, because the paraxial ray equation becomes a harmonic oscillator" },
]

[widgets."com.github.richbai90.optics.optical-design-grin.int-grin"]
type = "interactive"
expression = "2 * sin(g * x)"
domain = [0, 4]
ydomain = [-2.4, 2.4]
title = "Ray path in a parabolic GRIN medium: y = A·sin(gz)"
xlabel = "axial distance z (mm)"
ylabel = "ray height y (× A)"
readout = "z = {x:0.1f} mm → y = {y:0.2f} A"
parameters = [
    { name = "g", label = "gradient g (1/mm)", min = 0.5, max = 3.0, step = 0.01, initial = 1.5708 },
]

[widgets."com.github.richbai90.optics.optical-design-grin.quiz3"]
type = "quiz"
question = "A GRIN rod has n₀ = 1.6 and gradient g ≈ 1.57 mm⁻¹ (quarter-pitch length 1.0 mm). What focal length does a quarter-pitch slice deliver?"
options = [
    "About 0.4 mm — f = 1/(n₀g)",
    "About 1.0 mm — the quarter-pitch length itself",
    "About 1.6 mm — f = n₀/g",
    "GRIN rods have no focal length; they only guide rays",
]
answer = 0
explanation = "Quarter pitch (gL = π/2) turns an input point into a collimated beam with f = 1/(n₀g) = 1/(1.6 × 1.571) ≈ 0.398 mm. The full oscillation period is 2π/g ≈ 4 mm, so a 1 mm slice is a quarter-pitch lens — the standard fiber-coupler geometry."

[widgets."com.github.richbai90.optics.optical-design-grin.card-aplanatic"]
type = "flashcard"
front = "What does it mean for a point pair to be aplanatic?"
back = "The pair images with zero spherical aberration and zero coma exactly: every zone focuses to the same point and the Abbe sine condition holds at every angle. For a sphere of radius R (glass n, outside n'): object inside at Rn'/n from center, virtual image at Rn/n' on the same side, magnification (n/n')²."

[widgets."com.github.richbai90.optics.optical-design-grin.card-grin"]
type = "flashcard"
front = "What does a parabolic index profile do to paraxial rays?"
back = "It turns their path equation into a harmonic oscillator: y'' + g²y = 0, so rays oscillate sinusoidally about the axis. A quarter-pitch slice of such a rod is a lens with f = 1/(n₀g); a full pitch relays an image to itself."


[widgets."com.github.richbai90.optics.light-in-matter.math-index"]
tex = "n = \\frac{c}{v}"
label = "Index of refraction"
definitions = [
    { symbol = "n", meaning = "index of refraction of the medium (n = 1 in vacuum; n > 1 in matter)", link = "#the-index-of-refraction" },
    { symbol = "c", meaning = "speed of light in vacuum", link = "/course/optics/the-propagation-of-light#speed-media-and-the-constant-c" },
    { symbol = "v", meaning = "phase velocity of light inside the medium", link = "#the-index-of-refraction" },
]

[widgets."com.github.richbai90.optics.light-in-matter.math-cauchy"]
tex = "n(\\lambda) \\;\\approx\\; A + \\frac{B}{\\lambda^{2}}"
label = "Cauchy's dispersion equation"
definitions = [
    { symbol = "A", meaning = "n at short wavelength asymptote (fit constant)", link = "#dispersion-n-depends-on-wavelength" },
    { symbol = "B", meaning = "dispersion strength (fit constant)", link = "#dispersion-n-depends-on-wavelength" },
    { symbol = "\\lambda", meaning = "vacuum wavelength", link = "/course/optics/the-propagation-of-light#wavefronts-and-rays" },
]

[widgets."com.github.richbai90.optics.light-in-matter.int-cauchy"]
expression = "1.50 + 0.0045 / (x * x)"
domain = [0.4, 0.7]
ydomain = [1.505, 1.53]
title = "Cauchy dispersion of a crown-type glass"
xlabel = "wavelength λ (μm)"
ylabel = "index n(λ)"
readout = "n({x:0.2f} μm) = {y:0.4f}"

[widgets."com.github.richbai90.optics.light-in-matter.plot-nlambda"]
title = "Index of refraction rises toward short wavelengths"
xlabel = "wavelength (nm)"
ylabel = "n"

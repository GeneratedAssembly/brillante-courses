[widgets."com.github.richbai90.optics.a-brief-history-of-optics.quiz1"]
type = "quiz"
question = "Ibn al-Haytham's lasting contribution to optics was primarily…"
options = [
    "the discovery that light travels from objects into the eye, established experimentally",
    "the first measurement of the speed of light",
    "the invention of the achromatic lens",
    "the wave theory of diffraction",
]
answer = 0
explanation = "His Book of Optics (c. 1021) overthrew the Greek emission theory of vision with experiments on mirrors, lenses, and the camera obscura. The speed of light was not measured until the 17th century (Rømer), achromats arrived in 1733 (Hall/Dolland), and diffraction theory is Young/Fresnel (1800s)."

[widgets."com.github.richbai90.optics.a-brief-history-of-optics.quiz2"]
type = "quiz"
question = "Young's double-slit experiment (1801) was decisive because it showed…"
options = [
    "that light travels faster in water than in air",
    "bright and dark fringes that only a wave interference mechanism can explain",
    "that white light contains many colors",
    "that light carries momentum",
]
answer = 1
explanation = "Corpuscles cannot cancel each other; waves can. The fringes' dark bands required two wavefronts arriving out of phase — the signature that broke the corpuscular consensus."

[widgets."com.github.richbai90.optics.a-brief-history-of-optics.card-huygens"]
type = "flashcard"
front = "Huygens' principle (1678)"
back = "Every point on a wavefront acts as a source of secondary spherical wavelets; the new wavefront is their envelope."

[widgets."com.github.richbai90.optics.a-brief-history-of-optics.card-young"]
type = "flashcard"
front = "Young's double-slit experiment (1801)"
back = "Two coherent beams interfere into bright/dark fringes — direct evidence that light is a wave."

[widgets."com.github.richbai90.optics.a-brief-history-of-optics.card-maxwell"]
type = "flashcard"
front = "Maxwell (1865)"
back = "Electromagnetic waves propagate at c computable from electrostatics + magnetostatics — matching the measured speed of light."


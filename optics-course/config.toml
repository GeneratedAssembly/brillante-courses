[widgets."com.github.richbai90.optics.two-slit-interference.math-pathdifference"]
type = "math"
label = "Path difference"
tex = "\\Delta r = d\\,\\sin\\theta"
definitions = [
    { symbol = "d", meaning = "center-to-center slit separation" },
    { symbol = "θ", meaning = "observation angle from the axis (screen far away: L ≫ d)" },
    { symbol = "Δr", meaning = "extra path of one beam; each λ of it is 2π of phase", link = "/course/optics/wave-equation-phasors#harmonic-waves-and-phasors" },
]

[widgets."com.github.richbai90.optics.two-slit-interference.math-intensity"]
type = "math"
label = "Two-slit intensity"
tex = "I = I_{max}\\cos^2\\!\\left(\\frac{\\pi d \\sin\\theta}{\\lambda}\\right)"
definitions = [
    { symbol = "maxima", meaning = "d sinθ = mλ — paths differ by whole wavelengths", link = "#path-difference-makes-phase" },
    { symbol = "minima", meaning = "d sinθ = (m + ½)λ — an odd number of half-wavelengths" },
    { symbol = "I_max", meaning = "4 × single-slit intensity at the peaks: both beams in phase add fully" },
]

[widgets."com.github.richbai90.optics.two-slit-interference.int-fringes"]
type = "interactive"
expression = "cos(1.5708 * d * x / lam) * cos(1.5708 * d * x / lam)"
domain = [-15, 15]
ydomain = [0, 1.05]
title = "Two-slit fringes on a screen at L = 2 m: I ∝ cos²(πd·sinθ/λ) ≈ cos²(πdy/2λL) — drag d and λ"
xlabel = "screen position y (mm)"
ylabel = "relative intensity"
readout = "y = {x:0.2f} mm → I = {y:0.2f}"
parameters = [
    { name = "d", label = "slit separation d (mm)", min = 0.05, max = 0.5, step = 0.01, initial = 0.2 },
    { name = "lam", label = "wavelength λ (μm)", min = 0.4, max = 0.7, step = 0.01, initial = 0.55 },
]

[widgets."com.github.richbai90.optics.two-slit-interference.quiz1"]
type = "quiz"
question = "At what path difference do two equal beams cancel exactly?"
options = [
    "An integer number of wavelengths",
    "An odd number of half-wavelengths",
    "An odd number of quarter-wavelengths",
    "Any difference beyond one wavelength",
]
answer = 1
explanation = "Destructive interference needs a π relative phase: an odd number of half-wavelengths of extra path, d sinθ = (m + ½)λ. Whole wavelengths re-phase the beams constructively; quarter-wavelength mixtures land in between, at partial intensity."

[widgets."com.github.richbai90.optics.two-slit-interference.quiz2"]
type = "quiz"
question = "Fringe spacing on a 2 m screen is 5.5 mm with d = 0.2 mm at λ = 550 nm. Halve the slit separation. New spacing?"
options = [
    "2.75 mm",
    "5.5 mm",
    "11 mm",
    "22 mm",
]
answer = 2
explanation = "Δy = λL/d doubles when d halves: 550×10⁻⁹ × 2 / 10⁻⁴ = 11 mm. The inverse proportionality is why the grating's fine pitch (large N, small d) spreads its orders wide."

[widgets."com.github.richbai90.optics.two-slit-interference.quiz3"]
type = "quiz"
question = "Ten identical slits replace the two, same spacing. What happens to the pattern?"
options = [
    "Same peak angles, peaks 100× more intense and about 10× narrower",
    "Ten times more fringes, same width",
    "The pattern averages to uniform illumination",
    "The minima deepen but nothing else changes",
]
answer = 0
explanation = "N in-phase contributions peak at N²I₁ = 100× the single-slit intensity at the same angles mλ = d sinθ, while neighboring-phase cancellation narrows the peaks by 1/N. That sharpening is the operating principle of the diffraction grating."

[widgets."com.github.richbai90.optics.two-slit-interference.card-conditions"]
type = "flashcard"
front = "State the two-slit conditions."
back = "Constructive: d sinθ = mλ (paths differ by whole wavelengths). Destructive: d sinθ = (m + ½)λ (odd half-wavelengths). Same bookkeeping — with a phase-flip correction — governs thin films."

[widgets."com.github.richbai90.optics.two-slit-interference.card-spacing"]
type = "flashcard"
front = "How far apart are Young's fringes?"
back = "Δy = λL/d. For λ = 550 nm, d = 0.2 mm, L = 2 m: 5.5 mm — measurable with a ruler, linear in λ, so counting fringes measures wavelength."

# ---------------------------------------------------------------------------
# Lesson 29 — Thin Films (29-thin-films.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.optics.thin-films.math-conditions"]
type = "math"
label = "Thin-film conditions (round trip 2nt)"
tex = "2nt = m\\lambda \\;\\text{or}\\; \\left(m + \\tfrac{1}{2}\\right)\\lambda \\qquad \\text{(which one is constructive depends on the flip count)}"
definitions = [
    { symbol = "n, t", meaning = "film index and thickness; the second reflection travels 2nt farther", link = "#the-phase-flip-at-reflection" },
    { symbol = "π flip rule", meaning = "reflection off a denser medium flips phase (r < 0); off a rarer one, it does not" },
    { symbol = "flip count", meaning = "0 or 2 flips: constructive at 2nt = mλ. 1 flip: constructive at 2nt = (m + ½)λ" },
]

[widgets."com.github.richbai90.optics.thin-films.int-film"]
type = "interactive"
expression = "sin(2 * pi * n * x / lam) * sin(2 * pi * n * x / lam)"
domain = [0, 600]
ydomain = [0, 1.05]
title = "Reflection from a one-flip film (air | film | air): R ∝ sin²(2πnt/λ) — drag n and λ"
xlabel = "film thickness t (nm)"
ylabel = "relative reflectance"
readout = "t = {x:0.0f} nm → R_rel = {y:0.2f}"
parameters = [
    { name = "n", label = "film index n", min = 1.2, max = 2.5, step = 0.01, initial = 1.33 },
    { name = "lam", label = "wavelength λ (nm)", min = 400, max = 700, step = 5, initial = 550 },
]

[widgets."com.github.richbai90.optics.thin-films.math-arcoating"]
type = "math"
label = "The quarter-wave AR coating"
tex = "t = \\frac{\\lambda_0}{4 n_f}, \\qquad R_{min} = \\left(|r_1| - |r_2|\\right)^2"
definitions = [
    { symbol = "t", meaning = "minimum coating thickness: 550/(4 × 1.38) ≈ 99.6 nm for MgF₂ at 550 nm" },
    { symbol = "r₁, r₂", meaning = "the two reflection amplitudes (0.160 and 0.042 for air | MgF₂ | glass); imperfect cancellation leaves (0.118)² ≈ 1.4%" },
]

[widgets."com.github.richbai90.optics.thin-films.quiz1"]
type = "quiz"
question = "An MgF₂ film (n = 1.38) sits on glass (n = 1.5). How many of its two surface reflections flip phase?"
options = [
    "None — both interfaces reflect off a denser medium",
    "One — only the first (air → MgF₂)",
    "Two — air → MgF₂ and MgF₂ → glass are both low → high",
    "One — only the second (MgF₂ → glass)",
]
answer = 2
explanation = "The flip rule keys on going from lower to higher index: air (1.0) → MgF₂ (1.38) flips, and MgF₂ (1.38) → glass (1.5) also flips. Two flips cancel each other's π, which inverts the coating's conditions — reflection is destroyed at 2nt = mλ, hence the quarter-wave thickness."

[widgets."com.github.richbai90.optics.thin-films.quiz2"]
type = "quiz"
question = "A soap film (n = 1.33) in air is 100 nm thick. Which visible wavelength reflects most strongly?"
options = [
    "266 nm — the round-trip optical thickness",
    "532 nm — 2nt = λ/2 is the one-flip constructive condition",
    "1064 nm — near infrared, just past the visible",
    "All visible wavelengths equally — 100 nm is too thin to select",
]
answer = 1
explanation = "One flip (air → soap flips; soap → air does not) puts constructive reflection at 2nt = (m + ½)λ. Here 2nt = 2 × 1.33 × 100 = 266 nm, so the m = 0 term sits at λ = 532 nm — green. The m = 1 term would need λ ≈ 177 nm, deep in the ultraviolet. The bubble flashes green-gold."

[widgets."com.github.richbai90.optics.thin-films.quiz3"]
type = "quiz"
question = "Why do multielement camera lenses look purple in reflected light?"
options = [
    "Purple is the natural color of MgF₂",
    "The coating destroys green reflection at its design wavelength; the reflected complement — red plus blue — is what survives",
    "Purple light has the shortest wavelength and penetrates coatings best",
    "The glass itself fluoresces purple under white light",
]
answer = 1
explanation = "A single quarter-wave coating minimizes reflection only near its design wavelength (≈ 550 nm, green). What it cannot cancel reflects — roughly red and blue — and their mix reads as purple. The deeper the coating stack, the flatter (and more neutral) the residual."

[widgets."com.github.richbai90.optics.thin-films.card-flips"]
type = "flashcard"
front = "Give the phase-flip rule and its consequence for film conditions."
back = "Reflection off a denser medium flips π (r < 0); off a rarer one it does not. Flip count 0 or 2: constructive reflection at 2nt = mλ. One flip: constructive at 2nt = (m + ½)λ. The flips swap the constructive and destructive lines."

[widgets."com.github.richbai90.optics.thin-films.card-coating"]
type = "flashcard"
front = "Design a single-layer AR coating."
back = "Choose n_f between air and glass (MgF₂, 1.38), thickness λ₀/4n_f ≈ 100 nm at 550 nm; two flips invert the condition so reflection cancels at design. Residual R = (|r₁| − |r₂|)² ≈ 1.4% versus 4% bare — and the lens blushes purple where green is killed."


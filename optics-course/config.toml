# Widget instance configs for the Optics course.
#
# Conventions:
# - Widget ids are reverse-DNS namespaced per lesson:
#     com.github.richbai90.optics.<lesson>.<name>
#   where <lesson> is the lesson file slug (without order prefix) and <name>
#   is a short widget name, unique within the course.
# - Every <Widget type="..." id="..." /> tag in a lesson .md file MUST have a
#   matching [widgets."<id>"] entry here, added in the same change. A missing
#   or invalid entry renders a visible error card on the lesson page.
# - Entries are grouped in per-lesson sections, in lesson order.
#
# kind          required / optional keys
# ----          ------------------------
# quiz          question (req), options (req), answer, explanation
# slider        label, min (req), max (req), step, initial, unit, display,
#               readout (safe expression over x; display needs {result})
# plot          title, xlabel, ylabel, points | series
# flashcard     front (req), back (req)
# math          tex (req), label, definitions: [{symbol, meaning, link?}]
# stepper       label, steps (req): [{title?, tex?, text?, note?}]
# interactive   expression (req), domain (req), ydomain, parameters, samples,
#               title, xlabel, ylabel, xslider, readout
# acknowledge   statement (req), button_label, done_message
# resource-link title (req), url (req), source (req), description, kind


[widgets."com.github.richbai90.optics.fresnel-equations.math-brewster"]
type = "math"
tex = "\\tan\\theta_B = \\frac{n_2}{n_1} \\qquad \\Longleftrightarrow \\qquad \\theta_B + \\theta_t = 90^\\circ"
label = "Brewster's angle"
definitions = [
    { symbol = "\\theta_B", meaning = "incidence angle at which r_p vanishes: no p-polarized light is reflected, so the reflected beam is purely s-polarized", link = "#brewster-s-angle" },
    { symbol = "\\theta_t", meaning = "refraction angle at that incidence; the reflected and refracted rays are exactly perpendicular", link = "/course/optics/reflection-and-refraction#snell-s-law" },
    { symbol = "n_1, n_2", meaning = "indices of the two media — air→glass gives 56.3°, air→water 53.1°", link = "/course/optics/light-in-matter#the-index-of-refraction" },
]

[widgets."com.github.richbai90.optics.fresnel-equations.stepper-brewster"]
type = "stepper"
label = "Deriving Brewster's angle from r_p = 0"
steps = [
    { title = "Set the p reflection to zero", tex = "r_p = 0 \\iff n_2\\cos\\theta_B = n_1\\cos\\theta_t", text = "The numerator of r_p vanishes — that is the entire condition." },
    { title = "Bring in Snell's law", tex = "n_1\\sin\\theta_B = n_2\\sin\\theta_t", text = "The second equation the interface must obey at the same time." },
    { title = "Multiply the two equations", tex = "\\sin\\theta_B\\cos\\theta_B = \\sin\\theta_t\\cos\\theta_t \\;\\Rightarrow\\; \\sin 2\\theta_B = \\sin 2\\theta_t", text = "The angles are equal or supplementary; a real refracted ray with n1 ≠ n2 forces the supplementary branch.", note = "θB = θt would mean no bending at all." },
    { title = "Read the geometry", tex = "\\theta_B + \\theta_t = 90^\\circ", text = "The reflected and transmitted rays stand perpendicular to each other." },
    { title = "Close the loop", tex = "\\tan\\theta_B = \\frac{n_2}{n_1}", text = "Substitute cos θt = sin θB back into Snell's law. Physically: the dipoles driven in medium 2 oscillate along the direction the reflected ray would take — and an oscillating dipole radiates nothing along its own axis, so no p light comes back." },
]

[widgets."com.github.richbai90.optics.fresnel-equations.math-tirphase"]
type = "math"
tex = "\\tan\\frac{\\delta_s}{2} = \\frac{\\sqrt{\\sin^2\\theta_i - n^2}}{\\cos\\theta_i}, \\qquad \\tan\\frac{\\delta_p}{2} = \\frac{\\sqrt{\\sin^2\\theta_i - n^2}}{n^2\\cos\\theta_i}, \\qquad n = \\frac{n_2}{n_1} < 1"
label = "Phase shifts on total internal reflection"
definitions = [
    { symbol = "\\delta_s, \\delta_p", meaning = "phase jumps imposed on the two polarizations by the reflection — equal magnitudes |r| = 1, unequal phases", link = "#beyond-the-critical-angle" },
    { symbol = "\\theta_i", meaning = "angle of incidence beyond the critical angle arcsin(n2/n1)", link = "/course/optics/reflection-and-refraction#total-internal-reflection" },
    { symbol = "n", meaning = "index ratio n2/n1 of the rarer to the denser medium", link = "/course/optics/light-in-matter#the-index-of-refraction" },
]

[widgets."com.github.richbai90.optics.fresnel-equations.quiz1"]
type = "quiz"
question = "A six-element camera lens has twelve air–glass surfaces, uncoated. Roughly what fraction of normally incident light survives to the sensor (ignoring absorption and re-reflections)?"
options = [
    "About 96% — one 4% reflection in total",
    "About 78% — half of 4% per element",
    "About 61% — 0.96 raised to the twelfth power",
    "About 52% — the surfaces halve the light twice over",
]
answer = 2
explanation = "Each surface passes 96%, so twelve surfaces pass 0.96¹² ≈ 0.61. Re-reflections recover a little, but the loss is real — which is why every modern lens is coated, and why coated glass looks purple (the residual reflection is wavelength-weighted)."

[widgets."com.github.richbai90.optics.fresnel-equations.quiz2"]
type = "quiz"
question = "Why do polarized sunglasses cut glare from a lake surface?"
options = [
    "They absorb the infrared heat that carries the glare",
    "Sunlight glancing off water near Brewster's angle is reflected almost purely s-polarized, and the glasses block exactly that polarization",
    "They rotate the polarization of the glare into a harmless direction",
    "They reflect the p-polarized component back at the water",
]
answer = 1
explanation = "At angles near θB = arctan(n2/n1) ≈ 53° for water, r_p = 0: the reflected glare is entirely s-polarized. Sunglasses pass the p component and absorb the s, killing the mirror off the water while keeping most of the scene (whose light is unpolarized) visible."

[widgets."com.github.richbai90.optics.fresnel-equations.quiz3"]
type = "quiz"
question = "Past the critical angle, r_s and r_p become complex with |r| = 1. What does that mean physically?"
options = [
    "No light is reflected and the formulas have broken down",
    "All power is returned, but the two polarizations acquire unequal phase shifts — so total internal reflection can convert linear into elliptical or circular polarization",
    "The reflected light loses its polarization entirely",
    "The phase shift is identical for s and p, so polarization is always preserved",
]
answer = 1
explanation = "|r| = 1 is total reflection; the unequal arguments δp ≠ δs are a controllable retardance. Two TIRs at the right angle give δp − δs = 90°: the Fresnel rhomb is a quarter-wave plate made of plain glass, immune to the wavelength limits of birefringent crystals."

[widgets."com.github.richbai90.optics.fresnel-equations.card-coefficients"]
type = "flashcard"
front = "What do the Fresnel equations give, and what do they assume?"
back = "Amplitude coefficients r_s, r_p (and t_s, t_p) for a plane wave at a flat dielectric interface, from continuity of tangential E and H. Inputs: θi, n1, n2, polarization. Reflectance R = |r|²; normal incidence R0 = ((n1−n2)/(n1+n2))² — 4% for air/glass."

[widgets."com.github.richbai90.optics.fresnel-equations.card-brewster"]
type = "flashcard"
front = "Brewster's angle"
back = "tan θB = n2/n1. r_p vanishes there; reflected ray ⊥ refracted ray; reflected light is purely s-polarized. Air→glass 56.3°, air→water 53.1°. Basis of glare polarization and reflection polarizers."


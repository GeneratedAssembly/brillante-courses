[widgets."com.github.richbai90.optics.eye-camera.quiz2"]
question = "A 55-year-old reads newspapers at arm's length but sees distant mountains sharply. What has changed?"
options = [
    "The eyeball elongated — classic myopia",
    "The crystalline lens stiffened: accommodation range shrank, so the near point receded, while relaxed-eye (distance) focus still lands on the retina",
    "The cornea flattened, adding negative power at all distances",
    "The retina detached from the optic nerve",
]
answer = 1
explanation = "Presbyopia is a loss of accommodation, not a shift of the eye's relaxed focus: distance vision (ciliary muscles relaxed) is unaffected, but the near point slides past reading distance. Positive-power reading glasses restore close-range focus."

[widgets."com.github.richbai90.optics.eye-camera.math-fnumber"]
tex = "N = \\frac{f}{D}, \\qquad E \\propto \\frac{1}{N^2}"
label = "F-number and exposure"
definitions = [
    { symbol = "N", meaning = "f-number (written f/N); the standard stops are √2 apart: 1.4, 2, 2.8, 4, 5.6, 8, 11, 16, 22", link = "#the-camera-focus-by-distance-exposure-by-aperture" },
    { symbol = "f", meaning = "focal length of the camera lens", link = "/course/optics/thin-lenses#the-thin-lens-equation" },
    { symbol = "D", meaning = "diameter of the aperture (entrance pupil) — the hole the f-number names", link = "#the-camera-focus-by-distance-exposure-by-aperture" },
    { symbol = "E", meaning = "image-plane exposure (irradiance on the sensor); each full stop halves or doubles it", link = "#the-camera-focus-by-distance-exposure-by-aperture" },
]

[widgets."com.github.richbai90.optics.eye-camera.quiz3"]
question = "You stop a lens down from f/2 to f/8. What happens to the light reaching the sensor?"
options = [
    "It drops to 1/16 — each of the 4 full stops halves the exposure",
    "It drops to 1/4 — the diameter is 4× smaller",
    "It stays the same; f-number only affects depth of field",
    "It rises to 4× — stopping up brightens",
]
answer = 0
explanation = "Exposure scales as 1/N². Going f/2 → f/8 is N multiplied by 4, so the exposure falls by 16× — four full stops (f/2 → 2.8 → 4 → 5.6 → 8, each √2 on N and ½ on light)."

[widgets."com.github.richbai90.optics.eye-camera.card-accommodation"]
front = "Accommodation"
back = "Ciliary muscles reshape the crystalline lens, changing f so the image stays on the fixed retina. Young near point ≈ 25 cm; it recedes with age (presbyopia)."

[widgets."com.github.richbai90.optics.eye-camera.card-myopia"]
front = "Myopia & correction"
back = "Eye too powerful/long: distant objects focus in front of the retina. Finite far point x_F; diverging lens P = −1/x_F images infinity at the far point."

[widgets."com.github.richbai90.optics.eye-camera.card-fnumber"]
front = "F-number"
back = "N = f/D. Exposure ∝ 1/N²; each full stop (N ×√2) halves the light. Larger N: less light, more depth of field."


[widgets."com.github.richbai90.optics.the-propagation-of-light.math-cflambda"]
tex = "c = \\lambda\\,f"
label = "Speed, wavelength, and frequency"
definitions = [
    { symbol = "c", meaning = "speed of light in vacuum, 299,792,458 m/s (exact)", link = "#speed-media-and-the-constant-c" },
    { symbol = "\\lambda", meaning = "wavelength — distance between successive wavefronts", link = "#wavefronts-and-rays" },
    { symbol = "f", meaning = "frequency — oscillations per second; unchanged when light crosses into a medium", link = "#speed-media-and-the-constant-c" },
]

[widgets."com.github.richbai90.optics.the-propagation-of-light.quiz1"]
question = "A lens is 2 cm across and visible light has λ ≈ 500 nm. Which model describes the lens's action best?"
options = [
    "Wave optics — the object is huge compared to λ",
    "Ray optics — the object is many wavelengths across",
    "Neither; photons are required",
    "Ray optics, because λ is always larger than apertures",
]
answer = 1
explanation = "The ray model is valid when objects are many wavelengths across (≫ λ). A 2 cm lens is ~40,000 wavelengths wide, so rays trace it accurately; the wave nature reappears at its edges and aperture stops (diffraction)."

[widgets."com.github.richbai90.optics.the-propagation-of-light.quiz2"]
question = "Light passes from air into glass. What happens to its frequency and wavelength?"
options = [
    "Both decrease",
    "Frequency stays the same; wavelength decreases",
    "Frequency decreases; wavelength stays the same",
    "Both stay the same",
]
answer = 1
explanation = "The wave at the boundary must oscillate in step with the incoming wave, so f is fixed. With v = c/n < c and v = fλ, the wavelength inside the medium shrinks by the factor n."

[widgets."com.github.richbai90.optics.the-propagation-of-light.card-wavefront"]
front = "Wavefront vs ray"
back = "Wavefront = surface of constant phase; ray = perpendicular to wavefronts, pointing along propagation."

[widgets."com.github.richbai90.optics.the-propagation-of-light.card-spectrum"]
front = "Visible band"
back = "λ ≈ 380–750 nm: violet at the short end, red at the long end."


[widgets."com.github.richbai90.optics.fresnel-zones.quiz1"]
type = "quiz"
question = "Why does opening exactly one Fresnel zone make the on-axis intensity four times the unobstructed value?"
options = [
    "Because the single zone is four times the area of the whole wavefront",
    "Because the unobstructed wave is the alternating sum ≈ a1/2, while one open zone contributes the full a1 — and intensity goes as amplitude squared",
    "Because the lens effect of the aperture concentrates the light",
    "Because blocking anything always increases intensity on axis",
]
answer = 1
explanation = "The alternating zone sum cancels itself down to half of the first term — that is what a 'free' wave is. Remove every zone except the first and the cancellation disappears: amplitude doubles, intensity quadruples. Less aperture, more light on axis."

[widgets."com.github.richbai90.optics.fresnel-zones.quiz2"]
type = "quiz"
question = "A 1 mm-radius aperture is illuminated with 500 nm light. Its Fresnel number at a screen 1 m away is…"
options = [
    "0.2 — far field, use Fraunhofer theory",
    "2 — near field, zone picture appropriate",
    "20 — deep near field with strong shadow fringing",
    "200 — geometric optics is exact",
]
answer = 1
explanation = "N_F = a²/(λd) = (10⁻³)²/(5×10⁻⁷ × 1) = 2. Two zones open: the observation point sits in the Fresnel (near-field) regime where the zone construction is the right tool — the same aperture at 10 m would give N_F = 0.2 and belong to Fraunhofer diffraction."

[widgets."com.github.richbai90.optics.fresnel-zones.quiz3"]
type = "quiz"
question = "An opaque disk blocks exactly the first 20 Fresnel zones reaching P. What is the field at the exact center of its shadow?"
options = [
    "Zero — the disk blocks all light traveling straight to P",
    "Bright: the remaining zones sum to about +a21/2, so the axis behind any paraxial disk carries a spot",
    "Bright only if the disk is smaller than one wavelength",
    "Dark with a bright ring, because the zones cancel in pairs but the last one overshoots",
]
answer = 1
explanation = "With zones 1–20 gone, the open wavefront contributes a21 − a22 + ⋯ ≈ a21/2 — nonzero for any disk size. This is the Poisson spot: Poisson derived it in 1818 to refute Fresnel's wave theory, and Arago observed it. The spot is still used today to align laser beams and characterize particles."

[widgets."com.github.richbai90.optics.fresnel-zones.card-zones"]
type = "flashcard"
front = "Half-period zones: construction and result"
back = "Spheres centered on P, radii spaced λ/2, cut the wavefront into annuli of equal area πλd; each contributes a nearly equal phasor with alternating sign. Sum ≈ a1/2 (free wave); odd zones open → ≈ a1 (4× intensity); even → ≈ 0."

[widgets."com.github.richbai90.optics.fresnel-zones.card-fresnel-number"]
type = "flashcard"
front = "Fresnel number"
back = "N_F = a²/(λd) — zones an aperture opens. N_F ≳ 1: near field (Fresnel diffraction, zone picture, structured shadows). N_F ≪ 1: far field (Fraunhofer diffraction, Fourier picture)."


[widgets."com.github.richbai90.optics.fraunhofer-fourier.quiz1"]
type = "quiz"
question = "A slit is made half as wide. What happens to its central Fraunhofer lobe?"
options = [
    "It narrows by half — less opening, less spread",
    "It doubles in width — the lobe width goes as λL/a",
    "It stays the same width but loses intensity",
    "It disappears below a width threshold",
]
answer = 1
explanation = "The minima sit at sinθ = mλ/a, so halving a doubles every angle: the central lobe spans 2λL/a, twice as wide. Narrower apertures spread light more — the exact opposite of the ray intuition, and the reason resolution trades against throughput."

[widgets."com.github.richbai90.optics.fraunhofer-fourier.quiz2"]
type = "quiz"
question = "A 5 cm optic's Fraunhofer regime begins near 4.5 km — yet lecture demonstrations show its pattern on a 1 m bench. How?"
options = [
    "By using red light, which has a shorter far-field distance",
    "By using a larger screen, which collects the far field sooner",
    "By placing a lens one focal length away: it maps the infinite-distance pattern onto its focal plane",
    "By increasing the source brightness",
]
answer = 2
explanation = "A lens imaging collimated light from the aperture onto its focal plane delivers the field that would form infinitely far away (the C = 0 focal-to-focal property of ray matrices). The desktop replaces the 4.5 km; this is also exactly how a laser beam profiler and a Fourier-transform spectrometer fold infinity onto a sensor."

[widgets."com.github.richbai90.optics.fraunhofer-fourier.quiz3"]
type = "quiz"
question = "Two slits of width a = 0.02 mm, separated by d = 0.2 mm. Roughly how many bright fringes fit under the central single-slit envelope?"
options = [
    "About 5",
    "About 9",
    "About 19",
    "About 40",
]
answer = 2
explanation = "The envelope's first zeros sit where a sinθ = ±λ; between them fit about 2d/a − 1 = 19 bright interference fringes (spacing λ/d, envelope width 2λ/a). The ratio d/a — not the absolute sizes — decides the count."

[widgets."com.github.richbai90.optics.fraunhofer-fourier.card-singleslit"]
type = "flashcard"
front = "Characterize the single-slit Fraunhofer pattern."
back = "Minima at a sinθ = mλ; intensity (sin β/β)² with β = πa sinθ/λ. Central lobe spans 2λL/a (90% of the power); first sidelobe 4.7%. Narrower slit → wider lobe."

[widgets."com.github.richbai90.optics.fraunhofer-fourier.card-airy"]
type = "flashcard"
front = "What is the Airy disk, and where is its first zero?"
back = "The Fraunhofer pattern of a circular aperture: central disk plus rings, first zero at sinθ = 1.22λ/D. Eye (5 mm): 28 arcsec; 8 m telescope: 0.017 arcsec — the resolution floor every instrument carries."

# ---------------------------------------------------------------------------
# Lesson 33 — Diffraction Gratings (33-gratings.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.optics.gratings.math-grating"]
type = "math"
label = "The grating equation"
tex = "m\\lambda = d\\,\\sin\\theta_m \\qquad (\\text{normal incidence})"
definitions = [
    { symbol = "d", meaning = "groove period (e.g. 1.667 μm for a 600 lines/mm grating)" },
    { symbol = "m", meaning = "diffraction order; orders exist only for m ≤ d/λ (≈ 3 at 550 nm here)" },
    { symbol = "θₘ", meaning = "angle of the m-th order; between orders the N contributions cancel pairwise" },
]

[widgets."com.github.richbai90.optics.gratings.int-orders"]
type = "interactive"
expression = "m * x / d"
domain = [400, 700]
ydomain = [0, 1.05]
title = "Grating order angle: sinθ = mλ/d — drag m and d (600 lines/mm means d = 1.667 μm)"
xlabel = "wavelength λ (nm)"
ylabel = "sin θ"
readout = "λ = {x:0.0f} nm → sinθ = {y:0.3f}"
parameters = [
    { name = "m", label = "order m", min = 1, max = 3, step = 1, initial = 1 },
    { name = "d", label = "period d (nm)", min = 1000, max = 3000, step = 10, initial = 1667 },
]

[widgets."com.github.richbai90.optics.gratings.plot-orders"]
type = "plot"
title = "Order angles for a 600 lines/mm grating (normal incidence)"
xlabel = "wavelength (nm)"
ylabel = "order angle θ (degrees)"
series = [
    { name = "m = 1", color = "#0d9488", points = [[400, 13.89], [450, 15.66], [500, 17.46], [550, 19.27], [600, 21.1], [650, 22.95], [700, 24.83]] },
    { name = "m = 2", color = "#6366f1", points = [[400, 28.69], [450, 32.68], [500, 36.87], [550, 41.3], [600, 46.05], [650, 51.26], [700, 57.14]] },
]

[widgets."com.github.richbai90.optics.gratings.math-resolving"]
type = "math"
label = "Resolving power"
tex = "R = \\frac{\\lambda}{\\Delta\\lambda} = mN"
definitions = [
    { symbol = "N", meaning = "number of illuminated grooves (beam width × groove density)" },
    { symbol = "m", meaning = "order: resolution grows with order, which is why echelle gratings trade away free orders" },
    { symbol = "Rayleigh argument", meaning = "resolved when one line's maximum falls on the other's first zero; peak width ~ λ/(Nd cosθ)" },
]

[widgets."com.github.richbai90.optics.gratings.quiz1"]
type = "quiz"
question = "Why does the m-th order of an N-slit grating sharpen as N grows?"
options = [
    "Each slit diffracts less when it has more neighbors",
    "Between orders the N contributions cancel pairwise; peak width shrinks as 1/N while peak intensity grows as N²",
    "Absorption spreads the orders out",
    "The grating equation changes with N",
]
answer = 1
explanation = "The order angles mλ = d sinθ are fixed by d, not N. But away from an exact angle, phasors from N slits close into a polygon and cancel; the residual lobe narrows as 1/N and the peak towers as N². Sharpness is a phasor-cancellation statement."

[widgets."com.github.richbai90.optics.gratings.quiz2"]
type = "quiz"
question = "A 10 mm beam illuminates a 600 lines/mm grating in first order near 550 nm. The closest resolvable wavelength pair is about:"
options = [
    "0.0092 nm",
    "0.092 nm",
    "0.92 nm",
    "9.2 nm",
]
answer = 1
explanation = "N = 600 mm⁻¹ × 10 mm = 6000 grooves; R = mN = 6000, so Δλ = λ/R = 550/6000 ≈ 0.092 nm. Doubling the beam width doubles N — resolution is bought with illuminated grooves."

[widgets."com.github.richbai90.optics.gratings.quiz3"]
type = "quiz"
question = "A binary phase grating (0/π profile, 50% duty) differs from a binary amplitude grating (opaque/clear, 50% duty) most visibly in the zero order. How?"
options = [
    "Phase: 25% in the zero order. Amplitude: none",
    "Phase: exactly 0% — the two half-apertures cancel in phase. Amplitude: 25%",
    "Both send 50% to the zero order",
    "Phase gratings have no zero order because they absorb it",
]
answer = 1
explanation = "The zero order sums the complex amplitudes across one period: amplitude grating gives (1 + 0)/2 → intensity (1/2)² = 25%; phase grating gives (1 + e^{iπ})/2 = 0 — exact cancellation. The freed 81% flows into the odd orders (40.5% each), which is the phase grating's whole advantage."

[widgets."com.github.richbai90.optics.gratings.card-equation"]
type = "flashcard"
front = "State the grating equation and the order limit."
back = "mλ = d sinθₘ (normal incidence); only orders with m ≤ d/λ exist (600 lines/mm at 550 nm: orders 1–3, at 19.3° and 41.3° for m = 1, 2). Between orders, N-fold cancellation sharpens peaks as 1/N."

[widgets."com.github.richbai90.optics.gratings.card-resolving"]
type = "flashcard"
front = "What sets a grating's resolving power?"
back = "R = mN: order times illuminated grooves. A 10 mm beam on 600 lines/mm gives N = 6000 and Δλ ≈ 0.09 nm at 550 nm. More grooves or higher order — that is the whole design space."

# ---------------------------------------------------------------------------
# Lesson 34 — Spatial Filtering and the Frequency Plane (34-spatial-filtering.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.optics.spatial-filtering.math-frequencyplane"]
type = "math"
label = "The frequency plane"
tex = "\\nu = \\frac{x}{\\lambda f}"
definitions = [
    { symbol = "x", meaning = "offset from the axis in the lens's back focal plane" },
    { symbol = "ν", meaning = "spatial frequency (cycles/mm) of the object feature that diffracts light to that spot" },
    { symbol = "λf", meaning = "the scale: 1 mm of focal-plane offset per 9.1 cycles/mm at f = 100 mm, λ = 550 nm" },
]

[widgets."com.github.richbai90.optics.spatial-filtering.plot-transfer"]
type = "plot"
title = "The pupil is a low-pass filter (coherent light)"
xlabel = "spatial frequency ν / ν_max"
ylabel = "transfer H"
series = [
    { name = "clear circular pupil", color = "#0d9488", points = [[0, 1], [0.4, 1], [0.401, 0], [1, 0]] },
]

[widgets."com.github.richbai90.optics.spatial-filtering.quiz1"]
type = "quiz"
question = "In a lens's back focal plane, where does light carrying the *finest* object detail (highest spatial frequency) land?"
options = [
    "On the axis — fine detail is the strongest signal",
    "Far from the axis, toward the pupil's rim",
    "Uniformly across the focal plane",
    "Fine detail does not reach the focal plane at all",
]
answer = 1
explanation = "The frequency-plane map ν = x/(λf) is monotonic: high spatial frequencies diffract to large angles, which the lens folds to large focal-plane offsets. The pupil rim is the cutoff — light diffracted past it never contributes to the image."

[widgets."com.github.richbai90.optics.spatial-filtering.quiz2"]
type = "quiz"
question = "A frequency-plane mask with a small opaque dot on the axis is placed in a 4f system. The output image is:"
options = [
    "A low-pass-filtered copy — blurred",
    "An edge map — uniform regions vanish, gradients survive",
    "Unchanged — the zero order carries no information",
    "Inverted in brightness",
]
answer = 1
explanation = "The axial zero order carries each point's DC (average) level; blocking it removes bulk brightness and passes structure — the image becomes its own gradient, bright where the object changes. This is the high-pass (dark-field-style) filter."

[widgets."com.github.richbai90.optics.spatial-filtering.quiz3"]
type = "quiz"
question = "An unstained living cell is nearly transparent, yet phase-contrast microscopy shows it brightly. What conversion makes that possible?"
options = [
    "The cell absorbs ultraviolet, detected by proxy",
    "A quarter-wave shift of the axial zero order converts phase gradients into intensity differences",
    "The cell's motion scatters light Doppler-style",
    "The illuminating light is circularly polarized",
]
answer = 1
explanation = "A phase object's information lives in phase, which intensity detectors cannot see. Its spectrum, though, splits: bulk phase sits in the zero order, gradients scatter to the rim. Zernike's mask retards the zero order by π/2, so phase slopes interfere into visible intensity — no stain, no absorption."

[widgets."com.github.richbai90.optics.spatial-filtering.card-frequencyplane"]
type = "flashcard"
front = "What is the frequency plane of a lens?"
back = "The back focal plane, where position x maps to object spatial frequency ν = x/(λf) — 9.1 cycles/mm per millimeter at f = 100 mm, 550 nm. Masks there are spectral filters; the pupil rim is the cutoff NA/λ."

[widgets."com.github.richbai90.optics.spatial-filtering.card-phasecontrast"]
type = "flashcard"
front = "Summarize Zernike's phase-contrast trick."
back = "Transparent phase objects are invisible because detectors read intensity. Shift the zero order (where the bulk phase concentrates) by π/2 with a tiny focal-plane mask, and the phase gradients interfere into intensity. Schlieren and dark-field are the same idea with amplitude masks."

# ---------------------------------------------------------------------------
# Lesson 35 — The 4f System (35-fourf-system.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.optics.fourf-system.stepper-walk"]
type = "stepper"
label = "Walking a photon through the 4f system"
steps = [
    { title = "Lens 1: object to spectrum", tex = "U_1(x_f) = \\mathcal{F}\\{U_0(x)\\}", text = "The object sits one focal length before lens 1; its Fourier transform lands in the back focal plane — the frequency plane." },
    { title = "The mask edits the spectrum", tex = "U_2(x_f) = M(x_f)\\,U_1(x_f)", text = "A pupil mask M — clear disk, central dot, annulus — multiplies the spectrum frequency by frequency." },
    { title = "Lens 2: spectrum back to image", tex = "U_{img}(x') = \\left(h_M * U_0\\right)(x')", text = "The second transform inverts the first: the output image is the object convolved with h_M, the mask's inverse transform — filtering in the frequency plane is convolution in the image plane." },
    { title = "Magnification falls out", tex = "m = -\\frac{f_2}{f_1}", text = "The two focal-to-focal transforms scale the coordinates by their focal lengths: the image is inverted and magnified by the focal-length ratio alone.", note = "Equal lenses give m = −1 — a unit, inverted relay." },
]

[widgets."com.github.richbai90.optics.fourf-system.plot-masks"]
type = "plot"
title = "Binary amplitude pupil masks (radial profiles)"
xlabel = "normalized pupil radius"
ylabel = "transmission"
series = [
    { name = "low-pass disk", color = "#0d9488", points = [[0, 1], [0.4, 1], [0.401, 0], [1, 0]] },
    { name = "high-pass (central stop)", color = "#6366f1", points = [[0, 0], [0.5, 0], [0.501, 1], [1, 1]] },
    { name = "annular band", color = "#f59e0b", points = [[0, 1], [0.3, 1], [0.301, 0], [0.6, 0], [0.601, 1], [1, 1]] },
]

[widgets."com.github.richbai90.optics.fourf-system.math-abbe"]
type = "math"
label = "Abbe's spatial-frequency ceiling"
tex = "\\nu_{max} = \\frac{\\mathrm{NA}}{\\lambda}"
definitions = [
    { symbol = "NA", meaning = "numerical aperture: n sinθ of the collecting cone", link = "/course/optics/stops-pupils#numerical-aperture-and-f-number" },
    { symbol = "ν_max", meaning = "the finest spatial frequency the image can carry: 182 cycles/mm at NA = 0.1, 1182 at NA = 0.65 (λ = 550 nm)" },
    { symbol = "orders", meaning = "the image is the sum of the diffraction orders the objective collects — Abbe's microscope theory" },
]

[widgets."com.github.richbai90.optics.fourf-system.quiz1"]
type = "quiz"
question = "What sets the magnification of a 4f relay built from lenses of focal lengths f₁ and f₂?"
options = [
    "The lens separation only",
    "m = −f₂/f₁ — the focal-length ratio alone",
    "The mask's transmittance",
    "The object's spatial-frequency content",
]
answer = 1
explanation = "Each lens scales its focal-plane coordinates by its focal length, so the composite image height scales by f₂/f₁ — inverted, hence the sign. The four-f-length spacing is fixed by the transform geometry; the ratio is the only degree of freedom."

[widgets."com.github.richbai90.optics.fourf-system.quiz2"]
type = "quiz"
question = "In a 4f system, a small opaque dot at the frequency-plane axis blocks the zero order. A uniformly bright disk object images as:"
options = [
    "The same uniform disk, dimmer",
    "Darkness with bright edges — uniform regions vanish, boundaries survive",
    "A ring at the disk's radius",
    "Nothing changes; the zero order carries no information",
]
answer = 1
explanation = "The zero order is each point's DC level. Removing it takes away the bulk brightness and leaves the gradients: the disk's interior (constant) goes dark, its rim (rapid change) glows. Every edge map ever demonstrated in an optics lab is this experiment."

[widgets."com.github.richbai90.optics.fourf-system.quiz3"]
type = "quiz"
question = "In Abbe's terms, why does a higher-NA objective give a sharper microscope image?"
options = [
    "It gathers more light, so the image is brighter and noise is lower",
    "It collects more diffraction orders, so more spatial frequencies — more detail — reach the image",
    "It magnifies more before the image forms",
    "It reduces the wavelength of the light used",
]
answer = 1
explanation = "The image is the sum of its collected orders; NA caps them at ν_max = NA/λ. Higher NA admits finer spatial frequencies, so finer object structure actually appears in the image. Brightness is a side benefit; the detail ceiling is the point."

[widgets."com.github.richbai90.optics.fourf-system.card-geometry"]
type = "flashcard"
front = "Describe the 4f geometry and what it computes."
back = "Object —f— lens 1 —f— frequency plane —f— lens 2 —f— image: Fourier transform, mask, inverse transform. The image is the object convolved with the mask's impulse response, magnified m = −f₂/f₁."

[widgets."com.github.richbai90.optics.fourf-system.card-abbe"]
type = "flashcard"
front = "State Abbe's imaging bound."
back = "The image is the sum of its diffraction orders, and the objective's NA caps collectible orders at ν_max = NA/λ (182 cycles/mm at NA 0.1, 550 nm). Finer structure is not degraded — it is absent from the image entirely."


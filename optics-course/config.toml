    { symbol = "f", meaning = "focal length: f = R/2 — positive for concave (converging), negative for convex (diverging)", link = "#spherical-mirrors-concave-and-convex" },
    { symbol = "s,\\; s'", meaning = "object and image distances measured from the mirror vertex; real images form on the object side (s' > 0)", link = "#spherical-mirrors-concave-and-convex" },

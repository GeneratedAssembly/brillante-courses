[widgets."com.github.richbai90.optics.perfect-focusing-and-the-paraxial-approximation.math-paraxial"]
type = "math"
tex = "\\sin\\theta \\approx \\theta, \\qquad \\tan\\theta \\approx \\theta, \\qquad \\cos\\theta \\approx 1"
label = "The paraxial (small-angle) approximation"
definitions = [
    { symbol = "\\theta", meaning = "ray angle in radians; the error in sin θ ≈ θ grows as θ³ (≈ 0.5% at 10°)", link = "#the-paraxial-approximation" },
]

[widgets."com.github.richbai90.optics.perfect-focusing-and-the-paraxial-approximation.int-sintheta"]
type = "interactive"
expression = "100 * (x - sin(x)) / x"
domain = [0.005, 0.5]
ydomain = [0.0, 5.0]
title = "Relative error of the paraxial approximation sin θ ≈ θ"
xlabel = "ray angle θ (rad)"
ylabel = "relative error (%)"
readout = "θ = {x:0.3f} rad → error ≈ {y:0.2f}%"

[widgets."com.github.richbai90.optics.perfect-focusing-and-the-paraxial-approximation.quiz1"]
type = "quiz"
question = "Which of these surfaces focuses parallel rays to a perfect point — with no spherical aberration at any aperture?"
options = [
    "A spherical concave mirror",
    "A spherical refracting surface",
    "A paraboloidal mirror",
    "A plane mirror",
]
answer = 2
explanation = "A paraboloid is the exact surface that sends every ray parallel to its axis through one focus (Fermat: all paths equal). Spheres only manage this in the paraxial limit; plane mirrors never focus at all."

[widgets."com.github.richbai90.optics.perfect-focusing-and-the-paraxial-approximation.quiz2"]
type = "quiz"
question = "A spherical mirror of radius R focuses paraxial rays at f = R/2. Marginal rays hitting the rim focus…"
options = [
    "exactly at f = R/2 as well — all rays agree",
    "farther from the mirror than R/2",
    "closer to the mirror than R/2 — the signature of spherical aberration",
    "behind the mirror",
]
answer = 2
explanation = "Marginal (rim) rays have larger incidence angles, where sin θ ≈ θ fails, and they cross the axis nearer the mirror. The gap between marginal and paraxial foci is the longitudinal spherical aberration."

[widgets."com.github.richbai90.optics.perfect-focusing-and-the-paraxial-approximation.quiz3"]
type = "quiz"
question = "Which instrument can be designed with paraxial (first-order) optics alone?"
options = [
    "A telescope primary working at f/8",
    "A high-NA microscope objective (NA ≈ 1.3)",
    "A fast camera lens at f/1.4, wide open",
    "None — every real design needs aberration theory",
]
answer = 0
explanation = "At f/8, ray angles stay within a few degrees, where the paraxial error is well under 1%. High-NA microscope objectives and f/1.4 camera lenses run marginal rays at tens of degrees, where third-order aberrations dominate the design."

[widgets."com.github.richbai90.optics.perfect-focusing-and-the-paraxial-approximation.card-paraboloid"]
type = "flashcard"
front = "Paraboloidal reflector"
back = "Exact focus for rays parallel to the axis — all optical path lengths to the focus are equal (Fermat). Telescopes, dishes, searchlights."

[widgets."com.github.richbai90.optics.perfect-focusing-and-the-paraxial-approximation.card-paraxial"]
type = "flashcard"
front = "Paraxial approximation"
back = "sin θ ≈ tan θ ≈ θ, cos θ ≈ 1 (θ in radians). Makes ray tracing linear; errors are third order — the aberrations."


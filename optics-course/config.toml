[widgets."com.github.richbai90.optics.mirrors.quiz1"]
type = "quiz"
question = "A shaving mirror shows your face upright and enlarged. How are you standing relative to the concave mirror?"
options = [
    "Beyond the center of curvature — real, inverted, enlarged",
    "Between the mirror and its focal point — virtual, upright, magnified",
    "Exactly at the focal point — image at infinity",
    "Any position — concave mirrors always magnify",
]
answer = 1
explanation = "Inside the focal length (s < f), a concave mirror behaves like a magnifying glass: s' < 0, so the image is virtual, upright, and enlarged — the geometry of every makeup/shaving mirror. Step beyond f and the image flips real and inverted."

[widgets."com.github.richbai90.optics.mirrors.quiz2"]
type = "quiz"
question = "Why do security mirrors in shops and driveways use convex rather than concave or flat mirrors?"
options = [
    "Convex mirrors form brighter images",
    "A convex mirror always forms a virtual, upright, reduced image — and the reduction squeezes a wide field of view into one glance",
    "Concave mirrors cannot form images of distant objects",
    "Convex mirrors are cheaper to polish",
]
answer = 1
explanation = "Reduction is the point: each image is smaller than the object, so more of the scene fits into the mirror's angular field. The image stays upright and virtual for every real object position — no surprising inversions for a driver or clerk."

[widgets."com.github.richbai90.optics.mirrors.quiz3"]
type = "quiz"
question = "Why is the primary of a large research telescope a mirror rather than a lens?"
options = [
    "Mirrors are always cheaper per square meter",
    "Reflection is achromatic (no chromatic aberration), and a mirror can be supported over its whole back face — a huge lens would sag and absorb light in its glass",
    "Lenses cannot form real images of stars",
    "Mirrors need no figure (polished shape) at all",
]
answer = 1
explanation = "Two structural reasons plus one optical: reflection treats all wavelengths identically (zero chromatic aberration, unlike any single glass lens); the mirror substrate can be supported across its back and even actively flexed; and light passes through no glass at all, so absorption and bubbles vanish."

[widgets."com.github.richbai90.optics.mirrors.card-fR2"]
type = "flashcard"
front = "Spherical-mirror focal length"
back = "f = R/2 (paraxial). Concave: converging, f > 0. Convex: diverging, f < 0. Marginal rays focus short — spherical aberration (cured by paraboloids for on-axis parallel light)."

[widgets."com.github.richbai90.optics.mirrors.card-conveximage"]
type = "flashcard"
front = "Convex mirror image"
back = "Always virtual, upright, and reduced for real objects — hence the wide field of view of security and vehicle mirrors."

[widgets."com.github.richbai90.optics.mirrors.card-planemirror"]
type = "flashcard"
front = "Plane-mirror image"
back = "Virtual, upright, mirror-reversed, exactly as far behind the mirror as the object is in front. Perfectly aberration-free at every angle."


[widgets."com.github.richbai90.optics.light-in-matter.card-n"]
type = "flashcard"
front = "Index of refraction n"
back = "n = c/v — ratio of light's speed in vacuum to its speed in the medium. Air ≈ 1.0003, water ≈ 1.33, glass ≈ 1.52, diamond ≈ 2.42."

[widgets."com.github.richbai90.optics.light-in-matter.card-rayleigh"]
type = "flashcard"
front = "Rayleigh scattering"
back = "Scattering by particles ≪ λ; intensity ∝ 1/λ⁴ — blue (450 nm) scatters ≈ 4.4× more than red (650 nm)."


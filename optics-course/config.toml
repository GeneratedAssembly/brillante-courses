label = "Myopic correction (lens at the eye)"
definitions = [
    { symbol = "P", meaning = "power of the corrective lens in diopters — negative, i.e. a diverging lens", link = "#refractive-errors-and-their-correction" },
    { symbol = "x_F", meaning = "far-point distance of the eye in meters — the farthest object the unaided eye can focus", link = "#refractive-errors-and-their-correction" },
]


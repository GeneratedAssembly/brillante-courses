[widgets."com.github.richbai90.optics.magnifiers-microscopes.quiz1"]
type = "quiz"
question = "Why is a magnifier used with the object at (or inside) its focal length, rather than farther out?"
options = [
    "Farther out the lens would crack under stress",
    "Inside the focal length the lens forms a virtual, upright, enlarged image that the eye can focus; beyond it the image is real and the eye cannot look at it through the lens",
    "Only inside the focal length does light pass through the lens",
    "The focal point is where the lens is strongest",
]
answer = 1
explanation = "With s < f the converging lens gives a virtual image at a comfortable viewing distance, upright and enlarged. With s > f the image is real — on the far side — and looking back through the lens at it is not how the eye works. The relaxed-eye trick (object exactly at f) sends collimated light that the eye focuses at zero strain."

[widgets."com.github.richbai90.optics.magnifiers-microscopes.math-microscope"]
type = "math"
tex = "M \\;=\\; \\left(-\\frac{L}{f_o}\\right)\\left(\\frac{25\\,\\mathrm{cm}}{f_e}\\right)"
label = "Compound microscope magnifying power"
definitions = [
    { symbol = "f_o", meaning = "focal length of the objective — a few mm to ~1 cm in practice", link = "#the-compound-microscope" },
    { symbol = "f_e", meaning = "focal length of the eyepiece, which views the intermediate image as a simple magnifier", link = "#the-compound-microscope" },
    { symbol = "L", meaning = "tube length: from the objective's back focal point to the eyepiece's front focal point, standardized at 160 mm", link = "#the-compound-microscope" },
]


[widgets."com.github.richbai90.optics.thick-composite.quiz1"]
type = "quiz"
question = "You measure a thick lens from its front glass surface and get a different 'focal length' than from its back surface. Which distance actually predicts imaging?"
options = [
    "The distance from the front surface — light enters there",
    "The distance from the back surface — light exits there",
    "The distance from the principal planes — the thick lens behaves, paraxially, like a thin lens located there",
    "Neither; thick lenses have no focal length",
]
answer = 2
explanation = "A thick system behaves like a thin lens of focal length F — but the 'thin lens' is fictitious: F is measured from the principal planes H and H', which sit inside (or even outside) the glass. Surface-to-focus distances are real, but only principal-plane distances satisfy the thin-lens equation."

[widgets."com.github.richbai90.optics.thick-composite.math-cfeq"]
type = "math"
tex = "F \\;=\\; -\\frac{1}{C}"
label = "Effective focal length from the system matrix"
definitions = [
    { symbol = "C", meaning = "lower-left entry of the system matrix M (in air); C = −1/F for any paraxial system", link = "#principal-planes" },
    { symbol = "F", meaning = "effective focal length, measured from a principal plane to the corresponding focus", link = "#principal-planes" },
]

[widgets."com.github.richbai90.optics.thick-composite.stepper-composite"]
type = "stepper"
label = "Two thin lenses, separation d: composite focal length"
steps = [
    { title = "Write the product", tex = "M = L_2\\,T(d)\\,L_1", text = "The ray meets lens f₁ first, crosses the gap d, then meets lens f₂ — so L₁ stands rightmost in the product.", note = "Order runs opposite to the ray's journey, as always." },
    { title = "Fold lens 2 into the gap", tex = "L_2\\,T(d) = \\begin{pmatrix} 1 & d \\\\ -1/f_2 & 1-d/f_2 \\end{pmatrix}", text = "A plain matrix product of the second lens and the translation." },
    { title = "Multiply in the first lens", tex = "C = -\\left(\\frac{1}{f_1} + \\frac{1}{f_2} - \\frac{d}{f_1 f_2}\\right)", text = "Multiplying by L₁ and collecting the lower-left entry gives C — and C alone fixes the power of the combination." },
    { title = "Read off the focal length", tex = "\\frac{1}{F} = \\frac{1}{f_1} + \\frac{1}{f_2} - \\frac{d}{f_1 f_2}", text = "Since F = −1/C, the composite focal length follows immediately.", note = "Separation enters with a minus sign: spacing lenses apart weakens the combination." },
    { title = "Check the limits", tex = "d \\to 0:\\; \\frac{1}{F} = \\frac{1}{f_1} + \\frac{1}{f_2}; \\qquad d = f_1 + f_2:\\; \\frac{1}{F} = 0", text = "In contact, powers add. At d = f₁ + f₂ the power vanishes — the afocal (telescope) geometry.", note = "Every good formula is a bag of special cases." },
]

[widgets."com.github.richbai90.optics.thick-composite.math-composite"]
type = "math"
tex = "\\frac{1}{F} = \\frac{1}{f_1} + \\frac{1}{f_2} - \\frac{d}{f_1 f_2}"
label = "Composite focal length of two thin lenses"
definitions = [
    { symbol = "f_1,\\; f_2", meaning = "focal lengths of the first and second thin lens (each signed: converging > 0)", link = "/course/optics/thin-lenses#the-thin-lens-equation" },
    { symbol = "d", meaning = "axial separation between the two lenses", link = "#two-lenses-apart-the-composite-formula" },
    { symbol = "F", meaning = "effective focal length of the combination, measured from its principal planes", link = "#principal-planes" },
]

[widgets."com.github.richbai90.optics.thick-composite.int-focal"]
type = "interactive"
expression = "(f1 * f2) / (f1 + f2 - x)"
domain = [0, 20]
ydomain = [-15, 15]
title = "Composite focal length vs separation d"
xlabel = "separation d (cm)"
ylabel = "composite focal length F (cm)"
readout = "d = {x:0.1f} cm → F = {y:0.2f} cm"
parameters = [
    { name = "f1", label = "front lens f₁ (cm)", min = 1, max = 6, step = 0.1, initial = 4 },
    { name = "f2", label = "rear lens f₂ (cm)", min = -4, max = 4, step = 0.1, initial = 2 },
]

[widgets."com.github.richbai90.optics.thick-composite.quiz2"]
type = "quiz"
question = "Two thin lenses in contact: one is −5.0 D, the other +2.0 D. What is the combination?"
options = [
    "−3.0 D, an effective focal length of about −33 cm",
    "−7.0 D, an effective focal length of about −14 cm",
    "+3.0 D, an effective focal length of about +33 cm",
    "The diopters do not combine; only focal lengths add",
]
answer = 0
explanation = "Thin lenses in contact add powers: −5.0 + 2.0 = −3.0 D, i.e. f = 1/P = −0.333 m. This additivity is why prescriptions are written in diopters — and why d ≈ 0 in the composite formula is the optometrist's world."

[widgets."com.github.richbai90.optics.thick-composite.quiz3"]
type = "quiz"
question = "A 'telephoto' lens must behave like a long-focus lens (say F = 200 mm) yet fit in a short barrel. What arrangement does it?"
options = [
    "Two strong positive lenses close together",
    "A positive front element followed by a weaker negative element, suitably separated",
    "A negative front element followed by a strong positive element",
    "A single thick lens with deeply curved surfaces",
]
answer = 1
explanation = "The negative rear element stretches the principal planes forward of the elements themselves, so the effective focal length (measured from the principal planes) far exceeds the physical barrel length. The reverse-telephoto flip — negative front, positive rear — leaves a long back focus for wide-angle designs."

[widgets."com.github.richbai90.optics.thick-composite.card-principal"]
type = "flashcard"
front = "Principal planes (H, H')"
back = "The two planes from which a thick/composite system's focal length F is measured; rays transfer between them at unit magnification, as if the whole system were one thin lens."

[widgets."com.github.richbai90.optics.thick-composite.card-telephoto"]
type = "flashcard"
front = "Telephoto pair"
back = "Positive front + negative rear, separated: long effective F from a short barrel — the rear principal plane sits in front of the elements."

[widgets."com.github.richbai90.optics.thick-composite.card-afocal"]
type = "flashcard"
front = "Afocal system"
back = "Net power 1/F = 0 (two lenses at d = f₁ + f₂): parallel rays in, parallel rays out — it changes ray angles, not convergence. A telescope."


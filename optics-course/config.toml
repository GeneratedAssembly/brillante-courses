# ---------------------------------------------------------------------------
# Lesson 17 — Chromatic Aberration, Spherical Aberration, and Coma (17-chromatic-spherical-coma.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.optics.chromatic-spherical-coma.math-singlet"]
type = "math"
label = "Why focal length drifts with wavelength"
tex = "\\frac{1}{f(\\lambda)} = \\bigl(n(\\lambda)-1\\bigr)\\left(\\frac{1}{R_1} - \\frac{1}{R_2}\\right)"
definitions = [
    { symbol = "f(λ)", meaning = "focal length at wavelength λ; it inherits the wavelength dependence of the glass index", link = "/course/optics/prisms-and-dispersion" },
    { symbol = "n(λ)", meaning = "refractive index at λ — falls with wavelength in normal glasses (Cauchy: n = A + B/λ²)", link = "/course/optics/prisms-and-dispersion" },
    { symbol = "R₁, R₂", meaning = "the two surface radii of the thin lens (sign convention of the ray-transfer lesson)", link = "/course/optics/ray-transfer-matrices" },
]

[widgets."com.github.richbai90.optics.chromatic-spherical-coma.int-chromatic"]
type = "interactive"
expression = "25 / (2 * (1.50 + 0.0045 / (x * x) - 1))"
domain = [0.4, 0.7]
ydomain = [23.4, 24.8]
title = "Chromatic focal shift of a symmetric singlet (R = 25 mm, n = 1.50 + 0.0045/λ²)"
xlabel = "wavelength λ (μm)"
ylabel = "focal length f (mm)"
readout = "λ = {x:0.2f} μm → f = {y:0.2f} mm"

[widgets."com.github.richbai90.optics.chromatic-spherical-coma.quiz1"]
type = "quiz"
question = "Two thin singlets are ground to the same focal length, one in crown glass (V ≈ 64), one in flint (V ≈ 26). Which shows the larger chromatic focal shift across the visible band?"
options = [
    "The crown singlet — higher index means more dispersion",
    "The flint singlet — its relative dispersion 1/V is larger",
    "They shift identically — V only affects prism deviation",
    "Neither: stopping down removes chromatic error",
]
answer = 1
explanation = "Chromatic drift scales as 1/V, the relative dispersion (n_F − n_C)/(n_d − 1). The flint's V ≈ 26 gives a visible-band focus shift near 4% of f; the crown's V ≈ 64 gives about 1.6%. Stopping down does nothing for chromatic error — it only tames spherical aberration and coma."

[widgets."com.github.richbai90.optics.chromatic-spherical-coma.stepper-achromat"]
type = "stepper"
label = "Deriving the achromat power split"
steps = [
    { title = "Write each power as geometry times index", tex = "\\varphi_i = (n_i - 1)\\,\\kappa_i", text = "Element i has curvature sum κ₁ = 1/R₁ − 1/R₂ — pure shape, wavelength-independent. All chromatic dependence enters through n_i(λ).", note = "The achromat condition will be a statement about the n_i, not the curvatures." },
    { title = "Add the powers", tex = "\\varphi = \\varphi_1 + \\varphi_2", text = "Thin elements in contact: powers add (from the composite-lens lesson)." },
    { title = "Count the chromatic change", tex = "\\Delta\\varphi_i = \\varphi_i\\,\\frac{\\Delta n_i}{n_i - 1} = \\frac{\\varphi_i}{V_i}", text = "Moving from the d line to F or C changes each element's power by its power divided by its Abbe number — because V is defined as (n_d − 1)/(n_F − n_C)." },
    { title = "Demand zero drift", tex = "\\frac{\\varphi_1}{V_1} + \\frac{\\varphi_2}{V_2} = 0", text = "The doublet is achromatic between the F and C lines when the two chromatic power changes cancel." },
    { title = "Solve the split", tex = "\\varphi_1 = \\frac{V_1}{V_1 - V_2}\\,\\varphi, \\qquad \\varphi_2 = -\\frac{V_2}{V_1 - V_2}\\,\\varphi", text = "Together with φ₁ + φ₂ = φ this fixes the power ratio φ₁/φ₂ = −V₁/V₂. For N-BK7 (V = 64.17) with N-SF11 (V = 25.76) at f = 100 mm: f₁ = 59.9 mm, f₂ = −149.1 mm.", note = "The split, not the shapes: bending each element for spherical aberration and coma is the designer's remaining freedom." },
]

[widgets."com.github.richbai90.optics.chromatic-spherical-coma.math-achromat"]
type = "math"
label = "The achromat condition"
tex = "\\frac{\\varphi_1}{\\varphi_2} = -\\frac{V_1}{V_2}"
definitions = [
    { symbol = "φ₁, φ₂", meaning = "the optical powers of the crown (positive) and flint (negative) elements", link = "/course/optics/thick-composite" },
    { symbol = "V₁, V₂", meaning = "Abbe numbers: (n_d − 1)/(n_F − n_C); large V means low dispersion", link = "/course/optics/prisms-and-dispersion" },
]

[widgets."com.github.richbai90.optics.chromatic-spherical-coma.math-sa"]
type = "math"
label = "Spherical aberration versus zone height"
tex = "\\mathrm{LSA} \\propto y^2, \\qquad \\mathrm{TSA} \\propto y^3"
definitions = [
    { symbol = "LSA", meaning = "longitudinal spherical aberration: axial gap between marginal and paraxial focus", link = "#spherical-aberration" },
    { symbol = "TSA", meaning = "transverse spherical aberration: blur radius at the paraxial focus", link = "#spherical-aberration" },
    { symbol = "y", meaning = "zone height: distance of a ray from the axis at the lens" },
]

[widgets."com.github.richbai90.optics.chromatic-spherical-coma.quiz2"]
type = "quiz"
question = "An achromatic doublet has 100 mm focal length, built from N-BK7 (V = 64.17) and N-SF11 (V = 25.76). What is the focal length of the positive crown element?"
options = [
    "About 100 mm — an achromat splits the power evenly",
    "About 60 mm — the crown carries V₁/(V₁ − V₂) of the total power",
    "About 149 mm — the crown carries V₂/(V₁ − V₂) of the power",
    "About 40 mm — the flint adds, not subtracts",
]
answer = 1
explanation = "φ₁ = φ·V₁/(V₁ − V₂) = φ·64.17/38.41 = 1.671 φ, so f₁ = 100/1.671 ≈ 59.9 mm. The flint takes φ₂ = −0.671 φ (f₂ ≈ −149 mm), and the sum is exactly φ = 1/100 mm⁻¹. Verified: 1/59.9 + 1/(−149.1) = 1/100."

[widgets."com.github.richbai90.optics.chromatic-spherical-coma.quiz3"]
type = "quiz"
question = "A lens working at f/2 is stopped down to f/4 (two stops). By what factors do longitudinal and transverse spherical aberration shrink?"
options = [
    "2× and 4×",
    "4× and 8×",
    "4× and 16×",
    "8× and 8×",
]
answer = 1
explanation = "The aperture radius halves, so the zone height halves. LSA ∝ y² drops 4×; TSA ∝ y³ drops 8×. The diffraction spot, meanwhile, doubles — one reason aberration-limited and diffraction-limited regimes trade places with f-number."

[widgets."com.github.richbai90.optics.chromatic-spherical-coma.card-achromat"]
type = "flashcard"
front = "State the achromatic doublet's power-split condition."
back = "φ₁/φ₂ = −V₁/V₂: the crown (low dispersion, high V) carries the positive power V₁/(V₁ − V₂) of the total, the flint carries the negative remainder. F and C light then focus together; a secondary spectrum of order f/2000 remains between them."

[widgets."com.github.richbai90.optics.chromatic-spherical-coma.card-stopping"]
type = "flashcard"
front = "Why does stopping down reduce spherical aberration, and at what cost?"
back = "LSA ∝ y² and TSA ∝ y³ in zone height, so f/2 → f/4 cuts the longitudinal error 4× and the transverse blur 8×. The cost is diffraction: the Airy spot grows in proportion to the f-number."

# ---------------------------------------------------------------------------
# Lesson 18 — Astigmatism, Field Curvature, and Distortion (18-astigmatism-field-curvature-distortion.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.optics.astigmatism-field-curvature-distortion.math-astig"]
type = "math"
label = "Astigmatic focus split"
tex = "z_T - z_S \\;\\propto\\; \\theta^2 y^2"
definitions = [
    { symbol = "z_T", meaning = "axial position of the tangential focus (the fan in the plane containing axis and field point)", link = "#astigmatism" },
    { symbol = "z_S", meaning = "axial position of the sagittal focus (the fan perpendicular to it)", link = "#astigmatism" },
    { symbol = "θ", meaning = "field angle of the object point" },
    { symbol = "y", meaning = "aperture (zone) height of the ray fan" },
]

[widgets."com.github.richbai90.optics.astigmatism-field-curvature-distortion.quiz1"]
type = "quiz"
question = "An off-axis point images as two short perpendicular line segments at different depths, with a circle of least confusion between them. Which aberration is this?"
options = [
    "Coma — a comet flare toward one side",
    "Astigmatism — the tangential and sagittal fans focus apart",
    "Field curvature — the focus lies on a bowl",
    "Distortion — the point is sharp but displaced",
]
answer = 1
explanation = "The conoid of Sturm — line focus, ellipses, circle of least confusion, line focus in the perpendicular direction — is the signature of astigmatism: the tangential and sagittal fans have different effective powers. Coma smears asymmetrically, field curvature blurs on a flat sensor, distortion only displaces."

[widgets."com.github.richbai90.optics.astigmatism-field-curvature-distortion.math-petzval"]
type = "math"
label = "The Petzval sum"
tex = "\\frac{1}{R_P} = \\sum_i \\frac{\\varphi_i}{n_i}"
definitions = [
    { symbol = "R_P", meaning = "radius of the Petzval image surface (the natural focus bowl of the whole train)" },
    { symbol = "φᵢ", meaning = "optical power of element i (thin lenses in contact, air on both sides)" },
    { symbol = "nᵢ", meaning = "refractive index of element i's glass", link = "/course/optics/prisms-and-dispersion" },
]

[widgets."com.github.richbai90.optics.astigmatism-field-curvature-distortion.quiz2"]
type = "quiz"
question = "Why must a flat-field camera lens include a negative element in a high-index glass?"
options = [
    "To boost the total power without adding curvature",
    "Because the Petzval sum Σφᵢ/nᵢ depends only on powers and indices — bending cannot fix it, so a negative high-index term must cancel the positives",
    "To correct chromatic aberration, which is the same thing as field curvature",
    "To make the lens symmetric about the stop",
]
answer = 1
explanation = "Each element contributes φᵢ/nᵢ to the Petzval sum, and no bending or stop shift changes it. Positive crown elements always push the sum positive, so flattening the field demands a negative element — and dividing by a large nᵢ makes that term as small as possible, which is why high-index flints earn their place."

[widgets."com.github.richbai90.optics.astigmatism-field-curvature-distortion.math-distortion"]
type = "math"
label = "Two field mappings"
tex = "y' = f\\tan\\theta \\quad \\text{(rectilinear)} \\qquad\\qquad y' = f\\,\\theta \\quad \\text{(f-theta)}"
definitions = [
    { symbol = "y'", meaning = "image height on the focal plane" },
    { symbol = "θ", meaning = "field angle of the incoming ray against the axis" },
    { symbol = "rectilinear", meaning = "straight object lines stay straight in the image — the mapping a camera lens wants" },
    { symbol = "f-theta", meaning = "image height proportional to field angle — the mapping a laser scan lens wants, for constant scan speed" },
]

[widgets."com.github.richbai90.optics.astigmatism-field-curvature-distortion.plot-tantheta"]
type = "plot"
title = "Image height for a 100 mm lens: f·tanθ versus f·θ"
xlabel = "field angle θ (degrees)"
ylabel = "image height y′ (mm)"
series = [
    { name = "f·tanθ (rectilinear)", color = "#0d9488", points = [[5, 8.749], [10, 17.633], [15, 26.795], [20, 36.397], [25, 46.631], [30, 57.735]] },
    { name = "f·θ (f-theta)", color = "#6366f1", points = [[5, 8.727], [10, 17.453], [15, 26.180], [20, 34.907], [25, 43.633], [30, 52.360]] },
]

[widgets."com.github.richbai90.optics.astigmatism-field-curvature-distortion.quiz3"]
type = "quiz"
question = "A camera lens must photograph architecture without bending vertical lines. Which focal-plane mapping does it need?"
options = [
    "y′ = f·θ — linear in angle",
    "y′ = f·tanθ — the rectilinear mapping",
    "y′ = f·sinθ — the equidistant mapping",
    "Any mapping, as long as the lens is stopped down",
]
answer = 1
explanation = "Perspective maps a straight line in the scene to a great circle through the entrance pupil; the image-plane curve that keeps it straight is the intersection with the tangent plane — y′ = f·tanθ. A lens that realizes this mapping accurately is called rectilinear; the residual error against it is exactly the barrel/pincushion distortion of the design."

[widgets."com.github.richbai90.optics.astigmatism-field-curvature-distortion.card-seidel"]
type = "flashcard"
front = "Name the six classical aberrations and their driving variable."
back = "One chromatic (first order): longitudinal/lateral color, driven by dispersion 1/V. Five Seidel (third order): spherical aberration (aperture⁴ wave), coma (aperture × field), astigmatism and field curvature (field² with aperture²), distortion (field³, position-only)."

[widgets."com.github.richbai90.optics.astigmatism-field-curvature-distortion.card-petzval"]
type = "flashcard"
front = "What is the Petzval sum, and why is it stubborn?"
back = "1/R_P = Σφᵢ/nᵢ over the train's elements. It depends only on powers and glass indices — not on bending or stop position — so a flat field must be bought with a negative element, best in high-index glass to keep its power (and its other aberrations) small."


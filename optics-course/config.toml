[widgets."com.github.richbai90.optics.fresnel-diffraction.stepper-zoneplate"]
type = "stepper"
label = "Why blocking the even zones makes a lens"
steps = [
    { title = "Start from the aperture result", text = "A circular aperture of outer radius a brightens the axis at every distance holding an odd number of zones: z = f, f/3, f/5, …, where f = a²/λ.", note = "Drag the interactive above: the peaks are focal lengths." },
    { title = "The even zones are the cancelers", tex = "A = a_1 - a_2 + a_3 - \\cdots", text = "At z = f every odd zone arrives in phase with zone 1; the even zones arrive inverted and are precisely what subtracts the amplitude back down." },
    { title = "Etch the even zones away", text = "A mask that blocks the even annuli and opens the odd ones converts the alternating sum into a plain sum: A = a1 + a3 + a5 + ⋯ — many zones adding in phase." },
    { title = "A lens made of rings", tex = "\\rho_m = \\sqrt{m\\,\\lambda f}", text = "Place the ring boundaries at the half-period zone radii for distance f and the plate focuses a plane wave at f — by interference, not refraction." },
    { title = "And at f/3, f/5, …", text = "The same plate satisfies the odd-zone condition at every f/m with m odd, so diffractive lenses always come with weaker higher-order foci.", note = "Order-m focus at z = f/m, m odd." },
]

[widgets."com.github.richbai90.optics.fresnel-diffraction.math-zoneplate"]
type = "math"
tex = "\\rho_m = \\sqrt{m\\,\\lambda f}, \\qquad f \\;=\\; \\frac{\\rho_1^2}{\\lambda}"
label = "Zone plate: ring radii and focal length"
definitions = [
    { symbol = "\\rho_m", meaning = "radius of the m-th zone boundary — odd zones open, even zones blocked", link = "#one-aperture-many-focal-lengths" },
    { symbol = "m", meaning = "zone number counted from the center", link = "/course/optics/fresnel-zones#half-period-zones" },
    { symbol = "\\lambda", meaning = "wavelength; the 1/λ dependence is what reverses the chromatism relative to glass", link = "/course/optics/the-propagation-of-light#wavefronts-and-rays" },
    { symbol = "f", meaning = "first-order focal length; secondary foci sit at f/3, f/5, …", link = "#one-aperture-many-focal-lengths" },
]

[widgets."com.github.richbai90.optics.fresnel-diffraction.quiz1"]
type = "quiz"
question = "At the exact geometric shadow boundary of a straight edge, the intensity is…"
options = [
    "Zero — the edge blocks the direct ray",
    "Half the unobstructed value",
    "Equal to the unobstructed value, then dropping inside",
    "Twice the unobstructed value, from the edge overshoot",
]
answer = 1
explanation = "At the edge exactly half the wavefront remains, and the Cornu-spiral chord from (0, 0) to the far limit has half the free-wave length in amplitude — I = I_free/2. The overshoot to ~1.4× happens slightly outside the edge, where the chord swings past the limit point."

[widgets."com.github.richbai90.optics.fresnel-diffraction.quiz2"]
type = "quiz"
question = "A zone plate is illuminated with white light. Where do red and blue focus?"
options = [
    "Blue short, red long — same as a glass lens",
    "Red short, blue long — f = ρ1²/λ, the reverse of glass",
    "Both at f — a zone plate is achromatic",
    "Neither — white light destroys the zone structure",
]
answer = 1
explanation = "f ∝ 1/λ: longer wavelength diffracts harder and focuses nearer, the opposite of refractive chromatism — and with magnitude far larger (diffractive 'Abbe number' ≈ −3.4). A weak diffractive element cemented to strong glass is the standard hybrid achromat in thin camera modules."

[widgets."com.github.richbai90.optics.fresnel-diffraction.quiz3"]
type = "quiz"
question = "Why does a binary amplitude zone plate send only ~10% of the light into its main focus?"
options = [
    "The rings absorb the other 90% as heat",
    "The open odd zones also form the f/3, f/5 … foci and a defocusing continuum — the alternating-sum structure splits the power among orders; ~1/π² lands in the first focus",
    "Diffraction cannot concentrate light at all",
    "Only light hitting the outermost ring is ever focused"
]
answer = 1
explanation = "A binary plate is a square-wave aperture function: its energy spreads over all diffraction orders. Blazed phase plates — rings that delay rather than block — repackage nearly all of the light into one order, which is why modern DOE lenses are phase structures."

[widgets."com.github.richbai90.optics.fresnel-diffraction.card-cornu"]
type = "flashcard"
front = "What the Cornu spiral encodes"
back = "Parametric plot of the Fresnel integrals C(t), S(t). Any straight-edge or slit geometry = a chord between two points of the spiral; intensity = chord length squared. Limits (±½, ±½) are the complete wavefront; the spiral's overshoots are the shadow-edge fringes."

[widgets."com.github.richbai90.optics.fresnel-diffraction.card-zoneplate"]
type = "flashcard"
front = "Zone plate"
back = "Concentric rings at radii √(mλf) opening the odd half-period zones. Focuses at f = ρ1²/λ (and f/3, f/5…): f ∝ 1/λ — chromatism opposite to glass. Binary amplitude efficiency ≈ 1/π² ≈ 10%; blazed phase plates reach ~50–90%. The lens of choice for X-rays."


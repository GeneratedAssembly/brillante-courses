[widgets."com.github.richbai90.optics.prisms-and-dispersion.math-deviation"]
tex = "D \\;\\approx\\; (n - 1)\\,\\alpha"
label = "Thin-prism deviation"
definitions = [
    { symbol = "D", meaning = "total deviation — angle between incoming and outgoing ray", link = "#the-prism-mechanism" },
    { symbol = "n", meaning = "index of refraction of the prism glass at the wavelength of interest", link = "/course/optics/light-in-matter#the-index-of-refraction" },
    { symbol = "\\alpha", meaning = "apex angle of the prism (thin-prism limit: α small, ray near minimum deviation)", link = "#the-prism-mechanism" },
]

[widgets."com.github.richbai90.optics.prisms-and-dispersion.math-abbe"]
tex = "V_d \\;=\\; \\frac{n_d - 1}{\\,n_F - n_C\\,}"
label = "Abbe number (inverse dispersive power)"
definitions = [
    { symbol = "V_d", meaning = "Abbe number — high V means low dispersion (crown glasses: ~55–65; flints: ~30–40)", link = "#fighting-dispersion-the-achromatic-doublet" },
    { symbol = "n_d", meaning = "index at the d-line of helium, λ ≈ 587.6 nm (near the middle of the visible band)", link = "#the-prism-mechanism" },
    { symbol = "n_F,\\; n_C", meaning = "indices at the blue F-line (486.1 nm) and red C-line (656.3 nm) of hydrogen — bracketing the visible band", link = "#the-prism-mechanism" },
]


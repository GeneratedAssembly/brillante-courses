[widgets."com.github.richbai90.optics.thin-lenses.math-lensmaker"]
type = "math"
tex = "\\frac{1}{f} \\;=\\; (n-1)\\left(\\frac{1}{R_1} - \\frac{1}{R_2}\\right)"
label = "Lensmaker's equation (thin lens in air)"
definitions = [
    { symbol = "f", meaning = "focal length of the lens; f > 0 converging, f < 0 diverging", link = "#the-thin-lens-equation" },
    { symbol = "n", meaning = "index of refraction of the lens glass relative to the surroundings", link = "/course/optics/light-in-matter#the-index-of-refraction" },
    { symbol = "R_1,\\; R_2", meaning = "radii of curvature of the first and second surface; sign per the convention card below", link = "#sign-conventions-and-diopters" },
]

[widgets."com.github.richbai90.optics.thin-lenses.math-thinlens-eq"]
type = "math"
tex = "\\frac{1}{s} + \\frac{1}{s'} = \\frac{1}{f}, \\qquad m = -\\frac{s'}{s}"
label = "Thin-lens equation and magnification"
definitions = [
    { symbol = "s", meaning = "object distance; s > 0 for a real object to the left of the lens", link = "#the-thin-lens-equation" },
    { symbol = "s'", meaning = "image distance; s' > 0 real image (right side), s' < 0 virtual image (object side)", link = "#real-and-virtual-images" },
    { symbol = "f", meaning = "focal length from the lensmaker's equation", link = "#from-two-surfaces-to-one-lens" },
    { symbol = "m", meaning = "lateral magnification y' / y; m < 0 means an inverted image", link = "#real-and-virtual-images" },
]

[widgets."com.github.richbai90.optics.thin-lenses.int-imaging"]
type = "interactive"
expression = "(f * x) / (x - f)"
domain = [1.2, 30]
ydomain = [-12, 12]
title = "Image distance s′ vs object distance s (thin lens)"
xlabel = "object distance s (cm)"
ylabel = "image distance s′ (cm)"
readout = "s = {x:0.1f} cm → s′ = {y:0.2f} cm"
parameters = [
    { name = "f", label = "focal length f (cm)", min = -3, max = 3, step = 0.1, initial = 2 },
]

[widgets."com.github.richbai90.optics.thin-lenses.quiz1"]
type = "quiz"
question = "An object stands 6 cm from a thin converging lens of f = +2 cm. Where and what is the image?"
options = [
    "3 cm behind the lens; real, inverted, half size",
    "3 cm in front of the lens; virtual, upright, half size",
    "12 cm behind the lens; real, inverted, twice the size",
    "1.5 cm behind the lens; real, upright, quarter size",
]
answer = 0
explanation = "1/s' = 1/f − 1/s = 1/2 − 1/6 = 1/3 → s' = 3 cm (positive → real, behind the lens). Magnification m = −s'/s = −3/6 = −0.5: inverted and half size."

[widgets."com.github.richbai90.optics.thin-lenses.quiz2"]
type = "quiz"
question = "A magnifying glass is a converging lens. How do you use it?"
options = [
    "Hold the object farther than the focal length, so the image is real and inverted",
    "Hold the object inside the focal length, so the lens makes a virtual, upright, magnified image your eye can focus",
    "Hold the object exactly at the focal length, so the image is at infinity",
    "Any position works — converging lenses always magnify",
]
answer = 1
explanation = "With s < f, the thin-lens equation gives s' < 0: a virtual image on the object side, upright and enlarged (m = −s'/s > 0 with s' < 0). Your eye then images that virtual object comfortably. Exactly at f the outgoing light is collimated — the relaxed-eye limit for a magnifier."

[widgets."com.github.richbai90.optics.thin-lenses.quiz3"]
type = "quiz"
question = "A real object is placed in front of a thin diverging lens (f < 0). The image is…"
options = [
    "always real, inverted, and reduced",
    "always virtual, upright, and reduced — no object position changes this",
    "real or virtual depending on whether the object is inside or outside f",
    "always virtual, upright, and magnified",
]
answer = 1
explanation = "With f < 0 and s > 0, s' = fs/(s − f) is negative for every s (numerator negative, denominator positive): the image is always virtual, on the object side, upright, and smaller than the object. Diverging lenses alone never cast real images of real objects."

[widgets."com.github.richbai90.optics.thin-lenses.card-signs"]
type = "flashcard"
front = "Thin-lens sign conventions"
back = "s > 0: real object (left of lens). s' > 0: real image (right of lens). f > 0: converging, f < 0: diverging. R convex toward the object: R > 0 (in the lensmaker's equation)."

[widgets."com.github.richbai90.optics.thin-lenses.card-diopter"]
type = "flashcard"
front = "Lens power (diopter)"
back = "P = 1/f with f in meters; unit: diopter (D). Converging: P > 0, diverging: P < 0. A +2.0 D reading lens has f = +0.5 m. Powers of thin lenses in contact add."

[widgets."com.github.richbai90.optics.thin-lenses.card-realvirtual"]
type = "flashcard"
front = "Real vs virtual image"
back = "Real: rays actually converge (s' > 0) — can be caught on a screen; inverted for a single thin lens. Virtual: rays only appear to come from a point (s' < 0) — visible to the eye, not to a screen; upright."


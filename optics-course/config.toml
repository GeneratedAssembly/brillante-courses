definitions = [
    { symbol = "A", meaning = "n at short wavelength asymptote (fit constant)", link = "#dispersion-n-depends-on-wavelength" },
    { symbol = "B", meaning = "dispersion strength (fit constant)", link = "#dispersion-n-depends-on-wavelength" },
    { symbol = "\\lambda", meaning = "vacuum wavelength", link = "/course/optics/the-propagation-of-light#wavefronts-and-rays" },
]


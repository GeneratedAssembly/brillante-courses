# ---------------------------------------------------------------------------
# Lesson 23 — From Rays to Waves (23-rays-to-waves.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.optics.rays-to-waves.math-fermat"]
type = "math"
label = "Fermat's principle"
tex = "L = \\int_A^B n\\,ds, \\qquad \\delta L = 0"
definitions = [
    { symbol = "L", meaning = "optical path length: physical length weighted by index — the time of flight times c", link = "/course/optics/the-propagation-of-light#speed-media-and-the-constant-c" },
    { symbol = "δL = 0", meaning = "the physical path makes L stationary (usually minimum) against neighboring paths" },
    { symbol = "ds", meaning = "element of the ray path" },
]

[widgets."com.github.richbai90.optics.rays-to-waves.stepper-fermat"]
type = "stepper"
label = "Deriving Snell's law from least time"
steps = [
    { title = "Set up the path", tex = "L(x) = n_1\\sqrt{h_1^2 + x^2} + n_2\\sqrt{h_2^2 + (D - x)^2}", text = "A sits height h₁ above a flat interface, B depth h₂ below, D apart along the interface. The crossing point x is the only freedom.", note = "Everything the answer needs is already in L." },
    { title = "Differentiate along the interface", tex = "\\frac{dL}{dx} = n_1\\frac{x}{\\sqrt{h_1^2 + x^2}} - n_2\\frac{D - x}{\\sqrt{h_2^2 + (D - x)^2}} = 0", text = "Stationarity sets the derivative to zero. Each fraction is exactly the sine of the angle the ray makes with the interface normal." },
    { title = "Read off Snell's law", tex = "n_1\\sin\\theta_1 = n_2\\sin\\theta_2", text = "The stationary condition is Snell's law — no wave, no Huygens construction, just a derivative." },
    { title = "Work the numbers", tex = "h_1 = 2,\\; h_2 = 3,\\; D = 5,\\; n_2/n_1 = 1.5:\\;\\; x = 3.000,\\; \\theta_1 = 56.31^\\circ,\\; \\theta_2 = 33.69^\\circ", text = "Verified numerically: the stationary crossing sits at x = 3.000 mm, and n₁sinθ₁ = n₂sinθ₂ = 0.8321 exactly.", note = "Least time, not least distance: bending toward the normal trades path length for time in the slow medium." },
]

[widgets."com.github.richbai90.optics.rays-to-waves.math-eikonal"]
type = "math"
label = "The eikonal equation"
tex = "|\\nabla S| = n"
definitions = [
    { symbol = "S", meaning = "the eikonal: light's spatial phase; its level surfaces S = const are the wavefronts", link = "/course/optics/the-propagation-of-light#wavefronts-and-rays" },
    { symbol = "∇S", meaning = "points perpendicular to the wavefronts — along the rays — with magnitude equal to the local index" },
    { symbol = "n", meaning = "the refractive index at the point (local wavelength is λ₀/n)", link = "/course/optics/the-propagation-of-light#speed-media-and-the-constant-c" },
]

[widgets."com.github.richbai90.optics.rays-to-waves.int-gradient"]
type = "interactive"
expression = "t * x + 0.003333 * x * x"
domain = [0, 12]
ydomain = [-2, 3.5]
title = "Paraxial ray in a linear index gradient n(y) = n₀ + αy (α = 0.01/mm, n₀ = 1.5): a parabola with gravity α/n₀"
xlabel = "axial distance z (mm)"
ylabel = "ray height y (mm)"
readout = "z = {x:0.1f} mm → y = {y:0.3f} mm"
parameters = [
    { name = "t", label = "initial slope θ₀", min = -0.3, max = 0.3, step = 0.01, initial = 0.1 },
]

[widgets."com.github.richbai90.optics.rays-to-waves.quiz1"]
type = "quiz"
question = "Why does the least-time path from a point above water to a point below bend at the surface instead of running straight?"
options = [
    "Because light avoids interfaces whenever it can",
    "Because the straight path lingers in the slow medium; bending shortens the underwater leg enough to cut total time",
    "Because the shortest path is always the one closest to the normal",
    "Because light accelerates in water, so it prefers to enter steeply",
]
answer = 1
explanation = "Time = optical path length. The straight line minimizes distance, not time: it spends too many millimeters crawling at c/n₂. The bent path — exactly Snell's law — is the stationary compromise. Fermat's principle prices every extra millimeter of glass."

[widgets."com.github.richbai90.optics.rays-to-waves.quiz2"]
type = "quiz"
question = "In the eikonal picture, what is a ray?"
options = [
    "A thin beam of light, as drawn in diagrams",
    "The curve that is everywhere perpendicular to the wavefronts S = const",
    "The direction of the Poynting vector averaged over time",
    "Any line satisfying n₁sinθ₁ = n₂sinθ₂ at every interface",
]
answer = 1
explanation = "The eikonal S carries the phase; its level surfaces are the wavefronts, and ∇S — perpendicular to every wavefront — defines the ray family. Everything else (Snell, Fermat, lens phases) follows from |∇S| = n. The Poynting direction is a consequence, not the definition."

[widgets."com.github.richbai90.optics.rays-to-waves.quiz3"]
type = "quiz"
question = "A highway mirage shows the sky where the hot asphalt should be. In eikonal terms, what happened?"
options = [
    "The road reflected the sky like a mirror because it is smooth",
    "Hot, low-index air near the road curved the rays upward until they refracted back down; the eye back-traced them into a phantom pool",
    "Water vapor condensed above the road and acted as a lens",
    "The index gradient bent the rays downward, doubling the road into the sky",
]
answer = 1
explanation = "Hot air expands, its density and index drop: n(y) increases with height. The paraxial ray equation bends rays toward higher n — upward, away from the road — so steeply that near-grazing rays turn around and climb. Your eye back-traces them along straight lines to a glossy 'pool' that is really redirected sky."

[widgets."com.github.richbai90.optics.rays-to-waves.card-fermat"]
type = "flashcard"
front = "State Fermat's principle."
back = "Light takes the path of stationary optical path length L = ∫n ds — usually the least time. Snell's law, mirages, and the lens phase-delay picture are all consequences; the deep reason is that only near-stationary paths survive phase cancellation."

[widgets."com.github.richbai90.optics.rays-to-waves.card-eikonal"]
type = "flashcard"
front = "What does |∇S| = n say?"
back = "The phase S advances 2π per local wavelength λ₀/n, so its gradient magnitude equals the index. Wavefronts are S = const surfaces; rays are their normals; geometric optics is the short-wavelength limit of the wave equation."

# ---------------------------------------------------------------------------
# Lesson 24 — The Wave Equation and Phasors (24-wave-equation-phasors.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.optics.wave-equation-phasors.math-wave-eq"]
type = "math"
label = "The wave equation"
tex = "\\frac{\\partial^2 U}{\\partial z^2} = \\frac{1}{v^2}\\,\\frac{\\partial^2 U}{\\partial t^2}"
definitions = [
    { symbol = "U", meaning = "the disturbance (for light: a field component of E or B)" },
    { symbol = "v", meaning = "the wave speed in the uniform medium (v = c/n in matter)" },
]

[widgets."com.github.richbai90.optics.wave-equation-phasors.math-phasor"]
type = "math"
label = "The phasor representation"
tex = "U = \\operatorname{Re}\\{A\\,e^{i(kz - \\omega t)}\\}, \\qquad k = \\frac{2\\pi}{\\lambda}, \\quad \\omega = \\frac{2\\pi}{T}, \\quad v = \\frac{\\omega}{k}"
definitions = [
    { symbol = "A", meaning = "complex amplitude; |A| sets the intensity, its phase sets the offset" },
    { symbol = "k", meaning = "wavenumber: phase radians per meter" },
    { symbol = "ω", meaning = "angular frequency: phase radians per second" },
    { symbol = "v = ω/k", meaning = "phase velocity — the speed of the crests in a nondispersive medium" },
]

[widgets."com.github.richbai90.optics.wave-equation-phasors.int-traveling"]
type = "interactive"
expression = "cos(2 * pi * (x / lam - t))"
domain = [0, 6]
ydomain = [-1.2, 1.2]
title = "Traveling wave U = cos(2π(x/λ − t)) — drag λ and t"
xlabel = "z"
ylabel = "U"
readout = "z = {x:0.1f} → U = {y:0.2f}"
parameters = [
    { name = "lam", label = "wavelength λ", min = 0.5, max = 3, step = 0.05, initial = 2 },
    { name = "t", label = "time t (fraction of a period)", min = 0, max = 1, step = 0.01, initial = 0 },
]

[widgets."com.github.richbai90.optics.wave-equation-phasors.math-planewave"]
type = "math"
label = "Plane waves in three dimensions"
tex = "U(\\mathbf{r}, t) = A\\,e^{i(\\mathbf{k}\\cdot\\mathbf{r} - \\omega t)}, \\qquad |\\mathbf{k}| = \\frac{n\\omega}{c}"
definitions = [
    { symbol = "k", meaning = "wave vector: points along travel, perpendicular to the wavefronts k·r = const", link = "/course/optics/the-propagation-of-light#wavefronts-and-rays" },
    { symbol = "|k| = nω/c", meaning = "the dispersion relation: the same ω-k tie as in 1D, with the medium's index" },
]

[widgets."com.github.richbai90.optics.wave-equation-phasors.math-velocities"]
type = "math"
label = "Phase and group velocity"
tex = "v_p = \\frac{\\omega}{k}, \\qquad v_g = \\frac{d\\omega}{dk}"
definitions = [
    { symbol = "v_p", meaning = "phase velocity: speed of a single crest of one frequency" },
    { symbol = "v_g", meaning = "group velocity: speed of the wave-packet envelope — where energy and information travel" },
]

[widgets."com.github.richbai90.optics.wave-equation-phasors.quiz1"]
type = "quiz"
question = "Two beams, each of intensity I₀, overlap at a point with a 120° phase difference. What total intensity results?"
options = [
    "0 — they partially cancel",
    "I₀/2",
    "I₀ — phasors of equal size at 120° sum to one phasor of that size",
    "2I₀ — intensities always add",
]
answer = 2
explanation = "Amplitudes add, not intensities: the resultant phasor of two equal phasors 120° apart has magnitude equal to either, so I = 4I₀cos²(60°) = I₀. At 0° the result is 4I₀, at 180° it is 0 — every fringe in this course is this line."

[widgets."com.github.richbai90.optics.wave-equation-phasors.quiz2"]
type = "quiz"
question = "Green light of wavelength 500 nm in air. Its frequency and wavenumber are approximately:"
options = [
    "ν ≈ 600 THz, k ≈ 1.26 × 10⁷ rad/m",
    "ν ≈ 600 MHz, k ≈ 1.26 × 10⁷ rad/m",
    "ν ≈ 600 THz, k ≈ 1.26 × 10⁵ rad/m",
    "ν ≈ 6 PHz, k ≈ 1.26 × 10⁹ rad/m",
]
answer = 0
explanation = "ν = c/λ = 3×10⁸/5×10⁻⁷ = 6×10¹⁴ Hz = 600 THz; k = 2π/λ = 1.257×10⁷ rad/m; ω = 2πν ≈ 3.8×10¹⁵ rad/s. No electronics resolves these cycles — instruments see time-averaged intensity."

[widgets."com.github.richbai90.optics.wave-equation-phasors.quiz3"]
type = "quiz"
question = "In normal-dispersion glass at 550 nm (n falls as λ grows), which travels faster — and what does that mean physically?"
options = [
    "The group velocity; the envelope outruns its crests, so signals arrive early",
    "The phase velocity; crests slide forward through the packet, while information still travels at v_g",
    "Both equal c/n; dispersion only shifts the wavelength",
    "Neither — in a dispersive medium neither velocity is defined",
]
answer = 1
explanation = "v_p = c/n = 0.660c but v_g = c/(n − λ dn/dλ) = 0.647c in the course's Cauchy model: crests drift forward through the packet. Energy and information ride with the envelope at v_g, which stays below c. Phase velocity can exceed c in other settings without breaking causality for exactly this reason."

[widgets."com.github.richbai90.optics.wave-equation-phasors.card-dalembert"]
type = "flashcard"
front = "What is the general solution of the 1D wave equation?"
back = "U(z, t) = f(z − vt) + g(z + vt): any profile f translating right and any profile g translating left, rigidly. Linearity is the license to add such solutions — the basis of all interference and diffraction arguments."

[widgets."com.github.richbai90.optics.wave-equation-phasors.card-velocities"]
type = "flashcard"
front = "Phase velocity versus group velocity — define and rank them in normal glass."
back = "v_p = ω/k carries crests; v_g = dω/dk carries the envelope (energy, information). In normal-dispersion glass v_g < v_p: 0.660c versus 0.647c at 550 nm in the course's Cauchy model."

# ---------------------------------------------------------------------------
# Lesson 25 — Maxwell's Equations and Light (25-maxwell-em-waves.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.optics.maxwell-em-waves.math-maxwell"]
type = "math"
label = "Maxwell's equations in vacuum"
tex = "\\nabla\\cdot\\mathbf{E} = 0, \\qquad \\nabla\\cdot\\mathbf{B} = 0, \\qquad \\nabla\\times\\mathbf{E} = -\\frac{\\partial\\mathbf{B}}{\\partial t}, \\qquad \\nabla\\times\\mathbf{B} = \\mu_0\\varepsilon_0\\,\\frac{\\partial\\mathbf{E}}{\\partial t}"
definitions = [
    { symbol = "∇·E = 0", meaning = "Gauss: no charge in the wave region — E's field lines neither start nor end" },
    { symbol = "∇·B = 0", meaning = "no magnetic charge exists, anywhere" },
    { symbol = "∇×E = −∂B/∂t", meaning = "Faraday: a changing magnetic field curls the electric field" },
    { symbol = "∇×B = μ₀ε₀ ∂E/∂t", meaning = "Ampère–Maxwell: a changing electric field (or current) curls the magnetic field" },
]

[widgets."com.github.richbai90.optics.maxwell-em-waves.math-c"]
type = "math"
label = "The wave equation and light's speed"
tex = "\\nabla^2\\mathbf{E} = \\mu_0\\varepsilon_0\\,\\frac{\\partial^2\\mathbf{E}}{\\partial t^2}, \\qquad c = \\frac{1}{\\sqrt{\\mu_0\\varepsilon_0}} = 299{,}792{,}458\\ \\mathrm{m/s}"
definitions = [
    { symbol = "∇²E", meaning = "the Laplacian: each field component obeys the wave equation of the previous lesson", link = "/course/optics/wave-equation-phasors#the-wave-equation" },
    { symbol = "c", meaning = "1/√(μ₀ε₀) — and the measured speed of light; the constants were measured in a lab, on tabletops, with no optics involved" },
]

[widgets."com.github.richbai90.optics.maxwell-em-waves.math-index"]
type = "math"
label = "Index from the dielectric response"
tex = "v = \\frac{c}{n}, \\qquad n^2 = \\varepsilon_r \\;\\; \\text{(non-magnetic, at optical frequency)}"
definitions = [
    { symbol = "ε_r", meaning = "relative permittivity at the wave's frequency — not the static value" },
    { symbol = "n(ω)", meaning = "frequency-dependent index: dispersion is the frequency dependence of ε_r", link = "/course/optics/prisms-and-dispersion#dispersion-n-depends-on-wavelength" },
]

[widgets."com.github.richbai90.optics.maxwell-em-waves.math-poynting"]
type = "math"
label = "Energy flux: the Poynting vector"
tex = "\\mathbf{S} = \\frac{1}{\\mu_0}\\,\\mathbf{E}\\times\\mathbf{B}, \\qquad \\langle S \\rangle = \\tfrac{1}{2}c\\varepsilon_0 E_0^2"
definitions = [
    { symbol = "S", meaning = "energy flux density, W/m² — energy crossing a unit area per second, along the wave's travel" },
    { symbol = "⟨S⟩", meaning = "irradiance: the time average instruments actually measure; ½cε₀ = 1.33×10⁻³ W/m² per (V/m)²" },
    { symbol = "E₀", meaning = "electric field amplitude; sunlight's 1000 W/m² means E₀ ≈ 870 V/m, B₀ ≈ 2.9 µT" },
]

[widgets."com.github.richbai90.optics.maxwell-em-waves.stepper-fresnel"]
type = "stepper"
label = "Deriving the Fresnel coefficients at normal incidence"
steps = [
    { title = "Boundary conditions", tex = "E_{t1} = E_{t2}, \\qquad H_{t1} = H_{t2}", text = "With no free surface charge or current, the tangential E and H fields must be continuous across the interface; matching phase along the surface pins Snell's law.", note = "Two continuity equations — that is the whole machinery." },
    { title = "Bookkeep the electric fields", tex = "E_i + E_r = E_t", text = "At the interface plane, incident plus reflected (both live in medium 1) equals transmitted. Signs stay positive at normal incidence." },
    { title = "Bookkeep the magnetic fields", tex = "n_1(E_i - E_r) = n_2 E_t", text = "H = E/(μ₀v) with v = c/n, and the reflected wave travels backward, flipping H's sign. μ₀ is common to both media and cancels." },
    { title = "Solve the two equations", tex = "r = \\frac{E_r}{E_i} = \\frac{n_1 - n_2}{n_1 + n_2}, \\qquad t = \\frac{E_t}{E_i} = \\frac{2n_1}{n_1 + n_2}", text = "Two linear equations, two unknowns. The amplitude reflection coefficient changes sign entering a denser medium — the π phase flip behind half-wave-loss bookkeeping." },
    { title = "Take the power", tex = "R = |r|^2 = \\left(\\frac{n_1 - n_2}{n_1 + n_2}\\right)^2 \\;\\xrightarrow{\\;1 \\to 1.5\\;}\\; 0.04", text = "Air-to-glass reflects 4% of the power per surface — the number the Fresnel lesson priced, now derived rather than asserted.", note = "Twelve air-glass surfaces in a zoom lens: 0.96¹² ≈ 0.61 — coatings are not a luxury." },
]

[widgets."com.github.richbai90.optics.maxwell-em-waves.quiz1"]
type = "quiz"
question = "Which Maxwell equation forces light to be a transverse wave?"
options = [
    "Faraday's law — ∇×E = −∂B/∂t",
    "Ampère–Maxwell — ∇×B = μ₀ε₀ ∂E/∂t",
    "Gauss's law in the wave region — ∇·E = 0, so k·E = 0",
    "∇·B = 0 — the absence of magnetic charge",
]
answer = 2
explanation = "In a source-free plane wave, ∇·E = 0 becomes k·E = 0: the field must be perpendicular to the propagation direction. The curls then fix the partner field: B = k̂×E/c. Transversality is Gauss's law plus plane-wave structure."

[widgets."com.github.richbai90.optics.maxwell-em-waves.quiz2"]
type = "quiz"
question = "Water's static permittivity is ε_r ≈ 80, yet n = 1.33. Why does n² = ε_r still work?"
options = [
    "It does not — the index has nothing to do with permittivity",
    "At optical frequencies only the fast electronic polarization responds: ε_r(optical) = n² ≈ 1.77, while the slow molecular rotation that makes the static value huge cannot follow 600 THz",
    "The static value must be divided by the dielectric constant of vacuum",
    "Water's index is set by its magnetic susceptibility instead",
]
answer = 1
explanation = "ε_r is frequency-dependent. Molecular dipoles (water's rotational polarization) freeze out above ~10¹⁰ Hz; at 6×10¹⁴ Hz only electron clouds deform, giving ε_r ≈ 1.77. The same frequency dependence of ε_r is dispersion — the prism mechanism."

[widgets."com.github.richbai90.optics.maxwell-em-waves.quiz3"]
type = "quiz"
question = "Sunlight delivers about 1000 W/m² at noon. The amplitude of its electric field is roughly:"
options = [
    "0.9 V/m",
    "87 V/m",
    "870 V/m",
    "8700 V/m",
]
answer = 2
explanation = "⟨S⟩ = ½cε₀E₀² with ½cε₀ = 1.33×10⁻³ W/m² per (V/m)²: E₀ = √(1000/1.33×10⁻³) ≈ 868 V/m, and B₀ = E₀/c ≈ 2.9 µT. A few hundred volts per meter of field is an ordinary day outdoors."

[widgets."com.github.richbai90.optics.maxwell-em-waves.card-maxwell"]
type = "flashcard"
front = "Write vacuum Maxwell's equations and what they predict about light."
back = "∇·E = 0, ∇·B = 0, ∇×E = −∂B/∂t, ∇×B = μ₀ε₀ ∂E/∂t. Cross the curls: each field obeys the wave equation at c = 1/√(μ₀ε₀) = 299 792 458 m/s. Transversality (k·E = 0) and B = k̂×E/c come free."

[widgets."com.github.richbai90.optics.maxwell-em-waves.card-poynting"]
type = "flashcard"
front = "What does the Poynting vector measure, and how big is it for sunlight?"
back = "S = (1/μ₀)E×B, energy flux in W/m². Its time average is the irradiance: ⟨S⟩ = ½cε₀E₀². Sunlight's 1000 W/m² corresponds to E₀ ≈ 870 V/m and B₀ ≈ 2.9 µT."


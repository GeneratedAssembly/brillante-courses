# Lesson 10 — Thick and Composite Lenses (10-thick-composite.md)

# Recommended reading and viewing callouts
[widgets."com.github.richbai90.optics.thick-composite.link-lecture-5"]
title = "Lecture 5: Thick lenses; the composite lens; the eye"
url = "https://ocw.mit.edu/courses/2-71-optics-spring-2009/resources/lecture-5-thick-lenses-the-composite-lens-the-eye/"
source = "MIT OpenCourseWare"

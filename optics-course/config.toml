[widgets."com.github.richbai90.optics.polarization-poynting.math-states"]
type = "math"
label = "Polarization states from a phase offset"
tex = "E_x = A_x\\cos(\\omega t), \\qquad E_y = A_y\\cos(\\omega t + \\delta)"
definitions = [
    { symbol = "δ", meaning = "the relative phase of the two transverse components — it alone chooses the state's shape" },
    { symbol = "δ = 0 or π", meaning = "linear polarization: the components rise and fall together (or in opposition)" },
    { symbol = "δ = ±π/2, A_x = A_y", meaning = "circular polarization; the sign of δ sets the handedness" },
    { symbol = "otherwise", meaning = "elliptical polarization — the generic state" },
]

[widgets."com.github.richbai90.optics.polarization-poynting.plot-ellipses"]
type = "plot"
title = "The tip of E for δ = 0° (linear), 45° (elliptical), 90° (circular)"
xlabel = "E_x (× A)"
ylabel = "E_y (× A)"
series = [
    { name = "δ = 0° (linear)", color = "#0d9488", points = [[1.0, 1.0], [0.707, 0.707], [0.0, 0.0], [-0.707, -0.707], [-1.0, -1.0]] },
    { name = "δ = 45° (elliptical)", color = "#f59e0b", points = [[1.0, 0.707], [0.924, 0.383], [0.707, 0.0], [0.383, -0.383], [0.0, -0.707], [-0.383, -0.924], [-0.707, -1.0], [-0.924, -0.924], [-1.0, -0.707], [-0.924, -0.383], [-0.707, -0.0], [-0.383, 0.383], [0.0, 0.707], [0.383, 0.924], [0.707, 1.0], [0.924, 0.924], [1.0, 0.707]] },
    { name = "δ = 90° (circular)", color = "#6366f1", points = [[1.0, 0.0], [0.924, -0.383], [0.707, -0.707], [0.383, -0.924], [0.0, -1.0], [-0.383, -0.924], [-0.707, -0.707], [-0.924, -0.383], [-1.0, 0.0], [-0.924, 0.383], [-0.707, 0.707], [-0.383, 0.924], [0.0, 1.0], [0.383, 0.924], [0.707, 0.707], [0.924, 0.383], [1.0, 0.0]] },
]

[widgets."com.github.richbai90.optics.polarization-poynting.math-malus"]
type = "math"
label = "Malus's law"
tex = "I = I_0\\cos^2\\theta"
definitions = [
    { symbol = "θ", meaning = "angle between the polarizer's transmission axis and the incoming polarization direction" },
    { symbol = "I₀", meaning = "intensity after the first (preparing) polarizer; unpolarized input halves there" },
]

[widgets."com.github.richbai90.optics.polarization-poynting.int-malus"]
type = "interactive"
expression = "cos(x) * cos(x)"
domain = [0, 1.5708]
ydomain = [0, 1.05]
title = "Malus's law: transmitted fraction through an analyzer"
xlabel = "analyzer angle θ (rad)"
ylabel = "T = cos²θ"
readout = "θ = {x:0.2f} rad → T = {y:0.3f}"

[widgets."com.github.richbai90.optics.polarization-poynting.math-rhomb"]
type = "math"
label = "TIR phase shifts (Fresnel's rhomb)"
tex = "\\tan\\frac{\\delta_s}{2} = -\\frac{\\sqrt{n^2\\sin^2\\theta - 1}}{n\\cos\\theta}, \\qquad \\tan\\frac{\\delta_p}{2} = -\\frac{n\\,\\sqrt{n^2\\sin^2\\theta - 1}}{\\cos\\theta}"
definitions = [
    { symbol = "δ_s, δ_p", meaning = "phase shifts of the two polarizations under total internal reflection (|r| = 1 for both)" },
    { symbol = "retardance δ_p − δ_s", meaning = "peaks near 45°; for n = 1.5 the maximum is 45.2° at θ = 51.7° — two bounces make a quarter-wave plate", link = "/course/optics/fresnel-equations#beyond-the-critical-angle" },
]

[widgets."com.github.richbai90.optics.polarization-poynting.quiz1"]
type = "quiz"
question = "Equal-amplitude s and p components with relative phase δ = π/2 make what state?"
options = [
    "Linear polarization at 45°",
    "Linear polarization whose axis rotates",
    "Circular polarization — the tip of E sweeps a circle, handedness set by the sign of δ",
    "Unpolarized light",
]
answer = 2
explanation = "E_x = A cos(ωt), E_y = A cos(ωt + π/2): the tip of E stays at constant magnitude A while both components oscillate a quarter-cycle apart — a circle, traversed with sense set by the sign of δ. Unequal amplitudes would give an ellipse; δ = 0 or π collapses to a line."

[widgets."com.github.richbai90.optics.polarization-poynting.quiz2"]
type = "quiz"
question = "Light of intensity I₀, linearly polarized at 0°, passes a polarizer at 45° and then one at 90°. What exits?"
options = [
    "0 — the last pair of axes is crossed",
    "I₀/4 — the 45° polarizer re-projects the light onto the final axis",
    "I₀/2 — only the final polarizer attenuates polarized light",
    "I₀/8 — each polarizer halves whatever arrives",
]
answer = 1
explanation = "The 45° polarizer passes cos²45° = ½ of the arriving light: I₀/2, now polarized along 45°. The 90° analyzer sees that beam at 45° to its axis and passes cos²45° of it: I₀/4. A crossed 0°/90° pair alone passes nothing; the middle element rescues a quarter. (Unpolarized input would halve once more, to I₀/8.)"

[widgets."com.github.richbai90.optics.polarization-poynting.quiz3"]
type = "quiz"
question = "Why is the Fresnel rhomb valued for broadband circular polarization?"
options = [
    "Its glass is naturally birefringent at all wavelengths",
    "Its 90° retardance is set by reflection geometry, not by a thickness resonance — so it barely changes with wavelength",
    "It amplifies the p polarization selectively",
    "Total internal reflection adds gain at all wavelengths",
]
answer = 1
explanation = "A birefringent quarter-wave plate works only where its thickness equals λ/4 of the phase slip — a narrow band. The rhomb's retardance comes from the TIR phase formulas at a fixed angle: geometry, not resonance, so the quarter-wave condition holds across the whole visible band."

[widgets."com.github.richbai90.optics.polarization-poynting.card-states"]
type = "flashcard"
front = "How does the phase offset δ between the transverse components choose the polarization state?"
back = "δ = 0 or π: linear. δ = ±π/2 with equal amplitudes: circular (sign = handedness). Anything else: elliptical. Interfaces split any state into its s and p parts, which is why those two axes are the alphabet."

[widgets."com.github.richbai90.optics.polarization-poynting.card-malus"]
type = "flashcard"
front = "State Malus's law and the three-polarizer surprise."
back = "I = I₀cos²θ through an analyzer at angle θ; unpolarized input halves at the first polarizer. Crossed polarizers pass nothing — but a 45° polarizer between them restores a quarter of the prepared intensity, because projections compose."


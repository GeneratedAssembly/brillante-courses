[widgets."com.github.richbai90.optics.telescopes.math-afocal"]
tex = "d = f_o + f_e, \\qquad \\frac{1}{F} = 0"
label = "Afocal telescope geometry"
definitions = [
    { symbol = "d", meaning = "objective-to-eyepiece separation: the two lenses share a focal plane", link = "#the-afocal-geometry" },
    { symbol = "f_o", meaning = "focal length of the objective — the light-gathering, image-forming lens", link = "#the-afocal-geometry" },
    { symbol = "f_e", meaning = "focal length of the eyepiece, which recollimates the bundles", link = "#the-afocal-geometry" },
    { symbol = "F", meaning = "composite focal length of the pair; zero power means no finite F (see the composite formula)", link = "/course/optics/thick-composite#two-lenses-apart-the-composite-formula" },
]

[widgets."com.github.richbai90.optics.telescopes.stepper-afocal"]
label = "The telescope matrix: zero power, nonzero magnification"
steps = [
    { title = "Multiply the two lens matrices", tex = "M = L_2\\,T(d)\\,L_1", text = "Objective first (rightmost in the product), gap d, then eyepiece — the composite formula of lesson 10, applied at d = f_o + f_e.", note = "Order runs opposite to the ray's journey." },
    { title = "Substitute the shared focal plane", tex = "C = -\\left(\\frac{1}{f_o} + \\frac{1}{f_e} - \\frac{f_o + f_e}{f_o f_e}\\right) = 0", text = "The lower-left entry — the system power — vanishes identically at d = f_o + f_e.", note = "This is the afocal condition." },
    { title = "Read the full matrix", tex = "M = \\begin{pmatrix} -f_e/f_o & d \\\\ 0 & -f_o/f_e \\end{pmatrix}", text = "With C = 0 the (1,2) entry carries all the imaging: the A entry is the angular demagnification of the bundles." },
    { title = "Identify the magnifying power", tex = "\\frac{\\alpha_{\\text{out}}}{\\alpha_{\\text{in}}} = -\\frac{f_o}{f_e}", text = "A ray entering at angle α_in exits at −(f_o/f_e)α_in: angles are magnified by −f_o/f_e even though the system has no focal length.", note = "Zero power ≠ zero magnifying power." },
]

[widgets."com.github.richbai90.optics.telescopes.math-magpower"]
tex = "M \\;=\\; -\\frac{f_o}{f_e} \\;=\\; \\frac{\\theta_{\\text{image}}}{\\theta_{\\text{object}}}"
label = "Telescope angular magnification"
definitions = [
    { symbol = "f_o", meaning = "objective focal length; long objectives magnify most", link = "#angular-magnification" },
    { symbol = "f_e", meaning = "eyepiece focal length; typical values 2.5 cm or 1.25 cm", link = "#angular-magnification" },
    { symbol = "M", meaning = "angular magnification; the minus sign marks the inverted (astronomical) image", link = "#angular-magnification" },
]

[widgets."com.github.richbai90.optics.telescopes.int-magpower"]
expression = "fo / x"
domain = [0.5, 5]
ydomain = [0, 200]
title = "Telescope magnifying power M = f_o / f_e vs eyepiece focal length"
xlabel = "eyepiece focal length f_e (cm)"
ylabel = "angular magnification M (×)"
readout = "f_e = {x:0.2f} cm → M = {y:0.0f}×"
parameters = [
    { name = "fo", label = "objective focal length f_o (cm)", min = 25, max = 400, step = 5, initial = 100 },
]

[widgets."com.github.richbai90.optics.telescopes.math-lightgather"]
tex = "\\Phi \\;\\propto\\; A \\;=\\; \\pi\\left(\\frac{D}{2}\\right)^{2}"
label = "Light gathering vs aperture diameter"
definitions = [
    { symbol = "\\Phi", meaning = "radiant flux collected from a resolved source (scaling argument; see radiometry)", link = "#light-gathering-why-aperture-is-king" },
    { symbol = "D", meaning = "aperture diameter of the objective (its entrance pupil)", link = "/course/optics/stops-pupils#entrance-and-exit-pupils" },
    { symbol = "A", meaning = "collecting area — doubling D quadruples the gathered light", link = "#light-gathering-why-aperture-is-king" },
]

[widgets."com.github.richbai90.optics.telescopes.quiz1"]
question = "Why must the two lenses of an astronomical telescope be separated by exactly f_o + f_e for relaxed-eye viewing?"
options = [
    "That is the only spacing that fits both lenses in the tube",
    "The objective's back focal plane must coincide with the eyepiece's front focal plane, so each bundle is recollimated — parallel out for a relaxed eye",
    "It minimizes chromatic aberration of the pair",
    "So the eyepiece magnifies the objective's focal length",
]
answer = 1
explanation = "Parallel bundles from a distant object focus at the objective's back focal plane; the eyepiece emits collimated light only when its object sits in its front focal plane. Sharing that plane (d = f_o + f_e) makes the system afocal: zero power, image at infinity, unaccommodated eye."

[widgets."com.github.richbai90.optics.telescopes.quiz2"]
question = "A telescope has zero optical power. In what sense does it magnify at all?"
options = [
    "It doesn't — 'magnifying power' is just marketing",
    "It magnifies angles: each incoming bundle is redirected by a factor −f_o/f_e, so the retinal image of the scene is enlarged",
    "It magnifies the physical size of the intermediate image, which is what matters",
    "It magnifies the wavelength of the light",
]
answer = 1
explanation = "The objective forms a real intermediate image that is *smaller* than the scene. What the afocal system scales is ray angles: an incoming bundle at angle α leaves at −(f_o/f_e)α. The eye then converts those larger angles into a larger retinal image. The telescope's intermediate image is demagnified — the magnification is angular."

[widgets."com.github.richbai90.optics.telescopes.card-afocal"]
front = "Afocal system"
back = "Parallel rays in → parallel rays out (matrix power C = 0; d = f_o + f_e for two positive lenses). No focal length, but angular magnifying power M = −f_o/f_e. Telescope geometry."

[widgets."com.github.richbai90.optics.telescopes.card-cassegrain"]
front = "Cassegrain reflector"
back = "Concave primary + convex secondary reflecting light back through a hole in the primary. Compact tube; the mirror pair extends the effective focal length. Most large telescopes (including Hubble) use it."

[widgets."com.github.richbai90.optics.telescopes.quiz3"]
question = "Large research telescopes are reflectors rather than refractors. Which set of reasons is correct?"
options = [
    "Mirrors are cheaper to grind per square meter and need no coating",
    "Reflection is achromatic; the substrate is supported over its back (no sag); and no glass sits in the light path (no absorption)",
    "Mirrors cannot suffer spherical aberration, lenses always do",
    "Reflectors give upright images; refractors invert",
]
answer = 1
explanation = "Three walls kill large refractors: chromatic aberration of thick glass, absorption in it, and lenses sagging under their own weight — supported only at the rim. Mirrors dodge all three (reflection has no wavelength dependence; the substrate is backed; no transmission). Mirrors do have aberrations — hence parabolic primaries and Schmidt corrector plates."


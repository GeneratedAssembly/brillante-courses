# ---------------------------------------------------------------------------
# Lesson 36 — Shift Invariance, Transfer Functions, and the Talbot Effect (36-transfer-functions.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.optics.transfer-functions.math-convolution"]
type = "math"
label = "Shift-invariant imaging is convolution"
tex = "I_{img}(x) = \\left(I_{obj} * h\\right)(x)"
definitions = [
    { symbol = "h", meaning = "the point-spread function: the image of one point — for a circular aperture, the Airy disk and its rings", link = "/course/optics/fraunhofer-fourier#the-circular-aperture-the-airy-disk" },
    { symbol = "*", meaning = "convolution: the image is the sum of shifted copies of h, one per object point" },
    { symbol = "shift invariance", meaning = "the same h everywhere in the field — broken slowly by off-axis aberrations", link = "/course/optics/astigmatism-field-curvature-distortion" },
]

[widgets."com.github.richbai90.optics.transfer-functions.math-otf"]
type = "math"
label = "The optical transfer function"
tex = "\\mathrm{OTF}(\\nu) = \\frac{P \\star P}{\\text{pupil area}}, \\qquad \\nu_{max} = \\frac{2\\,\\mathrm{NA}}{\\lambda}"
definitions = [
    { symbol = "OTF", meaning = "the Fourier transform of the PSF — for a diffraction-limited system, the normalized autocorrelation of the pupil" },
    { symbol = "P ⋆ P", meaning = "pupil overlapped with its own shift; the overlap fraction falls with frequency, giving the ramp" },
    { symbol = "ν_max", meaning = "incoherent cutoff: 2NA/λ — 365 cycles/mm at NA = 0.1, λ = 550 nm; H(ν_max/2) = 0.391" },
]

[widgets."com.github.richbai90.optics.transfer-functions.plot-otf"]
type = "plot"
title = "Diffraction-limited transfer functions (normalized to each cutoff)"
xlabel = "spatial frequency / cutoff"
ylabel = "transfer"
series = [
    { name = "incoherent (ramp to 2NA/λ)", color = "#0d9488", points = [[0.0, 1.0], [0.1, 0.8729], [0.2, 0.7471], [0.3, 0.6238], [0.4, 0.5046], [0.5, 0.391], [0.6, 0.2848], [0.7, 0.1881], [0.8, 0.1041], [0.9, 0.0374], [1.0, 0.0]] },
    { name = "coherent (flat to NA/λ)", color = "#6366f1", points = [[0.0, 1.0], [0.99, 1.0], [1.0, 0.0], [1.0, 0.0]] },
]

[widgets."com.github.richbai90.optics.transfer-functions.math-talbot"]
type = "math"
label = "The Talbot distance"
tex = "z_T = \\frac{2 d^2}{\\lambda}"
definitions = [
    { symbol = "d", meaning = "grating period" },
    { symbol = "order lag", meaning = "the m-th diffraction order lags zero by πzm²λ/d²; self-image when every lag is a full cycle" },
    { symbol = "half-Talbot", meaning = "at z_T/2 the pattern reappears contrast-reversed and shifted half a period" },
    { symbol = "numbers", meaning = "d = 10 µm at 550 nm: z_T = 0.364 mm; d = 20 µm: 1.455 mm (scales as d²)" },
]

[widgets."com.github.richbai90.optics.transfer-functions.quiz1"]
type = "quiz"
question = "Why is the incoherent point-spread function an intensity pattern (Airy) while the coherent one is an amplitude transform?"
options = [
    "Coherent light is always weaker",
    "Incoherent sources add intensities point by point; coherent sources add amplitudes across the pupil, and the detector's square happens afterward",
    "The pupil works differently in the two cases",
    "Diffraction only acts on incoherent light",
]
answer = 1
explanation = "Linearity moves: incoherent imaging is linear in intensity (sum of |h|² shifted), coherent imaging linear in amplitude (sum of h shifted, squared at the detector). The same aperture, two different convolutions — the whole coherent/incoherent distinction in one sentence."

[widgets."com.github.richbai90.optics.transfer-functions.quiz2"]
type = "quiz"
question = "Incoherent imaging's cutoff (2NA/λ) is twice the coherent one (NA/λ). Is incoherent imaging therefore always the sharper mode?"
options = [
    "Yes — doubled cutoff, doubled detail",
    "No — the incoherent ramp sags (0.39 at midband) while the coherent response stays flat to its cutoff; low-contrast fine detail can favor coherent imaging",
    "No — both cutoffs are identical in absolute units",
    "Yes, but only for self-luminous objects",
]
answer = 1
explanation = "Bandwidth is not contrast. The coherent response is unity until NA/λ then dies; the incoherent MTF is 0.39 by its midband. High-frequency, low-contrast structure may survive coherently what the incoherent ramp has already faded — resolution criteria must name their contrast."

[widgets."com.github.richbai90.optics.transfer-functions.quiz3"]
type = "quiz"
question = "A 20 µm-period amplitude grating is lit by collimated 550 nm light. Where does it form its first sharp self-image?"
options = [
    "0.36 mm — one Talbot distance for a 10 µm grating",
    "0.73 mm — the half-Talbot contrast-reversal plane",
    "1.45 mm — z_T = 2d²/λ",
    "2.91 mm — twice the Talbot distance",
]
answer = 2
explanation = "z_T = 2d²/λ = 2 × (2×10⁻⁵)²/5.5×10⁻⁷ = 1.45 mm. The half-Talbot plane at 0.73 mm shows the grating contrast-reversed; full self-images repeat every z_T. (0.36 mm belongs to a 10 µm period — the d² scaling punishes guesswork.)"

[widgets."com.github.richbai90.optics.transfer-functions.card-otf"]
type = "flashcard"
front = "Define the OTF and its cutoff."
back = "OTF = FT of the PSF = normalized pupil autocorrelation. Incoherent cutoff 2NA/λ with a ramp that sags to 0.39 at midband; MTF = |OTF|. Detail beyond the cutoff is absent from the image, not merely soft."

[widgets."com.github.richbai90.optics.transfer-functions.card-talbot"]
type = "flashcard"
front = "What is the Talbot effect?"
back = "A periodic object self-images in free space at z_T = 2d²/λ, with contrast-reversed half-images at z_T/2. A 10 µm grating at 550 nm: self-image every 0.36 mm. It is the object's diffraction orders rephasing — imaging without a lens."

# ---------------------------------------------------------------------------
# Lesson 37 — Coherent and Incoherent Imaging (37-coherent-incoherent-imaging.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.optics.coherent-incoherent-imaging.math-incoherent"]
type = "math"
label = "Incoherent imaging: linear in intensity"
tex = "I_{img} = I_{obj} * \\left|h\\right|^2, \\qquad \\nu_{max} = \\frac{2\\,\\mathrm{NA}}{\\lambda}"
definitions = [
    { symbol = "|h|²", meaning = "the intensity PSF — Airy disk for a circular aperture", link = "/course/optics/fraunhofer-fourier#the-circular-aperture-the-airy-disk" },
    { symbol = "ν_max", meaning = "twice the coherent cutoff, carried by the pupil autocorrelation ramp", link = "/course/optics/transfer-functions#the-optical-transfer-function" },
]

[widgets."com.github.richbai90.optics.coherent-incoherent-imaging.math-coherent"]
type = "math"
label = "Coherent imaging: linear in amplitude"
tex = "I_{img} = \\left|\\,P(\\nu)\\,U_{obj}(\\nu)\\,\\right|^2, \\qquad \\nu_{max} = \\frac{\\mathrm{NA}}{\\lambda}"
definitions = [
    { symbol = "P(ν)", meaning = "the pupil as a hard low-pass on amplitudes — the frequency-plane filter", link = "/course/optics/spatial-filtering#the-frequency-plane" },
    { symbol = "square at the end", meaning = "interference between neighboring object points survives until the detector squares — ringing, speckle, phase sensitivity follow" },
]

[widgets."com.github.richbai90.optics.coherent-incoherent-imaging.plot-otfs"]
type = "plot"
title = "Transfer functions on one axis (units of the coherent cutoff NA/λ)"
xlabel = "spatial frequency (× NA/λ)"
ylabel = "transfer"
series = [
    { name = "incoherent (pupil autocorrelation)", color = "#0d9488", points = [[0.0, 1.0], [0.2, 0.873], [0.4, 0.747], [0.6, 0.624], [0.8, 0.505], [1.0, 0.391], [1.2, 0.285], [1.4, 0.188], [1.6, 0.104], [1.8, 0.037], [2.0, 0.0]] },
    { name = "coherent (pupil low-pass)", color = "#6366f1", points = [[0.0, 1.0], [0.99, 1.0], [1.0, 0.0]] },
]

[widgets."com.github.richbai90.optics.coherent-incoherent-imaging.quiz1"]
type = "quiz"
question = "Why does the incoherent cutoff reach twice the coherent one?"
options = [
    "Incoherent light travels faster",
    "The incoherent OTF is the pupil's autocorrelation, whose footprint spans twice the pupil diameter — twice the frequency reach",
    "Coherent light is absorbed at high frequencies",
    "It does not; both cut off at NA/λ",
]
answer = 1
explanation = "The OTF is the pupil overlapped with its shifted self; the overlap survives until the shift reaches two pupil diameters — giving 2NA/λ against the coherent pupil's flat passband out to NA/λ. Bandwidth doubles; the ramp, though, sags early."

[widgets."com.github.richbai90.optics.coherent-incoherent-imaging.quiz2"]
type = "quiz"
question = "Laser light scattered from a rough wall looks grainy (speckle). The grain's characteristic size scales as:"
options = [
    "λ/NA — the interference cell set by the collection cone",
    "The wall's roughness height",
    "The laser's coherence length",
    "The spot's total power",
]
answer = 0
explanation = "Rough-surface points scatter with path-dependent phases; the resulting interference pattern has correlation cells of angular width λ/D, which back-propagates to λ/NA at the surface. Narrow the aperture and the grains coarsen — speckle is the coherent mode's signature texture."

[widgets."com.github.richbai90.optics.coherent-incoherent-imaging.quiz3"]
type = "quiz"
question = "Why does Köhler illumination image the *source* into the objective's pupil rather than onto the object?"
options = [
    "To save lamp power",
    "So every object point is lit by the full condenser cone — uniform illumination whose coherence the condenser NA dials",
    "To keep the source cool",
    "Because the object would otherwise melt",
]
answer = 1
explanation = "Imaging the source onto the object would print the lamp's filament structure on the scene and tie coherence to source structure. Köhler's arrangement decouples them: the condenser cone (its NA relative to the objective's) sets how coherently each point is lit, smoothly between the two imaging modes."

[widgets."com.github.richbai90.optics.coherent-incoherent-imaging.card-modes"]
type = "flashcard"
front = "Contrast the two imaging modes in one breath."
back = "Incoherent: linear in intensity, image = object convolved with |h|², cutoff 2NA/λ, gentle ramp, rings little. Coherent: linear in amplitude, pupil low-pass at NA/λ, squared at the detector — neighboring points interfere: ringing, speckle, phase sensitivity."

[widgets."com.github.richbai90.optics.coherent-incoherent-imaging.card-kohler"]
type = "flashcard"
front = "What does Köhler illumination buy?"
back = "Source imaged into the pupil, not onto the object: uniform lighting of every point from the full condenser cone, with the condenser NA acting as a coherence dial between the two imaging modes."

# ---------------------------------------------------------------------------
# Lesson 38 — The Space-Bandwidth Product (38-space-bandwidth.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.optics.space-bandwidth.math-sbp"]
type = "math"
label = "The space-bandwidth product"
tex = "N_{dof} = A_{field} \\times (2\\nu_{max})^2, \\qquad 2\\nu_{max} = \\frac{2}{\\lambda N}"
definitions = [
    { symbol = "N_dof", meaning = "countable degrees of freedom — the pixels the optics can actually deliver" },
    { symbol = "A_field", meaning = "image field area; each dimension carries 2ν_max countable cycles" },
    { symbol = "2ν_max", meaning = "two-sided incoherent cutoff: 455 cycles/mm at f/8, 1299 at f/2.8 (λ = 550 nm)" },
]

[widgets."com.github.richbai90.optics.space-bandwidth.int-sbp"]
type = "interactive"
expression = "field * 2 / (0.00055 * x)"
domain = [1.4, 16]
ydomain = [0, 115000]
title = "Countable pixels across the field: 2ν_c = 2/(λN), λ = 550 nm — drag f-number and field"
xlabel = "f-number N"
ylabel = "pixels across the field"
readout = "f/{x:0.1f} → {y:0.0f} pixels across"
parameters = [
    { name = "field", label = "field width (mm)", min = 6, max = 43.3, step = 0.1, initial = 36 },
]

[widgets."com.github.richbai90.optics.space-bandwidth.math-nyquist"]
type = "math"
label = "Matching lens to sensor"
tex = "\\nu_c = \\frac{1}{\\lambda N} = \\frac{1}{2p} \\quad\\Longrightarrow\\quad N = \\frac{2p}{\\lambda}"
definitions = [
    { symbol = "p", meaning = "pixel pitch; a 4 µm-pixel sensor resolves up to 1/(2p) = 125 cycles/mm" },
    { symbol = "N = 2p/λ", meaning = "the diffraction-limited aperture: f/14.5 for 4 µm pixels at 550 nm — past it, stopping down only softens" },
]

[widgets."com.github.richbai90.optics.space-bandwidth.quiz1"]
type = "quiz"
question = "A full-frame camera (8640 pixels across 36 mm) shoots at f/8 with λ = 550 nm. How many countable pixels does the lens deliver across?"
options = [
    "4320 — the sensor is oversampling",
    "8640 — lenses and sensors match at f/8",
    "16,364 — the lens outruns the sensor by ~1.9×",
    "46,753",
]
answer = 2
explanation = "2ν_c = 2/(λN) = 2/(0.00055 × 8) = 455 cycles/mm; × 36 mm = 16,364 countable pixels per row versus the sensor's 8640. (46,753 is the f/2.8 number — wide open, five sensor pixels per countable pixel.)"

[widgets."com.github.richbai90.optics.space-bandwidth.quiz2"]
type = "quiz"
question = "Past roughly what f-number does a 4 µm-pixel camera soften by diffraction alone?"
options = [
    "f/3.6",
    "f/8",
    "f/14.5 — where the diffraction cutoff meets the sensor's Nyquist frequency",
    "f/22.7",
]
answer = 2
explanation = "Match ν_c = 1/(λN) to 1/(2p): N = 2p/λ = 8/0.55 = 14.5. Beyond it the Airy spot outgrows the pixel and no amount of stopping down sharpens anything — the f/11–f/16 band camera reviews quote."

[widgets."com.github.richbai90.optics.space-bandwidth.quiz3"]
type = "quiz"
question = "Why can't a magnifier increase the space-bandwidth product of an image?"
options = [
    "Glass absorbs information",
    "Magnifying space shrinks the bandwidth by the same factor — the product is invariant (the Lagrange invariant in information clothing)",
    "Magnifiers add aberrations that cancel the gain",
    "It can, but only in blue light",
]
answer = 1
explanation = "Stretching the image by m divides spatial frequencies by m; the count is conserved. Creating information requires raising the numerical aperture (the Lagrange invariant's ε₀), which is why microscope objectives are fat, close, and expensive."

[widgets."com.github.richbai90.optics.space-bandwidth.card-sbp"]
type = "flashcard"
front = "Define the space-bandwidth product."
back = "N_dof = field area × (2ν_max)² with 2ν_max = 2/λN. Full frame at f/8, 550 nm: 455 cycles/mm → 16,364 countable pixels across versus the sensor's 8640 — the lens outruns the sensor."

[widgets."com.github.richbai90.optics.space-bandwidth.card-pixelmatching"]
type = "flashcard"
front = "What aperture matches a lens to its sensor?"
back = "Set the diffraction cutoff ν_c = 1/(λN) equal to the sensor Nyquist 1/(2p): N = 2p/λ — f/14.5 for 4 µm pixels at 550 nm. Past it, diffraction softens pixels; before it, pixels waste lens."

# ---------------------------------------------------------------------------
# Lesson 39 — Resolution and Depth of Focus (39-resolution-defocus.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.optics.resolution-defocus.math-rayleigh"]
type = "math"
label = "The Rayleigh criteria"
tex = "\\theta_{min} = 1.22\\,\\frac{\\lambda}{D}, \\qquad \\delta_{min} = \\frac{0.61\\,\\lambda}{\\mathrm{NA}}"
definitions = [
    { symbol = "θ_min", meaning = "angular resolution of an aperture D: 27.7 arcsec (5 mm eye), 0.017 arcsec (8 m telescope), at 550 nm" },
    { symbol = "δ_min", meaning = "lateral two-point resolution of a microscope objective: 0.61λ/NA — 0.24 µm at NA 1.4" },
    { symbol = "criterion", meaning = "one Airy peak on the other's first zero; Sparrow's criterion (flattest sum) lands nearby" },
]

[widgets."com.github.richbai90.optics.resolution-defocus.plot-rayleigh"]
type = "plot"
title = "Rayleigh resolution versus aperture (λ = 550 nm)"
xlabel = "aperture diameter D (mm)"
ylabel = "resolution (arcsec)"
series = [
    { name = "1.22λ/D", color = "#0d9488", points = [[1, 138.4], [5, 27.7], [10, 13.8], [50, 2.77], [100, 1.38], [200, 0.69]] },
]

[widgets."com.github.richbai90.optics.resolution-defocus.int-defocus"]
type = "interactive"
expression = "diam * abs(x) / foc"
domain = [0, 2]
ydomain = [0, 0.3]
title = "Geometric defocus blur ⌀ = D·δz/f — drag aperture and focal length"
xlabel = "sensor displacement δz (mm)"
ylabel = "blur diameter (mm)"
readout = "δz = {x:0.2f} mm → blur ⌀ = {y:0.3f} mm"
parameters = [
    { name = "diam", label = "aperture diameter D (mm)", min = 2, max = 40, step = 0.5, initial = 12.5 },
    { name = "foc", label = "focal length f (mm)", min = 20, max = 200, step = 1, initial = 50 },
]

[widgets."com.github.richbai90.optics.resolution-defocus.math-dof"]
type = "math"
label = "Depth of focus (λ/4 criterion)"
tex = "\\Delta z_{\\pm} \\approx 2\\lambda N^2"
definitions = [
    { symbol = "N", meaning = "f-number; ±2λN² is the displacement holding defocus PV under λ/4 — ±70 µm at f/8, ±282 µm at f/16 (550 nm)" },
    { symbol = "crossover", meaning = "geometric blur D·δz/f meets the Airy diameter 2.44λN at δz ≈ 2.9λN³/f — ±11 µm (f/2.8), ±86 µm (f/8) for a 50 mm lens" },
    { symbol = "hyperfocal", meaning = "H = f²/(Nc): focus there and H/2 → ∞ is inside the blur budget; 10.4 m for 50 mm at f/8, c = 30 µm" },
]

[widgets."com.github.richbai90.optics.resolution-defocus.quiz1"]
type = "quiz"
question = "An oil-immersion microscope objective (NA = 1.4) at λ = 550 nm. The closest resolvable point pair is about:"
options = [
    "0.24 µm — δ = 0.61λ/NA",
    "0.48 µm — one Airy diameter",
    "0.79 µm — 1.22λ/D with D = 1 mm",
    "1.34 µm — limited by the eyepiece",
]
answer = 0
explanation = "The lateral two-point resolution is 0.61λ/NA = 0.61 × 550/1400 = 0.24 µm. No eyepiece magnification changes it — the objective's NA set the ceiling when it collected the orders, which is the microscope-resolution promise kept."

[widgets."com.github.richbai90.optics.resolution-defocus.quiz2"]
type = "quiz"
question = "For a 50 mm lens, the defocus at which geometric blur equals the diffraction spot moves from wide open to f/8. The pair is:"
options = [
    "±11 µm (f/2.8) → ±86 µm (f/8)",
    "±70 µm (f/2.8) → ±282 µm (f/8)",
    "±1.1 mm (f/2.8) → ±8.6 mm (f/8)",
    "It does not move — the crossover is focus-independent",
]
answer = 0
explanation = "The crossover sits where D·δz/f = 2.44λN, giving δz ≈ 2.9λN³/f: at f/2.8 (D = 17.9 mm) about ±11 µm; at f/8 (D = 6.25 mm) about ±86 µm. Wide open, focus is micrometer-critical; stopped down, the diffraction floor tolerates nearly a tenth of a millimeter. (±70/±282 µm are the λ/4 DOF numbers.)"

[widgets."com.github.richbai90.optics.resolution-defocus.quiz3"]
type = "quiz"
question = "Why does the sharpest camera aperture sit two to three stops down from wide open?"
options = [
    "Sensors respond best to mid apertures",
    "Aberrations fall steeply with aperture (y², y³ scalings) while diffraction grows only as N — the blur sources equalize a few stops down",
    "Shutters are mechanically happiest mid-range",
    "Vignetting improves at mid apertures",
]
answer = 1
explanation = "Wide open, aberration blur (spherical ∝ y², coma ∝ y²·θ — the aberrations section's scalings) dominates; the crossover with the Airy diameter 2.44λN defines the best aperture. Stop further and diffraction — the floor nothing removes — takes over."

[widgets."com.github.richbai90.optics.resolution-defocus.card-rayleigh"]
type = "flashcard"
front = "State the two Rayleigh resolutions."
back = "Angular: θ = 1.22λ/D — 27.7 arcsec for the eye, 0.017 for an 8 m telescope. Microscope lateral: δ = 0.61λ/NA — 0.24 µm at NA 1.4. Magnification cannot beat either; the NA set the ceiling."

[widgets."com.github.richbai90.optics.resolution-defocus.card-dof"]
type = "flashcard"
front = "Give the depth-of-focus and hyperfocal formulas."
back = "DOF ±2λN² (λ/4 criterion): ±70 µm at f/8, 550 nm. The geometric/diffraction crossover: D·δz/f = 2.44λN. Hyperfocal H = f²/(Nc): 10.4 m for 50 mm, f/8, c = 30 µm."

# ---------------------------------------------------------------------------
# Lesson 40 — Wave Plates and Polarization Effects (40-polarization-wave-plates.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.optics.polarization-wave-plates.math-retardance"]
type = "math"
label = "Retardance of a birefringent plate"
tex = "\\delta = \\frac{2\\pi\\,\\Delta n\\,t}{\\lambda}, \\qquad t_{\\lambda/4} = \\frac{\\lambda}{4\\,\\Delta n}"
definitions = [
    { symbol = "Δn", meaning = "birefringence: quartz 0.0092, calcite 0.17 — thickness sets the phase delay between axes" },
    { symbol = "t_λ/4", meaning = "zero-order quarter-wave thickness: 14.9 µm of quartz at 550 nm, 10.9 µm at 400 nm" },
    { symbol = "zero-order pair", meaning = "two multiple-order plates crossed, subtracting to a net quarter wave — broadband where a single thick plate is not" },
]

[widgets."com.github.richbai90.optics.polarization-wave-plates.int-retardance"]
type = "interactive"
expression = "2 * pi * dn * x / lam"
domain = [0, 60]
ydomain = [0, 25]
title = "Retardance δ = 2πΔn·t/λ — drag Δn and λ (quartz Δn = 0.0092 default)"
xlabel = "plate thickness t (µm)"
ylabel = "retardance δ (rad)"
readout = "t = {x:0.1f} µm → δ = {y:0.2f} rad"
parameters = [
    { name = "dn", label = "birefringence Δn", min = 0.002, max = 0.02, step = 0.001, initial = 0.0092 },
    { name = "lam", label = "wavelength λ (µm)", min = 0.4, max = 0.7, step = 0.01, initial = 0.55 },
]

[widgets."com.github.richbai90.optics.polarization-wave-plates.quiz1"]
type = "quiz"
question = "A zero-order quartz quarter-wave plate is 14.9 µm thick at 550 nm. For 400 nm, the zero-order quarter-wave thickness is:"
options = [
    "The same — retardance is set by thickness alone",
    "10.9 µm — the thickness scales with wavelength",
    "21.7 µm — shorter waves need more glass",
    "29.9 µm — double for the shorter wavelength",
]
answer = 1
explanation = "t_λ/4 = λ/(4Δn): the required thickness scales linearly with wavelength — 400/550 × 14.9 = 10.9 µm. This wavelength dependence is exactly why single thick (multiple-order) plates drift out of quarter-wave away from design, and why zero-order pairs exist."

[widgets."com.github.richbai90.optics.polarization-wave-plates.quiz2"]
type = "quiz"
question = "Linear polarization enters a half-wave plate with its axis at angle θ to the plate's fast axis. What exits?"
options = [
    "Circular polarization",
    "Linear polarization rotated by 2θ",
    "Linear polarization rotated by θ/2",
    "Unpolarized light",
]
answer = 1
explanation = "A half-wave plate flips the sign of the component along its slow axis: decompose, flip, recompose — the polarization reflects about the fast axis, emerging rotated by 2θ. Rotate the plate by α and the beam rotates by 2α: the steering wheel of polarization optics."

[widgets."com.github.richbai90.optics.polarization-wave-plates.quiz3"]
type = "quiz"
question = "Why does polarization aberration grow so sharply in high-NA systems?"
options = [
    "High-NA glass is naturally birefringent",
    "Oblique Fresnel reflections accumulate diattenuation and retardance across surfaces, scaling as NA² — percent-level at NA 0.9",
    "Short focal lengths stress the coating",
    "Polarization only matters in the ultraviolet",
]
answer = 1
explanation = "Every surface's Fresnel coefficients differ slightly for s and p ([the angle behavior](/course/optics/fresnel-equations#reflectance-and-the-4-rule)); at oblique incidence the imbalance grows, and a high-NA train multiplies the effect over many steep surfaces — scaling as NA². Malus-law extinction and image contrast pay the bill."

[widgets."com.github.richbai90.optics.polarization-wave-plates.card-plates"]
type = "flashcard"
front = "How does thickness build a wave plate?"
back = "δ = 2πΔn·t/λ: a quarter-wave plate is λ/(4Δn) thick (quartz: 14.9 µm at 550 nm); a half-wave rotates polarization by 2θ. Zero-order pairs subtract multiple-order thicknesses for broadband retardance."

[widgets."com.github.richbai90.optics.polarization-wave-plates.card-aberrations"]
type = "flashcard"
front = "Where does polarization aberration come from?"
back = "Oblique Fresnel reflections are slightly diattenuating and retarding; the errors accumulate over surfaces as NA². Consequences: contrast leak past crossed polarizers, field-varying polarization, and stress birefringence in molded elements."


description = "The thin-lens equations, derived as a matrix relation (CC BY 4.0)."
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.optics.ray-transfer-matrices.math-vector"]
type = "math"
tex = "\\begin{pmatrix} y \\\\ \\theta \\end{pmatrix}"
label = "The ray vector"
definitions = [
    { symbol = "y", meaning = "signed height of the ray above the optical axis (up = +)", link = "#the-ray-vector-and-the-three-building-blocks" },
    { symbol = "\\theta", meaning = "signed angle of the ray to the axis in radians (upward-sloping = +)", link = "#the-ray-vector-and-the-three-building-blocks" },
]

[widgets."com.github.richbai90.optics.ray-transfer-matrices.math-translation"]
type = "math"
tex = "\\begin{pmatrix} y_2 \\\\ \\theta_2 \\end{pmatrix} = \\begin{pmatrix} 1 & d \\\\ 0 & 1 \\end{pmatrix} \\begin{pmatrix} y_1 \\\\ \\theta_1 \\end{pmatrix}"
label = "Translation through distance d in one medium"
definitions = [
    { symbol = "d", meaning = "axial distance between the two planes (positive, left to right)", link = "#the-ray-vector-and-the-three-building-blocks" },
    { symbol = "y_1,\\; \\theta_1", meaning = "ray height and angle at the first plane", link = "#the-ray-vector-and-the-three-building-blocks" },
]

[widgets."com.github.richbai90.optics.ray-transfer-matrices.math-refraction"]
type = "math"
tex = "\\begin{pmatrix} 1 & 0 \\\\ -\\tfrac{n_2-n_1}{n_2 R} & \\tfrac{n_1}{n_2} \\end{pmatrix}"
label = "Refraction at a spherical surface of radius R (n₁ → n₂)"
definitions = [
    { symbol = "R", meaning = "radius of curvature of the surface (positive if the center of curvature lies to the right)", link = "#the-ray-vector-and-the-three-building-blocks" },
    { symbol = "n_1,\\; n_2", meaning = "indices before and after the surface", link = "/course/optics/light-in-matter#the-index-of-refraction" },
]

[widgets."com.github.richbai90.optics.ray-transfer-matrices.math-thinlens"]
type = "math"
tex = "\\begin{pmatrix} 1 & 0 \\\\ -\\tfrac{1}{f} & 1 \\end{pmatrix}"
label = "Thin lens of focal length f"
definitions = [
    { symbol = "f", meaning = "focal length; f > 0 converging, f < 0 diverging (thin lens in air)", link = "/course/optics/thin-lenses" },
]

[widgets."com.github.richbai90.optics.ray-transfer-matrices.stepper-thinlens"]
type = "stepper"
label = "Deriving the thin-lens equation from matrices"
steps = [
    { title = "Assemble the system", tex = "M = T(s')\\,L\\,T(s)", text = "A ray leaves the object plane, propagates distance s to the lens (T(s)), refracts through the thin lens (L), then propagates s' toward a trial image plane (T(s')).", note = "The first element the ray meets stands rightmost in the product." },
    { title = "Multiply the outer pair", tex = "T(s')\\,L = \\begin{pmatrix} 1-s'/f & s' \\\\ -1/f & 1 \\end{pmatrix}", text = "Multiply the lens matrix by the final translation, right to left." },
    { title = "Complete the product", tex = "M = \\begin{pmatrix} 1-s'/f & s' + s - ss'/f \\\\ -1/f & 1-s/f \\end{pmatrix}", text = "Multiplying by T(s) fills in the B and D entries." },
    { title = "Apply the imaging condition", tex = "B = s' + s - \\tfrac{ss'}{f} = 0", text = "For an image, the output height must not depend on the input angle θ₀ — so B must vanish." },
    { title = "Read off the Gaussian form", tex = "\\frac{1}{s} + \\frac{1}{s'} = \\frac{1}{f}, \\qquad m = A = -\\frac{s'}{s}", text = "Divide B = 0 by ss' to get the thin-lens equation; the diagonal entry A is the magnification, negative for an inverted image.", note = "Same result as the usual lens derivation — but from pure linear algebra." },
]

[widgets."com.github.richbai90.optics.ray-transfer-matrices.math-imaging"]
type = "math"
tex = "B = 0 \\;\\Longrightarrow\\; y_{\\text{img}} = A\\,y_{\\text{obj}}"
label = "The imaging condition"
definitions = [
    { symbol = "B", meaning = "off-diagonal element of the system matrix; B = 0 means all rays from one object point meet at one image point", link = "#reading-images-off-the-matrix" },
    { symbol = "A", meaning = "diagonal element; with B = 0 it is the lateral magnification y_img / y_obj", link = "#reading-images-off-the-matrix" },
]

[widgets."com.github.richbai90.optics.ray-transfer-matrices.int-translation"]
type = "interactive"
expression = "y0 + th * x"
domain = [0, 40]
ydomain = [-8, 8]
title = "Free-space translation of a ray"
xlabel = "distance d (cm)"
ylabel = "ray height y (cm)"
readout = "y({x:0.1f} cm) = {y0:0.2f} + {th:0.3f}·{x:0.1f} = {y:0.2f} cm"
parameters = [
    { name = "y0", label = "initial height y₀ (cm)", min = -5, max = 5, step = 0.1, initial = 2 },
    { name = "th", label = "angle θ (rad)", min = -0.2, max = 0.2, step = 0.005, initial = 0.1 },
]

[widgets."com.github.richbai90.optics.ray-transfer-matrices.quiz1"]
type = "quiz"
question = "A ray meets translation T₁, then a lens L, then translation T₂. The system matrix is…"
options = [
    "T₁ · L · T₂ — written in the order the ray meets them",
    "T₂ · L · T₁ — the product runs opposite to the ray's journey",
    "L · (T₁ + T₂) — translations combine before the lens",
    "The sum T₁ + L + T₂, matrix element by element",
]
answer = 1
explanation = "Each element's matrix multiplies the ray vector from the left as the ray reaches it, so the first element ends up rightmost: M = T₂·L·T₁. Determinant det M = n_first/n_last — 1 in air — a quick arithmetic check."

[widgets."com.github.richbai90.optics.ray-transfer-matrices.quiz2"]
type = "quiz"
question = "A system matrix between two planes has B ≠ 0. Rays leaving one object point…"
options = [
    "still meet at a single image point, just displaced",
    "do not meet at a single point — the output height depends on the input angle θ₀, so the planes are not conjugate",
    "image with magnification A",
    "focus only if C = 0 too",
]
answer = 1
explanation = "y_out = A·y₀ + B·θ₀. A nonzero B mixes input angle into output height, so different rays from the same object point land at different heights — no image. Imaging requires exactly B = 0, with magnification A."

[widgets."com.github.richbai90.optics.ray-transfer-matrices.quiz3"]
type = "quiz"
question = "A system matrix has D = 0. What does that buy you?"
options = [
    "Perfect imaging with unit magnification",
    "An incoming parallel bundle (one θ₀, many y₀) collapses to a single point — a focal plane, the Fourier-transforming geometry",
    "The determinant becomes zero and the system is broken",
    "Nothing — only B matters",
]
answer = 1
explanation = "y_out = A·y₀ + B·θ₀ with B = 0: D = 0 means θ_out doesn't depend on y₀, so an angular bundle focuses to one point (C = 0 analogously). This focal-plane-to-focal-plane property is what makes a lens perform a Fourier transform — the heart of the 4f system."

[widgets."com.github.richbai90.optics.ray-transfer-matrices.card-abcdb"]
type = "flashcard"
front = "Imaging condition (ABCD)"
back = "B = 0 ⟺ object and image planes are conjugate; magnification m = A."

[widgets."com.github.richbai90.optics.ray-transfer-matrices.card-det"]
type = "flashcard"
front = "det of a ray matrix"
back = "det M = n_first/n_last (1 in air). Invariant under cascading — catches sign/typo slips."


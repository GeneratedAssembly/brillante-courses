[widgets."com.github.richbai90.optics.magnifiers-microscopes.quiz2"]
type = "quiz"
question = "In a compound microscope, what does the objective contribute, and what does the eyepiece contribute?"
options = [
    "Both produce virtual images; their magnifications add",
    "The objective forms a real, magnified intermediate image; the eyepiece acts as a simple magnifier on it — magnifications multiply",
    "The eyepiece forms the real image; the objective magnifies it virtually",
    "The objective collects light; the eyepiece does all the magnifying",
]
answer = 1
explanation = "The objective (very short f_o) images the specimen to a real, inverted, enlarged intermediate image — where the field stop sits. The eyepiece then views that image as a magnifying glass (virtual image at infinity for a relaxed eye). Total magnifying power is the product M = (−L/f_o)(25 cm/f_e)."

[widgets."com.github.richbai90.optics.magnifiers-microscopes.card-nearpoint"]
type = "flashcard"
front = "Near point"
back = "The closest object distance at which the unaided eye can still focus: ~25 cm (microscopy's older convention: 254 mm = 10 inches). It sets the unaided-angle baseline for angular magnification — and it lengthens with age."

[widgets."com.github.richbai90.optics.magnifiers-microscopes.card-tube"]
type = "flashcard"
front = "Tube length L"
back = "Distance from the objective's back focal point (BFP) to the eyepiece's front focal point (FFP): standardized at 160 mm. Gives M = (L/f_o)(25 cm/f_e) — why '40× objective × 10× eyepiece = 400×' is interchangeable between microscopes."

[widgets."com.github.richbai90.optics.magnifiers-microscopes.card-eyepiece"]
type = "flashcard"
front = "Eyepiece (ocular) design points"
back = "1) Intermediate image in its front focal plane → collimated output, virtual image at infinity, relaxed eye. 2) Exit pupil at ~10 mm eye relief, where the observer's eye goes — wrong position: black disc or vignetted field."

[widgets."com.github.richbai90.optics.magnifiers-microscopes.quiz3"]
type = "quiz"
question = "What physically stops a compound microscope from useful magnifications of 100 000×?"
options = [
    "Tube lengths would exceed the length of a room",
    "Nothing — with short enough focal lengths it works",
    "Resolution is limited by the wavelength of light; beyond ~1000× you are magnifying blur, and the paraxial/geometric picture itself fails for f → 1 µm lenses",
    "The eyepiece glass would absorb all the light",
]
answer = 2
explanation = "Magnification and resolution are different budgets. Details below roughly a micrometer cannot form usable images regardless of magnification, and a 1-µm focal length demands curvature so strong that diffraction dominates and the paraxial approximation collapses. Practical microscopes saturate near 1000×."


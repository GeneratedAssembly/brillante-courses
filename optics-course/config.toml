title = "Lecture 2: Reflection and refraction; prisms, waveguides, and dispersion"
url = "https://ocw.mit.edu/courses/2-71-optics-spring-2009/resources/lecture-2-reflection-and-refraction-prisms-waveguides-and-dispersion/"
source = "MIT OpenCourseWare"
kind = "video"
description = "The two laws of ray optics derived, demonstrated, and applied to prisms."

[widgets."com.github.richbai90.optics.reflection-and-refraction.link-openstax"]
title = "OpenStax University Physics III, §1.3–1.5 Reflection and Refraction"
url = "https://openstax.org/details/books/university-physics-volume-3"
source = "OpenStax"
kind = "web"
description = "The Law of Reflection, Refraction, and Total Internal Reflection (CC BY 4.0)."
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.optics.reflection-and-refraction.math-snell"]
tex = "n_1 \\sin\\theta_1 \\;=\\; n_2 \\sin\\theta_2"
label = "Snell's law"
definitions = [
    { symbol = "n_1,\\; n_2", meaning = "indices of refraction of the first and second medium", link = "/course/optics/light-in-matter#the-index-of-refraction" },
    { symbol = "\\theta_1", meaning = "angle of incidence, measured from the normal to the interface", link = "#snells-law" },
    { symbol = "\\theta_2", meaning = "angle of the refracted ray, measured from the normal on the far side", link = "#snells-law" },
]

[widgets."com.github.richbai90.optics.reflection-and-refraction.math-critical"]
tex = "\\sin\\theta_c = \\frac{n_2}{n_1} \\quad (n_1 > n_2)"
label = "Critical angle for total internal reflection"
definitions = [
    { symbol = "\\theta_c", meaning = "incidence angle above which no refracted ray exists — all light reflects internally", link = "#total-internal-reflection" },
    { symbol = "n_1,\\; n_2", meaning = "indices of the denser (incident-side) and rarer medium; requires n₁ > n₂", link = "/course/optics/light-in-matter#the-index-of-refraction" },
]

[widgets."com.github.richbai90.optics.reflection-and-refraction.int-snell"]
expression = "n * sin(x)"
domain = [0.0, 1.5708]
ydomain = [0.0, 2.6]
title = "Glass-to-air refraction: sin θ₂ = n · sin θ₁ (n₁ = n, n₂ = 1)"
xlabel = "incidence angle θ₁ (rad)"
ylabel = "sin θ₂"
readout = "θ₁ = {x:0.2f} rad → sin θ₂ = {y:0.3f}"
parameters = [
    { name = "n", label = "glass index n", min = 1.0, max = 2.5, step = 0.01, initial = 1.5 },
]

[widgets."com.github.richbai90.optics.reflection-and-refraction.quiz1"]
question = "A ray crosses from air (n = 1.0) into glass (n = 1.5) at 30° from the normal. What happens to the ray?"
options = [
    "It bends toward the normal, to about 19.5°",
    "It bends away from the normal, to about 48.6°",
    "It continues undeviated, since angles are small",
    "It reflects entirely — glass is denser",
]
answer = 0
explanation = "Snell's law: sin θ₂ = (1.0/1.5)·sin 30° = 0.333 → θ₂ ≈ 19.5°. Entering a denser medium bends the ray toward the normal; leaving it bends away."

[widgets."com.github.richbai90.optics.reflection-and-refraction.quiz2"]
question = "Diamond has n = 2.42, water n = 1.33. Why does a diamond sparkle while a wet street does not?"
options = [
    "Diamond is a crystal, and crystals always sparkle",
    "Diamond's critical angle is ≈ 24°, so light entering a cut stone bounces internally many times before escaping; water's ≈ 49° lets most light leak out",
    "Diamond reflects more light at its front surface",
    "Water absorbs visible light",
]
answer = 1
explanation = "A large n gives a small critical angle (θc = asin(n₂/n₁)): for diamond asin(1/2.42) ≈ 24.4°, so rays are trapped and strike many facets; for water θc ≈ 48.8°, close to where most everyday light already arrives, so it escapes readily."

[widgets."com.github.richbai90.optics.reflection-and-refraction.quiz3"]
question = "TIR prisms are preferred over metal mirrors in binoculars because TIR…"
options = [
    "is cheaper to manufacture than aluminum coating",
    "reflects essentially 100% of the light, while metal mirrors absorb a few percent",
    "inverts the image left-to-right",
    "works at any incidence angle, unlike a mirror",
]
answer = 1
explanation = "Total internal reflection is lossless — no light is transmitted, so reflectivity is exactly 100% for angles beyond θc. Aluminum coatings absorb/scatter a few percent per bounce, which adds up over several folds."

[widgets."com.github.richbai90.optics.reflection-and-refraction.card-snell"]
front = "Snell's law"
back = "n₁ sin θ₁ = n₂ sin θ₂ — angles measured from the normal; path is reversible; entering a denser medium bends toward the normal."

[widgets."com.github.richbai90.optics.reflection-and-refraction.card-tir"]
front = "Total internal reflection"
back = "For n₁ > n₂, rays at incidence angle > θc = asin(n₂/n₁) reflect with 100% efficiency. Fibers, TIR prisms, diamond sparkle."


# ---------------------------------------------------------------------------
# Lesson 27 — Superposition and Huygens' Principle (27-huygens-superposition.md)
# ---------------------------------------------------------------------------

[widgets."com.github.richbai90.optics.huygens-superposition.math-superposition"]
type = "math"
label = "Superposition of fields"
tex = "U = U_1 + U_2, \\qquad I = |U_1 + U_2|^2 = I_1 + I_2 + 2\\,\\operatorname{Re}(U_1^* U_2)"
definitions = [
    { symbol = "U", meaning = "the complex (phasor) field; amplitudes add, intensities do not", link = "/course/optics/wave-equation-phasors#harmonic-waves-and-phasors" },
    { symbol = "2Re(U₁*U₂)", meaning = "the interference cross term — brighter, darker, or nothing, depending on the phase relation", link = "/course/optics/coherence#temporal-coherence-bandwidth-is-forgetfulness" },
]

[widgets."com.github.richbai90.optics.huygens-superposition.stepper-snell"]
type = "stepper"
label = "Deriving Snell's law from Huygens' wavelets"
steps = [
    { title = "A plane wavefront meets the interface", tex = "\\theta_1 = \\angle(\\text{ray},\\ \\text{normal})", text = "A plane wavefront (perpendicular to the rays) approaches at incidence angle θ₁. Point A of the wavefront touches the interface first.", note = "Wavefront and rays stay perpendicular throughout." },
    { title = "While the rest crosses", tex = "t = \\frac{\\overline{BC}}{v_1}", text = "In the time the far end B of the wavefront travels BC at the faster speed v₁, the secondary wavelet from A spreads into medium 2." },
    { title = "The wavelet's smaller radius", tex = "r = v_2 t = \\overline{BC}\\cdot\\frac{v_2}{v_1}", text = "The wavelet propagates at the slower speed v₂, so its radius lags the incident advance." },
    { title = "Tangent-plane geometry", tex = "\\sin\\theta_2 = \\frac{r}{\\overline{AC}} = \\frac{\\overline{BC}}{\\overline{AC}}\\cdot\\frac{v_2}{v_1}", text = "The new wavefront is the tangent plane from C to the sphere — and the same right-triangle legs that give sin θ₁ give sin θ₂." },
    { title = "Snell's law in wave clothing", tex = "\\frac{\\sin\\theta_1}{v_1} = \\frac{\\sin\\theta_2}{v_2} \\;\\Longleftrightarrow\\; n_1\\sin\\theta_1 = n_2\\sin\\theta_2", text = "With v = c/n the construction is exactly Snell's law. Verified example: n₁ = 1 → n₂ = 1.5 at θ₁ = 45° gives θ₂ = 28.1°.", note = "Rays bend toward the normal entering a slower medium because the wavelets crowd together." },
]

[widgets."com.github.richbai90.optics.huygens-superposition.quiz1"]
type = "quiz"
question = "Two beams overlap on a detector. When does the interference cross term contribute to the time-averaged signal?"
options = [
    "Always — overlapping light always interferes",
    "Only when the beams keep a fixed phase relation over the detector's averaging time",
    "Only when the beams have equal intensities",
    "Only when the beams are orthogonally polarized",
]
answer = 1
explanation = "The cross term 2Re(U₁*U₂) oscillates at the beat frequency of the two fields. Any detector averages over far longer than an optical cycle, so a wandering relative phase averages the term to zero — leaving intensities to add. Fixed phase relation (coherence) is the precondition, not equal intensity."

[widgets."com.github.richbai90.optics.huygens-superposition.quiz2"]
type = "quiz"
question = "In Huygens' construction of refraction, what geometric object plays the role Snell's law plays in ray optics?"
options = [
    "The ray normal to the tangent wavelet",
    "The tangent plane to the family of secondary wavelets",
    "The arc length of the incident wavefront",
    "The line joining the source to the point of incidence",
]
answer = 1
explanation = "Each point of the wavefront sprouts a wavelet at the local speed; the surface tangent to all of them is the next wavefront, and its tilt against the interface — built from the speed ratio v₂/v₁ — is exactly sinθ₁/v₁ = sinθ₂/v₂."

[widgets."com.github.richbai90.optics.huygens-superposition.quiz3"]
type = "quiz"
question = "Two separate laser pointers overlap on a wall, yet no fringes appear. Why?"
options = [
    "Laser light is too monochromatic to interfere",
    "The two beams are orthogonally polarized by chance",
    "Independent sources carry no fixed mutual phase — the cross term averages away",
    "The wall is too rough; fringes need a mirror",
]
answer = 2
explanation = "Interference needs a fixed phase relation, and nothing couples the two pointers' oscillators: each lases independently. Even spatial overlap cannot rescue them. The remedy — derive both beams from one wavefront — is the whole art of interferometer design; coherence is quantified in a dedicated lesson."

[widgets."com.github.richbai90.optics.huygens-superposition.card-superposition"]
type = "flashcard"
front = "What does superposition say about intensities?"
back = "Nothing — superposition is about fields. Amplitudes add as phasors; intensity |U₁+U₂|² carries a cross term that can brighten, darken, or (for unrelated beams, after averaging) vanish. Intensities add only when coherence is absent."

[widgets."com.github.richbai90.optics.huygens-superposition.card-huygens"]
type = "flashcard"
front = "State Huygens' principle, and what Kirchhoff added."
back = "Every point of a wavefront is a source of spherical secondary wavelets; the next wavefront is their tangent envelope. Kirchhoff derived the construction from the wave equation and fixed the obliquity factor (1+cosθ)/2 — forward-biased, zero backward — turning a postulate into a theorem."


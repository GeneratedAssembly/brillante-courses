[widgets."com.github.richbai90.optics.stops-pupils.stepper-trace"]
label = "Tracing the two canonical rays through a stopped system"
steps = [
    { title = "Pick the object point", text = "An off-axis object point sends a diverging cone toward the system. Two members of that cone tell the whole story.", note = "Both rays must clear every element to reach the image." },
    { title = "Chief ray enters through the entrance pupil center", tex = "\\text{C.R.: } \\text{EP center} \\to \\text{AP center} \\to \\text{XP center}", text = "The chief ray aims at the center of the entrance pupil — which is the image of the aperture stop through the front elements — so it crosses the physical stop's center by construction." },
    { title = "Chief ray is cropped by the field stop", text = "Only chief rays within the field of view pass through the edges of the field stop; the field stop is where the chief ray can be cut off.", note = "This is what limits the scene, not the brightness." },
    { title = "Marginal ray grazes the aperture stop rim", tex = "\\text{M.R.: } \\text{EP rim} \\to \\text{AP rim} \\to \\text{XP rim}", text = "The marginal ray is the last ray that just clears the aperture stop; it sets the acceptance angle and hence the numerical aperture." },
    { title = "Both rays reconverge at the image point", text = "Since both are ordinary members of the object point's ray bundle, imaging brings them back together at the image — crossing every conjugate plane (stop, pupils, windows) at center or rim in between." },
]

[widgets."com.github.richbai90.optics.stops-pupils.math-exitpupil"]
tex = "\\frac{1}{z} + \\frac{1}{z'} = \\frac{1}{f} \\quad\\Longrightarrow\\quad z' = \\frac{f\\,z}{z - f}"
label = "Exit pupil of the single-lens camera"
definitions = [
    { symbol = "z", meaning = "distance from the aperture stop to the lens, measured toward the scene; here the stop sits between front focus and lens, so z < f", link = "#a-camera-worked-through" },
    { symbol = "z'", meaning = "exit-pupil position measured from the lens toward the image; z' < 0 means the exit pupil is virtual, in front of the lens", link = "#a-camera-worked-through" },
    { symbol = "f", meaning = "focal length of the camera lens", link = "/course/optics/thin-lenses#the-thin-lens-equation" },
]

[widgets."com.github.richbai90.optics.stops-pupils.int-exitpupil"]
expression = "(f * x) / (x - f)"
domain = [0.2, 10]
ydomain = [-20, 20]
title = "Exit-pupil position z′ vs stop position z (camera lens)"
xlabel = "stop-to-lens distance z (cm)"
ylabel = "exit-pupil position z′ (cm)"
readout = "z = {x:0.2f} cm → z′ = {y:0.2f} cm"
parameters = [
    { name = "f", label = "focal length f (cm)", min = 1, max = 3, step = 0.1, initial = 2 },
]

[widgets."com.github.richbai90.optics.stops-pupils.math-na"]
tex = "\\mathrm{NA} = n \\sin\\theta, \\qquad f/\\# \\;\\approx\\; \\frac{1}{2\\,\\mathrm{NA}} = \\frac{f}{D}"
label = "Numerical aperture and f-number (paraxial)"
definitions = [
    { symbol = "n", meaning = "refractive index of the object-space medium (air ≈ 1; immersion oil ≈ 1.5)", link = "/course/optics/light-in-matter#the-index-of-refraction" },
    { symbol = "\\theta", meaning = "half-angle subtended at the on-axis object point by the rim of the aperture stop", link = "#the-aperture-stop" },
    { symbol = "D", meaning = "diameter of the entrance pupil (paraxial); f/8 means f/# = 8", link = "#entrance-and-exit-pupils" },
]

[widgets."com.github.richbai90.optics.stops-pupils.quiz1"]
question = "How do you find the aperture stop of a system for an on-axis object point?"
options = [
    "It is always the smallest physical hole in the system",
    "Image every element's rim into object space; the one whose image subtends the smallest half-angle at the object is the aperture stop",
    "It is always the front element of the lens",
    "It is whichever element the designer labeled the iris",
]
answer = 1
explanation = "The aperture stop is the element that limits the acceptance angle — equivalent to the element whose rim, as seen (imaged) from the object side, subtends the smallest angle at the on-axis object. The role is a property of the whole system and the object position, not of any single physical part."

[widgets."com.github.richbai90.optics.stops-pupils.quiz2"]
question = "An objective works in immersion oil (n = 1.5) with an acceptance half-angle of 60°. Its numerical aperture is closest to…"
options = [
    "0.87 — NA = sin 60° in air, and oil only changes the wavelength",
    "1.30 — NA = n sin θ = 1.5 × 0.866",
    "1.50 — NA equals the oil index at this angle",
    "0.60 — NA is the angle itself in radians",
]
answer = 1
explanation = "NA = n sin θ = 1.5 × sin 60° ≈ 1.30. This is exactly why immersion exists: the index multiplies the sine, letting NA exceed 1 — impossible in air (n = 1). High NA means more admitted light and finer resolution."

[widgets."com.github.richbai90.optics.stops-pupils.quiz3"]
question = "A camera image is bright at the center and noticeably darker toward the corners. What is happening?"
options = [
    "Chromatic aberration spreading the corner focus",
    "Vignetting — the effective acceptance angle (NA) drops for off-axis points, so field edges receive less light",
    "The field stop is passing too much light",
    "Spherical aberration of the marginal rays",
]
answer = 1
explanation = "Vignetting is the off-axis decrease of effective NA: cones from field-edge points are partially clipped by elements other than the stop. It usually signals that the aperture stop is poorly placed for the system. Designers avoid it by strategic stop placement."

[widgets."com.github.richbai90.optics.stops-pupils.card-stop"]
front = "Aperture stop vs field stop"
back = "Aperture stop: limits the cone angle from each point → brightness (NA, f/#). Field stop: limits which chief rays get through → extent of the scene (field of view)."

[widgets."com.github.richbai90.optics.stops-pupils.card-rays"]
front = "Chief ray vs marginal ray"
back = "Chief ray: from the object through the CENTER of the aperture stop (and both pupils) — probes the field stop. Marginal ray: grazes the RIM of the stop (and both pupils) — sets NA. Both reconverge at the image point."


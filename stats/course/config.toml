# ==== 00-about ====

[widgets."com.github.richbai90.stats.00-about.master_model"]
type = "math"
label = "The master observation model"
tex = '\mathbf{y} = \mathbf{h}(\boldsymbol\theta) + \mathbf{n}'
definitions = [
    { symbol = "y", meaning = "the measurements: the data actually observed", link = "/course/stats/about#notation" },
    { symbol = "h(·)", meaning = "the forward operator: known physics mapping parameters to measurements", link = "/course/stats/about#notation" },
    { symbol = "n", meaning = "additive noise: thermal jitter, shot noise, quantization — what you cannot control" },
    { symbol = "θ", meaning = "the unknown parameter; bold marks a vector", link = "/course/stats/about#notation" },
]

[widgets."com.github.richbai90.stats.00-about.card_forward"]
type = "flashcard"
front = "What are the three ingredients of every estimation problem in this course?"
back = "A forward operator h mapping parameters to measurements, a noise mechanism that corrupts them, and a probabilistic argument that runs the chain backwards: y = h(θ) + n."

[widgets."com.github.richbai90.stats.00-about.card_reference_policy"]
type = "flashcard"
front = "When are you allowed to read the reference solution of an assignment?"
back = "Only after a graded attempt. Work the problem, take the verdict, then compare — reading it first wastes the problem. Equivalent derivations still count as correct."

[widgets."com.github.richbai90.stats.00-about.teach"]
type = "teach"
prompt = '''A student who missed this session asks you to explain the master observation model and how to read the course notation. In your own words, write the explanation you would give: what $\mathbf{y} = \mathbf{h}(\boldsymbol\theta) + \mathbf{n}$ says, what each piece encodes, how the two views of the unknown differ, and the notation conventions the course runs on.'''
key_points = '''- The master model $\mathbf{y} = \mathbf{h}(\boldsymbol\theta) + \mathbf{n}$: measurements $\mathbf{y}$, a known **forward operator** $\mathbf{h}$ encoding the physics, additive **noise** $\mathbf{n}$ encoding what you cannot control, and the unknown parameter $\boldsymbol\theta$; bold marks vectors.
- The estimation question is the reverse direction: given $\mathbf{y}$, say something defensible about $\boldsymbol\theta$.
- Two views of the unknown, chosen per question: deterministic (a fixed unknown constant; Modules 1–3) and Bayesian (random with a prior $p(\theta)$; Modules 4–5).
- Notation: $p(x;\theta)$ puts a semicolon between data and parameter; $\ell(\theta)$ is the log-likelihood; $V = \nabla_\theta \ell$ is the score; $\mathbf{I}(\theta)$ is the Fisher information; $\hat\theta(X)$ is an estimator, a function of the data.
- Everything in the course is a special case of this one equation; photon counting ($N \sim \mathrm{Poisson}(\lambda T)$) is the running physical example.'''
hint = '''Structure it in three sentences — physics, noise, and the question the data must answer — then add the scoping decision about the unknown.'''

# ==== 01-observation-model ====

[widgets."com.github.richbai90.stats.01-observation.model"]
type = "math"
label = "The generative equation"
tex = '\mathbf{y} = \mathbf{h}(\boldsymbol\theta) + \mathbf{n}'
definitions = [
    { symbol = "h(·)", meaning = "the forward operator: a linear array gives Hθ, a photon counter gives λT, a blurred image gives convolution", link = "/course/stats/about#notation" },
    { symbol = "n", meaning = "the noise mechanism; every hard question in the course lives here", link = "/course/stats/about#notation" },
]

[widgets."com.github.richbai90.stats.01-observation.two_views"]
type = "math"
label = "Two ways to treat the unknown"
tex = 'p(\mathbf{y};\, \boldsymbol\theta_0) \quad\text{deterministic} \qquad\qquad \boldsymbol\theta \sim p(\boldsymbol\theta), \;\; p(\mathbf{y}\mid\boldsymbol\theta) \quad\text{Bayesian}'
definitions = [
    { symbol = "p(y; θ₀)", meaning = "deterministic view: the data distribution at a fixed unknown θ₀", link = "/course/stats/about#notation" },
    { symbol = "p(y | θ)", meaning = "Bayesian view: the data distribution given a random parameter" },
    { symbol = "θ ~ p(θ)", meaning = "the prior: what you knew before the data arrived" },
]

[widgets."com.github.richbai90.stats.01-observation.quiz_views"]
type = "quiz"
question = "A temperature coefficient is fixed during one calibration run but varies randomly across the product line. Which scoping decision fits a question about this single run?"
options = [
    "Treat it as deterministic: a fixed unknown constant",
    "Treat it as Bayesian: random with a prior",
    "Neither view applies; the parameter is unidentifiable",
    "Always average the two views",
]
answer = 0
explanation = "The view matches the question: within one run the coefficient is a fixed unknown; across the product line it is random. Choose per question, not per home department."

[widgets."com.github.richbai90.stats.01-observation.inter_snr"]
type = "interactive"
title = "A single noisy measurement"
xlabel = "theta"
ylabel = "likelihood"
expression = 'exp(-(x - 1.2)^2/(2*sigma^2))'
domain = [0.0, 2.5]
parameters = [
    { name = "sigma", label = "noise sigma", min = 0.05, max = 1.5, step = 0.05, initial = 0.3 },
]
readout = "theta = {x:0.2f}, likelihood = {y:0.3f}, sigma = {sigma:0.2f}"

[widgets."com.github.richbai90.stats.01-observation.identifiability"]
type = "math"
label = "Identifiability"
tex = 'p(\mathbf{y};\, \boldsymbol\theta_1) = p(\mathbf{y};\, \boldsymbol\theta_2) \;\implies\; \boldsymbol\theta_1 = \boldsymbol\theta_2'
definitions = [
    { symbol = "p(y; θ)", meaning = "the data distribution at parameter θ; distinct parameters must give distinct distributions", link = "/course/stats/about#notation" },
    { symbol = "injective", meaning = "the map from parameters to distributions must be one-to-one, or no estimator can separate them" },
]

[widgets."com.github.richbai90.stats.01-observation.quiz_identifiability"]
type = "quiz"
question = "Two equal-spectrum sources are observed through one sensor that sees only their summed intensity. What is the right response?"
options = [
    "A cleverer estimator will separate them",
    "Average many more independent measurements",
    "Get more physics: a second sensor or a different filter",
    "Estimate the sum, then subtract a guessed split",
]
answer = 2
explanation = "Distinct parameters produce the same data distribution, so the failure is structural, not algorithmic. The fix is more physics, not more statistics."

[widgets."com.github.richbai90.stats.01-observation.card_model"]
type = "flashcard"
front = "Write the master observation model and name its parts."
back = "y = h(θ) + n: the forward operator h encodes the physics, the noise n encodes what you cannot control, and θ is the unknown the data must pin down."

[widgets."com.github.richbai90.stats.01-observation.card_identifiability"]
type = "flashcard"
front = "What is the identifiability check, and what fixes its failures?"
back = "Distinct parameters must give distinct data distributions. If the map θ ↦ distribution is not injective, no estimator helps — the fix is more physics (a second sensor, a different filter), not more statistics."

[widgets."com.github.richbai90.stats.01-observation.teach"]
type = "teach"
prompt = '''The class is about to continue Module 1. Teach Lesson 1 back to them: the generative equation, the two scoping views of the unknown, why the noise term holds every hard question, and why identifiability is checked before any algorithm is written.'''
key_points = '''- $\mathbf{y} = \mathbf{h}(\boldsymbol\theta) + \mathbf{n}$ with $\mathbf{h}$ the known physics (a matrix $\mathbf{H}\boldsymbol\theta$, a photon counter's $\lambda T$, a convolution) and $\mathbf{n}$ the noise; without noise estimation is trivial algebra, so the difficulty lives entirely in $\mathbf{n}$.
- The two views are scoping decisions, not schools: deterministic treats $\theta$ as a fixed unknown constant (rank estimators by variance under unbiasedness, or by likelihood), Bayesian treats $\theta$ as random with a prior $p(\theta)$ (rank by average loss over the joint).
- A parameter can be deterministic within one run and random across a product line; the view matches the question, not the home department.
- Identifiability first: distinct parameters must give distinct data distributions — the map $\theta \mapsto$ distribution must be injective. Failure is structural; the fix is more physics (a second sensor, a different filter), never a cleverer estimator.
- Then precision: for the noise level you actually have, the Fisher information sets the best achievable variance — the floor any estimator is compared against.'''
hint = '''Name the two checks in order, and use the equal-spectrum two-source example for the first one.'''

# ==== 02-mvue ====

[widgets."com.github.richbai90.stats.02-mvue.unbiased"]
type = "math"
label = "Unbiasedness"
tex = '\mathbb{E}_X\!\left[\hat\theta(X)\right] = \theta'
definitions = [
    { symbol = "θ̂(X)", meaning = "estimator: a function of the data; θ̂ alone is the realized estimate", link = "/course/stats/about#notation" },
    { symbol = "E_X[·]", meaning = "expectation over the data distribution at the true parameter", link = "/course/stats/about#notation" },
    { symbol = "bias", meaning = "systematic error: the estimator reads the parameter low or high on average over repeat experiments" },
]

[widgets."com.github.richbai90.stats.02-mvue.quiz_bias"]
type = "quiz"
question = "An estimator is biased low but has much smaller variance than the best unbiased one. What does the classical framework conclude?"
options = [
    "Always prefer it: smaller variance wins outright",
    "Bias is systematic error, yet a low-variance biased estimator can still win on mean-squared error",
    "Bias becomes irrelevant once the sample is large",
    "Averaging copies of it removes the bias for free",
]
answer = 1
explanation = "Unbiasedness is the axis the classical theory organizes around, and the CRLB constrains unbiased estimators specifically; mean-squared error trades bias against variance."

[widgets."com.github.richbai90.stats.02-mvue.factorization"]
type = "math"
label = "Factorization criterion for sufficiency"
tex = 'p(\mathbf{x};\theta) = g\!\left(T(\mathbf{x});\theta\right)\, h(\mathbf{x})'
definitions = [
    { symbol = "T(x)", meaning = "the sufficient statistic: the θ-dependent piece touches the data only through it" },
    { symbol = "g(·; θ)", meaning = "the θ-dependent factor; it sees the data only through T" },
    { symbol = "h(x)", meaning = "the θ-free factor: it does not involve the parameter at all" },
]

[widgets."com.github.richbai90.stats.02-mvue.stepper_rb"]
type = "stepper"
label = "Rao–Blackwell, step by step"
steps = [
    { title = "Start crude", text = "Take any unbiased estimator of θ. A crude one will do." },
    { title = "Condition on T", tex = '\tilde\theta = \mathbb{E}[\delta(X) \mid T]' },
    { title = "Mean preserved", tex = '\mathbb{E}[\tilde\theta] = \mathbb{E}[\delta(X)] = \theta', note = "The tower property: averaging the conditional mean over T recovers the original mean, so the Rao–Blackwellized estimator is still unbiased." },
    { title = "Variance shrinks", tex = '\operatorname{Var}[\delta] = \mathbb{E}\!\left[\operatorname{Var}[\delta \mid T]\right] + \operatorname{Var}[\tilde\theta]', note = "Law of total variance: conditioning removes the within-slice part, so the variance never grows." },
    { title = "Strictly better", text = "Equality holds only when the starting estimator already depends on the data through T alone." },
]

[widgets."com.github.richbai90.stats.02-mvue.rb_inequality"]
type = "math"
label = "Rao–Blackwell inequality"
tex = '\operatorname{Var}[\delta(X)] \;\ge\; \operatorname{Var}\!\left[\mathbb{E}[\delta(X) \mid T]\right]'
definitions = [
    { symbol = "δ(X)", meaning = "any unbiased starting estimator" },
    { symbol = "E[δ | T]", meaning = "the Rao–Blackwellized estimator: the conditional mean given the sufficient statistic" },
    { symbol = "Var[·]", meaning = "variance over the data distribution", link = "/course/stats/about#notation" },
]

[widgets."com.github.richbai90.stats.02-mvue.lehmann_scheffe"]
type = "math"
label = "Lehmann–Scheffé theorem"
tex = 'T \text{ complete sufficient}, \;\; g(T) \text{ unbiased} \;\implies\; g(T) \text{ is the unique MVUE}'
definitions = [
    { symbol = "complete", meaning = "T is complete when no nonzero function of T has zero expectation for every θ" },
    { symbol = "MVUE", meaning = "minimum-variance unbiased estimator: no other unbiased estimator of θ has smaller variance" },
    { symbol = "g(T)", meaning = "any unbiased estimator built from the sufficient statistic alone" },
]

[widgets."com.github.richbai90.stats.02-mvue.quiz_rb"]
type = "quiz"
question = "You hold an unbiased crude estimator and a sufficient statistic T. What does Rao–Blackwell say about E[crude | T]?"
options = [
    "Still unbiased, with variance no larger than the crude one",
    "Biased, but with lower variance",
    "Automatically the unique MVUE of θ",
    "Dependent on which crude estimator you started from",
]
answer = 0
explanation = "Conditioning removes the within-slice variance while the tower property keeps the mean. It becomes the unique MVUE only when T is complete — then the starting point stops mattering."

[widgets."com.github.richbai90.stats.02-mvue.card_sufficient"]
type = "flashcard"
front = "State the factorization criterion for sufficiency."
back = "T(X) is sufficient when p(x;θ) = g(T(x);θ)·h(x): the likelihood touches the data only through T plus a θ-free piece. Sufficiency is lossless compression — every unbiased estimator can be rebuilt from T alone."

[widgets."com.github.richbai90.stats.02-mvue.card_rb"]
type = "flashcard"
front = "Give the three-step recipe for the MVUE."
back = "Factor the likelihood to find the sufficient statistic T; find any unbiased estimator; compute E[crude | T]. For complete sufficient T (all exponential families), that conditional expectation is the unique MVUE."

[widgets."com.github.richbai90.stats.02-mvue.teach"]
type = "teach"
prompt = '''A classmate missed Lesson 2. Teach it back: unbiasedness as the classical standard, sufficiency as lossless compression, the Rao–Blackwell step and why it never hurts, and the three-step recipe that ends at the MVUE.'''
key_points = '''- Unbiasedness: $\mathbb{E}[\hat\theta(X)] = \theta$ — bias is systematic error over repeat experiments. Not the whole story (a low-variance biased estimator can win on MSE), but the axis classical theory organizes around and the CRLB constrains.
- Sufficiency by the factorization criterion $p(x;\theta) = g(T(x);\theta)\,h(x)$: once you know $T$, the raw data adds nothing about $\theta$. Sufficiency is lossless compression — every unbiased estimator can be rebuilt from $T$ alone.
- Rao–Blackwell: replace any unbiased estimator with $\tilde\theta = \mathbb{E}[\text{crude} \mid T]$. The tower property keeps the mean, and the law of total variance removes the within-slice part, so variance never grows.
- Lehmann–Scheffé: if $T$ is complete sufficient (all exponential families) and $g(T)$ is unbiased, then $g(T)$ is the unique MVUE — the starting point stops mattering.
- The recipe: factor the likelihood to find $T$; find any unbiased estimator; compute $\mathbb{E}[\text{crude} \mid T]$.'''
hint = '''Explain the two variance terms — within-slice and between-slice — and which one conditioning removes.'''

# ==== 03-crlb ====

[widgets."com.github.richbai90.stats.03-crlb.crlb_scalar"]
type = "math"
label = "Cramér–Rao lower bound (scalar)"
tex = '\operatorname{Var}[\hat\theta] \;\ge\; \frac{1}{I(\theta)}, \qquad I(\theta) = \mathbb{E}\!\left[\left(\frac{\partial \ell}{\partial \theta}\right)^{2}\right] = -\,\mathbb{E}\!\left[\frac{\partial^{2} \ell}{\partial \theta^{2}}\right]'
definitions = [
    { symbol = "I(θ)", meaning = "Fisher information: the variance of the score", link = "/course/stats/about#notation" },
    { symbol = "ℓ(θ)", meaning = "the log-likelihood at the observed data", link = "/course/stats/about#notation" },
    { symbol = "V = ∂ℓ/∂θ", meaning = "the score; a steep log-likelihood means large I and a low floor", link = "/course/stats/about#notation" },
    { symbol = "Var[θ̂]", meaning = "the variance of any unbiased estimator, bounded below", link = "/course/stats/about#notation" },
]

[widgets."com.github.richbai90.stats.03-crlb.stepper_crlb"]
type = "stepper"
label = "The Cramér–Rao proof in five moves"
steps = [
    { title = "Setup", text = "Let θ̂ be unbiased and let V be the score. The score has zero mean: averaging ∂ℓ/∂θ over the data distribution gives 0." },
    { title = "The covariance miracle", tex = '\operatorname{Cov}(V,\, \hat\theta - \theta) = \mathbb{E}\!\left[V\,(\hat\theta - \theta)\right] = 1', note = "Differentiate the normalization E[1] = 1 under the integral sign and the same expectation produces exactly 1 for any unbiased θ̂." },
    { title = "Cauchy–Schwarz", tex = '1 = \operatorname{Cov}(V,\, \hat\theta - \theta)^{2} \;\le\; \operatorname{Var}[V]\,\operatorname{Var}[\hat\theta]' },
    { title = "Rearrange", tex = '\operatorname{Var}[\hat\theta] \;\ge\; \frac{1}{\operatorname{Var}[V]} = \frac{1}{I(\theta)}' },
    { title = "Equality", text = "The bound is attained when the error is proportional to the score — the efficiency condition. Quadratic log-likelihoods (Gaussian families) deliver it." },
]

[widgets."com.github.richbai90.stats.03-crlb.fim"]
type = "math"
label = "Fisher information matrix"
tex = '\left[\mathbf{I}(\boldsymbol\theta)\right]_{ij} = -\,\mathbb{E}\!\left[\frac{\partial^{2} \ell}{\partial \theta_i\, \partial \theta_j}\right]'
definitions = [
    { symbol = "I(θ)", meaning = "the Fisher information matrix for p unknowns", link = "/course/stats/about#notation" },
    { symbol = "θᵢ, θⱼ", meaning = "components of the parameter vector" },
    { symbol = "∂²ℓ/∂θᵢ∂θⱼ", meaning = "second cross-derivative of the log-likelihood; its averaged negative is the mutual information between the parameters" },
]

[widgets."com.github.richbai90.stats.03-crlb.crlb_vector"]
type = "math"
label = "Cramér–Rao bound (vector)"
tex = '\mathbf{J}(\boldsymbol\theta) - \mathbf{I}^{-1}(\boldsymbol\theta) \succeq 0'
definitions = [
    { symbol = "J(θ)", meaning = "the covariance matrix of any unbiased estimator" },
    { symbol = "I⁻¹(θ)", meaning = "the inverse Fisher information: the matrix floor on the covariance", link = "/course/stats/about#notation" },
    { symbol = "⪰ 0", meaning = "positive semidefinite: the covariance is bounded below in the matrix sense; off-diagonals of I⁻¹ are the coupling terms" },
]

[widgets."com.github.richbai90.stats.03-crlb.quiz_fim"]
type = "quiz"
question = "For two parameters, what do large off-diagonal entries of I⁻¹(θ) mean?"
options = [
    "The noise is non-Gaussian",
    "Both parameters are pinned down tightly",
    "The information matrix is diagonal",
    "The data cannot separate those parameters; their estimates are strongly coupled",
]
answer = 3
explanation = "Off-diagonal structure is the coupling story: a nearly singular information matrix blurs the parameters into each other. The fix is more data — longer record, more sensors."

[widgets."com.github.richbai90.stats.03-crlb.transform"]
type = "math"
label = "CRLB under transformations"
tex = '\operatorname{Var}[\hat\alpha] \;\ge\; \frac{1}{I(\theta)}\left(\frac{\mathrm{d}g}{\mathrm{d}\theta}\right)^{2}'
definitions = [
    { symbol = "α = g(θ)", meaning = "a transformed parameter; the bound transports with the squared derivative" },
    { symbol = "I(θ)", meaning = "Fisher information for θ — precision statements always name the parametrization", link = "/course/stats/about#notation" },
]

[widgets."com.github.richbai90.stats.03-crlb.quiz_blue"]
type = "quiz"
question = "What does restricting an estimator to be linear and unbiased (BLUE) buy?"
options = [
    "The CRLB is then always attained",
    "The best linear unbiased rule with no Gaussian assumption",
    "It removes bias from any starting estimator",
    "It makes any statistic sufficient",
]
answer = 1
explanation = "Within the linear-unbiased class the Gaussian assumption drops out; for a Gaussian mean the linear rule is also efficient, but efficiency is not guaranteed in general."

[widgets."com.github.richbai90.stats.03-crlb.card_fisher"]
type = "flashcard"
front = "Define Fisher information and state the CRLB."
back = "I(θ) = E[(∂ℓ/∂θ)²] = −E[∂²ℓ/∂θ²]: the variance of the score. No unbiased estimator beats Var ≥ 1/I(θ); steep log-likelihoods mean high information and a low floor."

[widgets."com.github.richbai90.stats.03-crlb.card_efficient"]
type = "flashcard"
front = "When is an unbiased estimator efficient, and which family delivers it?"
back = "When it attains the CRLB — which needs the error proportional to the score, forcing a quadratic log-likelihood. Gaussian families are exactly that case: X̄ for a Gaussian mean hits σ²/n = I⁻¹."

[widgets."com.github.richbai90.stats.03-crlb.teach"]
type = "teach"
prompt = '''Teach Lesson 3 back: how the Fisher information turns the noise level into a hard floor on estimator variance, when the floor is actually attained, and what the matrix version says about parameters that refuse to separate.'''
key_points = '''- $I(\theta) = \mathbb{E}[(\partial\ell/\partial\theta)^2] = -\mathbb{E}[\partial^2\ell/\partial\theta^2]$: the variance of the score. A steep log-likelihood means large $I$ and a low floor; a flat one lets noise mimic parameter changes and the floor rises. The bound: $\operatorname{Var}[\hat\theta] \ge 1/I(\theta)$ for unbiased $\hat\theta$.
- The proof engine is Cauchy–Schwarz on the score and the error, whose covariance is exactly $1$ for any unbiased estimator.
- Efficiency is special, not generic: attaining the bound needs the error proportional to the score, which forces a quadratic log-likelihood — Gaussian families. The Gaussian sample mean is efficient; the Gaussian sample variance never attains $2\sigma^4/n$ at finite $n$.
- Vector form: $\mathbf{J} - \mathbf{I}^{-1} \succeq 0$. Large off-diagonal entries of $\mathbf{I}^{-1}$ mean the data cannot separate those parameters — nearly singular information, estimates blur together; the fix is more data (longer record, more sensors).
- The bound transports under reparametrization with $g'(\theta)^2$: precision statements always name the parametrization. BLUE: best within the linear-unbiased class with no Gaussian assumption needed.'''
hint = '''Give the physical reading first — steep versus flat log-likelihood — then the algebra.'''

# ==== 04-mle ====

[widgets."com.github.richbai90.stats.04-mle.definition"]
type = "math"
label = "Maximum likelihood"
tex = '\hat\theta_{\mathrm{ML}} = \operatorname*{arg\,max}_\theta \; \ell(\theta)'
definitions = [
    { symbol = "ℓ(θ)", meaning = "the log-likelihood; the MLE is its peak", link = "/course/stats/about#notation" },
    { symbol = "V(θ) = 0", meaning = "the likelihood equation: at a smooth interior peak the score vanishes", link = "/course/stats/about#notation" },
]

[widgets."com.github.richbai90.stats.04-mle.inter_score"]
type = "interactive"
title = "The score of Gaussian sample data"
xlabel = "theta"
ylabel = "score V"
expression = '(20 - 5*x)/4'
domain = [2.0, 6.0]
readout = "score V = {y:0.2f} at theta = {x:0.1f}"

[widgets."com.github.richbai90.stats.04-mle.invariance"]
type = "math"
label = "Invariance of the MLE"
tex = '\widehat{g(\theta)} = g\!\left(\hat\theta_{\mathrm{ML}}\right)'
definitions = [
    { symbol = "g(θ)", meaning = "any function of the parameter; reparametrizing cannot move the peak of the likelihood" },
    { symbol = "θ̂_ML", meaning = "the maximum likelihood estimate of θ" },
]

[widgets."com.github.richbai90.stats.04-mle.asymptotic"]
type = "math"
label = "Asymptotic normality"
tex = '\hat\theta_{\mathrm{ML}} \;\approx\; \mathcal{N}\!\left(\theta,\; I^{-1}(\theta)\right) \quad \text{for large } n'
definitions = [
    { symbol = "N(θ, C)", meaning = "Gaussian with the given mean and covariance", link = "/course/stats/about#notation" },
    { symbol = "I⁻¹(θ)", meaning = "the CRLB variance: attained in the large-sample limit", link = "/course/stats/about#notation" },
    { symbol = "n", meaning = "sample size; the approximation sharpens as n grows" },
]

[widgets."com.github.richbai90.stats.04-mle.stepper_linear"]
type = "stepper"
label = "MLE for the Gaussian linear model"
steps = [
    { title = "Model", tex = '\mathbf{y} = \mathbf{H}\boldsymbol\theta + \mathbf{n}, \quad \mathbf{n} \sim \mathcal{N}(\mathbf{0}, \sigma^{2}\mathbf{I})' },
    { title = "Log-likelihood", tex = '\ell(\boldsymbol\theta) = -\frac{1}{2\sigma^{2}}\left\|\mathbf{y} - \mathbf{H}\boldsymbol\theta\right\|^{2} + c' },
    { title = "Score", tex = '\nabla\ell(\boldsymbol\theta) = \frac{1}{\sigma^{2}}\mathbf{H}^{\mathsf T}\!\left(\mathbf{y} - \mathbf{H}\boldsymbol\theta\right)' },
    { title = "Normal equations", tex = '\mathbf{H}^{\mathsf T}\mathbf{H}\,\hat\theta = \mathbf{H}^{\mathsf T}\mathbf{y}' },
    { title = "Covariance", tex = '\operatorname{Cov}[\hat\theta] = \sigma^{2}\left(\mathbf{H}^{\mathsf T}\mathbf{H}\right)^{-1}', note = "Equal to the inverse Fisher information: the least-squares solution is efficient for Gaussian noise." },
]

[widgets."com.github.richbai90.stats.04-mle.quiz_normal"]
type = "quiz"
question = "For y = Hθ + n with n ~ N(0, σ²I), which statement is exactly right?"
options = [
    "A closed-form MLE exists only when H is square",
    "The MLE must be found by Newton iteration",
    "The least-squares solution is the MLE, with covariance σ²(HᵀH)⁻¹",
    "The MLE is biased for finite n",
]
answer = 2
explanation = "Gaussian noise turns least squares into maximum likelihood: the normal equations solve it in closed form, and the covariance matches the CRLB."

[widgets."com.github.richbai90.stats.04-mle.newton"]
type = "math"
label = "Newton–Raphson iteration"
tex = '\boldsymbol\theta_{k+1} = \boldsymbol\theta_k - \mathbf{H}^{-1}\, \nabla\ell(\boldsymbol\theta_k)'
definitions = [
    { symbol = "H", meaning = "the Hessian of ℓ; Fisher scoring uses its expected value, −I(θ)" },
    { symbol = "∇ℓ", meaning = "the gradient of the log-likelihood: the score", link = "/course/stats/about#notation" },
]

[widgets."com.github.richbai90.stats.04-mle.quiz_newton"]
type = "quiz"
question = "A Newton iteration keeps sliding into a small local peak of a multimodal likelihood. What is the standard remedy?"
options = [
    "Restart from several spread-out initializations and keep the best candidate",
    "Take larger steps",
    "Evaluate the score at the current point instead",
    "Add a prior term to flatten the surface",
]
answer = 0
explanation = "Multimodal likelihoods trap local iterations. Use spread-out starts, then check that the score is zero and the Hessian negative-definite at the answer."

[widgets."com.github.richbai90.stats.04-mle.card_invariance"]
type = "flashcard"
front = "State the invariance property of the MLE."
back = "The MLE of g(θ) is g applied to the MLE of θ: the estimate for g(θ) equals g(θ̂_ML). Reparametrizing cannot move the peak. Precision statements still travel with the Jacobian — invariance moves only the point estimate."

[widgets."com.github.richbai90.stats.04-mle.card_asymptotic"]
type = "flashcard"
front = "Why is the MLE the default estimator for large samples?"
back = "It is consistent, asymptotically efficient, and asymptotically normal: θ̂_ML ≈ N(θ, I⁻¹(θ)) for large n. Engineering practice reports θ̂ ± sqrt(I⁻¹) as error bars on this basis."

[widgets."com.github.richbai90.stats.04-mle.teach"]
type = "teach"
prompt = '''Teach Lesson 4 back: the MLE as the peak of the log-likelihood, the invariance property, the three asymptotic facts that make MLE the default, and why the least-squares solution is the MLE for the Gaussian linear model.'''
key_points = '''- $\hat\theta_{\mathrm{ML}} = \operatorname{argmax}_\theta \ell(\theta)$; at a smooth interior peak the score vanishes: $V(\theta) = 0$. For a Gaussian sample the score is a straight line crossing zero exactly at $\bar{x}$.
- Invariance: the MLE of $g(\theta)$ is $g(\hat\theta_{\mathrm{ML}})$ — reparametrizing cannot move the peak. Precision statements still transport with the Jacobian; invariance moves only the point estimate.
- Asymptotics: consistent, asymptotically efficient (the CRLB is attained in the limit even when no finite-$n$ estimator touches it), asymptotically normal $\hat\theta_{\mathrm{ML}} \approx \mathcal{N}(\theta, I^{-1}(\theta))$ — the reason engineering reports $\hat\theta \pm \sqrt{I^{-1}}$ as error bars.
- Gaussian linear model: $\mathbf{H}^{\mathsf T}\mathbf{H}\,\hat\theta = \mathbf{H}^{\mathsf T}\mathbf{y}$ — the least-squares solution is the MLE, with covariance $\sigma^2(\mathbf{H}^{\mathsf T}\mathbf{H})^{-1} = I^{-1}$. The same normal equations return as Wiener filtering, Tikhonov, and the Gaussian posterior mean.
- When algebra fails: Newton–Raphson or Fisher scoring, quadratically fast near the peak; multimodal likelihoods trap local iterations, so start from spread-out initializations and check a zero score and negative-definite Hessian at the answer.'''
hint = '''Anchor on the score: its zero is the peak, and everything else — invariance, asymptotics, normal equations — is bookkeeping around that fact.'''

# ==== 05-mle-poisson ====

[widgets."com.github.richbai90.stats.05-poisson.expfam"]
type = "math"
label = "The exponential family"
tex = 'p(x;\eta) = h(x)\,\exp\!\left\{\eta\, T(x) - A(\eta)\right\}'
definitions = [
    { symbol = "η", meaning = "the natural parameter" },
    { symbol = "T(x)", meaning = "the natural statistic: sufficient by the factorization theorem, and the family is complete" },
    { symbol = "A(η)", meaning = "the normalizer: it does not involve the data" },
]

[widgets."com.github.richbai90.stats.05-poisson.fim_expfam"]
type = "math"
label = "Fisher information in natural parameters"
tex = 'I(\eta) = \frac{\mathrm{d}^{2} A}{\mathrm{d}\eta^{2}}'
definitions = [
    { symbol = "A(η)", meaning = "the normalizer; its second derivative is the whole information computation" },
    { symbol = "I(η)", meaning = "Fisher information in the natural parametrization; multiplies by n for i.i.d. samples", link = "/course/stats/about#notation" },
]

[widgets."com.github.richbai90.stats.05-poisson.model"]
type = "math"
label = "Photon counting (shot noise)"
tex = 'p(N;\lambda T) = \frac{(\lambda T)^{N}\, e^{-\lambda T}}{N!}'
definitions = [
    { symbol = "N", meaning = "the photo-event count in one exposure" },
    { symbol = "λ", meaning = "the source rate: the parameter to estimate" },
    { symbol = "T", meaning = "the exposure time; λT is the expected count" },
]

[widgets."com.github.richbai90.stats.05-poisson.inter_likelihood"]
type = "interactive"
title = "Poisson log-likelihood at N = 37"
xlabel = "lambda"
ylabel = "log-likelihood"
expression = '37*log(x*T) - x*T'
domain = [10.0, 80.0]
parameters = [
    { name = "T", label = "exposure T", min = 0.5, max = 3.0, step = 0.1, initial = 1.0 },
]
readout = "lambda = {x:0.1f}, log-likelihood = {y:0.2f}, exposure T = {T:0.1f}"

[widgets."com.github.richbai90.stats.05-poisson.stepper_mle"]
type = "stepper"
label = "The Poisson MLE"
steps = [
    { title = "Model", tex = 'p(N_i;\lambda T) = \frac{(\lambda T)^{N_i} e^{-\lambda T}}{N_i!}' },
    { title = "Log-likelihood", tex = '\ell(\lambda) = \left(\sum_{i=1}^{n} N_i\right)\ln(\lambda T) - n\lambda T + c' },
    { title = "Score", tex = '\frac{\partial\ell}{\partial\lambda} = \frac{\sum_i N_i}{\lambda} - nT' },
    { title = "Set to zero", tex = '\hat\lambda = \frac{\sum_i N_i}{nT}' },
    { title = "Read it", text = "Total counts divided by total exposure: the empirical rate. It is unbiased, a function of the sufficient statistic, and efficient." },
]

[widgets."com.github.richbai90.stats.05-poisson.crlb"]
type = "math"
label = "Poisson CRLB"
tex = 'I(\lambda) = \frac{nT}{\lambda} \quad\implies\quad \operatorname{Var}[\hat\lambda] \;\ge\; \frac{\lambda}{nT}'
definitions = [
    { symbol = "I(λ)", meaning = "Fisher information for the rate over n exposures", link = "/course/stats/about#notation" },
    { symbol = "λ̂", meaning = "the estimate of the rate" },
    { symbol = "shot noise", meaning = "relative precision scales as 1/sqrt(total counts) — a budget, not a rate" },
]

[widgets."com.github.richbai90.stats.05-poisson.quiz_shot"]
type = "quiz"
question = "You want a photon rate to 1% relative precision. What does shot noise demand?"
options = [
    "One exposure 100 times longer",
    "About 10,000 detected photons in total, however they are distributed",
    "Replacing the Poisson model with a Gaussian one",
    "A fixed exposure of exactly one second",
]
answer = 1
explanation = "Relative precision scales as 1/sqrt(total counts), so 1% needs 10,000 photons — shot noise is a budget, not a rate."

[widgets."com.github.richbai90.stats.05-poisson.quiz_expfam"]
type = "quiz"
question = "For an exponential family in natural form, what is the Fisher information for one sample?"
options = [
    "The normalizer A(η) itself",
    "The reciprocal of A(η)",
    "The second derivative of A(η)",
    "exp{ηT(x) − A(η)}",
]
answer = 2
explanation = "One derivative of the normalizer replaces the whole score-variance computation. Mind the sign trap: for the exponential distribution the natural parameter is −λ."

[widgets."com.github.richbai90.stats.05-poisson.card_natural"]
type = "flashcard"
front = "In the exponential family p(x;η) = h(x)exp{ηT(x) − A(η)}, what does each piece give you?"
back = "T(x) is the sufficient statistic (factorization at a glance), A(η) is the normalizer whose second derivative is the Fisher information, and the family is complete — so any unbiased function of T is the MVUE."

[widgets."com.github.richbai90.stats.05-poisson.card_shot"]
type = "flashcard"
front = "State the shot-noise precision law for photon counting."
back = "Var(λ̂) ≥ λ/(nT): relative precision scales as 1/sqrt(total counts). Estimating a rate to 1% needs 10,000 detected photons no matter how the exposures are distributed — a budget, not a rate."

[widgets."com.github.richbai90.stats.05-poisson.teach"]
type = "teach"
prompt = '''Teach Lesson 5 back: the exponential family shape and why it collapses Lessons 2 through 4 into one mechanical recipe, plus the photon-counting model and its square-root precision law.'''
key_points = '''- The family: $p(x;\eta) = h(x)\exp\{\eta T(x) - A(\eta)\}$. Read it once and everything is mechanical: $T(x)$ is sufficient at a glance, the family is complete so Lehmann–Scheffé applies, and $I(\eta) = A''(\eta)$ — one derivative of the normalizer replaces the whole score-variance computation, times $n$ for i.i.d. samples.
- Photon counting: $N \sim \mathrm{Poisson}(\lambda T)$ — the parameter is the rate $\lambda$, the data the count over exposure $T$. At low flux the counts are small integers and the Poisson likelihood is the only honest one.
- The MLE is the empirical rate $\hat\lambda = \sum_i N_i / (nT)$: unbiased, a function of the sufficient statistic, and efficient.
- The Poisson CRLB: $I(\lambda) = nT/\lambda$, so $\operatorname{Var}[\hat\lambda] \ge \lambda/(nT)$ — relative precision scales as $1/\sqrt{\text{total counts}}$. One percent needs $10^4$ detected photons no matter how the exposures are distributed: shot noise is a budget, not a rate.
- The three-step recipe: read $T(x)$ and $A(\eta)$ off the density; solve $A'(\hat\eta) = \bar{T}$; transport back through $\eta(\theta)$ — and mind the sign of the natural parameter, which is $-\lambda$ for the exponential distribution.'''
hint = '''Anchor on $A(\eta)$: the sufficient statistic, the information, and the MLE all fall out of it.'''

# ==== 06-bayes-mmse ====

[widgets."com.github.richbai90.stats.06-mmse.bayes"]
type = "math"
label = "Bayes rule"
tex = 'p(\theta \mid x) = \frac{p(x \mid \theta)\, p(\theta)}{p(x)}'
definitions = [
    { symbol = "p(θ)", meaning = "the prior: what you knew before the data arrived" },
    { symbol = "p(θ | x)", meaning = "the posterior: the complete inference; every estimator is a functional of it" },
    { symbol = "p(x)", meaning = "the evidence: it normalizes the posterior and drops out of maximization" },
]

[widgets."com.github.richbai90.stats.06-mmse.mmse"]
type = "math"
label = "Minimum mean-squared error estimator"
tex = '\hat\theta_{\mathrm{MMSE}} = \mathbb{E}[\theta \mid x]'
definitions = [
    { symbol = "E[θ | x]", meaning = "the posterior mean: the conditional mean given the observed data" },
    { symbol = "MMSE", meaning = "mean-squared error averaged over the joint distribution of θ and X; the within-slice part is fixed by the posterior, the between-slice part is minimized at the conditional mean" },
]

[widgets."com.github.richbai90.stats.06-mmse.stepper_gauss"]
type = "stepper"
label = "Gaussian–Gaussian conjugacy"
steps = [
    { title = "Prior and data", tex = 'p(\theta) = \mathcal{N}(\mu_0, \sigma_0^{2}), \qquad x_i \mid \theta \sim \mathcal{N}(\theta, \sigma^{2})' },
    { title = "Posterior up to a constant", tex = 'p(\theta \mid \mathbf{x}) \;\propto\; \exp\!\left[-\frac{(\theta - \mu_0)^{2}}{2\sigma_0^{2}}\right] \exp\!\left[-\frac{\sum_i (x_i - \theta)^{2}}{2\sigma^{2}}\right]' },
    { title = "Complete the square", tex = '\frac{1}{\sigma_{\text{post}}^{2}} = \frac{1}{\sigma_0^{2}} + \frac{n}{\sigma^{2}}', note = "The exponent is a single quadratic in θ: the posterior is Gaussian with this precision." },
    { title = "Weighted mean", tex = '\mu_{\text{post}} = w\,\mu_0 + (1 - w)\,\bar{x}, \qquad w = \frac{1/\sigma_0^{2}}{1/\sigma_0^{2} + n/\sigma^{2}}' },
    { title = "Read it", text = "Precisions add and the mean is the precision-weighted average. A vague prior returns the classical answer; a sharp prior dominates noisy data." },
]

[widgets."com.github.richbai90.stats.06-mmse.posterior_mean"]
type = "math"
label = "Gaussian–Gaussian posterior mean"
tex = '\hat\theta_{\mathrm{MMSE}} = \frac{\mu_0/\sigma_0^{2} \;+\; n\bar{x}/\sigma^{2}}{1/\sigma_0^{2} \;+\; n/\sigma^{2}}'
definitions = [
    { symbol = "μ₀, σ₀²", meaning = "prior mean and variance" },
    { symbol = "x̄", meaning = "the sample mean of the n observations" },
    { symbol = "σ²", meaning = "the known observation variance" },
]

[widgets."com.github.richbai90.stats.06-mmse.shrinkage"]
type = "math"
label = "The shrinkage weight"
tex = 'w = \frac{1/\sigma_0^{2}}{1/\sigma_0^{2} + n/\sigma^{2}}, \qquad \hat\theta_{\mathrm{MMSE}} = w\,\mu_0 + (1 - w)\,\bar{x}'
definitions = [
    { symbol = "w", meaning = "the prior-to-total precision ratio: continuous slide from trust-the-data to trust-the-prior" },
    { symbol = "1/σ₀²", meaning = "prior precision; it competes with the data precision n/σ²" },
]

[widgets."com.github.richbai90.stats.06-mmse.inter_shrink"]
type = "interactive"
title = "Posterior mean as a precision-weighted average"
xlabel = "xbar"
ylabel = "posterior mean"
expression = '(2 + s20*x)/(1 + s20)'
domain = [-1.0, 5.0]
parameters = [
    { name = "s20", label = "prior variance", min = 0.0, max = 10.0, step = 0.25, initial = 1.0 },
]
readout = "xbar = {x:0.2f}, posterior mean = {y:0.3f}, prior variance = {s20:0.2f}"

[widgets."com.github.richbai90.stats.06-mmse.posterior_var"]
type = "math"
label = "Gaussian–Gaussian posterior variance"
tex = '\operatorname{Var}[\theta \mid \mathbf{x}] = \frac{1}{1/\sigma_0^{2} + n/\sigma^{2}}'
definitions = [
    { symbol = "precision", meaning = "inverse variance; precisions add under Gaussian conjugacy — bookkeeping in precision units" },
    { symbol = "Var[θ | x]", meaning = "posterior variance: at most the prior variance and at most the data variance", link = "/course/stats/about#notation" },
]

[widgets."com.github.richbai90.stats.06-mmse.quiz_mmse"]
type = "quiz"
question = "Which estimator minimizes mean-squared error over the joint distribution of θ and X?"
options = [
    "The posterior mean E[θ | x]",
    "The posterior mode",
    "The maximum likelihood estimate",
    "The posterior median, whatever the loss",
]
answer = 0
explanation = "Split the squared error into within-slice and between-slice parts; the within part is fixed by the posterior and the between part is minimized exactly at the conditional mean."

[widgets."com.github.richbai90.stats.06-mmse.quiz_compare"]
type = "quiz"
question = "Gaussian mean, known variance, n samples: the deterministic CRLB, the vague-prior posterior variance, and the MSE of the sample mean give..."
options = [
    "Three different numbers that agree only asymptotically",
    "The same number only when the prior is sharp",
    "The same number only for large n",
    "The same number, σ²/n, by three different derivations",
]
answer = 3
explanation = "All three routes land on σ²/n. The views part ways only when data is thin relative to prior knowledge — exactly where the Bayesian machinery has more to say."

[widgets."com.github.richbai90.stats.06-mmse.card_mmse"]
type = "flashcard"
front = "What is the MMSE estimator and why?"
back = "The posterior mean E[θ|x]. Split the squared error into within-slice and between-slice parts: the within part is fixed by the posterior and the between part is minimized exactly at the conditional mean."

[widgets."com.github.richbai90.stats.06-mmse.card_precision"]
type = "flashcard"
front = "What adds when Gaussian priors meet Gaussian data?"
back = "Precisions: 1/σ₀² + n/σ² is the posterior precision, the mean is the precision-weighted average of μ₀ and x̄, and the posterior variance is at most both the prior and the data variance."

[widgets."com.github.richbai90.stats.06-mmse.teach"]
type = "teach"
prompt = '''Teach Lesson 6 back: why the MMSE estimator is the posterior mean, and how the Gaussian–Gaussian conjugate pair produces the precision-weighted formula the course reuses everywhere.'''
key_points = '''- The posterior $p(\theta \mid x)$ is the complete inference; every estimator is a functional of it chosen by a loss. For squared error the answer is the posterior mean: $\hat\theta_{\mathrm{MMSE}} = \mathbb{E}[\theta \mid x]$.
- Why: split $\mathbb{E}[(g(X)-\theta)^2]$ into within-slice and between-slice parts. The within part is $\mathbb{E}[\operatorname{Var}(\theta \mid X)]$, fixed by the posterior and unavoidable; the between part is minimized exactly at the conditional mean.
- Gaussian–Gaussian conjugacy: precisions add, $\frac{1}{\sigma_{\text{post}}^2} = \frac{1}{\sigma_0^2} + \frac{n}{\sigma^2}$, and the mean is the precision-weighted average $\hat\theta = w\,\mu_0 + (1-w)\,\bar{x}$ with $w$ the prior-to-total precision ratio.
- No cliff: a vague prior returns the classical $\bar{x}$, a sharp prior or thin data slides the answer to the prior mean. The posterior variance is at most both the prior and the data variance — the update is bookkeeping in precision units.
- On the Gaussian-mean problem the deterministic CRLB, the vague-prior posterior variance, and the MSE of $\bar{X}$ all give $\sigma^2/n$; the views part company only when data is thin relative to prior knowledge.'''
hint = '''Present the shrinkage weight as an exchange rate between prior precision and data precision.'''

# ==== 07-bayes-map ====

[widgets."com.github.richbai90.stats.07-map.definition"]
type = "math"
label = "Maximum a posteriori"
tex = '\hat\theta_{\mathrm{MAP}} = \operatorname*{arg\,max}_\theta \; p(x \mid \theta)\, p(\theta)'
definitions = [
    { symbol = "p(x | θ) p(θ)", meaning = "likelihood times prior; p(x) drops out because it does not involve θ" },
    { symbol = "mode", meaning = "the highest point of the posterior; in logs, log-likelihood minus a prior penalty" },
    { symbol = "flat prior", meaning = "the MLE is exactly the MAP with a flat prior" },
]

[widgets."com.github.richbai90.stats.07-map.stepper_map"]
type = "stepper"
label = "MAP for the Gaussian–Gaussian pair"
steps = [
    { title = "Objective", text = "Maximize the log posterior; dropping p(x) leaves log-likelihood plus log prior." },
    { title = "Derivative", tex = '\frac{\partial}{\partial\theta}\left[\ln p(x \mid \theta) + \ln p(\theta)\right] = \frac{\bar{x} - \theta}{\sigma^{2}/n} - \frac{\theta - \mu_0}{\sigma_0^{2}}' },
    { title = "Solve", tex = '\hat\theta_{\mathrm{MAP}} = \frac{\mu_0/\sigma_0^{2} + n\bar{x}/\sigma^{2}}{1/\sigma_0^{2} + n/\sigma^{2}}' },
    { title = "Compare with MMSE", text = "Identical to the Lesson-6 posterior mean: the Gaussian posterior is symmetric, so its mode and mean agree. For skewed posteriors they part company." },
]

[widgets."com.github.richbai90.stats.07-map.quiz_mode"]
type = "quiz"
question = "For a right-skewed posterior such as a Gamma, how do MAP and MMSE compare?"
options = [
    "They coincide: mode equals mean",
    "MAP sits below MMSE: the mode slides into the skew while the mean stays pulled right",
    "MAP is always the larger of the two",
    "MAP does not exist for skewed posteriors",
]
answer = 1
explanation = "On skewed posteriors the mean exceeds the mode; the mode can even slide to a boundary while the mean stays interior. Which to use is a decision about the loss you will actually pay."

[widgets."com.github.richbai90.stats.07-map.lmmse"]
type = "math"
label = "Linear MMSE estimator"
tex = '\hat\theta_{\mathrm{LMMSE}} = \mu_\theta + \mathbf{C}_{\theta x}\mathbf{C}_{xx}^{-1}\!\left(\mathbf{x} - \boldsymbol\mu_x\right)'
definitions = [
    { symbol = "μ_θ, μ_x", meaning = "the means of parameter and data" },
    { symbol = "C_θx", meaning = "the cross-covariance between parameter and data: the statistical echo of the forward operator" },
    { symbol = "C_xx", meaning = "the data covariance matrix" },
]

[widgets."com.github.richbai90.stats.07-map.quiz_lmmse"]
type = "quiz"
question = "What does LMMSE require that MMSE does not?"
options = [
    "A Gaussian prior",
    "The full posterior distribution",
    "Only means and covariances: first and second moments",
    "A conjugate prior family",
]
answer = 2
explanation = "LMMSE optimizes over affine rules from second moments alone; no distributional assumption beyond covariances. For jointly Gaussian data it is the best estimator outright."

[widgets."com.github.richbai90.stats.07-map.ridge"]
type = "math"
label = "Gaussian MAP as regularized least squares"
tex = '\hat\theta = \operatorname*{arg\,min}_\theta \; \frac{1}{2\sigma^{2}}\left\|\mathbf{y} - \mathbf{H}\boldsymbol\theta\right\|^{2} + \frac{1}{2\sigma_0^{2}}\left\|\boldsymbol\theta - \boldsymbol\mu_0\right\|^{2}'
definitions = [
    { symbol = "σ², σ₀²", meaning = "noise and prior variances: their ratio is the exchange rate between data fit and prior plausibility" },
    { symbol = "‖·‖²", meaning = "squared Euclidean norm" },
    { symbol = "Tikhonov", meaning = "least squares with a quadratic penalty: the deterministic reading of this one line" },
]

[widgets."com.github.richbai90.stats.07-map.quiz_bridge"]
type = "quiz"
question = "The Gaussian MAP objective — least squares plus a quadratic penalty — is simultaneously which three things?"
options = [
    "The posterior mode, Tikhonov regularization, and a data-prior balance at exchange rate σ²/σ₀²",
    "The posterior mean, ridge regression, and a likelihood ratio",
    "The MLE, the Wiener filter, and the CRLB",
    "LMMSE, a sparsity penalty, and the ELBO",
]
answer = 0
explanation = "Three equivalent readings of one line — Bayesian, deterministic, and geometric. Module 3 takes the deterministic door and pushes much harder."

[widgets."com.github.richbai90.stats.07-map.card_map"]
type = "flashcard"
front = "Define the MAP estimator and its flat-prior limit."
back = "θ̂_MAP = argmax p(x|θ)p(θ): the posterior mode, i.e. log-likelihood minus a prior penalty in logs. A flat prior makes it exactly the MLE. For Gaussian–Gaussian models it coincides with the MMSE because the posterior is symmetric."

[widgets."com.github.richbai90.stats.07-map.card_lmmse"]
type = "flashcard"
front = "What does the LMMSE estimator assume?"
back = "Only first and second moments — means and covariances, no distributions. θ̂ = μ_θ + C_θx·C_xx⁻¹·(x − μ_x) is the best affine rule; for jointly Gaussian data it is the best estimator outright."

[widgets."com.github.richbai90.stats.07-map.teach"]
type = "teach"
prompt = '''Module 1 ends here. Teach the whole chain back: the observation model, sufficiency and the MVUE, the CRLB floor, maximum likelihood, the Bayesian posterior mean, and where MAP sits relative to it — then say why this lesson is the deterministic door into Module 3.'''
key_points = '''- MAP maximizes $p(x \mid \theta)\,p(\theta)$: the MLE is the MAP with a flat prior, and the negative log-prior enters the cost as a penalty term.
- The deterministic view (variance under unbiasedness, ranked against the CRLB) and the Bayesian view (average loss under the joint, the posterior mean for MMSE) are complementary scopes over the same equation.
- The linear-Gaussian case is the reconciliation: the LMMSE rule and the Gaussian posterior mean coincide, both exact, both achieved with the $w$-shrinkage from Lesson 6.
- Credible intervals are probability statements about $\theta$ given the data; confidence intervals are frequency statements about the procedure across hypothetical data. Never interchange them.
- The lesson closes by selecting the deterministic scope for Module 3's inverse problems: Gaussian noise and known structure, classical tools first, Bayesian answers in Module 4.'''
hint = '''Walk the module in order — model, sufficiency, bound, likelihood, posterior — and put MAP in its slot next to the posterior mean.'''

# ==== 08-assign-1a ====

[widgets."com.github.richbai90.stats.08-assign-1a.a1_gauss_mean"]
type = "assignment"
label = "Kay I · §7.2 · A1"
prompt = '''Eight independent samples from a Gaussian with unknown mean θ and known variance σ² = 4: $$x = (1.2,\; 2.4,\; 3.1,\; 2.9,\; 0.8,\; 1.6,\; 2.2,\; 1.8), \qquad \sum_i x_i = 16.0.$$ (a) Find the maximum likelihood estimate of θ. (b) Compute the Cramér–Rao lower bound on the variance of any unbiased estimator of θ, as a number. (c) Is the sample mean efficient for this problem? Justify your answer by comparing its variance with the bound.'''
hint = 'Set $(\sum_i x_i - n\theta)/\sigma^2$ to zero for the MLE; the Fisher information of the whole sample is $n/\sigma^2$.'
reference = '''**Setup.** For a Gaussian sample with known variance, $\ell(\theta) = -\sum_i (x_i-\theta)^2/(2\sigma^2) + \text{const}$.

**(a) MLE.** The score is $\partial\ell/\partial\theta = (\sum_i x_i - n\theta)/\sigma^2$. Setting it to zero with $\sum_i x_i = 16.0$ and $n = 8$:

$$\hat\theta_{\mathrm{ML}} = \bar{x} = \frac{16.0}{8} = 2.0$$

**(b) CRLB.** The Fisher information of the whole sample is $I(\theta) = n/\sigma^2 = 8/4 = 2$, so the bound is

$$\operatorname{Var} \ge \frac{1}{I(\theta)} = \frac{\sigma^2}{n} = \frac{4}{8} = 0.5$$

**(c) Efficiency.** $\operatorname{Var}(\bar{X}) = \sigma^2/n = 0.5$, exactly the bound: the sample mean is efficient. This is the Gaussian case — the log-likelihood is quadratic in $\theta$, so the error and the score are proportional and Cauchy–Schwarz is tight.

**Rubric notes.**
- Accept $\sigma^2/n$ or $0.5$ in (b); the equivalent form $1/(n/\sigma^2)$ is fine.
- A bound of $0.25$ confused one-sample information with n-sample information (it divides $\sigma^2$ by $n^2$) — partially correct at most.
- Part (c) requires the variance comparison; stating "efficient" without the argument does not earn the point.'''

[widgets."com.github.richbai90.stats.08-assign-1a.a2_bernoulli_rb"]
type = "assignment"
label = "Kay I · §3.5 · A2"
prompt = '''A coin with unknown heads probability p is flipped n = 6 times, and 4 heads are observed. (a) Use the factorization theorem to show that T, the number of heads, is sufficient for p. (b) Rao–Blackwellize the crude estimator that reports 1 if the first flip is heads and 0 otherwise: compute E[crude | T] and show that it equals k/n when T = k. (c) Give the variance of the Rao–Blackwellized estimator and compare it with the Cramér–Rao bound p(1−p)/n.'''
hint = 'For part (b) you need $P(x_1 = 1 \mid T = k)$: among the $\binom{n}{k}$ arrangements of $k$ heads in $n$ flips, count how many put a head first.'
reference = '''**(a) Sufficiency.** The likelihood is $p(x \mid p) = p^{k}(1-p)^{n-k}$, which factors as

$$p(x \mid p) = \underbrace{\left(\frac{p}{1-p}\right)^{k}(1-p)^{n}}_{g(T;\, p)} \cdot \underbrace{1}_{h(x)}$$

Only $T = k$ couples the data to $p$, so $T$ is sufficient.

**(b) Rao–Blackwell.** The crude estimator is $\delta = x_1$. The key identity is

$$P(x_1 = 1 \mid T = k) = \frac{k}{n}$$

(With $k$ heads among $n$ flips, every placement of the first flip is symmetric, so a fraction $k/n$ of arrangements put a head first.) Hence

$$\mathbb{E}[\delta \mid T] = P(x_1 = 1 \mid T) = \frac{k}{n}$$

On the observed data, $k = 4$, $n = 6$: the RB estimate is $4/6 = 2/3$.

**(c) Variance vs CRLB.** $T \sim \mathrm{Binomial}(n, p)$, so

$$\operatorname{Var}\!\left[\frac{k}{n}\right] = \frac{np(1-p)}{n^{2}} = \frac{p(1-p)}{n}$$

exactly the CRLB $p(1-p)/n$: the Rao–Blackwellized estimator is efficient, and because the Bernoulli family is exponential ($T$ complete), Lehmann–Scheffé makes it the unique MVUE.

**Rubric notes.**
- The identity $P(x_1 = 1 \mid T = k) = k/n$ is the heart of part (b); quoting the answer without it is partially correct.
- A variance of $2/27$ doubled the division (it divided $\operatorname{Var}(T) = np(1-p)$ by $n$ instead of $n^{2}$) — partially correct.
- Concluding "unique MVUE" requires invoking completeness (Lehmann–Scheffé), not Rao–Blackwell alone.'''

[widgets."com.github.richbai90.stats.08-assign-1a.a3_exponential_mle"]
type = "assignment"
label = "Kay I · §3.8 · A3"
prompt = '''Five independent inter-arrival times from an exponential distribution with rate λ: $$x = (2.1,\; 0.5,\; 1.3,\; 3.7,\; 2.4), \qquad \sum_i x_i = 10.0.$$ (a) Find the MLE of λ. Take care: the natural parameter of this model in exponential-family form is −λ. (b) Evaluate the Cramér–Rao lower bound for λ as a number at the MLE. (c) Is the MLE unbiased? If not, state the direction of the bias and justify it.'''
hint = 'The log-likelihood is $n\ln\lambda - \lambda\sum_i x_i$. For part (c), remember that $1/\bar{X}$ is not the mean of $1/X$: the sample mean of exponential data is Gamma distributed.'
reference = '''**(a) MLE.** The density is $p(x \mid \lambda) = \lambda e^{-\lambda x}$, so $\ell(\lambda) = n\ln\lambda - \lambda\sum_i x_i$. The score gives

$$\frac{n}{\lambda} = \sum_i x_i \quad\Longrightarrow\quad \hat\lambda = \frac{n}{\sum_i x_i} = \frac{1}{\bar{x}} = \frac{5}{10} = 0.5$$

(The natural parameter is $\eta = -\lambda$; dropping the sign while translating an answer back gives a negative rate — the trap.)

**(b) CRLB.** For one sample $I(\lambda) = 1/\lambda^{2}$, so for $n$ samples the bound is $\lambda^{2}/n$. Evaluated at the MLE:

$$\frac{\hat\lambda^{2}}{n} = \frac{0.25}{5} = 0.05$$

**(c) Bias.** The MLE is biased **high**. The sample mean of exponential data is $\bar{X} \sim \mathrm{Gamma}(n, \lambda)$ (shape–rate), and the mean of the inverse is

$$\mathbb{E}\!\left[\frac{1}{\bar{X}}\right] = \frac{n\lambda}{n-1} = \frac{5\lambda}{4} = 1.25\,\lambda$$

so $E[\hat\lambda] = 0.625$ when $\lambda = 0.5$. The reciprocal overweights the small realizations of $\bar{X}$ — Jensen at work.

**Rubric notes.**
- The bias claim in (c) needs a direction plus a justification (the Gamma mean of the inverse, or Jensen): noting only that $E[\bar{X}] = 1/\lambda$ so "$\hat\lambda = 1/\bar{X}$ looks unbiased" is incorrect reasoning.
- A CRLB of $\lambda/n$ (wrong power) or evaluating at $0.5$ with $n$ forgotten are partially correct at most.'''

[widgets."com.github.richbai90.stats.08-assign-1a.a4_gauss_variance"]
type = "assignment"
label = "Kay I · §7.6 · A4"
prompt = '''Six independent samples from a Gaussian with unknown mean μ and unknown variance σ²: $$x = (3.0,\; 1.0,\; 4.0,\; 2.0,\; 6.0,\; 2.0).$$ (a) Find the MLE of σ². (b) Give the unbiased estimator of σ² and its value on this data. (c) Evaluate the Cramér–Rao bound 2σ⁴/n at the MLE. (d) Does the unbiased estimator of (b) attain the bound? Compute its variance and explain.'''
hint = 'With both parameters unknown the CRLB for $\sigma^2$ is $2\sigma^4/n$, and the unbiased sample variance has $\operatorname{Var}(s^2) = 2\sigma^4/(n-1)$.'
reference = '''The sample mean is $\bar{x} = 18/6 = 3.0$ and the centered sum of squares is $\sum_i (x_i - \bar{x})^2 = 16$.

**(a) MLE.** $\hat\sigma^{2}_{\mathrm{ML}} = \frac{1}{n}\sum_i (x_i - \bar{x})^{2} = 16/6 = 8/3 \approx 2.667$.

**(b) Unbiased estimator.** $s^{2} = \frac{1}{n-1}\sum_i (x_i - \bar{x})^{2} = 16/5 = 3.2$.

**(c) Bound.** With both parameters unknown, $I(\sigma^{2}) = n/(2\sigma^{4})$, so

$$\mathrm{CRLB} = \frac{2\sigma^{4}}{n} \;\approx\; \frac{2\,(8/3)^{2}}{6} \approx 2.370 \quad \text{evaluated at } \hat\sigma^{2}$$

**(d) Attainment.** No. The variance of the unbiased sample variance is

$$\operatorname{Var}(s^{2}) = \frac{2\sigma^{4}}{n-1} \approx \frac{2\,(8/3)^{2}}{5} \approx 2.844 > 2.370$$

The error and the score are not proportional here — the log-likelihood is not quadratic in $\sigma^{2}$ — so no unbiased estimator attains the bound for finite $n$. This is the Lesson-3 example: the MVUE is asymptotically good but never efficient at finite $n$.

**Rubric notes.**
- Concluding efficiency in (d) is incorrect: the comparison $2.844 > 2.370$ must appear.
- Using $n$ instead of $n-1$ in the variance of $s^{2}$ (reporting 2.370) misses the point of the question — partially correct.
- Evaluating the bound at the true rather than estimated $\sigma^{2}$ is acceptable if stated.'''

[widgets."com.github.richbai90.stats.08-assign-1a.a5_line_fit"]
type = "assignment"
label = "Kay I · §4.3 · A5"
prompt = '''Three measurements at design times t = (0, 1, 2) give y = (1.1, 2.9, 5.2) under the linear model y = a + bt + n with n i.i.d. N(0, 1). (a) Write the normal equations and solve for the MLEs of a and b. (b) Give the covariance matrix of the estimate. (c) Compute the correlation between the two estimates and explain the sign of it from the design.'''
hint = 'First assemble $\mathbf{H}^{\mathsf T}\mathbf{H}$ and $\mathbf{H}^{\mathsf T}\mathbf{y}$ from the design rows $(1, 0)$, $(1, 1)$, $(1, 2)$; the covariance of the estimate is $\sigma^2(\mathbf{H}^{\mathsf T}\mathbf{H})^{-1}$.'
reference = '''The design matrix has rows $(1, t_i)$: $\mathbf{H} = \begin{bmatrix} 1 & 0 \\ 1 & 1 \\ 1 & 2 \end{bmatrix}$, so

$$\mathbf{H}^{\mathsf T}\mathbf{H} = \begin{bmatrix} 3 & 3 \\ 3 & 5 \end{bmatrix}, \qquad \mathbf{H}^{\mathsf T}\mathbf{y} = \begin{bmatrix} 9.2 \\ 13.3 \end{bmatrix}, \qquad \det = 6$$

**(a) Normal equations.** Solving $\mathbf{H}^{\mathsf T}\mathbf{H}\,\hat\theta = \mathbf{H}^{\mathsf T}\mathbf{y}$:

$$\hat{a} = \frac{5 \cdot 9.2 - 3 \cdot 13.3}{6} = \frac{61}{60} \approx 1.017, \qquad \hat{b} = \frac{-3 \cdot 9.2 + 3 \cdot 13.3}{6} = 2.05$$

**(b) Covariance.** With $\sigma^{2} = 1$:

$$\operatorname{Cov} = \sigma^{2}\left(\mathbf{H}^{\mathsf T}\mathbf{H}\right)^{-1} = \begin{bmatrix} 5/6 & -1/2 \\ -1/2 & 1/2 \end{bmatrix}$$

**(c) Correlation.** $\rho = \dfrac{-1/2}{\sqrt{(5/6)(1/2)}} \approx -0.775$. The sign is structural: every design time is $\ge 0$, so a steeper line must lower its intercept to stay close to the data — slope and intercept compete for the same three points. (Had the times been centered at zero, the off-diagonals would vanish.)

**Rubric notes.**
- The sign explanation in (c) must reference the design (non-negative times); "they are just correlated" does not earn the point.
- Swapping $\hat{a}$ and $\hat{b}$, or an inverted covariance matrix, are partially correct at most.'''

[widgets."com.github.richbai90.stats.08-assign-1a.card_efficiency_check"]
type = "flashcard"
front = "How do you check whether an estimator attains the CRLB?"
back = "Compute its variance and compare with 1/I(θ) (or the matrix form). Equality needs the error proportional to the score — a quadratic log-likelihood. The sample mean of a Gaussian: efficient. The sample variance of a Gaussian: never for finite n."

[widgets."com.github.richbai90.stats.08-assign-1a.card_rb_recipe"]
type = "flashcard"
front = "Recite the Rao–Blackwell three-step recipe."
back = "Find the sufficient statistic T by factoring the likelihood; pick any unbiased estimator; replace it with E[crude | T]. With complete T (exponential families) the result is the unique MVUE."

# ==== 09-assign-1b ====

[widgets."com.github.richbai90.stats.09-assign-1b.b1_gauss_posterior"]
type = "assignment"
label = "Kay I · §10.4 · B1"
prompt = '''A prior puts θ ~ N(1, 1). Four independent observations with known variance σ² = 2 give a sample mean x̄ = 2.25. (a) Compute the posterior distribution of θ. (b) Give the MMSE estimate. (c) Compare the posterior standard deviation with the data-only standard error σ/√n, and explain the difference.'''
hint = 'Precisions add: the posterior precision is $1/\sigma_0^2 + n/\sigma^2$, and the posterior mean is the precision-weighted average of $\mu_0$ and $\bar{x}$.'
reference = '''**(a) Posterior.** Prior precision $1/\sigma_0^{2} = 1$; data precision $n/\sigma^{2} = 4/2 = 2$; total precision $1 + 2 = 3$. Hence

$$p(\theta \mid \mathbf{x}) = \mathcal{N}\!\left(\frac{11}{6},\; \frac{1}{3}\right)$$

with mean $\dfrac{1 \cdot 1 + 2 \cdot 2.25}{3} = \dfrac{5.5}{3} = \dfrac{11}{6} \approx 1.833$ and variance $1/3 \approx 0.333$.

**(b) MMSE.** The posterior mean, $11/6 \approx 1.833$.

**(c) Comparison.** The posterior standard deviation is $\sqrt{1/3} \approx 0.577$, while the data-only standard error is $\sigma/\sqrt{n} = \sqrt{2}/2 \approx 0.707$. The posterior is tighter because **precision adds**: the total precision 3 exceeds the data precision 2. The prior is doing part of the work — with a vaguer prior the two numbers would converge.

**Rubric notes.**
- The mechanism to name is precision addition (inverse variance), not variance addition.
- Reporting the posterior variance $1/3$ as the standard deviation, or $0.707$ as the posterior sd, are partially correct at most.'''

[widgets."com.github.richbai90.stats.09-assign-1b.b2_poisson_map"]
type = "assignment"
label = "Kay I · §10.7 · B2"
prompt = '''A detector counts N = 7 photo-events in an exposure T = 1 from a source of rate λ. A prior gives λ an exponential distribution with rate 1/2 (mean 2). (a) Find the posterior distribution of λ. (b) Find the MAP estimate. (c) Find the MMSE estimate. (d) Explain why the MMSE is larger than the MAP here.'''
hint = 'Multiply the Poisson likelihood by the exponential prior density and read the Gamma shape and rate; the mode of a $\mathrm{Gamma}(\alpha, \beta)$ in shape–rate form is $(\alpha - 1)/\beta$.'
reference = '''**(a) Posterior.** With a flat-prior-reading as reference point: the likelihood $p(N \mid \lambda) \propto \lambda^{7} e^{-\lambda}$ times the prior density $\tfrac{1}{2}e^{-\lambda/2}$ gives

$$p(\lambda \mid N) \;\propto\; \lambda^{8-1} e^{-(3/2)\lambda} \qquad\Longrightarrow\qquad \mathrm{Gamma}\!\left(8,\; \frac{3}{2}\right) \ \text{(shape–rate)}$$

(An $\mathrm{Exponential}(1/2)$ prior is $\mathrm{Gamma}(1, 1/2)$; Poisson–Gamma conjugacy adds the count to the shape and the exposure to the rate.)

**(b) MAP.** The mode of a shape–rate Gamma is $(\alpha - 1)/\beta$:

$$\hat\lambda_{\mathrm{MAP}} = \frac{8 - 1}{3/2} = \frac{14}{3} \approx 4.67$$

**(c) MMSE.** The posterior mean is $\alpha/\beta$:

$$\hat\lambda_{\mathrm{MMSE}} = \frac{8}{3/2} = \frac{16}{3} \approx 5.33$$

**(d) Why mean > mode.** The Gamma posterior is right-skewed: the mode sits left of the bulk while the long right tail pulls the mean past it. The mode answers "where is the single most plausible rate", the mean answers "what rate minimizes squared error" — different losses, different points.

**Rubric notes.**
- A posterior of $\mathrm{Gamma}(8, 1)$ corresponds to a flat prior and loses part (a): the prior rate 1/2 must add to the rate.
- Swapping the mean and mode formulas ($(α−1)/β$ for the mean, $α/β$ for the mode) is partially correct.'''

[widgets."com.github.richbai90.stats.09-assign-1b.b3_lmmse"]
type = "assignment"
label = "Kay I · §12.3 · B3"
prompt = '''X ~ N(0, 1) is a signal and W ~ N(0, 2) is independent noise; you observe Y = X + W. (a) Find the LMMSE estimator of X in the form X̂ = wY. (b) Evaluate it at Y = 1.5. (c) Give the resulting mean-squared error.'''
hint = 'The LMMSE weight is $\operatorname{Cov}(X, Y)/\operatorname{Var}(Y)$, and here $\operatorname{Var}(Y) = \operatorname{Var}(X) + \operatorname{Var}(W)$.'
reference = '''**(a) Weight.** With $\operatorname{Cov}(X, Y) = \operatorname{Var}(X) = 1$ and $\operatorname{Var}(Y) = 1 + 2 = 3$:

$$w = \frac{\operatorname{Cov}(X, Y)}{\operatorname{Var}(Y)} = \frac{1}{3}$$

so $\hat{X} = Y/3$.

**(b) At Y = 1.5:** $\hat{X} = 1.5/3 = 0.5$.

**(c) Error.** For a linear estimator the MSE is $\operatorname{Var}(X) - w^{2}\operatorname{Var}(Y)$:

$$\mathrm{MMSE} = 1 - \frac{1}{9}\cdot 3 = 1 - \frac{1}{3} = \frac{2}{3} \approx 0.667$$

(Equivalently, $E[\operatorname{Var}(X \mid Y)]$: even optimal linear filtering leaves the noise-to-signal variance ratio intact.) Because the data is jointly Gaussian, this linear rule is also the global MMSE.

**Rubric notes.**
- A weight of $w = 1/2$ dropped the signal variance from $\operatorname{Var}(Y)$ (it used only $\operatorname{Var}(W) = 2$ in the denominator) — incorrect.
- Reporting the error as $1/3$ (the reduction rather than the remaining MSE) is partially correct.'''

[widgets."com.github.richbai90.stats.09-assign-1b.b4_beta_bernoulli"]
type = "assignment"
label = "Kay I · §10.2 · B4"
prompt = '''A Beta(2, 2) prior is placed on the success probability p of a coin. The coin is flipped n = 5 times and k = 3 heads are observed. (a) Find the posterior distribution of p. (b) Give the MMSE estimate. (c) Give the MAP estimate. (d) Give the MLE. (e) Give the posterior variance. Comment on the ordering of the three estimates.'''
hint = 'Beta conjugacy adds successes to $a_0$ and failures to $b_0$; the mode of $\mathrm{Beta}(a, b)$ is $(a - 1)/(a + b - 2)$.'
reference = '''**(a) Posterior.** $\mathrm{Beta}(a_0 + k,\; b_0 + n - k) = \mathrm{Beta}(5, 4)$.

**(b) MMSE.** The posterior mean: $a/(a+b) = 5/9 \approx 0.556$.

**(c) MAP.** The posterior mode: $(a-1)/(a+b-2) = 4/7 \approx 0.571$.

**(d) MLE.** $k/n = 3/5 = 0.6$.

**(e) Posterior variance.** $\dfrac{ab}{(a+b)^{2}(a+b+1)} = \dfrac{20}{81 \cdot 10} = \dfrac{2}{81} \approx 0.0247$.

**Ordering.** $\mathrm{MLE} > \mathrm{MAP} > \mathrm{MMSE}$: the Beta(2, 2) prior concentrates on 0.5 and pulls every Bayesian answer toward it — the mean moves most, the mode least. With more data all three would converge to the empirical frequency.

**Rubric notes.**
- Swapping the mean and mode formulas is the classic slip — partially correct.
- A posterior of $\mathrm{Beta}(3+2, 5-3)$ with $b_0$ forgotten is incorrect for (a).'''

[widgets."com.github.richbai90.stats.09-assign-1b.b5_discrete_prior"]
type = "assignment"
label = "Kay I · §10.8 · B5"
prompt = '''A prior gives θ = 0.5 probability 0.6 and θ = 0.8 probability 0.4. Observations are Bernoulli(θ). (i) For a single observation x = 1, compute the posterior probability of each value, the MAP estimate, and the posterior mean. (ii) Repeat for three observations x = (1, 0, 1). Comment on how the evidence moved the answer.'''
hint = 'For each hypothesis multiply the probabilities of the observed outcomes; track the likelihood ratio per success ($0.5/0.8$) and per failure ($0.5/0.2$).'
reference = '''**(i) One success.** Unnormalized: $0.6 \cdot 0.5 = 0.30$ vs $0.4 \cdot 0.8 = 0.32$; total $0.62$.

$$P(\theta = 0.8 \mid x = 1) = \frac{0.32}{0.62} \approx 0.516, \qquad P(\theta = 0.5 \mid x = 1) \approx 0.484$$

MAP $= 0.8$; posterior mean $= 0.484 \cdot 0.5 + 0.516 \cdot 0.8 \approx 0.655$.

**(ii) Success, failure, success.** Likelihoods: $0.5^{3} = 0.125$ vs $0.8^{2} \cdot 0.2 = 0.128$; unnormalized $0.6 \cdot 0.125 = 0.075$ vs $0.4 \cdot 0.128 = 0.0512$; total $0.1262$.

$$P(\theta = 0.8 \mid \mathbf{x}) = \frac{0.0512}{0.1262} \approx 0.406, \qquad P(\theta = 0.5 \mid \mathbf{x}) \approx 0.594$$

MAP $= 0.5$; posterior mean $= 0.594 \cdot 0.5 + 0.406 \cdot 0.8 \approx 0.622$.

**Teaching point.** Each success multiplies the likelihood ratio (0.5 vs 0.8) by $0.625$; each failure multiplies it by $2.5$. Two successes and one failure: $0.625^{2} \cdot 2.5 \approx 0.977$ — almost exactly neutral — so the prior ratio $1.5$ in favor of $\theta = 0.5$ decides. A single success was not enough to overcome the prior; the failure was.

**Rubric notes.**
- Inverting the likelihood (successes favoring $\theta = 0.5$) is incorrect: a success is more probable under the larger $\theta$.
- Correct posteriors with a mislabeled MAP or mean are partially correct.'''

[widgets."com.github.richbai90.stats.09-assign-1b.card_conjugacy"]
type = "flashcard"
front = "State the three conjugate pairs used in Module 1."
back = "Gaussian–Gaussian: precision adds, posterior Gaussian. Gamma–Poisson: Exponential(β) prior plus count N in time T gives Gamma(N+1, β+T). Beta–Bernoulli: Beta(a₀, b₀) prior plus k successes in n trials gives Beta(a₀+k, b₀+n−k)."

[widgets."com.github.richbai90.stats.09-assign-1b.card_mean_vs_mode"]
type = "flashcard"
front = "When do the posterior mean and mode disagree, and which should you use?"
back = "On skewed posteriors (Gamma, exponential, bounded parameters): mean > mode for right skew. Use the mode for one-true-value narratives (MAP), the mean for squared-error loss (MMSE)."
# ==== 10-random-processes ====

[widgets."com.github.richbai90.stats.10-random-processes.ac"]
type = "math"
label = "Wide-sense stationarity"
tex = '\mathbb{E}[x(n)] = \mu_x \;\; \text{for all } n, \qquad r_x(k) = \mathbb{E}\left[x(n+k)\, x^{*}(n)\right]'
definitions = [
    { symbol = "r_x(k)", meaning = "autocorrelation at lag k: the second-order memory of the process; it depends on the lag alone, not on n", link = "/course/stats/about#notation" },
    { symbol = "x*(n)", meaning = "complex conjugate; for real processes it drops and the autocorrelation is symmetric, r_x(-k) = r_x(k)" },
    { symbol = "WSS", meaning = "wide-sense stationary: constant mean plus lag-only autocorrelation; a modeling decision, not a law of nature" },
]

[widgets."com.github.richbai90.stats.10-random-processes.wk"]
type = "math"
label = "Wiener–Khinchin theorem"
tex = 'S_x(f) = \sum_{k=-\infty}^{\infty} r_x(k)\, e^{-j2\pi f k} \;\;\Longleftrightarrow\;\; r_x(k) = \int_{-1/2}^{1/2} S_x(f)\, e^{j2\pi f k}\, \mathrm{d}f'
definitions = [
    { symbol = "S_x(f)", meaning = "power spectral density: power per unit frequency; nonnegative, and its integral over the band equals the power r_x(0)" },
    { symbol = "f", meaning = "discrete-time frequency in cycles per sample, on the band from -1/2 to 1/2", link = "/course/stats/about#notation" },
    { symbol = "white noise", meaning = "the flat extreme: S(f) = σ² at every frequency and the autocorrelation is a spike at lag zero" },
]

[widgets."com.github.richbai90.stats.10-random-processes.inter_psd"]
type = "interactive"
title = "AR(1) power spectrum (square-root scale)"
xlabel = "f"
ylabel = "relative power"
expression = '1/sqrt(1 - 2*p*cos(2*pi*x) + p*p)'
domain = [0.0, 0.5]
parameters = [
    { name = "p", label = "pole radius", min = 0.1, max = 0.95, step = 0.05, initial = 0.5 },
]
readout = "f = {x:0.2f}, relative power = {y:0.3f}, pole radius = {p:0.2f}"

[widgets."com.github.richbai90.stats.10-random-processes.factorization"]
type = "math"
label = "Minimum-phase spectral factorization"
tex = 'S_x(f) = \sigma_{w}^{2}\,\left|\frac{B(e^{-j2\pi f})}{A(e^{-j2\pi f})}\right|^{2}, \qquad B, A \text{ minimum phase}'
definitions = [
    { symbol = "B/A", meaning = "the shaping filter: white noise in, the modeled process out; the scale is set by the driving-noise power" },
    { symbol = "minimum phase", meaning = "all poles and zeros inside the unit circle: the factor is stable and causally invertible" },
    { symbol = "whitening filter", meaning = "the causal inverse A/B: it turns the process back into white noise" },
]

[widgets."com.github.richbai90.stats.10-random-processes.toeplitz"]
type = "math"
label = "The Toeplitz covariance"
tex = '\mathbf{R}_x = \begin{bmatrix} r_x(0) & r_x(1) & \cdots & r_x(N-1) \\ r_x(1) & r_x(0) & \cdots & r_x(N-2) \\ \vdots & \vdots & \ddots & \vdots \\ r_x(N-1) & r_x(N-2) & \cdots & r_x(0) \end{bmatrix}'
definitions = [
    { symbol = "R_x", meaning = "covariance of a length-N block of samples; Toeplitz means entry (i, j) depends only on i - j", link = "/course/stats/about#notation" },
    { symbol = "N values", meaning = "r_x(0) through r_x(N-1) determine the whole matrix: N numbers instead of N² entries" },
    { symbol = "conditioning", meaning = "a sharply peaked spectrum makes R_x ill-conditioned; precision of every linear estimator on the block dies through that" },
]

[widgets."com.github.richbai90.stats.10-random-processes.quiz_wss"]
type = "quiz"
question = "A vibration record has zero mean and an autocorrelation that depends only on the time lag. What follows?"
options = [
    "The process is wide-sense stationary",
    "The process is Gaussian",
    "The power spectrum is flat",
    "Successive samples are independent",
]
answer = 0
explanation = "Constant mean plus lag-only autocorrelation is exactly wide-sense stationarity. It says nothing about Gaussianity, which is a higher-order property, nor about spectral flatness or independence."

[widgets."com.github.richbai90.stats.10-random-processes.quiz_toeplitz"]
type = "quiz"
question = "What does wide-sense stationarity buy you at the matrix level?"
options = [
    "The covariance matrix becomes diagonal",
    "The covariance matrix becomes singular",
    "Entry (i, j) of the covariance depends only on i - j, so N samples pin the matrix down with N numbers",
    "The covariance matrix drops rank by one at every additional lag",
]
answer = 2
explanation = "Toeplitz structure: constant diagonals, symmetric, fully determined by the first column. That redundancy is what the Levinson-Durbin recursion exploits to beat cubic cost."

[widgets."com.github.richbai90.stats.10-random-processes.card_wss"]
type = "flashcard"
front = "Define wide-sense stationarity."
back = "Constant mean, and autocorrelation depending on the lag alone: r_x(k) = E[x(n+k)x*(n)] for every n. One function of one integer then carries all the second-order physics: power at lag zero, memory in the decay, oscillation where it rings."

[widgets."com.github.richbai90.stats.10-random-processes.card_psd"]
type = "flashcard"
front = "State Wiener-Khinchin and the two constraints every power spectrum obeys."
back = "The power spectral density is the Fourier transform of the autocorrelation, and the transform is invertible. Every PSD is nonnegative and integrates to the total power r_x(0); the time and frequency pictures allocate the same budget."
[widgets."com.github.richbai90.stats.10-random-processes.teach"]
type = "teach"
prompt = '''Every algorithm in Module 2 feeds on the structure built in this lesson. Teach it back: what WSS means, the two pictures of covariance (time-lag and spectrum), the exact Toeplitz bridge between them, and how the ladder to Lesson 16 is stacked.'''
key_points = '''- WSS = constant mean plus autocovariance depending only on lag $k$; one $c(k)$ plus the mean completely characterizes second-order structure.
- Two pictures of the same object: $c(k)$ in the time domain, the PSD $P(\omega)$ in the frequency domain, related by the Wiener–Khinchin theorem — PSD is the Fourier transform of covariance.
- Finite samples turn covariance into a Toeplitz matrix whose entries are exactly the covariances at each lag; Toeplitz structure is what makes linear prediction, Levinson, and spectral estimation tractable.
- The ladder: this lesson (WSS, PSD, Toeplitz) → Lesson 11 (rational spectra, AR/MA models) → Lesson 12 (Levinson fast factorization) → Lesson 13 (Wiener filter from the PSDs) → Lesson 15 (state space, innovations) → Lesson 16 (Kalman recursion).
- The ladder is a sequence of re-samplings of one problem — the optimal linear processing of a second-order signal — each form chosen for the constraint it satisfies: memory, causality, time, or learning.'''
hint = '''Draw the ladder from WSS up to Kalman, and say at each rung which constraint is newly satisfied.'''

# ==== 11-signal-modeling ====

[widgets."com.github.richbai90.stats.11-signal-modeling.arma"]
type = "math"
label = "The rational model"
tex = 'H(z) = \frac{B(z)}{A(z)}, \qquad A(z) = 1 - \sum_{k=1}^{p} a_k z^{-k}, \quad B(z) = \sum_{k=0}^{q} b_k z^{-k}'
definitions = [
    { symbol = "AR", meaning = "autoregressive: all pole, B(z) = b0; resonances and ringing live in poles near the unit circle" },
    { symbol = "MA", meaning = "moving average: all zero, A(z) = 1; notches and nulls live in zeros" },
    { symbol = "ARMA", meaning = "both pole and zero structure: p poles and q zeros compress the physics into p + q + 1 coefficients" },
]

[widgets."com.github.richbai90.stats.11-signal-modeling.pade"]
type = "math"
label = "The Padé tail equation"
tex = 'H(z)\, A(z) = B(z) \;\;\Longrightarrow\;\; h(n) - \sum_{k=1}^{p} a_k\, h(n-k) = 0, \qquad n > q'
definitions = [
    { symbol = "h(n)", meaning = "the measured impulse response: p + q + 1 of its samples are taken as exact" },
    { symbol = "n > q", meaning = "past the numerator support the denominator recursion runs alone; these p equations pin the poles" },
    { symbol = "Padé", meaning = "solve the tail exactly, then read b off the first q + 1 coefficients; exact and brittle under noise" },
]

[widgets."com.github.richbai90.stats.11-signal-modeling.stepper_prony"]
type = "stepper"
label = "Prony, step by step"
steps = [
    { title = "Keep the tail, drop the trust", text = "Every sample past lag q still obeys the homogeneous recursion. Prony uses all of them instead of exactly p." },
    { title = "Overdetermined tail", tex = '\min_{a_1, \ldots, a_p} \; \sum_{n=q+1}^{N} \left( h(n) - \sum_{k=1}^{p} a_k\, h(n-k) \right)^{2}' },
    { title = "Normal equations", tex = '\left(\mathbf{H}^{\mathsf{T}}\mathbf{H}\right)\mathbf{a} = \mathbf{H}^{\mathsf{T}}\mathbf{h}, \qquad [\mathbf{H}]_{nk} = h(n-k)', note = "The same normal-equations structure as the linear least squares of Module 1, now on the tail of the response." },
    { title = "Recover the numerator", tex = 'b_k = h(k) - \sum_{i=1}^{\min(k,p)} a_i\, h(k-i)', note = "Matching the convolution at low lags; Prony sacrifices exactness exactly here." },
    { title = "The model is the operator", text = "A and B in hand, the spectrum, the whitening filter, and the structured forward operator of later modules all follow. Noisy data: the least-squares tail is the only workable recipe." },
]

[widgets."com.github.richbai90.stats.11-signal-modeling.ar_spectrum"]
type = "math"
label = "All-pole power spectrum"
tex = 'S_x(f) = \frac{\sigma_{w}^{2}}{\left|A(e^{-j2\pi f})\right|^{2}} = \frac{\sigma_{w}^{2}}{\left|1 - \sum_{k=1}^{p} a_k\, e^{-j2\pi f k}\right|^{2}}'
definitions = [
    { symbol = "poles", meaning = "each pole pair lifts the spectrum near its frequency; the distance to the unit circle sets the width of the lift" },
    { symbol = "sigma_w²", meaning = "the driving-noise power: it sets only the scale of the spectrum, never the shape" },
    { symbol = "shape", meaning = "the denominator coefficients alone decide the spectral shape; this is why autocorrelation data can recover the model" },
]

[widgets."com.github.richbai90.stats.11-signal-modeling.quiz_model"]
type = "quiz"
question = "A guitar string rings near 440 Hz with slowly decaying amplitude. Which model class captures that with the fewest parameters?"
options = [
    "A moving-average model: many taps, no poles",
    "A flat spectrum with a single notch",
    "Any class, since all rational models are equivalent",
    "An all-pole model: one complex pole pair just inside the unit circle at the resonance",
]
answer = 3
explanation = "Ringing is a pole close to the unit circle at the resonant frequency. Two parameters place that pole pair; an all-zero model needs a long FIR to imitate the same decay."

[widgets."com.github.richbai90.stats.11-signal-modeling.quiz_prony"]
type = "quiz"
question = "How does Prony differ from Padé on the same measured response?"
options = [
    "Prony matches the low-order samples exactly and ignores the tail",
    "Prony fits the whole tail by least squares, trading exactness at low n for a global fit that survives noise",
    "Prony needs no model order to be chosen",
    "Prony estimates the noise variance instead of the model",
]
answer = 1
explanation = "Pade solves exactly p tail equations. Prony keeps all available tail equations and solves them by least squares: redundant evidence against noise, at the price of no longer matching any single sample exactly."

[widgets."com.github.richbai90.stats.11-signal-modeling.card_rational"]
type = "flashcard"
front = "Name the three rational model classes and what each is for."
back = "AR: all pole, for resonances. MA: all zero, for notches. ARMA: both. The rational transfer function B over A is the structured forward operator of Module 2: a few coefficients encode the physics."

[widgets."com.github.richbai90.stats.11-signal-modeling.card_pade_prony"]
type = "flashcard"
front = "Which single equation do Padé and Prony both build on?"
back = "The homogeneous tail: past the numerator support, h(n) = the sum of a_k h(n-k). Pade solves p of those equations exactly; Prony fits all of them by least squares."
# ==== 12-levinson-lattice ====

[widgets."com.github.richbai90.stats.12-levinson-lattice.yw"]
type = "math"
label = "The Yule–Walker equations"
tex = '\sum_{k=1}^{p} a_k\, r_x(i-k) = r_x(i), \quad i = 1, \ldots, p \;\;\Longleftrightarrow\;\; \mathbf{R}_p\, \mathbf{a} = \mathbf{r}_p'
definitions = [
    { symbol = "R_p", meaning = "the p by p Toeplitz autocorrelation matrix from Lesson 10; symmetric and positive definite" },
    { symbol = "a", meaning = "the AR denominator coefficients of x(n) = sum a_k x(n-k) + w(n): the physics the autocorrelation already knows" },
    { symbol = "E_p", meaning = "prediction-error power at order p: E_p = r_x(0) - sum a_k r_x(k), the driving-noise power of the fitted model" },
]

[widgets."com.github.richbai90.stats.12-levinson-lattice.stepper_levinson"]
type = "stepper"
label = "Levinson–Durbin, step by step"
steps = [
    { title = "Order one", tex = 'a_1(1) = k_1 = \frac{r_x(1)}{r_x(0)}, \qquad \mathcal{E}_1 = r_x(0)\left(1 - k_1^{2}\right)' },
    { title = "The mismatch at lag m", tex = '\Delta_m = r_x(m) - \sum_{i=1}^{m-1} a_{m-1}(i)\, r_x(m-i)', note = "How far the measured autocorrelation at lag m is from the best order-(m-1) extrapolation. This single scalar drives the whole update." },
    { title = "Reflection coefficient", tex = 'k_m = \frac{\Delta_m}{\mathcal{E}_{m-1}}' },
    { title = "Fold the coefficients", tex = 'a_m(i) = a_{m-1}(i) - k_m\, a_{m-1}(m-i), \qquad a_m(m) = k_m', note = "The new model is the old one minus k_m times its own reversal: the Toeplitz symmetry at work." },
    { title = "Update the error", tex = '\mathcal{E}_m = \left(1 - k_m^{2}\right)\,\mathcal{E}_{m-1}', note = "Never grows. While it stays positive every k is inside the unit circle and the model of every order is stable. Cost: O(p²) total instead of O(p³)." },
]

[widgets."com.github.richbai90.stats.12-levinson-lattice.reflection"]
type = "math"
label = "Reflection coefficient"
tex = 'k_m = \frac{r_x(m) - \sum_{i=1}^{m-1} a_{m-1}(i)\, r_x(m-i)}{\mathcal{E}_{m-1}}'
definitions = [
    { symbol = "k_m", meaning = "the mismatch between extrapolated and measured autocorrelation, normalized by the error power; in wave physics, the fraction of a wave reflected at the m-th interface" },
    { symbol = "|k_m| < 1", meaning = "equivalent to positive prediction-error power; the stability certificate of the order-m model" },
    { symbol = "parameterization", meaning = "k_1 through k_p describe the process as completely as the a coefficients, with stability built into the range" },
]

[widgets."com.github.richbai90.stats.12-levinson-lattice.order_recursion"]
type = "math"
label = "Order recursion and error update"
tex = 'a_m(i) = a_{m-1}(i) - k_m\, a_{m-1}(m-i), \qquad \mathcal{E}_m = \left(1 - k_m^{2}\right)\mathcal{E}_{m-1}'
definitions = [
    { symbol = "reversal", meaning = "the update folds the coefficient vector against its own mirror image; Toeplitz structure is what makes one scalar enough to move up an order" },
    { symbol = "E_m", meaning = "prediction-error power at order m; it shrinks monotonically and its plateau is the practical model-order selector" },
]

[widgets."com.github.richbai90.stats.12-levinson-lattice.lattice"]
type = "math"
label = "The lattice filter"
tex = 'f_m(n) = f_{m-1}(n) + k_m\, b_{m-1}(n-1), \qquad b_m(n) = b_{m-1}(n-1) + k_m\, f_{m-1}(n)'
definitions = [
    { symbol = "f_m", meaning = "forward prediction error at stage m: next sample minus its prediction from the recent past" },
    { symbol = "b_m", meaning = "backward prediction error: predicting the distant past from the recent present; its orthogonality is the lattice strength" },
    { symbol = "stages", meaning = "identical two-port stages, each coupling the two errors once with k_m; order-adaptive and numerically robust" },
]

[widgets."com.github.richbai90.stats.12-levinson-lattice.quiz_structure"]
type = "quiz"
question = "What structural property of the Yule-Walker matrix lets Levinson-Durbin beat a general linear solve?"
options = [
    "It is diagonal plus a rank-one term",
    "It is sparse: most entries are exactly zero",
    "It is orthogonal, so the solve is a rotation",
    "It is Toeplitz, so the order-m solution is one reflection coefficient away from the order-(m-1) solution",
]
answer = 3
explanation = "Toeplitz shift structure is what the recursion consumes: each order reuses the previous order at O(m) cost. Total O(p²) instead of O(p³), and every intermediate model is itself usable."

[widgets."com.github.richbai90.stats.12-levinson-lattice.quiz_stability"]
type = "quiz"
question = "The prediction-error power stayed positive at every order of the recursion. What has been certified?"
options = [
    "The process is Gaussian",
    "Every reflection coefficient has magnitude below one, so the model of every order is stable and minimum phase",
    "The spectrum is flat",
    "The chosen model order is high enough",
]
answer = 1
explanation = "The error update E_m = (1 - k_m²) E_{m-1} with positive E_m forces |k_m| < 1 at each order, which is exactly the minimum-phase condition for the AR polynomial. Nothing here speaks to Gaussianity or to model order."

[widgets."com.github.richbai90.stats.12-levinson-lattice.card_levinson"]
type = "flashcard"
front = "State the Levinson-Durbin update in words."
back = "One new number per order: the reflection coefficient k_m measures how much the process extends beyond what the previous order predicts. Coefficients fold against their own reversal, and the error power shrinks by the factor 1 - k_m². Total cost O(p²)."

[widgets."com.github.richbai90.stats.12-levinson-lattice.card_lattice"]
type = "flashcard"
front = "What do the reflection coefficients parameterize, and why is that useful?"
back = "The lattice filter: k_m are the couplings between forward and backward prediction errors in a cascade of identical stages. Bounded by one, computable in place, and a complete re-parameterization of the model with stability built in."
[widgets."com.github.richbai90.stats.11-signal-modeling.teach"]
type = "teach"
prompt = '''The rational model's shape is what the forward operator keeps for the rest of the course. Teach it back: the AR/MA/ARMA classes, the Padé–Prony trade, why modelers lean AR, and the relationship between poles and spectrum.'''
key_points = '''- The rational classes: AR has poles only and a one-sided memory; MA has zeros only; ARMA combines both. The denominator of the rational model carries the resonances, so poles control the spectrum.
- Padé approximation matches a truncated series exactly and places poles wherever needed — good short-time fit, possibly unstable poles. Prony solves a nonlinear equation for the most accurate AR/ARMA fit — better long-run fit, harder numerics.
- AR is preferred: parsimony — a few poles capture long memory with few parameters — and the all-pole PSD is $b_0^2 / |A(e^{j\omega})|^2$, a bright peak at each resonance.
- The Yule–Walker equations link the model to data: $N$ equations in the coefficients, solved by Levinson in $O(N^2)$ (Lesson 12).
- The choice of model order is a cost: more parameters buy a closer fit but pay an Occam price (Lesson 37) and risk fitting the noise rather than the signal.'''
hint = '''Anchor on the denominator: poles are where the spectrum does its work.'''


# ==== 13-wiener ====

[widgets."com.github.richbai90.stats.13-wiener.normal"]
type = "math"
label = "Wiener–Hopf normal equations"
tex = '\mathbf{R}_y\, \mathbf{c} = \mathbf{r}_{yx}, \qquad \hat{x}(n) = \sum_{i=0}^{M-1} c(i)\, y(n-i)'
definitions = [
    { symbol = "c", meaning = "the M FIR taps; the whole design is one linear solve" },
    { symbol = "R_y", meaning = "Toeplitz autocorrelation of the observations; Levinson-class solvers apply at O(M²) cost" },
    { symbol = "orthogonality", meaning = "at the optimum E[e(n) y(n-i)] = 0 for every tap lag: the projection of x onto the data span, and nothing linear does better" },
]

[widgets."com.github.richbai90.stats.13-wiener.mmse"]
type = "math"
label = "The minimum mean-squared error"
tex = '\mathrm{MMSE} = r_x(0) - \mathbf{r}_{yx}^{\mathsf{T}}\, \mathbf{R}_y^{-1}\, \mathbf{r}_{yx}'
definitions = [
    { symbol = "r_x(0)", meaning = "the signal power you started with" },
    { symbol = "subtracted term", meaning = "the power the projection removed; the same ledger as the Gaussian posterior variance of Lesson 6" },
]

[widgets."com.github.richbai90.stats.13-wiener.stepper_noncausal"]
type = "stepper"
label = "Noncausal Wiener filtering, step by step"
steps = [
    { title = "The target", text = "Estimate x from y = x + v with no causality constraint: the estimator is any stable filter H(f) applied to the whole record." },
    { title = "Split the error spectrum", tex = '\mathrm{MMSE} = \int_{-1/2}^{1/2} \left( \left|H(f) - 1\right|^{2} S_x(f) + \left|H(f)\right|^{2} S_v(f) \right) \mathrm{d}f', note = "The cross terms vanish because signal and noise are uncorrelated: the error is signal leakage plus passed noise." },
    { title = "Minimize pointwise", tex = 'H(f) = \frac{S_x(f)}{S_x(f) + S_v(f)}', note = "The integrand is a nonnegative quadratic in H at each frequency: minimize it independently everywhere." },
    { title = "Read the shape", text = "Where the signal dominates, H approaches one and the band passes; where noise dominates, H approaches zero and the band rejects. A soft SNR weighting with no sharp cutoff anywhere." },
    { title = "The catch", text = "H(f) generally needs the future of y. Real-time operation is a constraint, and constraints have a price the causal design pays in the next panel." },
]

[widgets."com.github.richbai90.stats.13-wiener.causal"]
type = "math"
label = "Causal Wiener filter"
tex = 'H_{c}(z) = \frac{1}{\sigma_{e}^{2}\, Q(z)} \left[ \frac{S_{xy}(z)}{Q^{*}\!\left(1/z^{*}\right)} \right]_{+}'
definitions = [
    { symbol = "Q", meaning = "the minimum-phase spectral factor of the total observation spectrum S_y = S_x + S_v: the whitening filter" },
    { symbol = "[ ]+", meaning = "keep only the positive-time (causal) part of the impulse response: the projection principle in the time domain" },
    { symbol = "σ_e²", meaning = "the innovations variance after whitening; the scale that normalizes the projection" },
]

[widgets."com.github.richbai90.stats.13-wiener.quiz_orthogonality"]
type = "quiz"
question = "The optimal FIR Wiener filter satisfies E[e(n) y(n-i)] = 0 at every tap lag. What does the orthogonality principle mean?"
options = [
    "The error process is Gaussian",
    "No removable error remains in the directions the data offers; anything left is invisible to linear filtering",
    "The filter has zero gain at every frequency",
    "The estimate is unbiased by construction",
]
answer = 1
explanation = "Orthogonality is the projection statement: the residual is uncorrelated with the data span. Any surviving correlation would define a strictly better linear filter, so none survives."

[widgets."com.github.richbai90.stats.13-wiener.quiz_causal"]
type = "quiz"
question = "What does the positive-time projection buy in the causal Wiener design, and what does it cost?"
options = [
    "It enforces real-time realizability; the cost is the discarded negative-time half of the whitened cross-spectrum, so the causal filter never beats the noncausal one",
    "It drives the error below the Cramér-Rao bound",
    "It removes the need to know the noise spectrum",
    "It turns the infinite-impulse-response filter into an FIR one",
]
answer = 0
explanation = "Causality is a constraint, and the projection is how the constraint enters: whiten, keep positive time, unwhiten. The noncausal divider S_x over S_x + S_v remains the bound the causal design reaches for."

[widgets."com.github.richbai90.stats.13-wiener.card_normal"]
type = "flashcard"
front = "State the FIR Wiener normal equations and the resulting error."
back = "R_y c = r_yx, with MMSE = r_x(0) - r_xy R_y^{-1} r_yx. R_y is Toeplitz so Levinson-class solvers apply, and the orthogonality principle E[e y] = 0 is the entire derivation: projection onto the data span."

[widgets."com.github.richbai90.stats.13-wiener.card_snr"]
type = "flashcard"
front = "What is the noncausal Wiener filter at each frequency?"
back = "H(f) = S_x / (S_x + S_v): pass where the signal dominates, reject where noise dominates, soft weighting everywhere. The causal version whitens with the spectral factor of the total spectrum and keeps only positive time."
[widgets."com.github.richbai90.stats.13-wiener.teach"]
type = "teach"
prompt = '''The orthogonality principle is the load-bearing idea of all linear estimation. Teach it back: the statement, why it gives the normal equations, what the solution looks like in frequency, and what causality costs.'''
key_points = '''- The principle: to be optimal, the estimation error $e = x - \hat{x}$ must be uncorrelated with everything you already used — with the data, and with itself at every lag. Correlation left over is information you failed to extract.
- From the principle to the equations: setting covariances to zero produces the Wiener–Hopf equations $R\,\mathbf{c} = \mathbf{r}_{yx}$, a Toeplitz system; solve it with Levinson (Lesson 12) or, for scalar frequency response, the PSD ratio $H(\omega) = P_{xy}(\omega)/P_x(\omega)$.
- The MMSE is the leftover variance: the PSD of the error integrated over frequency, the part of $x$'s power no linear filter can reach.
- Causality is the price of real time: the causal Wiener filter needs a spectral factorization and is strictly worse than the noncausal one by the variance of the discarded future. Smoothing pays nothing for the future; filtering pays for it; prediction pays the most (Lesson 15's one-step limit).
- The bridge to Bayesian: for jointly Gaussian signals the linear-optimal filter is also the conditional mean — the same shrinkage weight as Lesson 6, spread across frequency.'''
hint = '''Lead with the projection statement — the error is orthogonal to the data — and treat everything else as bookkeeping on that fact.'''

# ==== 14-spectrum-estimation ====

[widgets."com.github.richbai90.stats.14-spectrum-estimation.periodogram"]
type = "math"
label = "The periodogram"
tex = '\hat{P}(f) = \frac{1}{N}\left|\sum_{n=0}^{N-1} x(n)\, e^{-j2\pi f n}\right|^{2}'
definitions = [
    { symbol = "asymptotically unbiased", meaning = "the mean of the periodogram approaches the true PSD as the record grows" },
    { symbol = "not consistent", meaning = "the variance does not shrink with N: it stays near the squared PSD; a longer record buys resolution, not stability" },
    { symbol = "leakage", meaning = "the finite record multiplies the data by a rectangle, whose sidelobes smear power across frequencies" },
]

[widgets."com.github.richbai90.stats.14-spectrum-estimation.welch"]
type = "math"
label = "Welch averaging"
tex = '\hat{P}_{W}(f) = \frac{1}{K\,L\,U} \sum_{i=0}^{K-1} \left|\sum_{n=0}^{L-1} x(iR + n)\, w(n)\, e^{-j2\pi f n}\right|^{2}'
definitions = [
    { symbol = "K, L, R", meaning = "K segments of length L advancing by R samples; overlapping segments buy more averages from the same record" },
    { symbol = "w, U", meaning = "the data window and its power normalization: leakage tamed at the price of a wider main lobe" },
    { symbol = "the trade", meaning = "variance falls like 1/K while resolution falls to the segment width 1/L: the bias-variance ledger, in frequency" },
]

[widgets."com.github.richbai90.stats.14-spectrum-estimation.mvdr"]
type = "math"
label = "MVDR (Capon) pseudo-spectrum"
tex = '\hat{P}_{MVDR}(f) = \frac{1}{\mathbf{a}^{H}(f)\, \mathbf{R}^{-1}\, \mathbf{a}(f)}'
definitions = [
    { symbol = "a(f)", meaning = "the steering vector: how a complex sinusoid at frequency f appears across the record or array" },
    { symbol = "R^{-1}", meaning = "the inverse covariance: the band that passes f with unit gain while minimizing output power, aware of everything else in the spectrum" },
    { symbol = "the cost", meaning = "needs a covariance estimate good enough to invert; short or ill-conditioned records break it exactly where it should help" },
]

[widgets."com.github.richbai90.stats.14-spectrum-estimation.music"]
type = "math"
label = "MUSIC pseudo-spectrum"
tex = 'P_{MU}(f) = \frac{1}{\sum_{i=m+1}^{M} \left|\mathbf{a}^{H}(f)\, \mathbf{q}_i\right|^{2}}'
definitions = [
    { symbol = "q_i", meaning = "the noise-subspace eigenvectors of the measured covariance, beyond the m signal directions" },
    { symbol = "the spike", meaning = "at a true line frequency the steering vector is orthogonal to the whole noise subspace and the denominator vanishes" },
    { symbol = "the bet", meaning = "super-resolution rests on the model: a few lines in white noise. If the model is fiction, the resolution is confident nonsense" },
]

[widgets."com.github.richbai90.stats.14-spectrum-estimation.quiz_averaging"]
type = "quiz"
question = "Welch splits a record into K segments and averages their periodograms. What is traded for the variance reduction?"
options = [
    "The estimate stops being nonnegative",
    "Frequency resolution falls from 1/N to the segment width 1/L",
    "The bias grows without bound as K rises",
    "Nothing: averaging only removes variance",
]
answer = 1
explanation = "Averaging shrinks variance like 1/K but resolution drops to the segment length 1/L. The window keeps bias controlled but widens the main lobe. You choose where to sit on the ledger, not whether it exists."

[widgets."com.github.richbai90.stats.14-spectrum-estimation.quiz_resolution"]
type = "quiz"
question = "Two sinusoids separated by less than about 1/N cycles per sample. What can the periodogram do?"
options = [
    "It resolves them if you zero-pad the record before transforming",
    "It resolves them if you average more segments",
    "It shows both peaks but at the wrong frequencies",
    "It shows one blended peak; the limit is structural, set by record length rather than algorithm quality",
]
answer = 3
explanation = "Classical resolution is the main-lobe width, set by N. Zero-padding interpolates the same information; more averaging trades resolution away. Beating 1/N requires a model assumption, which is what MVDR and MUSIC spend."

[widgets."com.github.richbai90.stats.14-spectrum-estimation.card_periodogram"]
type = "flashcard"
front = "Why is the periodogram not a consistent estimator of the spectrum?"
back = "Its variance stays near the squared PSD no matter how long the record: more samples refine the grid while each grid value keeps flapping. Consistency is bought by averaging (Bartlett, Welch) or smoothing, and the price is resolution."

[widgets."com.github.richbai90.stats.14-spectrum-estimation.card_highres"]
type = "flashcard"
front = "What assumption lets MVDR and MUSIC beat the 1/N resolution limit?"
back = "Structure: a few sinusoids in white noise make the covariance low-rank plus a scaled identity, splitting eigenvectors into signal and noise subspaces. Noise-subspace zeros locate the lines exactly. The bet fails if the model is wrong."
# ==== 15-state-space-innovations ====

[widgets."com.github.richbai90.stats.15-state-space-innovations.state_space"]
type = "math"
label = "The state-space triple"
tex = '\mathbf{x}(n+1) = \mathbf{A}\, \mathbf{x}(n) + \mathbf{B}\, \mathbf{u}(n), \qquad \mathbf{y}(n) = \mathbf{C}\, \mathbf{x}(n) + \mathbf{v}(n)'
definitions = [
    { symbol = "A", meaning = "the dynamics: memory and decay; eigenvalues are the poles, and stability puts them all inside the unit circle" },
    { symbol = "B, u", meaning = "how the driving noise enters; u is white with covariance Q" },
    { symbol = "C, v", meaning = "the sensor: what is measured of the state, plus measurement noise v with covariance R", link = "/course/stats/about#notation" },
]

[widgets."com.github.richbai90.stats.15-state-space-innovations.lyapunov"]
type = "math"
label = "Steady-state state covariance"
tex = '\boldsymbol\Pi = \mathbf{A}\, \boldsymbol\Pi\, \mathbf{A}^{\mathsf{T}} + \mathbf{B}\, \mathbf{Q}\, \mathbf{B}^{\mathsf{T}}'
definitions = [
    { symbol = "Π", meaning = "the stationary covariance of the state: fresh uncertainty in, decayed uncertainty carried forward", link = "/course/stats/about#notation" },
    { symbol = "ledger", meaning = "each step adds BQBᵀ of new noise; APAᵀ is what survives of the old. Scalar form: Π = q / (1 - a²)" },
]

[widgets."com.github.richbai90.stats.15-state-space-innovations.transfer"]
type = "math"
label = "Pulse transfer function"
tex = '\mathbf{H}(z) = \mathbf{C} \left(z\mathbf{I} - \mathbf{A}\right)^{-1}\, \mathbf{B}'
definitions = [
    { symbol = "poles", meaning = "the eigenvalues of A: one object, two grammars — the rational model of Lesson 11 and the realization here" },
    { symbol = "realization", meaning = "the triple behind a given H(z); infinitely many exist, and the minimal ones waste no states" },
    { symbol = "controllability, observability", meaning = "which states the input reaches and which the sensor sees; the properties Lesson 18 computes by hand" },
]

[widgets."com.github.richbai90.stats.15-state-space-innovations.innovations"]
type = "math"
label = "The innovations process"
tex = '\mathbf{e}(n) = \mathbf{y}(n) - \hat{\mathbf{y}}(n \mid n-1), \qquad \mathbb{E}\left[\mathbf{e}(n)\, \mathbf{e}^{\mathsf{T}}(m)\right] = \mathbf{0} \;\; \text{for } n \neq m'
definitions = [
    { symbol = "e(n)", meaning = "the one-step prediction residual: the new information carried by sample n and nothing else" },
    { symbol = "white", meaning = "uncorrelated across time; any leftover correlation would be usable, so an optimal predictor removes all of it" },
    { symbol = "σ_e²", meaning = "the innovations variance: the one-step unpredictability of y; the same quantity that normalized the causal Wiener filter" },
]

[widgets."com.github.richbai90.stats.15-state-space-innovations.quiz_innovations"]
type = "quiz"
question = "What makes the innovations sequence the right currency for filtering?"
options = [
    "It is Gaussian even when the observations are not",
    "It has larger variance than the observations, which aids numerical stability",
    "It is white: every sample carries only new information, so nothing already predictable can be counted twice",
    "It is bounded, so filtering errors stay bounded",
]
answer = 2
explanation = "Whiteness is the certificate of optimality: a correlated residual would still hold usable structure. The innovations view turns filtering into per-sample bookkeeping of new information."

[widgets."com.github.richbai90.stats.15-state-space-innovations.quiz_equivalence"]
type = "quiz"
question = "Lesson 11 rational models and this lesson triples describe the same filter. What does the state-space view add?"
options = [
    "Accuracy: the rational form is only an approximation of the state-space form",
    "Internal structure: states, controllability, and observability, which the input-output view hides",
    "Stability guarantees the rational form cannot provide",
    "Nothing; the two views are merely notational variants in every respect",
]
answer = 1
explanation = "The pulse transfer function of a triple is an ordinary rational H(z): same accuracy, same poles. What the realization adds is the internal anatomy — reachability from inputs, visibility to sensors, minimality — that filtering by transfer functions never exposes."

[widgets."com.github.richbai90.stats.15-state-space-innovations.card_state_space"]
type = "flashcard"
front = "What do A, B, and C each encode in a state-space model?"
back = "A: the dynamics, with poles as eigenvalues. B: how driving noise or inputs enter. C: what the sensor sees. The steady-state covariance balances the two in the Lyapunov equation, and eliminating the state returns the rational filter of Lesson 11."

[widgets."com.github.richbai90.stats.15-state-space-innovations.card_innovations"]
type = "flashcard"
front = "Define the innovations and their key property."
back = "e(n) = y(n) minus its one-step prediction. The sequence is white: each residual is the new information of the new sample. The map from y to e is causal and reversible, so no information is lost and none is double-counted."
[widgets."com.github.richbai90.stats.15-state-space-innovations.teach"]
type = "teach"
prompt = '''The innovations view is what the Kalman filter consumes. Teach it back: the state-space triple, why the one-step prediction error is the information the data carries, the Lyapunov ledger for the covariance, and why the innovations process is white.'''
key_points = '''- The state-space model: a hidden state evolving by $\mathbf{x}_{k+1} = \mathbf{A}\mathbf{x}_k + \mathbf{w}_k$ (the Lyapunov equation prices the state covariance) observed through $\mathbf{y}_k = \mathbf{C}\mathbf{x}_k + \mathbf{v}_k$; the triple is (A, C, noise covariances).
- The innovation $\boldsymbol\nu_k = \mathbf{y}_k - \mathbf{C}\hat{\mathbf{x}}_{k|k-1}$ is the part of the measurement the model could not predict; the whole history of the data collapses into the sequence of innovations without loss.
- The innovations are white: they are, by construction, the residual after every predictable correlation has been removed, so each one carries fresh information and none predicts the next.
- The innovations representation rewrites the original model as a white-noise-driven system with the same input–output statistics; filtering and prediction become a matter of processing innovations.
- Causality has a hard floor here: the best causal one-step predictor of a random process is exactly the innovation-based predictor, and its mean squared error is the innovation variance — you cannot do better without the future.'''
hint = '''Say "innovation = the surprise" and build the whole lesson on why the surprise sequence is white.'''

# ==== 16-kalman ====

[widgets."com.github.richbai90.stats.16-kalman.predict"]
type = "math"
label = "Predict step"
tex = '\hat{\mathbf{x}}(n+1 \mid n) = \mathbf{A}\, \hat{\mathbf{x}}(n \mid n), \qquad \mathbf{P}(n+1 \mid n) = \mathbf{A}\, \mathbf{P}(n \mid n)\, \mathbf{A}^{\mathsf{T}} + \mathbf{B}\, \mathbf{Q}\, \mathbf{B}^{\mathsf{T}}'
definitions = [
    { symbol = "P(n | n-1)", meaning = "the predicted error covariance: what you know about x(n) before seeing y(n)" },
    { symbol = "BQBᵀ", meaning = "the fresh process noise injected each step: the Lyapunov ledger of Lesson 15, one entry at a time" },
]

[widgets."com.github.richbai90.stats.16-kalman.gain"]
type = "math"
label = "Kalman gain"
tex = '\mathbf{K}(n) = \mathbf{P}(n \mid n-1)\, \mathbf{C}^{\mathsf{T}} \left(\mathbf{C}\, \mathbf{P}(n \mid n-1)\, \mathbf{C}^{\mathsf{T}} + \mathbf{R}\right)^{-1}'
definitions = [
    { symbol = "K(n)", meaning = "the precision-weighted trust in the new observation: the Lesson 6 shrinkage weight with the roles swapped" },
    { symbol = "S = CPCᵀ + R", meaning = "the innovation covariance: prediction error plus sensor noise; the scale of the new information" },
]

[widgets."com.github.richbai90.stats.16-kalman.update"]
type = "math"
label = "Correct step"
tex = '\hat{\mathbf{x}}(n \mid n) = \hat{\mathbf{x}}(n \mid n-1) + \mathbf{K}(n)\, \mathbf{e}(n), \qquad \mathbf{P}(n \mid n) = \left(\mathbf{I} - \mathbf{K}(n)\, \mathbf{C}\right) \mathbf{P}(n \mid n-1)'
definitions = [
    { symbol = "e(n)", meaning = "the innovation y(n) - C x̂(n | n-1): the new information of the sample", link = "/course/stats/about#notation" },
    { symbol = "P(n | n)", meaning = "the filtered error covariance: predict inflates it, each observation shrinks it, forever" },
]

[widgets."com.github.richbai90.stats.16-kalman.stepper_scalar"]
type = "stepper"
label = "Scalar Kalman: Lesson 6 run in time"
steps = [
    { title = "Predict manufactures the prior", tex = 'p(x_n \mid \mathbf{y}_{n-1}) = \mathcal{N}\left(a\, \hat{x}_{n-1},\; a^{2} P_{n-1 \mid n-1} + q\right)' },
    { title = "One Gaussian observation", tex = 'y_n = x_n + v_n, \qquad v_n \sim \mathcal{N}(0, r)', note = "Exactly the Gaussian-Gaussian conjugacy shape of Lesson 6: Gaussian prior, Gaussian likelihood." },
    { title = "Precisions add", tex = '\frac{1}{P_{n \mid n}} = \frac{1}{P_{n \mid n-1}} + \frac{1}{r}', note = "The Lesson 6 precision ledger, verbatim." },
    { title = "Precision-weighted correction", tex = '\hat{x}_{n \mid n} = \hat{x}_{n \mid n-1} + K_n\left(y_n - \hat{x}_{n \mid n-1}\right), \qquad K_n = \frac{P_{n \mid n-1}}{P_{n \mid n-1} + r}', note = "The shrinkage weight of Lesson 6, read backwards: trust the new sample in proportion to how uncertain the prediction is." },
    { title = "Recursion, not re-derivation", text = "Feed the posterior forward as the next prior and the filter runs forever: one predict-correct cycle per sample. The whole estimation theory of Lesson 6, compressed into a two-line recursion." },
]

[widgets."com.github.richbai90.stats.16-kalman.rts"]
type = "math"
label = "RTS smoother"
tex = '\mathbf{G}(n) = \mathbf{P}(n \mid n)\, \mathbf{A}^{\mathsf{T}}\, \mathbf{P}^{-1}(n+1 \mid n), \qquad \hat{\mathbf{x}}(n \mid N) = \hat{\mathbf{x}}(n \mid n) + \mathbf{G}(n)\left(\hat{\mathbf{x}}(n+1 \mid N) - \mathbf{A}\, \hat{\mathbf{x}}(n \mid n)\right)'
definitions = [
    { symbol = "G(n)", meaning = "the smoother gain: how much of the future correction flows back through the dynamics to step n" },
    { symbol = "x̂(n | N)", meaning = "the smoothed estimate: every observation up to N informs it, not only the past" },
    { symbol = "the price of causality", meaning = "the variance gap between filtered and smoothed; the time-domain twin of the causal Wiener penalty" },
]

[widgets."com.github.richbai90.stats.16-kalman.quiz_gain"]
type = "quiz"
question = "A sensor suddenly becomes four times noisier. What happens to the Kalman gain, and what does that mean?"
options = [
    "It rises: noisier data demands a larger correction",
    "It is unchanged; the gain does not depend on the noise level",
    "It drops toward zero: the filter trusts its prediction more and the observation less",
    "It becomes negative to compensate for the extra bias",
]
answer = 2
explanation = "K = P_pred Cᵀ S⁻¹ with S = C P_pred Cᵀ + R: larger R shrinks the gain. This is the Lesson 6 precision weighting with the roles of prior and data changing every sample."

[widgets."com.github.richbai90.stats.16-kalman.quiz_smoothing"]
type = "quiz"
question = "Why is the smoothed estimate never worse than the filtered one?"
options = [
    "Because the smoother runs a faster algorithm",
    "Because smoothing removes the bias the filter leaves",
    "Because smoothing assumes Gaussianity and filtering does not",
    "Because smoothing uses a superset of the data: every observation the filter saw, the smoother sees too",
]
answer = 3
explanation = "The RTS pass flows future information backward through the dynamics, so each smoothed estimate conditions on strictly more data under the same model. Variance shrinks monotonically; nothing is traded away except real-time operation."

[widgets."com.github.richbai90.stats.16-kalman.card_kf"]
type = "flashcard"
front = "Recite the two phases of the Kalman recursion."
back = "Predict: x̂ = A x̂ and P = A P Aᵀ + BQBᵀ. Correct: K = P Cᵀ (C P Cᵀ + R)⁻¹, then x̂ += K (y − C x̂) and P = (I − K C) P. The covariance is the full state of knowledge: predict inflates, each observation shrinks."

[widgets."com.github.richbai90.stats.16-kalman.card_rts"]
type = "flashcard"
front = "What does the RTS smoother add over the filter, and at what price?"
back = "A backward pass: the smoother gain G = P_f Aᵀ P_pred⁻¹ corrects each filtered estimate with what the future revealed. Variance never grows along the pass. The price is offline operation: real time stops at filtering."
[widgets."com.github.richbai90.stats.16-kalman.teach"]
type = "teach"
prompt = '''Module 2's ladder ends here. Teach the predict–correct recursion as Lesson 6 run in time: where the gain comes from, what predict and correct each contribute, how the covariance ledger closes, and why the fixed-interval smoother beats the filter.'''
key_points = '''- The filter is Lesson 6's precision-weighted average run recursively: the prediction carries the model and dynamics, the correction folds in the new measurement, and the gain is the posterior-mean weight $w$ with time indices attached.
- Predict: propagate the state with $\mathbf{A}$ and grow the covariance by $\mathbf{A}\mathbf{P}\mathbf{A}^{\mathsf T} + \mathbf{Q}$ — dynamics sharpen nothing, process noise widens everything. Correct: use the innovation $\mathbf{y}_k - \mathbf{C}\hat{\mathbf{x}}_{k|k-1}$ scaled by the gain $\mathbf{K}$, then shrink the covariance by the measurement precision.
- The gain is the ratio of the state's uncertainty to the measurement's — the same precision ledger as Lesson 6, updated each step — and the update collapses to the gain applied to the innovation.
- The covariance recursion closes on itself and never sees the data; the filter computes its own error budget online, the reason it is trusted in guidance, tracking, and navigation.
- The fixed-interval smoother (RTS) runs a backward pass with the future folded in, so it is uniformly better than the filter: same model, more information, lower variance — the offline answer when real time is not the constraint.'''
hint = '''Walk one step of predict then correct with scalar arithmetic, then say what the gain is a ratio of.'''

# ==== 17-assign-2a ====

[widgets."com.github.richbai90.stats.17-assign-2a.a1_yule_walker"]
type = "assignment"
label = "Hayes · ch. 3 · A1"
prompt = '''A second-order autoregressive analysis of a pressure trace gives autocorrelation values r(0) = 3, r(1) = 3/4, r(2) = 0. Assume the process is AR(2) with model x(n) = a1 x(n-1) + a2 x(n-2) + w(n), where w is white with variance sigma_w^2. (a) Solve the Yule-Walker equations for a1 and a2. (b) Compute the prediction-error power, which equals sigma_w^2. (c) Write the fitted difference equation. (d) Using the fitted model, predict the next sample when x(n-1) = 1 and x(n-2) = -2.'''
hint = 'Set up the 2 by 2 Toeplitz system $\mathbf{R}_2\, \mathbf{a} = \mathbf{r}_2$ with the convention of this problem set, then use the error formula $\mathcal{E}_2 = r(0) - a_1 r(1) - a_2 r(2)$. The predictor is the model without w.'
reference = '''**(a) Yule-Walker.** With the convention $x(n) = a_1 x(n-1) + a_2 x(n-2) + w(n)$, the equations $\sum_k a_k r(i-k) = r(i)$, $i = 1, 2$ are

$$\begin{bmatrix} 3 & 3/4 \\ 3/4 & 3 \end{bmatrix} \begin{bmatrix} a_1 \\ a_2 \end{bmatrix} = \begin{bmatrix} 3/4 \\ 0 \end{bmatrix}$$

Determinant: $9 - 9/16 = 135/16$. By elimination:

$$a_1 = \frac{(3)(3/4) - (3/4)(0)}{135/16} = \frac{9/4}{135/16} = \frac{4}{15} \approx 0.267, \qquad a_2 = \frac{(3)(0) - (3/4)(3/4)}{135/16} = -\frac{9}{135} = -\frac{1}{15} \approx -0.067$$

**(b) Error power.**

$$\mathcal{E}_2 = r(0) - a_1 r(1) - a_2 r(2) = 3 - \frac{4}{15}\cdot\frac{3}{4} - 0 = 3 - \frac{1}{5} = \frac{14}{5} = 2.8$$

So $\sigma_w^2 = 2.8$.

**(c) Model.** $x(n) = \tfrac{4}{15}\, x(n-1) - \tfrac{1}{15}\, x(n-2) + w(n)$.

**(d) Prediction.** The one-step predictor drops the noise term:

$$\hat{x}(n) = \frac{4}{15}(1) - \frac{1}{15}(-2) = \frac{4}{15} + \frac{2}{15} = \frac{6}{15} = \frac{2}{5} = 0.4$$

**Rubric notes.**
- Solving $R a = -r$ instead (the $A(z) = 1 + \sum a_k z^{-k}$ convention) gives $a_1 = -4/15$, $a_2 = 1/15$ and the same predictor: consistent work counts, but (c) must then be written in that convention explicitly.
- Reporting the error power as 3 (the variance of x) instead of 2.8: incorrect for (b).
- Prediction $-0.4$ from a sign slip in (d): incorrect.'''

[widgets."com.github.richbai90.stats.17-assign-2a.a2_levinson"]
type = "assignment"
label = "Hayes · ch. 5 · A2"
prompt = '''A stationary process has autocorrelation values r(0) = 3, r(1) = 2, r(2) = 1. (a) Run one step of the Levinson recursion: give the first reflection coefficient and the order-1 prediction-error power. (b) Compute the second reflection coefficient. (c) Give the order-2 AR coefficients and the final prediction-error power. (d) Verify your answer by solving the 2 by 2 Yule-Walker system directly. (e) Using the fitted model, predict the next sample when x(n-1) = 1 and x(n-2) = -2. (f) What do the reflection coefficients certify about stability?'''
hint = 'Follow the recursion of Lesson 12: $\Delta_m = r(m) - \sum_{i=1}^{m-1} a_{m-1}(i) r(m-i)$, then fold the coefficients against their own reversal. Cross-check with the direct solve; both must agree exactly.'
reference = '''**(a) Order one.** $k_1 = r(1)/r(0) = 2/3$, $a_1(1) = 2/3$, and

$$\mathcal{E}_1 = r(0)\left(1 - k_1^{2}\right) = 3\left(1 - \frac{4}{9}\right) = \frac{5}{3}$$

**(b) Second reflection.** $\Delta_2 = r(2) - a_1(1)\, r(1) = 1 - \tfrac{2}{3}\cdot 2 = -\tfrac{1}{3}$, so

$$k_2 = \frac{\Delta_2}{\mathcal{E}_1} = \frac{-1/3}{5/3} = -\frac{1}{5}$$

**(c) Order two.** $a_2(2) = k_2 = -1/5$ and the fold $a_2(1) = a_1(1) - k_2\, a_1(1) = \tfrac{2}{3}\left(1 + \tfrac{1}{5}\right) = \tfrac{4}{5}$. The error:

$$\mathcal{E}_2 = \mathcal{E}_1\left(1 - k_2^{2}\right) = \frac{5}{3}\cdot\frac{24}{25} = \frac{8}{5}$$

**(d) Direct check.** Solving $\begin{bmatrix} 3 & 2 \\ 2 & 3 \end{bmatrix} \mathbf{a} = \begin{bmatrix} 2 \\ 1 \end{bmatrix}$ gives $\mathbf{a} = (4/5, -1/5)$, and $\mathcal{E}_2 = 3 - \tfrac{4}{5}\cdot 2 - (-\tfrac{1}{5})\cdot 1 = \tfrac{8}{5}$. Both routes agree exactly.

**(e) Prediction.** $\hat{x}(n) = \tfrac{4}{5}(1) - \tfrac{1}{5}(-2) = \tfrac{6}{5} = 1.2$.

**(f) Stability.** $|k_1| = 2/3 < 1$ and $|k_2| = 1/5 < 1$, with $\mathcal{E}_m > 0$ throughout: the order-2 all-pole model is stable and minimum phase.

**Rubric notes.**
- A flipped sign in $\Delta_2$ (summing $+\sum a_{m-1}(i) r(m-i)$) gives $k_2 = 1/5$ and coefficients $(2/3 \cdot 4/5 \ldots)$ that then fail the direct check of (d): incorrect.
- Reporting $\mathcal{E}_2 = 4/5$, an arithmetic slip on $(5/3)(24/25) = 8/5$: partially correct.
- Claiming instability without checking $|k_m| < 1$: the answer must cite the reflection coefficients.'''

[widgets."com.github.richbai90.stats.17-assign-2a.a3_wiener_fir"]
type = "assignment"
label = "Hayes · ch. 7 · A3"
prompt = '''A signal x(n) is AR(1) with r_x(0) = 1 and r_x(1) = 1/2. It is observed in independent white noise: y(n) = x(n) + v(n) with E[v(n)^2] = 1. (a) Give r_y(0), r_y(1), and the cross-correlation values r_yx(0), r_yx(1). (b) Find the optimal single-tap Wiener estimate xhat(n) = c y(n) and its mean-squared error. (c) Find the optimal two-tap Wiener filter with taps c(0), c(1) acting on y(n) and y(n-1), and its mean-squared error. (d) Compare the two errors and explain where the improvement comes from.'''
hint = 'Independence splits the observation autocorrelation: $r_y(k) = r_x(k) + \sigma_v^2 \delta(k)$. The cross-correlation keeps the signal alone: $r_{yx}(k) = r_x(k)$. Then solve the normal equations, one tap and two taps.'
reference = '''**(a) Second-order numbers.** Whiteness of $v$ gives $r_y(0) = r_x(0) + 1 = 2$, $r_y(1) = r_x(1) = 1/2$; independence and zero mean kill the cross terms, so $r_{yx}(0) = r_x(0) = 1$ and $r_{yx}(1) = r_x(1) = 1/2$.

**(b) Single tap.** $c = r_{yx}(0)/r_y(0) = 1/2$, with error

$$\mathcal{E}_1 = r_x(0) - c\, r_{yx}(0) = 1 - \frac{1}{2} = \frac{1}{2}$$

**(c) Two taps.** Normal equations:

$$\begin{bmatrix} 2 & 1/2 \\ 1/2 & 2 \end{bmatrix} \begin{bmatrix} c(0) \\ c(1) \end{bmatrix} = \begin{bmatrix} 1 \\ 1/2 \end{bmatrix}, \qquad \det = 4 - \frac{1}{4} = \frac{15}{4}$$

$$c(0) = \frac{(2)(1) - (1/2)(1/2)}{15/4} = \frac{7}{4}\cdot\frac{4}{15} = \frac{7}{15}, \qquad c(1) = \frac{(2)(1/2) - (1/2)(1)}{15/4} = \frac{1}{2}\cdot\frac{4}{15} = \frac{2}{15}$$

Error: $\mathcal{E}_2 = 1 - \tfrac{7}{15}(1) - \tfrac{2}{15}(1/2) = 1 - \tfrac{8}{15} = \tfrac{7}{15} \approx 0.467$.

**(d) Comparison.** $1/2 \to 7/15$: the second tap exploits the memory the AR(1) signal leaves in $y(n-1)$, recovering part of the signal that a memoryless tap must abandon to the error. Additional taps keep improving toward the noncausal floor, with diminishing returns here since the correlation decays fast.

**Rubric notes.**
- Writing $r_{yx}(k) = r_y(k)$ (including the noise): incorrect — the cross-correlation carries signal only.
- Forgetting the noise in $r_y(0) = 2$ (using 1): propagates into (c) and fails there.
- Quoting the error as $8/15$ (the removed power instead of the remainder): partially correct.'''

[widgets."com.github.richbai90.stats.17-assign-2a.a4_welch"]
type = "assignment"
label = "Hayes · ch. 8 · A4"
prompt = '''A record of N = 8 samples, assumed to be white Gaussian noise of variance sigma^2 = 1, is x = (1, 1, -1, -1, -1, 1, 1, -1). Welch estimation with K = 2 non-overlapping segments of length L = 4 is applied. (a) Compute each segment periodogram at f = 1/4. (b) Average them. (c) Compute the raw 8-point periodogram at f = 1/8 and explain what this frequency says about the Welch estimate. (d) State the expected value of a periodogram value of white noise at any frequency, the variance of a single periodogram value, and the variance of the two-segment average, then comment on the resolution trade.'''
hint = 'For segment 1 the DFT kernel at f = 1/4 is $(1, -j, -1, j)$. For (c), remember the raw record can see frequencies on a 1/8 grid that the short segments cannot. For (d), a single periodogram value of white noise is exponential with mean $\sigma^2$.'
reference = '''**(a) Segment periodograms at f = 1/4.** Segment 1 is $(1, 1, -1, -1)$; with kernel $(1, -j, -1, j)$:

$$X_1 = 1 - j + 1 - j = 2 - 2j, \qquad \hat{P}_1 = \frac{|X_1|^2}{4} = \frac{8}{4} = 2$$

Segment 2 is $(-1, 1, 1, -1)$: $X_2 = -1 - j - 1 - j = -2 - 2j$, so $\hat{P}_2 = 8/4 = 2$ as well.

**(b) Welch average.** $\hat{P}_W(1/4) = (2 + 2)/2 = 2$.

**(c) The raw record at f = 1/8.** The 8-point DFT gives $X = 2 + 2j$, so

$$\hat{P}(1/8) = \frac{|X|^2}{8} = \frac{8}{8} = 1$$

The raw periodogram can see $f = 1/8$; the length-4 segments cannot — their grid is $1/4$. That is the resolution price of averaging, and it is structural.

**(d) Statistics.** For white noise of variance $\sigma^2 = 1$: the expected periodogram value is $\sigma^2 = 1$ at every frequency (unbiased); a single value is exponentially distributed with variance $\sigma^4 = 1$; the average of $K$ independent segments has variance $\sigma^4/K = 1/2$. The realized values (2, 2, 2) sit far from the expectation 1 — a reminder that these are single draws from a heavy-tailed distribution. Averaging tames the flap; it also blinds the estimator between grid points.

**Rubric notes.**
- Quoting the expectation as 2 from the realization: confuses estimate with estimand; incorrect for (d).
- Variance of the average stated as 1 (no reduction): incorrect.
- Correct segment values with the wrong Welch normalization (forgetting the 1/L scale): partially correct.'''

[widgets."com.github.richbai90.stats.17-assign-2a.a5_factor"]
type = "assignment"
label = "Hayes · ch. 4 · A5"
prompt = '''A spectrum analyzer reports the power spectrum S(f) = 5/4 + cos(2 pi f) for a real stationary process, on the band from -1/2 to 1/2. (a) Write S(f) as the squared magnitude of a minimum-phase rational factor in e^{-j2 pi f}. (b) Give the time-domain model of the process and the driving-noise variance. (c) Give the whitening filter that turns the process back into white noise and verify its stability. (d) Evaluate S at f = 0 and f = 1/2, and give the autocorrelation values r(0) and r(1).'''
hint = 'Expand $|1 + a e^{-j2\pi f}|^2 = 1 + a^2 + 2a\cos(2\pi f)$ and match coefficients. The whitening filter is the causal inverse of the factor; check where its pole sits.'
reference = '''**(a) Factorization.** Using $|1 + a\, e^{-j2\pi f}|^{2} = 1 + a^{2} + 2a\cos(2\pi f)$ and matching against $5/4 + \cos(2\pi f)$: $a = 1/2$, so

$$S(f) = \left|1 + \frac{1}{2}\, e^{-j2\pi f}\right|^{2}$$

The minimum-phase factor is $B(z) = 1 + \tfrac{1}{2} z^{-1}$, with its single zero at $z = -1/2$, inside the unit circle.

**(b) Time-domain model.** The factor is a filter driven by white noise of unit power:

$$x(n) = w(n) + \frac{1}{2}\, w(n-1), \qquad \sigma_w^2 = 1$$

an MA(1) process.

**(c) Whitening filter.** The stable causal inverse is $1/B(z) = \dfrac{1}{1 + \tfrac{1}{2} z^{-1}}$, with impulse response $h(n) = (-\tfrac{1}{2})^{n}$: absolutely summable, hence stable, and convolving it with $x$ returns white noise.

**(d) Values.** $S(0) = 5/4 + 1 = 9/4$ and $S(1/2) = 5/4 - 1 = 1/4$. The autocorrelation of the MA(1) model: $r(0) = 1 + \tfrac{1}{4} = \tfrac{5}{4}$, $r(1) = \tfrac{1}{2}\sigma_w^2 = \tfrac{1}{2}$, and $r(k) = 0$ for $|k| > 1$.

**Rubric notes.**
- Factoring as $1 - \tfrac{1}{2} e^{-j2\pi f}$ produces $5/4 - \cos(2\pi f)$: wrong sign, incorrect.
- Reading $r(1) = 1$ from the cosine coefficient instead of $a\sigma_w^2 = 1/2$: incorrect.
- A whitening choice with a pole outside the unit circle (for example $1/(1 + 2 z^{-1})$): fails the stability demand of (c).'''

[widgets."com.github.richbai90.stats.17-assign-2a.card_chain"]
type = "flashcard"
front = "Trace the chain from stationarity to a cheap algorithm."
back = "Wide-sense stationarity gives Toeplitz covariance (Lesson 10); Toeplitz structure gives the Levinson order recursion at O(p²) total cost (Lesson 12); the same structure prices the Wiener solve (Lesson 13). Physics in, algorithm out."

[widgets."com.github.richbai90.stats.17-assign-2a.card_fit"]
